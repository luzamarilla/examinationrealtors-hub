<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>練筆團申論整理</title>
<style>
:root{
  --ink:#1e293b; --sub:#64748b; --line:#e2e8f0; --line-strong:#94a3b8;
  --neutral:#334155; --neutral-bg:#f1f5f9;
  --accent:#8B4438; --accent-bg:#f1e2dd;
  --accent2:#9C7A34; --accent2-bg:#efe6d0;
  --ok:#3f6b4f; --ok-bg:#e3eee6;
}
*{box-sizing:border-box;}
body{margin:0; background:#fff;}
.page{
  max-width:1200px; margin:0 auto; padding:24px 40px 30px;
  font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;
  color:var(--ink); line-height:1.4;
}
.page-header{
  background:var(--ink); color:#fff; border-radius:14px;
  padding:20px 30px; margin-bottom:16px;
  display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
}
.page-header h1{font-size:26px; font-weight:900; letter-spacing:1px; margin:0;}
.page-header .badge{background:rgba(255,255,255,.15); border-radius:10px; padding:8px 16px; text-align:center; font-size:12.5px;}
.page-header .badge strong{font-size:17px; display:block;}

.toc{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
.toc a{font-size:14px; font-weight:800; color:var(--ink); text-decoration:none; background:var(--neutral-bg); border:1px solid var(--line-strong); border-radius:8px; padding:6px 14px;}

.subject{margin-bottom:30px;}
.subject-head{font-size:20px; font-weight:900; color:#fff; padding:9px 20px; border-radius:10px; margin-bottom:10px; background:var(--accent);}
.session{margin:0 0 22px; padding-left:12px; border-left:3px solid var(--line-strong);}
.session-head{font-size:17px; font-weight:900; color:var(--accent); margin:6px 0 4px;}
.session-head .date{display:inline-block; font-size:13px; color:#fff; background:var(--accent); border-radius:6px; padding:1px 8px; margin-right:8px; vertical-align:2px;}
.session-head .meta{font-size:12.5px; font-weight:400; color:var(--sub); margin-left:8px;}
.subject-head .meta{font-size:13px; font-weight:400; opacity:.85; margin-left:10px;}

.block-title{font-size:16px; font-weight:800; margin:16px 0 6px; padding-bottom:4px; border-bottom:2px solid var(--line-strong);}

.question{font-size:14px; background:#f8fafc; border-left:3px solid var(--sub); border-radius:8px; padding:9px 14px;}
.question p{margin:0 0 4px;}

.photo-note{font-size:12.5px; color:var(--sub); margin-top:4px;}

table{width:100%; border-collapse:collapse; font-size:14px; table-layout:fixed;}
th{background:var(--ink); color:#fff; padding:7px 12px; text-align:left; font-size:13.5px;}
td{padding:7px 12px; border-bottom:1px solid var(--line); vertical-align:top; overflow-wrap:break-word;}
tbody tr:nth-child(even) td{background:#fafafa;}
td.term{font-weight:800; background:var(--neutral-bg); border-right:2px solid var(--line-strong);}
td ul{margin:0; padding-left:18px;}
td li{margin-bottom:2px;}

.law{color:var(--sub); font-size:12px; margin-left:4px;}
.trap{color:var(--accent2); font-weight:700;}
.pill{display:inline-block; font-size:12px; font-weight:800; border-radius:10px; padding:1px 9px; white-space:nowrap;}
.pill.ok{color:var(--ok); background:var(--ok-bg); border:1px solid var(--ok);}
.pill.part{color:var(--accent2); background:var(--accent2-bg); border:1px solid var(--accent2);}
.pill.plus{color:var(--neutral); background:var(--neutral-bg); border:1px solid var(--neutral);}

.tips{background:var(--accent-bg); border-left:4px solid var(--accent); border-radius:8px; padding:10px 16px; font-size:14px;}
.tips ul{margin:0; padding-left:20px;}
.tips li{margin-bottom:4px;}

.frac{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; margin:0 4px; line-height:1.2;}
.frac .num{align-self:stretch; border-bottom:2px solid currentColor; padding-bottom:2px; text-align:center; white-space:nowrap;}
.frac .den{padding-top:2px; text-align:center; white-space:nowrap;}

.full p{margin:0 0 6px; line-height:1.7;}
.full p:last-child{margin-bottom:0;}
.miss{color:var(--accent); font-weight:700; background:var(--accent-bg); border-radius:3px; padding:0 2px;}
.diff{color:var(--accent2); font-weight:700; background:var(--accent2-bg); border-radius:3px; padding:0 2px;}
.mine{font-size:12px; font-weight:400; color:var(--sub); margin-left:2px;}
.skel{background:#f8fafc;}
.skel p{margin:0 0 6px; line-height:1.6;}
.skel p:last-child{margin-bottom:0;}
.skel b{color:var(--ink);}
.legend{font-size:13px; margin:0 0 6px; display:flex; gap:14px; flex-wrap:wrap;}

.footer{text-align:center; color:var(--sub); font-size:13px; margin-top:10px; padding-top:8px; border-top:1px solid var(--line);}

@media (max-width:700px){
  .page{padding:16px;}
  th:nth-child(1), td:nth-child(1){width:22% !important;}
}
@media print{
  @page{size:A4; margin:12mm 10mm;}
  *{-webkit-print-color-adjust:exact!important; print-color-adjust:exact!important;}
  .page{max-width:100%; padding:0;}
  .toc{display:none;}
  .subject{break-before:page;}
  .subject:first-of-type{break-before:auto;}
  tr{break-inside:avoid;}
}
</style>
</head>
<body>
<div class="page">

<div class="page-header">
  <div>
    <div style="font-size:13px;opacity:.7;margin-bottom:5px;">不動產經紀人考試｜申論題練筆團</div>
    <h1>練筆團申論整理</h1>
  </div>
</div>

<div class="toc">
  <a href="tudifa/">土地法</a>
  <a href="minfa/">民法</a>
  <a href="gujia/">估價</a>
  <a href="jingji/">經紀法</a>
</div>

<div class="footer">已依科別拆成四頁，請點上方科目</div>

</div>
</body>
</html>
