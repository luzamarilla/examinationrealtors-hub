<style>
/* Layout: 單欄手機優先；頂部四科頁籤，每點一張卡，題目在上、答案點開才顯示 */
:root{
  --bg:#F3F2EE; --card:#FFFFFF; --ink:#2A2927; --sub:#6B6860; --line:#DAD7CF;
  --accent:#A5523D; --accent-soft:#F1E2DC; --moss:#5F7466; --ochre:#9A7420; --ochre-soft:#F3EBD6;
  --display:"Noto Serif TC","Songti TC",serif; --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7;
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-family:var(--display);font-size:26px;margin:0 0 4px;letter-spacing:.02em}
.lead{margin:0 0 14px;color:var(--sub);font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
.tab{font:inherit;font-size:15px;font-weight:500;padding:10px 0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tab:focus-visible,.btn:focus-visible,summary:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0 12px}
.btn{font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--ochre-soft);border-color:var(--ochre);color:var(--ochre)}
.count{margin-left:auto;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.item{background:var(--card);border:1px solid var(--line);border-radius:8px;min-width:0}
.item.weak{border-color:var(--ochre);background:#FFFDF6}
summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
summary::-webkit-details-marker{display:none}
.no{flex:none;font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:4px;min-width:26px;text-align:center;padding:1px 4px;margin-top:3px}
.q{min-width:0;font-weight:500;overflow-wrap:anywhere}
.q small{display:block;color:var(--sub);font-weight:400;font-size:13px}
.ans{padding:2px 14px 12px 50px;font-size:15px;overflow-wrap:anywhere}
.ans ul{margin:0;padding-left:1.1em}
.ans li{margin:3px 0}
.ans b{color:var(--accent)}
.ans .tip{display:inline-block;margin-top:6px;font-size:13px;color:var(--moss);font-weight:500}
.mark{margin:0 14px 12px 50px}
details:not([open]) .mark{display:none}
.foot{margin-top:18px;font-size:13px;color:var(--sub)}
@media(prefers-reduced-motion:no-preference){.item{transition:border-color .15s}}
body{margin:0}
</style>
</head>

<div class="wrap">

  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="tools">
    <button class="btn" id="openAll" type="button">全部打開</button>
    <button class="btn" id="closeAll" type="button">全部遮住</button>
    <button class="btn" id="onlyWeak" type="button" aria-pressed="false">只看沒印象</button>
    <span class="count" id="count"></span>
  </div>
  <ol class="list" id="list"></ol>
  <p class="foot">來源：常錯清單（11/7 重排版）＋ 11/12、11/13 口頭考錯點。「沒印象」只存在這支手機的瀏覽器。</p>
</div>

 "<ul><li>未登記且所有人不明：<b>使用執照起造人 → 建造執照起造人</b> → 都沒有才找現住人或管理人</li><li>免徵：無償供公用、軍用、毀損 5 成以上必須修復；減半：平民住宅、工廠、毀損 3～5 成</li><li>標準價格每 <b>3 年</b>重新評定，縣市政府公告</li></ul>"],
["都市計畫的年期、比例尺、期限？",
 "<ul><li>預計 <b>25 年</b>發展；實施進度 5 年一期、最長 25 年</li><li>比例尺：主要計畫圖 ≥ 1/10000；細部計畫圖 ≥ 1/1200</li><li>核定後 <b>30 日</b>內發布</li><li>第一期：主要計畫發布後 2 年內完成細部計畫、細部計畫發布後 5 年內完成公共設施（<b>2 細 5 公</b>）</li><li>開放空間（公園、體育場所、綠地、廣場、兒童遊樂場）不少於 <b>10%</b></li><li>通盤檢討：都市計畫 <b>3 年或 5 年</b>；區域計畫 5 年；縣市國土計畫 5 年；全國國土計畫 10 年（跟「實施進度一期 5 年」分開）</li></ul>"],
["規定地價：每幾年？調查幾年？沒申報或太低？",
 "<ul><li>每 <b>2 年</b>重新規定</li><li>調查最近 <b>1 年</b>的買賣或收益價格（不是 2 年）</li><li>沒申報 → 以公告地價 <b>80%</b> 為申報地價</li><li>申報太低（未滿 80%）→ 照價收買，或以 80% 為申報地價（不是徵收）</li></ul>"],
["土地罰則的倍數和金額？",
 "<ul><li>土稅逃稅：短匿稅額 <b>3 倍</b>以下；規避實物：<b>1 倍</b></li><li>土稅未登記再出售：移轉現值 <b>2%</b> 以下；平均地權未登記再出售：登記費 <b>20 倍</b>以下</li><li>壟斷投機：3 年以下有期徒刑，得併科 7 千元以下罰金</li><li>買賣已辦竣移轉登記卻未申報登錄：<b>3 萬～15 萬</b></li></ul>"],
["抵價地和抵費地，誰拿多少？",
 "<ul><li><b>抵價地</b>（區段徵收）＝地主<b>領回</b>的：原則 <b>50%</b>；特殊核准 <b>40%</b>；已辦農地重劃 <b>45%</b>，都是「不得少於」</li><li><b>抵費地</b>（市地重劃）＝政府拿去<b>標售</b>的：不得超過 <b>45%</b>，所以地主領回至少 <b>55%</b></li></ul><span class='tip'>抵「價」地＝地主領回；抵「費」地＝地主付出的費用</span>"],
["土增稅怎麼算？（一般用地）",
 "<ul><li>漲價總數額 ＝ 申報移轉現值 －（前次移轉現值，已用物價指數調整）－ 改良費用等可扣項目</li><li>漲幅 ＝ 漲價總數額 ÷ 前次移轉現值總額：<b>未達 100%：20%</b>；<b>100%～未達 200%：30%</b>；<b>200% 以上：40%</b>（「達」＝含，剛好 100%、200% 算上一級）</li><li>分段算最保險：前 100% 用 20%、第二個 100% 用 30%、超過的全用 40%，加起來</li><li>公式：第二級＝漲價總數額×30%－前次總額×0.1；第三級＝漲價總數額×40%－前次總額×0.3</li><li>自用住宅用地 10%，不走累進</li></ul><span class='tip'>別和地價稅混：地價稅看地價是累進起點的 5、10、15、20 倍</span>"],
["徵收補償費什麼時候發？",
 "<ul><li>徵收公告期間 <b>30 日</b></li><li>公告期滿後 <b>15 日</b>內發給補償費</li><li>逾期沒發 → 該徵收案<b>失其效力</b>（不是「失敗」）；例外：被徵收人在公告期間內提行政救濟</li></ul>"],
["自用住宅優惠：稅率？面積？",
 "<ul><li>地價稅 <b>2‰</b>、土增稅 <b>10%</b>；面積兩稅一樣：<b>都市 3 公畝、非都市 7 公畝</b>（土地稅法 §17、§34），超過部分照一般稅率</li><li>限<b>一處</b>（本人、配偶、未成年受扶養親屬合計）；「一生一次」只有<b>土增稅</b>有</li></ul>"],
["市地重劃公告後禁止什麼？",
 "<ul><li>禁止<b>新建、採取土石、分割</b>（不是禁止移轉、設定；那是混到區段徵收）</li><li>已在施工中的：可改善者限期改善，逾期拆除且不補償</li></ul>"]
]},
jj:{name:"經紀",items:[
["公平法 §20 有哪五款？差別待遇屬哪一類？",
 "<ul><li>口訣「<b>杯差低脅限</b>」：杯葛、差別待遇、低價利誘阻礙競爭、脅迫利誘使他事業不為價格競爭（脅≠協）、不正當限制交易相對人</li><li>差別待遇＝<b>限制競爭</b>；仿冒、營業誹謗、不當贈品＝不公平競爭</li><li>獨占、結合、聯合行為不是 §20 的款</li></ul>"],
["懲罰性賠償：消保法和公平法各幾倍、誰請求？",
 "<ul><li><b>消保法</b>：企業經營者故意 5 倍、重大過失 3 倍、過失 1 倍（都是「以下」），由<b>消費者</b>請求</li><li><b>公平法</b>：<b>事業</b>故意，最多 <b>3 倍</b>，由<b>被害人</b>請求，不分三級</li><li>公平法時效：知悉起 2 年、行為時起 10 年</li><li>違反應記載事項屆期不改：3 萬～30 萬</li></ul><span class='tip'>事業＝公平法；企業經營者＝消保法</span>"],
["營業員、經紀人怎麼取得資格？換證呢？",
 "<ul><li>營業員：訓練合格或經紀人考試及格，<b>還要登錄領證</b>；訓練 ≥ 30 小時；換證 20 小時</li><li>經紀人：考試及格＋<b>1 年</b>營業員經驗，向<b>直轄市、縣市政府</b>請領；換證 30 小時</li><li>證書有效 <b>4 年</b>；屆滿前 6 個月內向原核發機關申請換證</li><li>消極資格只看 §6 第 1～4、7 款</li></ul>"],
["經紀人員和經紀業，各自什麼情況廢止？",
 "<ul><li>人員：被處分停止執行業務<b>累計</b>滿 <b>5 年</b> → 廢止證書</li><li>經紀業：自行停業<b>連續</b> 6 個月以上 → 得廢止許可</li><li>沒繳營業保證金 → 停業，滿 1 年廢止；保證金低於額度，通知 1 個月內沒補足 → 停止營業</li></ul><span class='tip'>業看連續 6 個月，人看累計 5 年</span>"],
["違法結合怎麼處分？結合申報門檻？",
 "<ul><li>處分口訣「<b>分、股、營</b>」：分設事業、處分股份、轉讓營業（沒有停止營業）</li><li>申報門檻：結合後市占達 <b>1/3</b>，或參與結合的一方達 <b>1/4</b></li><li>整體經濟利益大於限制競爭不利益 → 不得禁止</li></ul>"],
["聯合行為：原則、許可、期限？",
 "<ul><li>原則<b>禁止</b>、例外許可；事業先向公平交易委員會申請許可</li><li>期限 ≤ <b>5 年</b>，延展每次 ≤ 5 年</li><li>共同約定<b>專任</b>委託期間、共同定價 → 算聯合行為；共同約定一般委託不違法</li><li>中止調查是「中止」不是「中斷」，時效合併計算</li></ul>"],
["斡旋金和要約書差在哪？違反公平法哪一條？",
 "<ul><li>要約書：<b>不用付錢</b>；斡旋金是仲介業的規範</li><li>沒書面告知差別、預售屋要先付訂金才給審閱 → 公平法 <b>§25</b> 欺罔或顯失公平（不是 §21、不是 §20）</li><li>斡旋金返還糾紛是民事，不歸公平法</li></ul>"],
["經紀業許可程序：公會、開業、遷出？",
 "<ul><li>加入<b>登記所在地</b>公會；許可後 <b>6 個月</b>內開業</li><li>公會入退會：報所在地主管機關層轉中央備查</li><li>遷出原縣市：遷出後 <b>30 日</b>內向遷入地申請備查，並加入遷入地公會</li></ul>"],
["消保法通訊、訪問交易：幾日解約？怎麼解約？",
 "<ul><li>收受商品後 <b>7 日</b>內（不是 10 日），<b>退回商品或書面通知</b>（口頭不算）；不用理由、不負擔費用</li><li>企業經營者收到通知次日起 <b>15 日</b>內取回、返還對價</li><li>不能特約排除；「合理例外」只限<b>通訊交易</b></li></ul>"],
["消費爭議調解方案：誰同意？異議幾日？",
 "<ul><li>小額方案：<b>全體</b>調解委員過半數同意</li><li>一般方案：<b>參與</b>調解委員過半數</li><li>一方沒到場：依到場一造請求或依職權提方案，不適用公示送達</li><li>異議：兩種都是送達後 <b>10 日</b>，異議 → 視為調解不成立</li></ul>"],
["定型化契約條款的四層效力？審閱期？",
 "<ul><li>審閱期：<b>30 日</b>以內合理期間；沒給 → 條款不構成契約內容，但消費者可主張仍構成</li><li>口訣：<b>拋牴禁＝無效</b>｜<b>平任目＝推定顯失公平</b>｜<b>沒給看、想不到、看不清＝不構成契約內容</b>｜<b>該寫沒寫＝照樣算</b></li><li>疑義作有利於消費者的解釋；公告方式要經消費者同意</li></ul>"],
["消保團體訴訟的要件？讓與請求權要幾人？",
 "<ul><li>許可設立 <b>2 年</b>以上＋專門人員＋行政院評定優良；限社團或財團法人</li><li>要委任律師</li><li>檢驗商品或服務的結果有錯：要給業者<b>澄清機會</b></li><li><b>20 人</b>以上讓與請求權（不是 50 人），以團體自己名義起訴，不得向消費者收報酬</li></ul>"],
["廣告不實用哪部法？不實廣告的數字？",
 "<ul><li>服務品質、企業形象：<b>公平法</b></li><li>加盟標示、簽約後刊登廣告與事實不符：<b>經紀條例</b>，內政部處理（不是公平會）；定型化契約：消保法</li><li>公平法 §21 罰鍰：第一次 <b>5 萬～2,500 萬</b>，屆期不改才按次 10 萬～5,000 萬</li><li>非知名薦證者連帶賠償上限：報酬 <b>10 倍</b></li></ul>"],
["經紀條例罰鍰金額怎麼分？",
 "<ul><li><b>6 萬～30 萬</b>：差價、廣告、無資格人員、設置比例、簽章</li><li><b>3 萬～15 萬</b>：代銷實價登錄、§24-2 同時受託、名冊 15 日</li><li><b>1 萬～5 萬</b>：租賃實價登錄</li><li>人員直接停業只有 <b>§19</b>（差價、其他報酬、超收）：6 個月～3 年；申誡是 §16、§22、§23、§25</li></ul>"],
["分期付款、預售屋、區權會同意，各要點？",
 "<ul><li>分期付款沒寫利率 → 按現金交易價格週年 <b>5%</b>；屋主委託仲介賣房不是分期付款買賣</li><li>「附屬建物除陽臺外不得計價」：管<b>預售屋買賣定型化契約不得記載事項</b></li><li>區權會決議另經特定人同意：專有部分改約定共用 → 該區權人；屋頂基地台 → 頂層區權人；約定專用變更 → 使用該部分的區權人</li></ul>"],
["經紀條例第 6 條七款（消極資格）怎麼記？",
 "<ul><li>口訣「<b>能破犯訓業停罰</b>」；經紀人員用第 1、2、3、4、7 款＝「能破犯訓罰」；經紀業七款全用</li><li>第 1 款＝無行為能力或限制行為能力人（不是「完全能力」）</li><li>第 3 款犯罪：緩刑不受限</li><li>第 6 款＝停止<b>營業</b>（管業）；第 7 款＝停止<b>執行業務</b>或證書廢止未滿 5 年（管人員）</li></ul>"],
["定型化契約誰擬訂、誰核定？",
 "<ul><li>內政部擬訂、<b>行政院核定</b>（不是事業主管機關擬訂、內政部核定）</li><li>違反不得記載事項 → <b>無效</b>（不寫「視為不構成契約」）</li><li>預售屋「附屬建物除陽臺外不得計價」＝<b>不得記載</b>事項</li></ul>"],
["經紀人要簽章的文件有哪 6 項？說明書何時交付？",
 "<ul><li>§22 六項：<b>委託契約書、要約書、定金收據、廣告稿、說明書、租賃買賣契約書</b>（口訣：委託、要約、定金、廣告、說明、契約）</li><li>說明書：向相對人<b>解說前</b>先經委託人簽章；<b>雙方簽訂租賃或買賣契約書時</b>交給相對人，相對人簽章，說明書視為契約一部分（§24）</li><li>違反 §22Ⅰ：業 6～30 萬；人員申誡，滿 3 次停業 6 個月～3 年</li></ul>"]
]},
appraisal:{name:"估價",items:[
["折舊提存率和折舊提存費怎麼分辨？",
 "<ul><li>有 <b>C</b> ＝提存費；沒有 C ＝提存率</li><li>有 <b>i</b> ＝償債基金型；沒有 i ＝等速折舊型</li><li>提存費等速型：C × (1－s) × 1/N</li><li>等速型提存率：<b>每年折舊率 ÷（1－累積折舊率）</b>（例：2% ÷ 0.8＝2.5%）</li></ul>"],
["估價原則：文具店、殯儀館、變動、最有效使用？",
 "<ul><li>學校旁賣文具：<b>適合原則</b></li><li>鄰近殯儀館價格下跌：<b>外部性原則</b></li><li>變動原則：切合<b>價格日期</b>當時的價值（不是勘察日期）</li><li>最有效使用：客觀上具良好意識及通常使用能力者，在合法、實質可能、正當合理、財務可行下獲致最高利益</li></ul>"],
["營造施工費包含哪八項？直接法、間接法？",
 "<ul><li>直接材料、直接人工、間接材料、間接人工、管理費、稅捐、資本利息、營造施工利潤（<b>廣告費不在內</b>）</li><li>直接法：<b>淨計法</b>、<b>單位工程法</b></li><li>間接法：<b>工程造價比較法</b>、<b>單位面積（體積）比較法</b>（名字有「比較」的都是間接法）</li></ul>"],
["都更權變：基地權利價值比率怎麼用？",
 "<ul><li>區分所有建物：<b>全棟建物之基地價值比率</b>（寫「建物價值比率」錯）</li><li>非區分所有（透天）：房地總價 × 基地價值比率（例：1,500 × 90%＝1,350 萬）；低於素地價值時才以素地為準</li><li>基地未建築使用：素地價值</li></ul>"],
["比較法的排除門檻和分母？",
 "<ul><li>單項（區域、個別因素）調整率 &gt; <b>15%</b>；四項總調整率 &gt; <b>30%</b>；試算價格差距 ≥ <b>20%</b>（只有這個帶等號）</li><li>調整率分母 ＝ <b>比較價格原價</b>（例：18 ÷ 63≈28.6%）</li><li>試算價格差距分母 ＝ <b>高低平均</b>（例：12.5 ÷ 51.25≈24.4%）</li><li>調整項目：情況、價格日期、區域因素、個別因素（沒有一般因素）</li></ul>"],
["比較法的權重、調整方法？",
 "<ul><li>權重看<b>調整幅度</b>，調整越小權重越高（不是看價格接不接近）</li><li>區域、個別因素調整：<b>百分率法為原則</b>、差額法為例外（§24）</li><li>樓層差 100 萬直接加減 ＝ 差額法</li></ul>"],
["土開法公式和每個字母？",
 "<ul><li><b>V＝S ÷（1＋R）÷（1＋i）－（C＋M）</b>（R＝開發商<b>利潤率</b>，i＝<b>資本利息綜合利率</b>；C 含營造廠利潤，但 C＋M <b>不含</b>開發商的利息和利潤，那兩項另外扣）</li><li>問每坪要再除坪數</li><li>資本利息綜合利率＝年利率 ×（土地價值比率＋建物價值比率 × 1/2）× <b>開發年數</b></li><li>間接成本 M 4 項，口訣「<b>設、廣、管、稅</b>」：規劃設計費、廣告銷售費、管理費、稅捐；總成本不含出售時的所得稅</li><li>現況勘察看<b>勘估標的</b>的工程進度</li></ul>"],
["特殊宗地用什麼方法？",
 "<ul><li>比較法為原則：農牧場、鹽田、池沼墓地、公設地</li><li>溫泉地、高爾夫球場：沒指定方法</li><li>林地：比較、收益、成本三法都可</li><li>工事、水利土壤改良：<b>成本法</b></li></ul>"],
["計量模型的三個門檻？",
 "<ul><li>比較標的 ≥ 自變數的 <b>5 倍</b></li><li>調整後判定係數 ≥ <b>0.7</b></li><li>係數同時為零的顯著機率 ≤ <b>5%</b></li><li>6＋5＝11 個自變數 → 至少 <b>55</b> 筆；可推算調整率和調整額</li></ul>"],
["樓層別效用比、地價分配率公式？",
 "<ul><li>樓層別效用比含<b>土地效用＋建物效用</b></li><li>面積相同：A 層 50、基準層 40 → 50 ÷ 40＝125%</li><li>地價分配率＝（<b>樓層別效用比－平均樓層別效用比</b>）× 全棟建物成本比率（例：110%－105% × 40%＝68%）</li></ul>"],
["估價基本事項有哪四項？",
 "<ul><li>勘估標的內容、<b>價格日期</b>、價格種類及條件、估價目的</li><li>勘查日期<b>不是</b></li><li>作業所需時間屬「擬定估價計畫」；標的狀態屬「確認勘估標的狀態」</li></ul>"],
["宗地估價：設施通過、多種法定用途？",
 "<ul><li>土地上下有設施通過：先估<b>正常價格</b>，再扣<b>地價減損額</b>（寫「特定價格」錯）</li><li>一宗土地有數種法定用途：考量最有效使用、各用途相關性、分割難易度，決定分別估價或依主要用途估價</li></ul>"],
["價格日期調整用哪兩個指數？",
 "<ul><li>用比較標的<b>交易日</b> → 勘估標的<b>價格日期</b>的指數</li><li>例：7 月 106% → 8 月 108%：108 ÷ 106≈102%</li><li>勘察日期是干擾；交易日在後面也一樣，<b>價格日期永遠在分子</b></li></ul>"],
["收益法：總收入到淨收益、折舊提存怎麼加？",
 "<ul><li>總收入 → 扣閒置等損失 → <b>有效總收入</b> → 扣總費用 → <b>淨收益</b></li><li>貸款支出、土地增值稅不是總費用；管理維修費、地價稅、房屋稅、保險費才是</li><li>淨收益沒扣折舊提存：建物收益價格＝建物淨收益 ÷（建物資本化率＋<b>折舊提存率</b>）；已扣就不加</li><li>綜合資本化率（沒扣折舊）：土地資本化率 × 土地比率＋（建物資本化率＋折舊提存率）× 建物比率，<b>土地不加</b>、沒有 × 1/2</li></ul>"],
["收益資本化率有哪五種求法？怎麼算？",
 "<ul><li>五種：風險溢酬法、<b>市場萃取法</b>（淨收益 ÷ 價格）、加權平均資金成本法、債務保障比率法、有效總收入乘數法（沒有「不動產成數法」）</li><li>債務保障比率法：<b>DCR × 貸款常數 × 貸款比率</b>（例：1.5 × 0.1 × 75%＝11.25%）</li><li>加權平均資金成本法：自有比率 × 自有報酬率＋借款比率 × 借款利率（比率配報酬率，不是金額）</li><li>有效總收入乘數法：淨收益率 ÷ 乘數（例：75% ÷ 15＝5%）</li></ul>"]
]}
};
var KEYS=["civil","land","jj","appraisal"], cur="civil", onlyWeak=false;
var weak={};
try{weak=JSON.parse(localStorage.getItem("mustsee-weak")||"{}")}catch(e){weak={}}
function save(){try{localStorage.setItem("mustsee-weak",JSON.stringify(weak))}catch(e){}}
function esc(s){return s}
function renderTabs(){
  var t=document.getElementById("tabs");t.innerHTML="";
  KEYS.forEach(function(k){
    var b=document.createElement("button");b.type="button";b.className="tab";b.setAttribute("role","tab");
    b.setAttribute("aria-selected",k===cur?"true":"false");b.textContent=DATA[k].name;
    b.onclick=function(){cur=k;try{history.replaceState(null,"","#"+k)}catch(e){}render()};
    t.appendChild(b);
  });
}
function render(){
  renderTabs();
  var list=document.getElementById("list");list.innerHTML="";
  var shown=0,items=DATA[cur].items;
  items.forEach(function(it,i){
    var id=cur+i,isWeak=!!weak[id];
    if(onlyWeak&&!isWeak)return;
    shown++;
    var li=document.createElement("li");li.className="item"+(isWeak?" weak":"");
    var d=document.createElement("details");
    d.innerHTML='<summary><span class="no">'+(i+1)+'</span><span class="q">'+it[0]+'</span></summary><div class="ans">'+it[1]+'</div>';
    var m=document.createElement("button");m.type="button";m.className="btn mark";m.setAttribute("aria-pressed",isWeak?"true":"false");
    m.textContent=isWeak?"已標沒印象":"標沒印象";
    m.onclick=function(){weak[id]=!weak[id];if(!weak[id])delete weak[id];save();if(onlyWeak){render();return}var w=!!weak[id];li.className="item"+(w?" weak":"");m.setAttribute("aria-pressed",w?"true":"false");m.textContent=w?"已標沒印象":"標沒印象"};
    d.appendChild(m);li.appendChild(d);list.appendChild(li);
  });
  if(!shown){list.innerHTML='<li class="item"><div class="q" style="padding:14px">這一科還沒有標沒印象的題目。</div></li>'}
  document.getElementById("count").textContent=shown+" / "+items.length+" 點";
}
document.getElementById("openAll").onclick=function(){document.querySelectorAll("#list details").forEach(function(d){d.open=true})};
document.getElementById("closeAll").onclick=function(){document.querySelectorAll("#list details").forEach(function(d){d.open=false})};
document.getElementById("onlyWeak").onclick=function(){onlyWeak=!onlyWeak;this.setAttribute("aria-pressed",onlyWeak?"true":"false");render()};
(function(){var h=(location.hash||"").replace("#","");if(KEYS.indexOf(h)>-1)cur=h;render()})();
window.addEventListener("hashchange",function(){var h=(location.hash||"").replace("#","");if(KEYS.indexOf(h)>-1){cur=h;render()}});
</script>
