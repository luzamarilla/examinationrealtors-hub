債權者，債權人得聲請法院撤銷之。\n債務人所為之有償行為，於行為時明知有損害於債權人之權利者，以受益人於受益時亦知其情事者為限，債權人得聲請法院撤銷之。\n債務人之行為非以財產為標的，或僅有害於以給付特定物為標的之債權者，不適用前二項之規定。\n債權人依第一項或第二項之規定聲請法院撤銷時，得並聲請命受益人或轉得人回復原狀。但轉得人於轉得時不知有撤銷原因者，不在此限。"}],"no":12,"options":["撤銷權僅能對不健全的意思表示為之，不得對法律行為或法律關係為之","任何撤銷權之行使，均只須以意思表示方式為之，即生法律效果","撤銷權因一定期間內不行使而消滅，此期間稱為消滅時效","撤銷權之法律性質與解除權相同，均屬形成權之一種"],"stem":"針對民法有關撤銷權之規範，下列敘述何者正確？","subject":"民法","topic":"撤銷權","year":107},{"answer":"D","explain":"贈與可附負擔（§412）。贈與是契約（不是單獨行為）、諾成（不用交付）；經公證的贈與不得任意撤銷（§408 II）","id":"mf-107-14","laws":[{"ref":"民法 §412","text":"贈與附有負擔者，如贈與人已為給付而受贈人不履行其負擔時，贈與人得請求受贈人履行其負擔，或撤銷贈與。\n負擔以公益為目的者，於贈與人死亡後，主管機關或檢察官得請求受贈人履行其負擔。"},{"ref":"民法 §408","text":"贈與物之權利未移轉前，贈與人得撤銷其贈與。其一部已移轉者，得就其未移轉之部分撤銷之。\n前項規定，於經公證之贈與，或為履行道德上義務而為贈與者，不適用之。"}],"no":14,"options":["贈與係單獨行為","贈與以物之交付為要件，於物之交付後，贈與行為才為生效","經公證之贈與，於贈與物之權利未移轉前，贈與人得隨時撤銷其贈與","贈與得附有負擔"],"stem":"下列有關贈與之敘述，何者正確？","subject":"民法","topic":"贈與","year":107},{"answer":"C","explain":"錯誤選項：法人應設董事（§27），監察人是「得設」。法人有權利能力（專屬自然人的除外）；董事執行職務侵權→法人連帶負責（§28）","id":"mf-107-15","laws":[{"ref":"民法 §27","text":"法人應設董事。董事有數人者，法人事務之執行，除章程另有規定外，取決於全體董事過半數之同意。\n董事就法人一切事務，對外代表法人。董事有數人者，除章程另有規定外，各董事均得代表法人。\n對於董事代表權所加之限制，不得對抗善意第三人。\n法人得設監察人，監察法人事務之執行。監察人有數人者，除章程另有規定外，各監察人均得單獨行使監察權。"},{"ref":"民法 §28","text":"法人對於其董事或其他有代表權之人因執行職務所加於他人之損害，與該行為人連帶負賠償之責任。"}],"no":15,"options":["法人可分為財團法人與社團法人","法人於法令限制內，有享受權利負擔義務之能力。但專屬於自然人之權利義務，不在此限","法人應設董事與監察人","法人對於其董事或其他有代表權之人因執行職務所加於他人之損害，與該行為人連帶負賠償之責任"],"stem":"民法關於法人之規定，下列敘述，何者錯誤？","subject":"民法","topic":"法人機關","year":107},{"answer":"C","explain":"錯誤選項：債務不履行致人格權受侵害→可以準用侵權規定請求賠償（§227-1）","id":"mf-107-16","laws":[{"ref":"民法 §227-1","text":"債務人因債務不履行，致債權人之人格權受侵害者，準用第一百九十二條至第一百九十五條及第一百九十七條之規定，負損害賠償責任。"}],"no":16,"options":["人格權受侵害時，得請求法院除去其侵害；有受侵害之虞時，得請求防止之","名譽權受侵害時，若法院採取命被告登報道歉作為回復名譽之適當處分，依現行司法實務見解，仍屬合憲","債務人因債務不履行，致債權人之人格權受侵害者，不得請求損害賠償","生命權受侵害時，配偶得請求損害賠償與慰撫金"],"stem":"關於人格權保護，下列敘述，何者錯誤？","subject":"民法","topic":"人格權","year":107},{"answer":"B","explain":"已安裝在大廈內運作的電梯＝建物重要成分，不能單獨作為物權客體。義肢（未裝上）、專有部分、能遮風避雨的違建都可以","id":"mf-107-18","laws":[],"no":18,"options":["醫療器材店所販售之大腿義肢","已被安裝置入大廈內運作的客製化電梯","區分所有建築物（如大廈）之專有部分","足以遮風避雨的違章建築物"],"stem":"下列敘述所涉及之物，何者不能單獨作為物權之客體？","subject":"民法","topic":"重要成分","year":107},{"answer":"B","explain":"拾得漂流物準用遺失物規定（§810）→要通知、交存，不能立即取得所有權；不是無主物先占","id":"mf-107-19","laws":[{"ref":"民法 §810","text":"拾得漂流物、沈沒物或其他因自然力而脫離他人占有之物者，準用關於拾得遺失物之規定。"}],"no":19,"options":["甲拾得珍貴漂流木，依民法第802 條無主物先占規定，原始取得其所有權","甲拾得珍貴漂流木，依民法第810 條適用關於拾得遺失物規定，負通知及交存該物之義務，無法立即取得該物所有權","因天災致國有珍貴林木漂流至國有林區外時，甲得自由撿拾取得所有權，不受民法關於拾得遺失物規定之限制","甲因丙取得漂流木所有權而受損害時，得依關於不當得利之規定請求償還價額"],"stem":"甲於颱風過後翌日在河邊拾得從國家森林區漂流而下之珍貴紅檜木，乙自甲處竊取之，並將之以低價出售予不知情之丙。下列敘述，何者正確？","subject":"民法","topic":"漂流物","year":107},{"answer":"A","explain":"地上權可以（另有農育權、典權，§882）；不動產役權不能單獨抵押；著作權、租賃權不行","id":"mf-107-20","laws":[{"ref":"民法 §882","text":"地上權、農育權及典權，均得為抵押權之標的物。"}],"no":20,"options":["地上權","不動產役權","著作權","租賃權"],"stem":"下列何種權利，得為抵押權之標的物？","subject":"民法","topic":"抵押權標的","year":107},{"answer":"C","explain":"一筆地贈與數人→分別共有。祭祀公業派下員、合夥財產、分割前遺產都是公同共有","id":"mf-107-21","laws":[],"no":21,"options":["祭祀公業之派下員對不具法人資格的祭祀公業財產之關係","合夥人對合夥財產之關係","將一筆土地贈與且移轉登記予數人，受贈人對該贈與物之關係","數人繼承遺產，於分割遺產前，各繼承人對於遺產全部之關係"],"stem":"下列何者並非公同共有關係？","subject":"民法","topic":"公同共有","year":107},{"answer":"D","explain":"定義正確（§881-1）。質權是擔保物權不是用益物權；違建建造完成時建造人原始取得所有權；公同共有沒有應有部分，不能就應有部分設定抵押","id":"mf-107-22","laws":[{"ref":"民法 §881-1","text":"稱最高限額抵押權者，謂債務人或第三人提供其不動產為擔保，就債權人對債務人一定範圍內之不特定債權，在最高限額內設定之抵押權。\n最高限額抵押權所擔保之債權，以由一定法律關係所生之債權或基於票據所生之權利為限。\n基於票據所生之權利，除本於與債務人間依前項一定法律關係取得者外，如抵押權人係於債務人已停止支付、開始清算程序，或依破產法有和解、破產之聲請或有公司重整之聲請，而仍受讓票據者，不屬最高限額抵押權所擔保之債權。但抵押權人不知其情事而受讓者，不在此限。"}],"no":22,"options":["用益物權包括地上權、農育權、不動產役權、典權與質權","違章建築物不能辦理移轉登記，故於建造完成時，建造人無法取得所有權","基於公同關係而共有之房地，各共有人得就其應有部分設定抵押權","稱最高限額抵押權者，謂債務人或第三人提供其不動產為擔保，就債權人對債務人一定範圍內之不特定債權，在最高限額內設定之抵押權"],"stem":"下列關於物權規定之敘述，何者正確？","subject":"民法","topic":"最高限額抵押","year":107},{"answer":"A","explain":"錯誤選項：通行權人不限土地所有人，地上權人等也準用（§800-1）。只要與公路無適宜聯絡即可；必要時可開路；要付償金","id":"mf-107-24","laws":[{"ref":"民法 §800-1","text":"第七百七十四條至前條規定，於地上權人、農育權人、不動產役權人、典權人、承租人、其他土地、建築物或其他工作物利用人準用之。"}],"no":24,"options":["通行權人必須為土地所有人","土地因與公路無適宜聯絡即可，無須毫無聯絡方法","通行權人有必要時可以開設道路","通行權人對於通行地因此所受之損害，應支付償金"],"stem":"關於相鄰地必要通行權，下列敘述何者錯誤？","subject":"民法","topic":"袋地通行","year":107},{"answer":"A","explain":"從物常助主物效用、獨立的物，動產不動產都可（§68）。分離後的成分、孳息歸有收取權人（§70）不是占有人；無權占有建屋→房屋屬建築人；能遮風避雨的房屋已是獨立不動產","id":"mf-109-01","laws":[{"ref":"民法 §68","text":"非主物之成分，常助主物之效用，而同屬於一人者，為從物。但交易上有特別習慣者，依其習慣。\n主物之處分，及於從物。"},{"ref":"民法 §70","text":"有收取天然孳息權利之人，其權利存續期間內，取得與原物分離之孳息。\n有收取法定孳息權利之人，按其權利存續期間內之日數，取得其孳息。"}],"no":1,"options":["從物在客觀上需常助主物之效用，且與主物為各自獨立之兩個物，動產或不動產均可為從物","物之成分或其天然孳息，分離後原則上屬於該成分或天然孳息之占有人","無權占有他人土地建築房屋，建築完成時，該房屋原則上屬於土地所有人所有","已足避風雨，可達經濟上使用目的，但屋頂尚未完全完工之房屋，屬土地之成分"],"stem":"下列關於法律上之物的敘述，何者正確？","subject":"民法","topic":"從物","year":109},{"answer":"A","explain":"人格權受侵害的除去妨害請求權不罹於時效。贍養費、繼承回復請求權（§1146 II）都會時效消滅；未登記不動產的返還請求權仍適用時效（已登記的才不適用）","id":"mf-109-02","laws":[{"ref":"民法 §1146","text":"繼承權被侵害者，被害人或其法定代理人得請求回復之。\n前項回復請求權，自知悉被侵害之時起，二年間不行使而消滅；自繼承開始時起逾十年者亦同。"}],"no":2,"options":["人格權受侵害時之除去妨害請求權","夫妻因離婚所約定之贍養費請求權","繼承權受侵害時之回復請求權","未登記不動產所有權人之返還請求權"],"stem":"下列何者非消滅時效適用之客體？","subject":"民法","topic":"消滅時效客體","year":109},{"answer":"C","explain":"買賣標的物利益及危險，自交付時起由買受人承受（§373），不是過戶、簽約或付清價金","id":"mf-109-03","laws":[{"ref":"民法 §373","text":"買賣標的物之利益及危險，自交付時起，均由買受人承受負擔，但契約另有訂定者，不在此限。"}],"no":3,"options":["於甲與乙簽訂汽車買賣契約時起，由乙承受","自該車辦理過戶登記於乙時，由乙承受","自該車交付於乙時起，由乙承受","於乙支付價金完畢時，由乙承受"],"stem":"甲與乙訂立買賣契約，將其二手汽車出賣予乙，若當事人間無特別約定者，關於該汽車之利益及危險，下列何者正確？","subject":"民法","topic":"危險負擔","year":109},{"answer":"C","explain":"可以要約＋承諾、要約交錯、要約＋意思實現（§161）成立；沒有「承諾交錯」這種方式","id":"mf-109-04","laws":[{"ref":"民法 §161","text":"依習慣或依其事件之性質，承諾無須通知者，在相當時期內，有可認為承諾之事實時，其契約為成立。\n前項規定，於要約人要約當時預先聲明承諾無須通知者準用之。"}],"no":4,"options":["契約得以要約與承諾之意思表示合致而成立","契約得以要約交錯之方式而成立","契約得以承諾交錯之方式而成立","契約得以要約與意思實現方式而成立"],"stem":"下列有關契約成立之敘述，何者錯誤？","subject":"民法","topic":"契約成立","year":109},{"answer":"D","explain":"借款到期開本票交給債權人＝新債清償（間接給付，§320），本票兌現前舊債不消滅","id":"mf-109-07","laws":[{"ref":"民法 §320","text":"因清償債務而對於債權人負擔新債務者，除當事人另有意思表示外，若新債務不履行時，其舊債務仍不消滅。"}],"no":7,"options":["甲所受領乙開立的100 萬元本票，是債之內容更改","甲所受領乙開立的100 萬元本票，是抵銷","甲所受領乙開立的100 萬元本票，是代物清償","甲所受領乙開立的100 萬元本票，是新債清償"],"stem":"甲借給乙100 萬元，借期屆至，甲請求乙返還100 萬元借款，乙因此開立100 萬元之本票交由甲受領。下列敘述，何者正確？","subject":"民法","topic":"新債清償","year":109},{"answer":"C","explain":"判決只確定「甲要履行移轉義務」（給付判決），甲還沒辦移轉登記→所有權仍屬甲（§758）","id":"mf-109-10","laws":[{"ref":"民法 §758","text":"不動產物權，依法律行為而取得、設定、喪失及變更者，非經登記，不生效力。\n前項行為，應以書面為之。"}],"no":10,"options":["因甲已將其土地出售乙，故所有權屬於乙","因乙已取得土地買賣契約給付請求權勝訴確定，故所有權屬於乙","因甲尚未辦理土地所有權移轉登記於乙，故所有權仍屬於甲","因該地尚未交付予乙占有，故所有權仍屬於甲"],"stem":"甲將其土地出售乙，但因價金給付方式仍有爭議，故甲拒絕交付予乙，亦不辦理登記，乙起訴請求甲履行買賣契約之給付義務，經判決勝訴確定。下列敘述，何者正確？","subject":"民法","topic":"登記生效","year":109},{"answer":"A","explain":"錯誤選項：因可歸責於受任人而提前終止，不能請求已處理部分報酬；非可歸責於受任人才可以（§548 II）。有償注意義務較高；依習慣應給報酬可請求","id":"mf-109-11","laws":[{"ref":"民法 §548","text":"受任人應受報酬者，除契約另有訂定外，非於委任關係終止及為明確報告顛末後，不得請求給付。\n委任關係，因非可歸責於受任人之事由，於事務處理未完畢前已終止者，受任人得就其已處理之部分，請求報酬。"}],"no":11,"options":["委任關係因可歸責於受任人之事由，而於委任事務處理完畢前經終止者，受任人仍得就已經處理之部分比例請求報酬","受任人受有報酬之注意義務，高於受任人未受報酬之注意義務","當事人縱未約定報酬，但依交易習慣或委任事務之性質應給與報酬者，受任人得請求報酬","除契約另有規定外，原則上於委任關係終止時，受任人須明確報告始末後才能請求報酬"],"stem":"關於委任契約受任人之報酬，下列敘述，何者錯誤？","subject":"民法","topic":"委任報酬","year":109},{"answer":"B","explain":"錯誤選項：違建買受人只取得事實上處分權，不是所有權，不能行使 §767 物上請求權（實務）。拍定人自取得權利移轉證書時取得權利","id":"mf-109-12","laws":[{"ref":"民法 §767","text":"所有人對於無權占有或侵奪其所有物者，得請求返還之。對於妨害其所有權者，得請求除去之。有妨害其所有權之虞者，得請求防止之。\n前項規定，於所有權以外之物權，準用之。"}],"no":12,"options":["土地與土地上之違章建築同屬於一人所有，嗣將違章建築與土地分別讓與相異之人，仍有民法第425 條之1 推定租賃關係規定之適用","違章建築之買受人對於無權占用房屋之人，得行使民法第767 條之物上請求權","違章建築遭拍賣，拍定人自取得法院權利移轉證書之日起，取得該違章建築之權利","甲、乙買賣違章建築，所讓與的是事實上之處分權"],"stem":"甲將自己所有的違章建築A 屋賣給乙，有關於買賣違章建築之法律關係。下列敘述，依實務見解，何者錯誤？","subject":"民法","topic":"違章建築","year":109},{"answer":"C","explain":"社團法人名下財產是法人單獨所有。遺產（分割前）、合夥財產、夫妻共同財產都是公同共有","id":"mf-109-14","laws":[],"no":14,"options":["繼承人有數人時，其繼承取得之遺產","合夥人之合夥財產","屬於社團法人名下之財產","屬於夫妻共同財產制下之財產"],"stem":"下列何者非屬公同共有之性質？","subject":"民法","topic":"公同共有","year":109},{"answer":"D","explain":"加工價值顯逾材料→佛像歸加工人乙（§814）；原主甲依不當得利請求償還價額（§816）。17 歲可占有（占有是事實）；乙賣給丙是有權處分","id":"mf-109-15","laws":[{"ref":"民法 §814","text":"加工於他人之動產者，其加工物之所有權，屬於材料所有人。但因加工所增之價值顯逾材料之價值者，其加工物之所有權屬於加工人。"},{"ref":"民法 §816","text":"因前五條之規定而受損害者，得依關於不當得利之規定，請求償還價額。"}],"no":15,"options":["甲因未滿二十歲，不得占有該木材","乙不能取得名貴的佛像所有權","乙將名貴的佛像讓與並交付予丙，係屬無權處分","甲得向乙請求償還該木材的價額"],"stem":"甲現年十七歲，在山中拾獲名貴木材一塊，嗣後該木材遭乙竊取，乙請人雕刻成名貴的佛像，以高價出售於惡意的丙，並交付之。下列敘述，何者正確？","subject":"民法","topic":"加工","year":109},{"answer":"B","explain":"預付地租非經登記不得對抗受讓人（§836-1）。不可抗力不能請求減免地租（§837）；欠租是「積欠地租達 2 年總額」不是連續 2 年（§836）；無地租的地上權可隨時拋棄（§834）","id":"mf-109-18","laws":[{"ref":"民法 §836-1","text":"土地所有權讓與時，已預付之地租，非經登記，不得對抗第三人。"},{"ref":"民法 §837","text":"地上權人，縱因不可抗力，妨礙其土地之使用，不得請求免除或減少租金。"},{"ref":"民法 §836","text":"地上權人積欠地租達二年之總額，除另有習慣外，土地所有人得定相當期限催告地上權人支付地租，如地上權人於期限內不為支付，土地所有人得終止地上權。地上權經設定抵押權者，並應同時將該催告之事實通知抵押權人。\n地租之約定經登記者，地上權讓與時，前地上權人積欠之地租應併同計算。受讓人就前地上權人積欠之地租，應與讓與人連帶負清償責任。\n第一項終止，應向地上權人以意思表示為之。"},{"ref":"民法 §834","text":"地上權無支付地租之約定者，地上權人得隨時拋棄其權利。"}],"no":18,"options":["地上權人若因不可抗力，妨礙其土地之使用，依法即得請求免除或減少租金","土地所有權讓與時，地上權人已預付之地租，非經登記，不得對抗第三人","地上權人須連續積欠地租達二年，土地所有人始得終止地上權","地上權無支付地租之約定者，地上權人應於一年前通知土地所有人，始得拋棄其權利"],"stem":"下列關於地上權之敘述，何者正確？","subject":"民法","topic":"地上權","year":109},{"answer":"B","explain":"建築物存在必要的權利（地上權）只是併付拍賣，抵押權人對它無優先受償權→不是效力所及。扣押後的租金（§864）、附加部分（§862）、滅失後殘餘物（§862-1）都是效力所及","id":"mf-109-19","laws":[{"ref":"民法 §864","text":"抵押權之效力，及於抵押物扣押後抵押人就抵押物得收取之法定孳息。但抵押權人，非以扣押抵押物之事情，通知應清償法定孳息之義務人，不得與之對抗。"},{"ref":"民法 §862","text":"抵押權之效力，及於抵押物之從物與從權利。\n第三人於抵押權設定前，就從物取得之權利，不受前項規定之影響。\n以建築物為抵押者，其附加於該建築物而不具獨立性之部分，亦為抵押權效力所及。但其附加部分為獨立之物，如係於抵押權設定後附加者，準用第八百七十七條之規定。"},{"ref":"民法 §862-1","text":"抵押物滅失之殘餘物，仍為抵押權效力所及。抵押物之成分非依物之通常用法而分離成為獨立之動產者，亦同。\n前項情形，抵押權人得請求占有該殘餘物或動產，並依質權之規定，行使其權利。"}],"no":19,"options":["抵押物扣押後，抵押人就抵押物所得收取之租金","抵押之建築物存在所必要且性質上得讓與之權利","設定抵押權後所增建附加於該建築物，而不具獨立性之部分","抵押之建築物滅失後殘餘之鋼筋"],"stem":"以建築物設定抵押權者，下列何者非抵押權效力所及之標的物範圍？","subject":"民法","topic":"抵押權效力範圍","year":109},{"answer":"B","explain":"婚前財產在婚姻中生的孳息→視為婚後財產（§1017 II）。財產不足清償債務→法院宣告改用分別財產制（不是法定，§1010）；婚後財產處分不用他方同意","id":"mf-109-22","laws":[{"ref":"民法 §1017","text":"夫或妻之財產分為婚前財產與婚後財產，由夫妻各自所有。不能證明為婚前或婚後財產者，推定為婚後財產；不能證明為夫或妻所有之財產，推定為夫妻共有。\n夫或妻婚前財產，於婚姻關係存續中所生之孳息，視為婚後財產。\n夫妻以契約訂立夫妻財產制後，於婚姻關係存續中改用法定財產制者，其改用前之財產視為婚前財產。"},{"ref":"民法 §1010","text":"夫妻之一方有左列各款情形之一時，法院因他方之請求，得宣告改用分別財產制：\n一、依法應給付家庭生活費用而不給付時。\n二、夫或妻之財產不足清償其債務時。\n三、依法應得他方同意所為之財產處分，他方無正當理由拒絕同意時。\n四、有管理權之一方對於共同財產之管理顯有不當，經他方請求改善而不改善時。\n五、因不當減少其婚後財產，而對他方剩餘財產分配請求權有侵害之虞時。\n六、有其他重大事由時。\n夫妻之總財產不足清償總債務或夫妻難於維持共同生活，不同居已達六個月以上時，前項規定於夫妻均適用之。"}],"no":22,"options":["於法定財產制下，夫或妻之財產分為婚前財產與婚後財產，婚前財產由夫妻各自所有，婚後財產則由夫妻共有","於法定財產制下，夫或妻之婚前及婚後財產，於婚姻關係存續中所生之孳息，均屬於婚後財產之範圍","無論採何種約定財產，當夫或妻其財產不足清償其債務時，法院得因他方之請求，宣告改用法定財產制","夫或妻各自管理、使用、收益其婚前財產與婚後財產，但對於婚後財產為處分時，應得他方之同意"],"stem":"下列關於夫妻法定財產制之敘述，何者正確？","subject":"民法","topic":"法定財產制","year":109},{"answer":"A","explain":"失蹤滿 7 年可聲請（§8）；80 歲以上滿 3 年；特別災難終了滿 1 年（不是 3 個月）；未受死亡宣告前的財產管理依家事事件法（不是破產法，§10）","id":"mf-110-03","laws":[{"ref":"民法 §8","text":"失蹤人失蹤滿七年後，法院得因利害關係人或檢察官之聲請，為死亡之宣告。\n失蹤人為八十歲以上者，得於失蹤滿三年後，為死亡之宣告。\n失蹤人為遭遇特別災難者，得於特別災難終了滿一年後，為死亡之宣告。"},{"ref":"民法 §10","text":"失蹤人失蹤後，未受死亡宣告前，其財產之管理，除其他法律另有規定者外，依家事事件法之規定。"}],"no":3,"options":["失蹤人失蹤滿七年後，法院得因利害關係人或檢察官之聲請，為死亡之宣告","失蹤人為八十歲以上者，得於失蹤滿五年後，為死亡之宣告","失蹤人為遭遇特別災難者，得於特別災難終了滿三個月後，為死亡之宣告","失蹤人失蹤後，未受死亡宣告前，其財產之管理，除其他法律另有規定者外，依破產法之規定"],"stem":"關於失蹤人的敘述，下列何者正確？","subject":"民法","topic":"死亡宣告","year":110},{"answer":"D","explain":"胎兒保護的是權利能力（§7），不是行為能力。受監護宣告人意思表示無效；限制行為能力人未得允許的單獨行為無效；未達結婚年齡結婚→得撤銷不是無效","id":"mf-110-04","laws":[{"ref":"民法 §7","text":"胎兒以將來非死產者為限，關於其個人利益之保護，視為既已出生。"}],"no":4,"options":["受監護宣告之人之意思表示，無效，應由其法定代理人代為意思表示，並代受意思表示","限制行為能力人未得法定代理人之允許，所為之單獨行為，無效","未滿法定結婚年齡之男女，其結婚之法律效果並非無效，而是得撤銷","為保障胎兒之行為能力，胎兒以將來非死產者為限，關於其個人利益之保護，視為既已出生"],"stem":"關於行為能力之敘述，下列何者錯誤？","subject":"民法","topic":"胎兒","year":110},{"answer":"C","explain":"表見代理（§169）正確。授權不用書面，向代理人或第三人以意思表示為之（§167）；代理人有數人→原則共同代理（§168）；無權代理→效力未定不是無效","id":"mf-110-05","laws":[{"ref":"民法 §169","text":"由自己之行為表示以代理權授與他人，或知他人表示為其代理人而不為反對之表示者，對於第三人應負授權人之責任。但第三人明知其無代理權或可得而知者，不在此限。"},{"ref":"民法 §167","text":"代理權係以法律行為授與者，其授與應向代理人或向代理人對之為代理行為之第三人，以意思表示為之。"},{"ref":"民法 §168","text":"代理人有數人者，其代理行為應共同為之。但法律另有規定或本人另有意思表示者，不在此限。"}],"no":5,"options":["代理權係以法律行為授與者，其授與應向代理人或向代理人對之為代理行為之第三人，以書面授權方式代理為之","代理人有數人者，其代理行為應單獨為之。但法律另有規定或本人另有意思表示者，不在此限","由自己之行為表示以代理權授與他人，或知他人表示為其代理人而不為反對之表示者，對於第三人應負授權人之責任。但第三人明知其無代理權或可得而知者，不在此限","代理人於代理權限內，以本人名義所為之意思表示，直接對本人發生效力。而無代理權人以代理人之名義所為之法律行為則為無效"],"stem":"關於代理的敘述，下列何者正確？","subject":"民法","topic":"代理","year":110},{"answer":"B","explain":"收養要書面＋法院認可（§1079）。拋棄動產所有權、贈與、經紀契約都不用書面","id":"mf-110-06","laws":[{"ref":"民法 §1079","text":"收養應以書面為之，並向法院聲請認可。\n收養有無效、得撤銷之原因或違反其他法律規定者，法院應不予認可。"}],"no":6,"options":["動產所有權之拋棄","子女之收養","贈與契約","演藝經紀契約"],"stem":"下列何種法律行為屬法定書面要式行為？","subject":"民法","topic":"法定書面要式","year":110},{"answer":"D","explain":"通謀虛偽隱藏他項法律行為→適用被隱藏的行為（§87 II）。心中保留原則有效，相對人明知才無效（§86）；通謀虛偽→無效","id":"mf-110-07","laws":[{"ref":"民法 §87","text":"表意人與相對人通謀而為虛偽意思表示者，其意思表示無效。但不得以其無效對抗善意第三人。\n虛偽意思表示，隱藏他項法律行為者，適用關於該項法律行為之規定。"},{"ref":"民法 §86","text":"表意人無欲為其意思表示所拘束之意，而為意思表示者，其意思表示，不因之無效。但其情形為相對人所明知者，不在此限。"}],"no":7,"options":["表意人無欲為其意思表示所拘束之意，而為意思表示者，其意思表示無效","表意人無欲為其意思表示所拘束之意，而為意思表示，其情形為相對人所明知者，其意思表示有效","表意人與相對人通謀而為虛偽意思表示者，其意思表示不因之無效","虛偽意思表示，隱藏他項法律行為者，適用關於該項法律行為之規定"],"stem":"關於意思表示不一致的敘述，下列何者正確？","subject":"民法","topic":"意思表示不一致","year":110},{"answer":"B","explain":"實行抵押權聲請強制執行前 5 年內發生的利息＋執行中發生的（§861 II）","id":"mf-110-08","laws":[{"ref":"民法 §861","text":"抵押權所擔保者為原債權、利息、遲延利息、違約金及實行抵押權之費用。但契約另有約定者，不在此限。\n得優先受償之利息、遲延利息、一年或不及一年定期給付之違約金債權，以於抵押權人實行抵押權聲請強制執行前五年內發生及於強制執行程序中發生者為限。"}],"no":8,"options":["二年","五年","十年","十五年"],"stem":"關於抵押權所擔保而得優先受償之利息，以於抵押權人實行抵押權聲請強制執行前幾年內發生及於強制執行程序中發生者為限？","subject":"民法","topic":"抵押權擔保利息","year":110},{"answer":"C","explain":"設定抵押權的物權行為要登記才生效（§758）。繼承登記前就取得（§759）；買賣契約是債權契約；夫妻財產制契約登記是對抗要件","id":"mf-110-09","laws":[{"ref":"民法 §758","text":"不動產物權，依法律行為而取得、設定、喪失及變更者，非經登記，不生效力。\n前項行為，應以書面為之。"},{"ref":"民法 §759","text":"因繼承、強制執行、徵收、法院之判決或其他非因法律行為，於登記前已取得不動產物權者，應經登記，始得處分其物權。"}],"no":9,"options":["遺產之繼承","土地買賣契約","設定抵押權之物權行為","夫妻就共同財產制之約定"],"stem":"依現行民法規定，下列何者須經登記始生法律效力？","subject":"民法","topic":"登記生效","year":110},{"answer":"D","explain":"先就主債務人財產強制執行無效果前可拒絕清償＝先訴抗辯權（§745）","id":"mf-110-11","laws":[{"ref":"民法 §745","text":"保證人於債權人未就主債務人之財產強制執行而無效果前，對於債權人得拒絕清償。"}],"no":11,"options":["同時履行抗辯","撤銷訴權","追索權抗辯","先訴抗辯"],"stem":"民法於保證契約一節中規定，保證人於債權人未就主債務人之財產強制執行而無效果前，對於債權人得拒絕清償，概念上一般稱為？","subject":"民法","topic":"保證","year":110},{"answer":"C","explain":"一人不能償還的部分→由求償權人與他債務人按比例分擔（§282 I），已免責的人也要分擔（§282 II）。一人單獨負責的事由由該人負擔（§280 但書）；求償可請求利息（§281）","id":"mf-110-12","laws":[{"ref":"民法 §282","text":"連帶債務人中之一人，不能償還其分擔額者，其不能償還之部分，由求償權人與他債務人按照比例分擔之。但其不能償還，係由求償權人之過失所致者，不得對於他債務人請求其分擔。\n前項情形，他債務人中之一人應分擔之部分已免責者，仍應依前項比例分擔之規定，負其責任。"},{"ref":"民法 §280","text":"連帶債務人相互間，除法律另有規定或契約另有訂定外，應平均分擔義務。但因債務人中之一人應單獨負責之事由所致之損害及支付之費用，由該債務人負擔。"},{"ref":"民法 §281","text":"連帶債務人中之一人，因清償、代物清償、提存、抵銷或混同，致他債務人同免責任者，得向他債務人請求償還各自分擔之部分，並自免責時起之利息。\n前項情形，求償權人於求償範圍內，承受債權人之權利。但不得有害於債權人之利益。"}],"no":12,"options":["連帶債務人相互間，縱因債務人中之一人應單獨負責之事由所致之損害及支付之費用，仍應平均分擔義務","連帶債務人中之一人，因清償、代物清償、提存、抵銷或混同，致他債務人同免責任者，得向他債務人請求償還各自分擔之部分，但不得請求利息","連帶債務人中之一人，不能償還其分擔額者，其不能償還之部分，由求償權人與他債務人按照比例分擔之","連帶債務人中之一人，不能償還其分擔額，而他債務人中之一人應分擔之部分已免責者，無須負其責任"],"stem":"關於連帶債務的敘述，下列何者正確？","subject":"民法","topic":"連帶債務求償","year":110},{"answer":"B","explain":"債務人無償行為害及債權→聲請法院撤銷（§244）。受詐欺意思表示撤銷即可；違反公序→無效；違反近親禁婚→無效（§988）","id":"mf-110-13","laws":[{"ref":"民法 §244","text":"債務人所為之無償行為，有害及債權者，債權人得聲請法院撤銷之。\n債務人所為之有償行為，於行為時明知有損害於債權人之權利者，以受益人於受益時亦知其情事者為限，債權人得聲請法院撤銷之。\n債務人之行為非以財產為標的，或僅有害於以給付特定物為標的之債權者，不適用前二項之規定。\n債權人依第一項或第二項之規定聲請法院撤銷時，得並聲請命受益人或轉得人回復原狀。但轉得人於轉得時不知有撤銷原因者，不在此限。"},{"ref":"民法 §988","text":"結婚有下列情形之一者，無效：\n一、不具備第九百八十二條之方式。\n二、違反第九百八十三條規定。\n三、違反第九百八十五條規定。但重婚之雙方當事人因善意且無過失信賴一方前婚姻消滅之兩願離婚登記或離婚確定判決而結婚者，不在此限。"}],"no":13,"options":["因受詐欺所為之意思表示","債務人所為之無償行為，有害及債權者","締結違反公共秩序之契約","違反民法第983 條特定親屬間禁止結婚規定之結婚行為"],"stem":"下列何種情形，當事人一方須以向法院聲請撤銷方式為之？","subject":"民法","topic":"聲請法院撤銷","year":110},{"answer":"B","explain":"合夥人沒有增資、補充資本的義務（§669）。合夥財產是公同共有；不足額→合夥人連帶負責（§681）；退夥後對退夥前債務仍要負責（§690）","id":"mf-110-14","laws":[{"ref":"民法 §669","text":"合夥人除有特別訂定外，無於約定出資之外增加出資之義務。因損失而致資本減少者，合夥人無補充之義務。"},{"ref":"民法 §681","text":"合夥財產不足清償合夥之債務時，各合夥人對於不足之額，連帶負其責任。"},{"ref":"民法 §690","text":"合夥人退夥後，對於其退夥前合夥所負之債務，仍應負責。"}],"no":14,"options":["各合夥人之出資及其他合夥財產，為合夥人全體之分別共有","合夥人除有特別訂定外，無於約定出資之外增加出資之義務。因損失而致資本減少者，合夥人無補充之義務","合夥財產不足清償合夥之債務時，各合夥人對於不足之額，無須負其責任","合夥人退夥後，對於其退夥前合夥所負之債務，無須負其責任"],"stem":"關於合夥的敘述，下列何者正確？","subject":"民法","topic":"合夥","year":110},{"answer":"C","explain":"只能就瑕疵物解除，分離顯受損害→可解除全部（§363 I）。從物有瑕疵→只能就從物解除；他地送到的物不受領→仍有暫為保管責任（§358）；種類物另行交付的物，出賣人仍負擔保責任（§364 II）","id":"mf-110-15","laws":[{"ref":"民法 §363","text":"為買賣標的之數物中，一物有瑕疵者，買受人僅得就有瑕疵之物為解除。其以總價金將數物同時賣出者，買受人並得請求減少與瑕疵物相當之價額。\n前項情形，當事人之任何一方，如因有瑕疵之物，與他物分離而顯受損害者，得解除全部契約。"},{"ref":"民法 §358","text":"買受人對於由他地送到之物，主張有瑕疵，不願受領者，如出賣人於受領地無代理人，買受人有暫為保管之責。\n前項情形，如買受人不即依相當方法證明其瑕疵之存在者，推定於受領時為無瑕疵。\n送到之物易於敗壞者，買受人經依相當方法之證明，得照市價變賣之。如為出賣人之利益，有必要時，並有變賣之義務。\n買受人依前項規定為變賣者，應即通知出賣人。如怠於通知，應負損害賠償之責。"},{"ref":"民法 §364","text":"買賣之物，僅指定種類者，如其物有瑕疵，買受人得不解除契約或請求減少價金，而即時請求另行交付無瑕疵之物。\n出賣人就前項另行交付之物，仍負擔保責任。"}],"no":15,"options":["買受人對於由他地送到之物，主張有瑕疵，不願受領者，買受人無暫為保管之責","從物有瑕疵者，買受人得就主物併同從物，解除全部契約","為買賣標的之數物中，一物有瑕疵者，買受人僅得就有瑕疵之物為解除，但當事人之任何一方，如因有瑕疵之物，與他物分離而顯受損害者，得解除全部契約","買賣之物，僅指定種類者，如其物有瑕疵，買受人得不解除契約或請求減少價金，而即時請求另行交付無瑕疵之物。出賣人就另行交付之物，不負擔保責任"],"stem":"關於買賣瑕疵擔保的敘述，下列何者正確？","subject":"民法","topic":"數物一物有瑕疵","year":110},{"answer":"D","explain":"登記不影響依其他法律所為財產權登記的效力（§1008 III）。結婚前或後都可訂；法定財產制（舊制才叫聯合財產制）；非經登記不得對抗第三人，不是不生效力","id":"mf-110-19","laws":[{"ref":"民法 §1008","text":"夫妻財產制契約之訂立、變更或廢止，非經登記，不得以之對抗第三人。\n前項夫妻財產制契約之登記，不影響依其他法律所為財產權登記之效力。\n第一項之登記，另以法律定之。"}],"no":19,"options":["夫妻得於結婚前以契約就民法所定之約定財產制中，選擇其一，為其夫妻財產制。結婚後則不行","夫妻未以契約訂立夫妻財產制者，除民法另有規定外，以聯合財產制，為其夫妻財產制","夫妻財產制契約之訂立、變更或廢止，非經登記，不生效力","夫妻財產制契約之登記，不影響依其他法律所為財產權登記之效力"],"stem":"關於夫妻財產制契約的敘述，下列何者正確？","subject":"民法","topic":"夫妻財產制契約","year":110},{"answer":"D","explain":"夫妻各自清償債務（§1046）；一方以自己財產替他方還債，婚姻存續中也能請求償還。(B)(C) 寫「存續中不得請求」都錯","id":"mf-110-20","laws":[{"ref":"民法 §1046","text":"分別財產制有關夫妻債務之清償，適用第一千零二十三條之規定。"}],"no":20,"options":["夫妻於行為時明知有損於婚姻關係消滅後他方之剩餘財產分配請求權者，以受益人受益時亦知其情事者為限，他方得聲請法院撤銷之","夫妻之一方以自己財產清償他方之債務時，於婚姻關係存續中，不得請求償還。但於婚姻關係消滅時，夫或妻現存之婚後財產，扣除婚姻關係存續所負債務後，如有剩餘，其雙方剩餘財產之差額，應平均分配","夫妻之一方以自己財產清償他方之債務時，於婚姻關係存續中，不得請求償還。但於婚姻關係消滅時，應分別納入現存之婚後財產或婚姻關係存續中所負債務計算","夫妻各自對其債務負清償之責"],"stem":"分別財產制有關夫妻債務的敘述，下列何者正確？","subject":"民法","topic":"分別財產制債務","year":110},{"answer":"A","explain":"共同財產的債務用共同財產清償→不生補償請求權（§1038 I）","id":"mf-110-21","laws":[{"ref":"民法 §1038","text":"共同財產所負之債務，而以共同財產清償者，不生補償請求權。\n共同財產之債務，而以特有財產清償，或特有財產之債務，而以共同財產清償者，有補償請求權，雖於婚姻關係存續中，亦得請求。"}],"no":21,"options":["不生補償請求權","不生補償請求權，但於共同財產制關係消滅時，應分別納入現存之婚後財產或婚姻關係存續中所負債務計算","有補償請求權，但於婚姻關係存續中，不得請求","有補償請求權，雖於婚姻關係存續中，亦得請求"],"stem":"關於共同財產所負之債務，而以共同財產清償者，下列何者正確？","subject":"民法","topic":"共同財產制債務","year":110},{"answer":"A","explain":"否認推定婚生子女要提否認之訴（§1063 II），不是認領之訴。生父生母結婚→視為婚生（準正）；認領→視為婚生；子女或生母可否認生父的認領（§1066）","id":"mf-110-22","laws":[{"ref":"民法 §1063","text":"妻之受胎，係在婚姻關係存續中者，推定其所生子女為婚生子女。\n前項推定，夫妻之一方或子女能證明子女非為婚生子女者，得提起否認之訴。\n前項否認之訴，夫妻之一方自知悉該子女非為婚生子女，或子女自知悉其非為婚生子女之時起二年內為之。但子女於未成年時知悉者，仍得於成年後二年內為之。"},{"ref":"民法 §1066","text":"非婚生子女或其生母，對於生父之認領，得否認之。"}],"no":22,"options":["如有受推定為婚生子女情形，夫妻之一方或子女能證明子女非為婚生子女者，得提起認領之訴","非婚生子女，其生父與生母結婚者，視為婚生子女","非婚生子女經生父認領者，視為婚生子女","非婚生子女或其生母，對於生父之認領，得否認之"],"stem":"民法關於非婚生子女之規定，下列何者錯誤？","subject":"民法","topic":"非婚生子女","year":110},{"answer":"C","explain":"官方答 (C) 錯誤。阿摩網友理由：繼承人要在繼承開始時生存（同時存在原則）、拋棄溯及繼承開始。⚠️但乙在甲死亡時其實還活著，這個理由說不太通，屬爭議題；考場直接記「丙拋棄前乙已死→丁不能繼承乙那一份」即可，不深究","id":"mf-110-23","laws":[],"no":23,"options":["甲之遺產繼承人順序，丙優先於乙","配偶丁與乙有相互繼承遺產之權","就甲之遺產，既然丙已拋棄繼承，應由次順序之乙繼承，雖然乙早於丙拋棄繼承前死亡，仍應由丁繼承乙所繼承自甲之遺產","拋棄繼承權，應於知悉其得繼承之時起三個月內，以書面向法院為之"],"stem":"甲早年父母雙亡，僅有一兄長乙，甲與配偶離異後獨自養育一子丙。某日甲死亡，於丙拋棄繼承前，乙亦不幸意外死亡，留下乙之配偶丁。下列何者錯誤？","subject":"民法","topic":"拋棄繼承","warn":"爭議題：官方答 (C)，理由說不太通，考場直接記結論就好。","year":110},{"answer":"D","explain":"繼承人連帶責任，自分割時（或清償期後）經 5 年免除（§1171 II）。可隨時請求分割（沒有服喪期）；遺囑禁止分割最多 10 年；擔保支付能力看分割時（附條件或未到期才看清償時，§1169）","id":"mf-110-25","laws":[{"ref":"民法 §1171","text":"遺產分割後，其未清償之被繼承人之債務，移歸一定之人承受，或劃歸各繼承人分擔，如經債權人同意者，各繼承人免除連帶責任。\n繼承人之連帶責任，自遺產分割時起，如債權清償期在遺產分割後者，自清償期屆滿時起，經過五年而免除。"},{"ref":"民法 §1169","text":"遺產分割後，各繼承人按其所得部分，對於他繼承人因分割而得之債權，就遺產分割時債務人之支付能力，負擔保之責。\n前項債權，附有停止條件或未屆清償期者，各繼承人就應清償時債務人之支付能力，負擔保之責。"}],"no":25,"options":["繼承人於服喪三年後得隨時請求分割遺產","遺囑禁止遺產之分割者，其禁止之效力以二十年為限","遺產分割後，各繼承人按其所得部分，對於他繼承人因分割而得之債權，就應清償時債務人之支付能力，負擔保之責","繼承人之連帶責任，自遺產分割時起，如債權清償期在遺產分割後者，自清償期屆滿時起，經過五年而免除"],"stem":"關於遺產分割的敘述，下列何者正確？","subject":"民法","topic":"遺產分割","year":110},{"answer":"A","explain":"前小姨子＝旁系姻親、輩分相同→可以結婚。前養女（收養終止後直系親屬仍禁婚）、前媳婦（直系姻親，關係消滅後仍禁婚）、叔母（旁系姻親輩分不同）都禁止（§983）","id":"mf-111-02","laws":[{"ref":"民法 §983","text":"與左列親屬，不得結婚︰\n一、直系血親及直系姻親。\n二、旁系血親在六親等以內者。但因收養而成立之四親等及六親等旁系血親，輩分相同者，不在此限。\n三、旁系姻親在五親等以內，輩分不相同者。\n前項直系姻親結婚之限制，於姻親關係消滅後，亦適用之。\n第一項直系血親及直系姻親結婚之限制，於因收養而成立之直系親屬間，在收養關係終止後，亦適用之。"}],"no":2,"options":["與離婚後無依無靠之前小姨子結婚","與終止收養後之前養女結婚","與自己兒子離婚後之前媳婦結婚","與叔叔死亡後孤苦守寡之叔母結婚"],"stem":"下列何種情況是非屬於近親禁止結婚之規範範圍？","subject":"民法","topic":"近親禁婚","year":111},{"answer":"B","explain":"「買賣不破租賃」只適用租賃，使用借貸不能主張；使用借貸一定無償；動物飼養費原則由借用人負擔（§469）；借用人不能轉借收益","id":"mf-111-04","laws":[{"ref":"民法 §469","text":"借用物之通常保管費用，由借用人負擔。借用物為動物者，其飼養費亦同。\n借用人就借用物支出有益費用，因而增加該物之價值者，準用第四百三十一條第一項之規定。\n借用人就借用物所增加之工作物，得取回之。但應回復借用物之原狀。"}],"no":4,"options":["使用借貸契約必須是無償的契約","借用人得主張買賣不破使用借貸之抗辯","借用物為動物時，飼養費原則上應由借用人承擔","借用人對於借用物原則上並無轉租收益之權限"],"stem":"下列敘述，何者錯誤？","subject":"民法","topic":"使用借貸","year":111},{"answer":"D","explain":"間接給付（新債清償，§320）：新債務不履行時舊債務不消滅。代物清償、抵銷、混同都會讓債務消滅","id":"mf-111-06","laws":[{"ref":"民法 §320","text":"因清償債務而對於債權人負擔新債務者，除當事人另有意思表示外，若新債務不履行時，其舊債務仍不消滅。"}],"no":6,"options":["債權人受領債務人以代物清償方式清償原有之債務","債務人對債權人已屆清償期之債權行使抵銷權，彼此間在抵銷數額之債權債務","債權與其債務發生混同之情形","債務人以間接給付之方式清償原有之債務"],"stem":"下列何種情形，債務人之原有債務不會發生消滅之效果？","subject":"民法","topic":"間接給付","year":111},{"answer":"A","explain":"自己代理（§106）沒經本人同意→效力未定（本人可承認），不是無效。表見代理以「沒有代理權」為前提；間接代理不直接對本人生效；代理人被詐欺→本人可撤銷（§105 以代理人判斷）","id":"mf-111-08","laws":[{"ref":"民法 §106","text":"代理人非經本人之許諾，不得為本人與自己之法律行為，亦不得既為第三人之代理人，而為本人與第三人之法律行為。但其法律行為，係專履行債務者，不在此限。"},{"ref":"民法 §105","text":"代理人之意思表示，因其意思欠缺、被詐欺、被脅迫，或明知其事情或可得而知其事情，致其效力受影響時，其事實之有無，應就代理人決之。但代理人之代理權係以法律行為授與者，其意思表示，如依照本人所指示之意思而為時，其事實之有無，應就本人決之。"}],"no":8,"options":["未經本人事前同意之自己代理，對於本人而言，係無效之代理行為","民法第169 條表見代理效力之發生，須無本人之授予代理權為其要件","間接代理人之代理行為不會對本人直接發生效力","代理人為代理行為時，被相對人詐欺，本人得自行撤銷該代理行為"],"stem":"有關現行民法代理制度之介紹，下列何者錯誤？","subject":"民法","topic":"代理","year":111},{"answer":"C","explain":"財團法人得以遺囑設立（§60）。財團是他律法人（題目說自律錯）；開除社員要總會決議＋正當理由（不是董事會）；社團最高機關是總會不是董事會","id":"mf-111-09","laws":[{"ref":"民法 §60","text":"設立財團者，應訂立捐助章程。但以遺囑捐助者，不在此限。\n捐助章程，應訂明法人目的及所捐財產。\n以遺囑捐助設立財團法人者，如無遺囑執行人時，法院得依主管機關、檢察官或利害關係人之聲請，指定遺囑執行人。"}],"no":9,"options":["財團法人具有自律法人之性質","社員資格須經社團之董事會特別決議同意，且有正當理由時，方能開除之","財團法人之設立，得以遺囑為之","社團法人以社團董事會為其最高意思機關"],"stem":"對於民法上有關法人規定之說明，下列何者正確？","subject":"民法","topic":"法人","year":111},{"answer":"A","explain":"給付前後都能聲請法院撤銷（§74）；1 年期間是除斥期間不是消滅時效；要向法院聲請，不是對相對人意思表示；不是自始無效","id":"mf-111-11","laws":[{"ref":"民法 §74","text":"法律行為，係乘他人之急迫、輕率或無經驗，使其為財產上之給付或為給付之約定，依當時情形顯失公平者，法院得因利害關係人之聲請，撤銷其法律行為或減輕其給付。\n前項聲請，應於法律行為後一年內為之。"}],"no":11,"options":["當事人無論於財產給付前或給付後，均得聲請撤銷該暴利行為","撤銷權自該法律行為成立時起一年內不行使，罹於消滅時效而消滅","行使暴利行為之撤銷權時，應以意思表示向相對人為之","暴利行為自始當然無效"],"stem":"關於民法第74 條暴利行為之規定，下列敘述何者正確？","subject":"民法","topic":"暴利行為","year":111},{"answer":"D","explain":"共有人分割後的擔保責任是按應有部分負責（§825），不是連帶。合夥人對不足額（§681）、共同侵權（§185）、共同繼承人對遺產債務（§1153）都是法定連帶","id":"mf-111-12","laws":[{"ref":"民法 §825","text":"各共有人，對於他共有人因分割而得之物，按其應有部分，負與出賣人同一之擔保責任。"},{"ref":"民法 §681","text":"合夥財產不足清償合夥之債務時，各合夥人對於不足之額，連帶負其責任。"},{"ref":"民法 §185","text":"數人共同不法侵害他人之權利者，連帶負損害賠償責任。不能知其中孰為加害人者亦同。\n造意人及幫助人，視為共同行為人。"},{"ref":"民法 §1153","text":"繼承人對於被繼承人之債務，以因繼承所得遺產為限，負連帶責任。\n繼承人相互間對於被繼承人之債務，除法律另有規定或另有約定外，按其應繼分比例負擔之。"}],"no":12,"options":["合夥財產不足清償合夥債務時，各合夥人對於該不足額之債務","數人共同不法侵害他人權利所生之損害賠償債務","共同繼承人對於被繼承人，於繼承所得遺產限度內之遺產債務","共有人對於他共有人因分割而得之物，所負之擔保責任債務"],"stem":"下列何者非法律明文規定屬於連帶債務之性質？","subject":"民法","topic":"連帶債務","year":111},{"answer":"B","explain":"管理決定顯失公平，或情事變更難以繼續→法院得因任何共有人聲請以裁定變更（§820 II、III）。(A) 寫「半數以上」錯，要「過半數」；(C) 是聲請裁定不是訴請裁判；(D) 不動產的約定要登記後才對受讓人有效，「受讓時知悉就有效」是動產的規定（§826-1）","id":"mf-111-14","laws":[{"ref":"民法 §820","text":"共有物之管理，除契約另有約定外，應以共有人過半數及其應有部分合計過半數之同意行之。但其應有部分合計逾三分之二者，其人數不予計算。\n依前項規定之管理顯失公平者，不同意之共有人得聲請法院以裁定變更之。\n前二項所定之管理，因情事變更難以繼續時，法院得因任何共有人之聲請，以裁定變更之。\n共有人依第一項規定為管理之決定，有故意或重大過失，致共有人受損害者，對不同意之共有人連帶負賠償責任。\n共有物之簡易修繕及其他保存行為，得由各共有人單獨為之。"},{"ref":"民法 §826-1","text":"不動產共有人間關於共有物使用、管理、分割或禁止分割之約定或依第八百二十條第一項規定所為之決定，於登記後，對於應有部分之受讓人或取得物權之人，具有效力。其由法院裁定所定之管理，經登記後，亦同。\n動產共有人間就共有物為前項之約定、決定或法院所為之裁定，對於應有部分之受讓人或取得物權之人，以受讓或取得時知悉其情事或可得而知者為限，亦具有效力。\n共有物應有部分讓與時，受讓人對讓與人就共有物因使用、管理或其他情形所生之負擔連帶負清償責任。"}],"no":14,"options":["分管契約應以共有人半數以上及其應有部分合計過半數，或應有部分合計逾三分之二之同意訂定之","分管契約訂定後，若因情事變更難以繼續時，法院得因任何共有人之聲請，以裁定變更之","共有人對於分管契約無法達成協議時，得訴請法院裁判定分管方式","分管契約訂定後，對於應有部分之受讓人於受讓時知悉其情事者，亦具有效力"],"stem":"關於共有不動產分管契約之敘述，下列何者正確？","subject":"民法","topic":"分管契約","year":111},{"answer":"A","explain":"丙侮辱的是母親乙，不是被繼承人甲→不符 §1145 I 第 5 款，不喪失；丁在甲生前表示拋棄＝預先拋棄無效（拋棄要繼承開始後）→乙丙丁戊各 150 萬","id":"mf-111-15","laws":[{"ref":"民法 §1145","text":"有左列各款情事之一者，喪失其繼承權：\n一、故意致被繼承人或應繼承人於死或雖未致死因而受刑之宣告者。\n二、以詐欺或脅迫使被繼承人為關於繼承之遺囑，或使其撤回或變更之者。\n三、以詐欺或脅迫妨害被繼承人為關於繼承之遺囑，或妨害其撤回或變更之者。\n四、偽造、變造、隱匿或湮滅被繼承人關於繼承之遺囑者。\n五、對於被繼承人有重大之虐待或侮辱情事，經被繼承人表示其不得繼承者。\n前項第二款至第四款之規定，如經被繼承人宥恕者，其繼承權不喪失。"}],"no":15,"options":["乙、丙、丁、戊各150 萬元","乙、戊各200 萬元，庚、辛各100 萬元","乙、丁、戊各150 萬元，庚、辛各75 萬元","乙、戊各300 萬元"],"stem":"甲與乙結婚，生有三個女兒丙、丁、戊。丙因未婚生有二子庚及辛，曾與其母乙發生重大爭吵及言語侮辱情事，而遭甲表示剝奪其繼承權。丁則於甲生前即已向甲表示，當甲百年後將拋棄繼承權。設甲死亡時留有遺產現金600 萬元，並未立有遺囑。問:甲之遺產依法應如何分配？","subject":"民法","topic":"喪失繼承權＋預先拋棄","year":111},{"answer":"B","explain":"現制全面限定責任（§1148 II）：沒開遺產清冊不當然喪失限定利益。仍要繼承債務、只是以遺產為限；隱匿遺產情節重大→不能主張限定（§1163）；順序是先還債權人、最後才交付遺贈（§1160）","id":"mf-111-16","laws":[{"ref":"民法 §1148","text":"繼承人自繼承開始時，除本法另有規定外，承受被繼承人財產上之一切權利、義務。但權利、義務專屬於被繼承人本身者，不在此限。\n繼承人對於被繼承人之債務，以因繼承所得遺產為限，負清償責任。"},{"ref":"民法 §1163","text":"繼承人中有下列各款情事之一者，不得主張第一千一百四十八條第二項所定之利益：\n一、隱匿遺產情節重大。\n二、在遺產清冊為虛偽之記載情節重大。\n三、意圖詐害被繼承人之債權人之權利而為遺產之處分。"},{"ref":"民法 §1160","text":"繼承人非依前條規定償還債務後，不得對受遺贈人交付遺贈。"}],"no":16,"options":["限定繼承係指繼承人自繼承開始時，僅承受被繼承人財產上之權利，而不繼承其債務","繼承人縱未依法開具遺產清冊陳報法院，並不當然喪失限定繼承之利益","繼承人隱匿被繼承人之遺產而情節重大者，仍可主張限定繼承之利益","繼承人應先對受遺贈人交付遺贈，其次償還優先權之債務，再清償普通債務"],"stem":"關於限定繼承之敘述，下列何者正確？","subject":"民法","topic":"限定責任","year":111},{"answer":"C","explain":"夫妻各自管理、使用、收益、處分婚前婚後財產，各自清償債務（§1018）。婚後財產不是共有；追加計算限「為減少他方分配、法定財產制消滅前 5 年內」的處分（§1030-3）；分配請求權 2 年／5 年時效從「知有差額」起算（§1030-1 V）","id":"mf-111-17","laws":[{"ref":"民法 §1018","text":"夫或妻各自管理、使用、收益及處分其財產。"},{"ref":"民法 §1030-3","text":"夫或妻為減少他方對於剩餘財產之分配，而於法定財產制關係消滅前五年內處分其婚後財產者，應將該財產追加計算，視為現存之婚後財產。但為履行道德上義務所為之相當贈與，不在此限。\n前項情形，分配權利人於義務人不足清償其應得之分配額時，得就其不足額，對受領之第三人於其所受利益內請求返還。但受領為有償者，以顯不相當對價取得者為限。\n前項對第三人之請求權，於知悉其分配權利受侵害時起二年間不行使而消滅。自法定財產制關係消滅時起，逾五年者，亦同。"},{"ref":"民法 §1030-1","text":"法定財產制關係消滅時，夫或妻現存之婚後財產，扣除婚姻關係存續所負債務後，如有剩餘，其雙方剩餘財產之差額，應平均分配。但下列財產不在此限：\n一、因繼承或其他無償取得之財產。\n二、慰撫金。\n夫妻之一方對於婚姻生活無貢獻或協力，或有其他情事，致平均分配有失公平者，法院得調整或免除其分配額。\n法院為前項裁判時，應綜合衡酌夫妻婚姻存續期間之家事勞動、子女照顧養育、對家庭付出之整體協力狀況、共同生活及分居時間之久暫、婚後財產取得時間、雙方之經濟能力等因素。\n第一項請求權，不得讓與或繼承。但已依契約承諾，或已起訴者，不在此限。\n第一項剩餘財產差額之分配請求權，自請求權人知有剩餘財產之差額時起，二年間不行使而消滅。自法定財產制關係消滅時起，逾五年者，亦同。"}],"no":17,"options":["夫或妻之財產分為婚前財產與婚後財產，婚前財產由夫妻各自所有，婚後財產則由夫妻共有","夫或妻於婚姻關係存續中就其婚後財產所為之無償行為，應將該財產追加計算，視為現存之婚後財產","夫或妻各自管理、使用、收益及處分其婚前及婚後財產，並各自對其債務負清償之責","剩餘財產差額分配請求權屬一身專屬性之權利，請求權人自法定財產制關係消滅時起，二年間不行使而消滅"],"stem":"關於夫妻法定財產制之規定，下列敘述何者正確？","subject":"民法","topic":"法定財產制","year":111},{"answer":"B","explain":"以建築物設定抵押，建築物存在必要的權利（地上權）可讓與→併付拍賣（§877-1），但抵押權人對這部分價金無優先受償權","id":"mf-111-18","laws":[{"ref":"民法 §877-1","text":"以建築物設定抵押權者，於法院拍賣抵押物時，其抵押物存在所必要之權利得讓與者，應併付拍賣。但抵押權人對於該權利賣得之價金，無優先受清償之權。"}],"no":18,"options":["若丁實行抵押權拍賣B 屋時，A 地所有權應併付拍賣之","若丁實行抵押權拍賣B 屋時，地上權應併付拍賣之","若丙實行抵押權拍賣A 地所有權時，B 屋應併付拍賣之","若丙實行抵押權拍賣A 地所有權時，地上權應併付拍賣之"],"stem":"甲將其A 地設定地上權予乙，乙於A 土地上興建B 屋一棟。其後甲為貸款擔保而將其A 地設定抵押權予丙，乙亦因其貸款擔保而將B 屋設定抵押權予丁。下列敘述何者正確？","subject":"民法","topic":"建築物抵押＋地上權","year":111},{"answer":"B","explain":"果樹附合於土地屬乙；果實分離前是土地成分屬乙；分離後歸有收取權的人（§70），無權占有人甲沒有收取權→分離前後都屬乙","id":"mf-111-19","laws":[{"ref":"民法 §70","text":"有收取天然孳息權利之人，其權利存續期間內，取得與原物分離之孳息。\n有收取法定孳息權利之人，按其權利存續期間內之日數，取得其孳息。"}],"no":19,"options":["果實在與果樹分離前或分離後，均屬於甲所有","果實在與果樹分離前或分離後，均屬於乙所有","果實在與果樹分離前屬於甲所有，分離後屬於乙所有","果實在與果樹分離前屬於乙所有，分離後屬於甲所有"],"stem":"甲無權占有乙之土地種植果樹，其果實歸屬於何人？","subject":"民法","topic":"無權占有種果樹","year":111},{"answer":"C","explain":"特定物買賣不能請求另行交付，只有種類物可以（§364）；可解約、減價，故意不告知瑕疵可請求損害賠償（§360）","id":"mf-111-20","laws":[{"ref":"民法 §364","text":"買賣之物，僅指定種類者，如其物有瑕疵，買受人得不解除契約或請求減少價金，而即時請求另行交付無瑕疵之物。\n出賣人就前項另行交付之物，仍負擔保責任。"},{"ref":"民法 §360","text":"買賣之物，缺少出賣人所保證之品質者，買受人得不解除契約或請求減少價金，而請求不履行之損害賠償；出賣人故意不告知物之瑕疵者亦同。"}],"no":20,"options":["解除買賣契約","請求減少買賣價金","請求另行交付無瑕疵之物","故意不告知瑕疵時，請求損害賠償"],"stem":"特定物買賣，若因物有瑕疵而出賣人依法應負物之瑕疵擔保責任時，下列何者非買受人依法所得主張之權利？","subject":"民法","topic":"物之瑕疵擔保","year":111},{"answer":"D","explain":"租用基地建屋→承租人可請求出租人辦地上權登記（§422-1）。超過 1 年沒字據→視為不定期租賃，不是無效；租金增減限未定期限的租賃（§442）；出租人對承租人放在屋內的物是留置權不是質權（§445）","id":"mf-111-21","laws":[{"ref":"民法 §422-1","text":"租用基地建築房屋者，承租人於契約成立後，得請求出租人為地上權之登記。"},{"ref":"民法 §442","text":"租賃物為不動產者，因其價值之昇降，當事人得聲請法院增減其租金。但其租賃定有期限者，不在此限。"},{"ref":"民法 §445","text":"不動產之出租人，就租賃契約所生之債權，對於承租人之物置於該不動產者，有留置權。但禁止扣押之物，不在此限。\n前項情形，僅於已得請求之損害賠償及本期與以前未交之租金之限度內，得就留置物取償。"}],"no":21,"options":["期限逾一年之不動產租賃契約，應以字據訂立之，否則契約無效","定有期限之不動產租賃，因其價值之昇降，當事人得聲請法院增減其租金","不動產之出租人就租金債權，對於承租人之物置於該不動產者，有法定質權","租用基地建築房屋者，承租人於契約成立後，得請求出租人為地上權之登記"],"stem":"關於租賃法律關係之敘述，下列何者正確？","subject":"民法","topic":"租賃","year":111},{"answer":"A","explain":"互負同種類、均屆清償期的債務→抵銷（§334）；抵充是幾筆債務先還哪筆；混同是債權人債務人同一人","id":"mf-111-22","laws":[{"ref":"民法 §334","text":"二人互負債務，而其給付種類相同，並均屆清償期者，各得以其債務，與他方之債務，互為抵銷。但依債之性質不能抵銷或依當事人之特約不得抵銷者，不在此限。\n前項特約，不得對抗善意第三人。"}],"no":22,"options":["抵銷","抵充","免除","混同"],"stem":"二人互負債務而其給付種類相同，並均屆清償期者，得以其債務與他方之債務互為下列何項主張，以消滅其債務？","subject":"民法","topic":"抵銷","year":111},{"answer":"B","explain":"財團法人設立登記前要得主管機關許可（§59）。財團只能公益；沒有總會；營利目的的是社團（§45 依特別法）","id":"mf-111-24","laws":[{"ref":"民法 §59","text":"財團於登記前，應得主管機關之許可。"},{"ref":"民法 §45","text":"以營利為目的之社團，其取得法人資格，依特別法之規定。"}],"no":24,"options":["財團法人得為公益或營利之目的而設立","財團法人於設立登記前，應得主管機關之許可","財團法人之最高意思機關為總會，且為必設之機關","財團法人若以營利為目的設立，其取得法人資格，依特別法之規定"],"stem":"關於財團法人之敘述，下列何者正確？","subject":"民法","topic":"財團法人","year":111},{"answer":"D","explain":"暴利行為（§74）要向法院聲請撤銷；錯誤、詐欺只要意思表示就能撤銷；通謀虛偽直接無效","id":"mf-112-04","laws":[{"ref":"民法 §74","text":"法律行為，係乘他人之急迫、輕率或無經驗，使其為財產上之給付或為給付之約定，依當時情形顯失公平者，法院得因利害關係人之聲請，撤銷其法律行為或減輕其給付。\n前項聲請，應於法律行為後一年內為之。"}],"no":4,"options":["通謀虛偽意思表示所為之法律行為","因錯誤或誤傳之意思表示而為法律行為","被詐欺而為意思表示之法律行為","因暴利行為所為之法律行為"],"stem":"下列情形，那一行為需向法院聲請撤銷，才會發生撤銷之效力？","subject":"民法","topic":"要聲請法院撤銷的行為","year":112},{"answer":"C","explain":"§350 出賣人擔保債權確實存在→契約有效，買方主張權利瑕疵擔保，不是標的不能而無效","id":"mf-112-06","laws":[{"ref":"民法 §350","text":"債權或其他權利之出賣人，應擔保其權利確係存在。有價證券之出賣人，並應擔保其證券未因公示催告而宣示無效。"}],"no":6,"options":["債權不得作為買賣之標的所以無效","該買賣標的權利自始不存在，屬於標的不能而無效","該買賣標的權利雖然不存在，但契約仍有效，甲可對乙主張權利瑕疵擔保","甲可依締約上過失向乙請求損害賠償"],"stem":"甲向乙購買乙對於丙的債權，但丙已於買賣前清償系爭債權而使該債權消滅，請問該買賣契約之效力如何？","subject":"民法","topic":"債權買賣，債權已不存在","year":112},{"answer":"B","explain":"超過週年 16% 部分無效（§205，110 年從 20% 下修）","id":"mf-112-07","laws":[{"ref":"民法 §205","text":"約定利率，超過週年百分之十六者，超過部分之約定，無效。"}],"no":7,"options":["12","16","20","25"],"stem":"依民法之規定，約定利率超過週年百分之多少，則超過之部分會無效？","subject":"民法","topic":"約定利率上限","year":112},{"answer":"C","explain":"簡易交付（§761 I 但書）","id":"mf-112-10","laws":[{"ref":"民法 §761","text":"動產物權之讓與，非將動產交付，不生效力。但受讓人已占有動產者，於讓與合意時，即生效力。\n讓與動產物權，而讓與人仍繼續占有動產者，讓與人與受讓人間，得訂立契約，使受讓人因此取得間接占有，以代交付。\n讓與動產物權，如其動產由第三人占有時，讓與人得以對於第三人之返還請求權，讓與於受讓人，以代交付。"}],"no":10,"options":["現實交付","占有改定","簡易交付","指示交付"],"stem":"為動產物權讓與之交付，倘受讓人已先占有動產，於讓與合意時即生動產所有權取得之效力，學理上稱之為何？","subject":"民法","topic":"受讓人已先占有","year":112},{"answer":"C","explain":"§798 但書：鄰地為公用地不適用→仍屬果樹所有人","id":"mf-112-11","laws":[{"ref":"民法 §798","text":"果實自落於鄰地者，視為屬於鄰地所有人。但鄰地為公用地者，不在此限。"}],"no":11,"options":["國家所有","該果實為無主物，誰先占即取得所有","為該果實之果樹所有權人所有","由國家及果樹所有權人所共有"],"stem":"果實自落於鄰地者，果實之所有權為鄰地所有權人所有，倘鄰地係公有用地時，該自落之果實為何人所有？","subject":"民法","topic":"果實落在公有地","year":112},{"answer":"D","explain":"租動產營業的租價＝2 年（§127），不是 5 年；催告後 6 個月沒起訴→不中斷；起訴是「中斷」不是「不完成」；判決確定→重新起算 5 年（§137 III）","id":"mf-112-15","laws":[{"ref":"民法 §127","text":"左列各款請求權，因二年間不行使而消滅：\n一、旅店、飲食店及娛樂場之住宿費、飲食費、座費、消費物之代價及其墊款。\n二、運送費及運送人所墊之款。\n三、以租賃動產為營業者之租價。\n四、醫生、藥師、看護生之診費、藥費、報酬及其墊款。\n五、律師、會計師、公證人之報酬及其墊款。\n六、律師、會計師、公證人所收當事人物件之交還。\n七、技師、承攬人之報酬及其墊款。\n八、商人、製造人、手工業人所供給之商品及產物之代價。"},{"ref":"民法 §137","text":"時效中斷者，自中斷之事由終止時，重行起算。\n因起訴而中斷之時效，自受確定判決，或因其他方法訴訟終結時，重行起算。\n經確定判決或其他與確定判決有同一效力之執行名義所確定之請求權，其原有消滅時效期間不滿五年者，因中斷而重行起算之時效期間為五年。"}],"no":15,"options":["乙租車公司的租金請求權時效本為5 年","乙於108 年9 月催告後6 個月內未起訴，仍生中斷時效之效力","乙於109 年8 月訴請甲給付租金時，時效不完成","判決確定後，時效重新起算5 年"],"stem":"甲於民國（下同）107 年9 月間向乙租車公司租用自小客車環島，然卻積欠乙租金新臺幣3 萬元，乙於108 年9 月催告後甲仍不為給付，乙便於109 年8 月訴請甲給付租金，於110 年9 月獲勝訴判決確定。下列何者正確？","subject":"民法","topic":"租車租金時效","year":112},{"answer":"C","explain":"§573 約定報酬無請求權，但契約不是無效（已付的不能要回）","id":"mf-112-16","laws":[{"ref":"民法 §573","text":"因婚姻居間而約定報酬者，就其報酬無請求權。"}],"no":16,"options":["甲乙間的契約，無效","乙得對甲請求給付報酬","乙對甲無報酬請求權","婚姻居間契約不得約定報酬"],"stem":"甲委託乙代為尋覓對象結婚，並承諾事成後給予乙報酬新臺幣10 萬元。關於婚姻居間契約，下列何者正確？","subject":"民法","topic":"婚姻居間","year":112},{"answer":"A","explain":"自訴狀送達之日起視為惡意（§959 II，10-12 已核對條文），不是判決確定日","id":"mf-112-20","laws":[{"ref":"民法 §959","text":"善意占有人自確知其無占有本權時起，為惡意占有人。\n善意占有人於本權訴訟敗訴時，自訴狀送達之日起，視為惡意占有人。"}],"no":20,"options":["善意占有人於本權訴訟敗訴時，自判決確定之日起，視為惡意占有人","善意占有人自確知其無占有本權時起，為惡意占有人","善意占有人因保存占有物所支出之必要費用，得向回復請求人請求償還","善意占有人，因改良占有物所支出之有益費用，於其占有物現存之增加價值限度內，得向回復請求人，請求償還"],"stem":"關於善意占有人之敘述，下列何者錯誤？","subject":"民法","topic":"善意占有人敗訴","year":112},{"answer":"B","explain":"不能證明歸屬的財產＝推定共有（§1017 I），題目寫「視為」所以錯","id":"mf-112-21","laws":[{"ref":"民法 §1017","text":"夫或妻之財產分為婚前財產與婚後財產，由夫妻各自所有。不能證明為婚前或婚後財產者，推定為婚後財產；不能證明為夫或妻所有之財產，推定為夫妻共有。\n夫或妻婚前財產，於婚姻關係存續中所生之孳息，視為婚後財產。\n夫妻以契約訂立夫妻財產制後，於婚姻關係存續中改用法定財產制者，其改用前之財產視為婚前財產。"}],"no":21,"options":["夫或妻婚前財產，於婚姻關係存續中所生之孳息，視為婚後財產","不能證明為夫或妻所有之財產，視為夫妻共有","夫或妻之財產分為婚前財產與婚後財產，由夫妻各自所有","夫妻各自對其債務負清償之責"],"stem":"就法定夫妻財產制之敘述，下列何者錯誤？","subject":"民法","topic":"法定財產制","year":112},{"answer":"C","explain":"配偶與父母（第 2 順序）或兄弟姊妹同為繼承＝1/2（§1144）","id":"mf-112-23","laws":[{"ref":"民法 §1144","text":"配偶有相互繼承遺產之權，其應繼分，依左列各款定之：\n一、與第一千一百三十八條所定第一順序之繼承人同為繼承時，其應繼分與他繼承人平均。\n二、與第一千一百三十八條所定第二順序或第三順序之繼承人同為繼承時，其應繼分為遺產二分之一。\n三、與第一千一百三十八條所定第四順序之繼承人同為繼承時，其應繼分為遺產三分之二。\n四、無第一千一百三十八條所定第一順序至第四順序之繼承人時，其應繼分為遺產全部。"}],"no":23,"options":["非婚生子女非經生父認領或準正，不得繼承其生父之遺產","遺產繼承人，除配偶外，其繼承順序為直系血親卑親屬、父母、兄弟姊妹、祖父母","配偶與被繼承人直系血親尊親屬同為繼承時，其應繼分為遺產之三分之一","特留分之規定，係為保障法定繼承人之權利免受侵害"],"stem":"關於遺產繼承之敘述，下列何者錯誤？","subject":"民法","topic":"應繼分","year":112},{"answer":"A","explain":"故意致被繼承人死亡（§1145 I 第 1 款）不能因原諒回復","id":"mf-112-24","laws":[{"ref":"民法 §1145","text":"有左列各款情事之一者，喪失其繼承權：\n一、故意致被繼承人或應繼承人於死或雖未致死因而受刑之宣告者。\n二、以詐欺或脅迫使被繼承人為關於繼承之遺囑，或使其撤回或變更之者。\n三、以詐欺或脅迫妨害被繼承人為關於繼承之遺囑，或妨害其撤回或變更之者。\n四、偽造、變造、隱匿或湮滅被繼承人關於繼承之遺囑者。\n五、對於被繼承人有重大之虐待或侮辱情事，經被繼承人表示其不得繼承者。\n前項第二款至第四款之規定，如經被繼承人宥恕者，其繼承權不喪失。"}],"no":24,"options":["子女為了遺產而謀殺父親，即喪失對父親之繼承權，因被繼承人原諒繼承人之行為而回復繼承權","偽造、變造、隱匿、湮滅被繼承人關於繼承之遺囑者，喪失繼承權，得因被繼承人原諒繼承人之行為而回復其繼承權","對於被繼承人有重大之虐待或侮辱情事，經被繼承人表示其不得繼承時，喪失繼承權，但之後仍可因獲得被繼承人之原諒而回復繼承權","以詐欺或脅迫妨害被繼承人為關於繼承之遺囑，或妨害其撤回或變更者，喪失繼承權，得因被繼承人原諒繼承人之行為而回復其繼承權"],"stem":"關於回復喪失繼承權之敘述，下列何者錯誤？","subject":"民法","topic":"宥恕回復繼承權","year":112},{"answer":"B","explain":"應通知因拋棄而應繼承的人，但沒通知不影響拋棄效力","id":"mf-112-25","laws":[],"no":25,"options":["應於知悉其得繼承之時起三個月內，以書面向法院為之","拋棄繼承後，應通知因其拋棄而應為繼承之人。未為通知者，不生拋棄繼承之效力","配偶拋棄繼承權者，其應繼分歸屬於與其同為繼承之人","繼承之拋棄，溯及於繼承開始時發生效力"],"stem":"關於拋棄繼承之敘述，下列何者錯誤？","subject":"民法","topic":"拋棄繼承通知","year":112},{"answer":"B","explain":"18 歲成年，19 歲可獨自買車；精神疾病沒受監護宣告≠無行為能力；受輔助宣告人贈與要輔助人同意；15 歲拋棄所有權是單獨行為，沒允許→無效","id":"mf-113-02","laws":[],"no":2,"options":["年滿30 歲患有精神疾病致無法處理自己事務之甲，當然沒有行為能力","年滿19 歲之乙可以獨自訂立買賣汽車之契約","受輔助宣告之丙可以不經輔助人丁之同意贈與使用過之筆電給戊","15 歲之庚可以不經法定代理人允許擅自丟棄自有之平板電腦"],"stem":"有關行為能力之敘述，下列何者正確？","subject":"民法","topic":"行為能力","year":113},{"answer":"B","explain":"丙可依 §110 向無權代理人乙請求損害賠償；乙是以「甲的代理人」名義賣，丙信的是代理權不是所有權→不適用善意取得；甲不承認→債權、物權契約都無效","id":"mf-113-03","laws":[{"ref":"民法 §110","text":"無代理權人，以他人之代理人名義所為之法律行為，對於善意之相對人，負損害賠償之責。"}],"no":3,"options":["丙善意取得名畫之所有權","丙得請求乙損害賠償","乙與丙之買賣契約有效","乙與丙之物權契約有效"],"stem":"甲將其所有之名畫出租於乙，並未將代理權授與乙。詎料，乙竟以甲之代理人名義，與善意之丙訂立買賣契約，將名畫出賣並交付於丙。甲不承認乙之無權代理行為，下列敘述，何者正確？","subject":"民法","topic":"無權代理＋善意取得","year":113},{"answer":"C","explain":"租約有效；第三人主張權利致不能使用→承租人得終止（§436 準用 §435）；不能對抗所有人丙","id":"mf-113-07","laws":[{"ref":"民法 §436","text":"前條規定，於承租人因第三人就租賃物主張權利，致不能為約定之使用、收益者準用之。"},{"ref":"民法 §435","text":"租賃關係存續中，因不可歸責於承租人之事由，致租賃物之一部滅失者，承租人得按滅失之部分，請求減少租金。\n前項情形，承租人就其存餘部分不能達租賃之目的者，得終止契約。"}],"no":7,"options":["甲與乙訂立之租賃契約無效","甲與乙訂立之租賃契約得撤銷","乙得終止與甲訂立之租賃契約","乙得以與甲之租賃契約對抗丙"],"stem":"甲與乙訂立租賃契約，將丙所有之A 屋出租於乙，並交付於乙。嗣後，丙對乙起訴，請求乙返還A 屋，致乙不能為約定之使用，下列敘述，何者正確？","subject":"民法","topic":"出租他人之物","year":113},{"answer":"A","explain":"§425-1 推定在房屋得使用期限內有租賃關係（比較：§838-1 法定地上權是「視為」，用在拍賣）","id":"mf-113-09","laws":[{"ref":"民法 §425-1","text":"土地及其土地上之房屋同屬一人所有，而僅將土地或僅將房屋所有權讓與他人，或將土地及房屋同時或先後讓與相異之人時，土地受讓人或房屋受讓人與讓與人間或房屋受讓人與土地受讓人間，推定在房屋得使用期限內，有租賃關係。其期限不受第四百四十九條第一項規定之限制。\n前項情形，其租金數額當事人不能協議時，得請求法院定之。"},{"ref":"民法 §838-1","text":"土地及其土地上之建築物，同屬於一人所有，因強制執行之拍賣，其土地與建築物之拍定人各異時，視為已有地上權之設定，其地租、期間及範圍由當事人協議定之；不能協議者，得請求法院以判決定之。其僅以土地或建築物為拍賣時，亦同。\n前項地上權，因建築物之滅失而消滅。"}],"no":9,"options":["推定甲與乙在房屋得使用期限內有租賃關係","視為甲與乙在房屋得使用期限內有租賃關係","推定乙在房屋得使用期限內對A 地有普通地上權","視為乙在房屋得使用期限內對A 地有普通地上權"],"stem":"甲在其所有之A 地上興建B 屋後，將B 屋出售並移轉所有權登記於乙。下列敘述，何者正確？","subject":"民法","topic":"房地同一人只賣房","year":113},{"answer":"C","explain":"認錯人（人的同一性錯誤）→契約有效但可撤銷；通謀虛偽離婚無效→仍是夫妻；心中保留相對人明知→無效；被脅迫→得撤銷非當然無效","id":"mf-113-10","laws":[],"no":10,"options":["甲與乙本為夫妻，為逃避債務，通謀虛偽離婚，並辦理離婚登記完畢，甲乙間已無婚姻關係","甲無欲為其意思表示之拘束，而向乙表示將贈與新款手機一部，乙雖明知甲心中之真意，贈與契約仍有效","甲誤將丙誤認為乙，與之訂立買賣契約，該契約有效，但甲得撤銷其之意思表示","甲受丙脅迫而與之訂立互易契約，該契約當然無效"],"stem":"有關意思表示之敘述，下列何者正確？","subject":"民法","topic":"意思表示","year":113},{"answer":"C","explain":"§416 贈與人得撤銷贈與","id":"mf-113-11","laws":[{"ref":"民法 §416","text":"受贈人對於贈與人，有左列情事之一者，贈與人得撤銷其贈與：\n一、對於贈與人、其配偶、直系血親、三親等內旁系血親或二親等內姻親，有故意侵害之行為，依刑法有處罰之明文者。\n二、對於贈與人有扶養義務而不履行者。\n前項撤銷權，自贈與人知有撤銷原因之時起，一年內不行使而消滅。贈與人對於受贈人已為宥恕之表示者，亦同。"}],"no":11,"options":["甲得解除贈與契約","甲得終止贈與契約","甲得撤銷贈與契約","甲得撤回贈與契約"],"stem":"甲與其20 歲之兒子乙訂立贈與契約，將甲所有之A 屋贈與乙，並完成所有權移轉登記。嗣後，乙竟不履行對甲之法定扶養義務。下列敘述，何者正確？","subject":"民法","topic":"受贈人不扶養","year":113},{"answer":"A","explain":"形成判決，判決確定時取得所有權，不待登記（處分前才要登記）","id":"mf-113-14","laws":[],"no":14,"options":["甲乙丙丁於判決確定時，各自取得分得部分之所有權","甲根據確定判決，請求乙丙丁辦理登記，始取得分得部分之所有權","共有物分割之判決是確認判決，僅在確認甲乙丙丁之權利義務法律關係","共有物分割之判決是給付判決，甲有權請求乙丙丁給付分得部分之所有權"],"stem":"甲乙丙丁分別共有A 地，甲以乙丙丁為被告提起分割共有物之訴，獲得勝訴確定判決。下列敘述，何者正確？","subject":"民法","topic":"分割共有物判決","year":113},{"answer":"B","explain":"只取得「請求登記為地上權人」的權利（向地政機關申請），不是直接取得","id":"mf-113-15","laws":[],"no":15,"options":["甲已經取得普通地上權","甲得請求登記為普通地上權人","因乙之A 地已辦理登記，故甲無法時效取得","甲得直接以乙為被告，起訴請求乙同意甲登記為普通地上權人"],"stem":"甲以行使普通地上權之意思，二十年間和平、公然、繼續在乙已登記之A 地上有B 屋，下列敘述，何者正確？","subject":"民法","topic":"時效取得地上權","year":113},{"answer":"C","explain":"§195 非財產上損害（慰撫金）一身專屬，除非已契約承諾或已起訴才可繼承","id":"mf-113-19","laws":[{"ref":"民法 §195","text":"不法侵害他人之身體、健康、名譽、自由、信用、隱私、貞操，或不法侵害其他人格法益而情節重大者，被害人雖非財產上之損害，亦得請求賠償相當之金額。其名譽被侵害者，並得請求回復名譽之適當處分。\n前項請求權，不得讓與或繼承。但以金額賠償之請求權已依契約承諾，或已起訴者，不在此限。\n前二項規定，於不法侵害他人基於父、母、子、女或配偶關係之身分法益而情節重大者，準用之。"}],"no":19,"options":["尚未繳清貸款之房屋","甲所著理財專書之著作權","甲對丙依據民法第195 條規定可主張之非財產上損害賠償請求權","甲積欠乙銀行之20 萬信用貸款"],"stem":"著有數本暢銷理財專書之甲，某日遭汽車駕駛人丙撞傷，卻於與丙損害賠償協議達成前，突發心肌梗塞猝死，留有土地一筆及尚未繳清貸款之房屋一棟，某上市電子公司股份100 萬股，銀行存款30 萬元，尚欠有乙銀行之信用貸款20 萬元。下列何者非屬繼承之標的？","subject":"民法","topic":"不能繼承的權利","warn":"這題考選部公告 (B)、(C) 都給分，網頁以 (C) 計。","year":113},{"answer":"C","explain":"生存歸來要向法院聲請撤銷，不是地檢署；80 歲以上失蹤滿 3 年；共有人是利害關係人可聲請","id":"mf-114-01","laws":[],"no":1,"options":["失蹤人遺留之與他人共有不動產之共有人，得聲請對失蹤人為死亡宣告","失蹤人已年滿80 歲，其失蹤期間應滿3 年後，始得被聲請死亡宣告","失蹤人受死亡宣告後，生存歸來時，得聲請地檢署撤銷死亡宣告","受死亡宣告之失蹤人實際上仍生存時，其權利能力不因死亡宣告而喪失"],"stem":"依我國民法有關死亡宣告之規定，下述何者錯誤？","subject":"民法","topic":"死亡宣告","year":114},{"answer":"B","explain":"「辨識能力顯有不足」＝輔助宣告；「不能辨識」才是監護宣告","id":"mf-114-02","laws":[],"no":2,"options":["受監護宣告之成年人，無行為能力","成年人因精神障礙或其他心智缺陷，致其辨識其意思表示效果之能力顯有不足者，得因聲請，對其為監護之宣告","受監護宣告之成年人，仍保有完全之權利能力","受輔助宣告之成年人逕自締結汽車之買賣契約，該契約不因欠缺輔助人之事前同意而無效"],"stem":"我國民法修正時，增訂有關監護宣告及輔助宣告制度之規定。依現行民法相關之規定，下列何者錯誤？","subject":"民法","topic":"監護 vs 輔助","year":114},{"answer":"C","explain":"法人仍可享有名稱權、名譽權等人格權，說「無法享有」錯；以遺囑捐助設立財團法人不用訂捐助章程（§60）","id":"mf-114-03","laws":[{"ref":"民法 §60","text":"設立財團者，應訂立捐助章程。但以遺囑捐助者，不在此限。\n捐助章程，應訂明法人目的及所捐財產。\n以遺囑捐助設立財團法人者，如無遺囑執行人時，法院得依主管機關、檢察官或利害關係人之聲請，指定遺囑執行人。"}],"no":3,"options":["民法關於公益社團法人之設立，係採取許可主義","法人解散後，在清算程序中，在清算之必要範圍內，仍具有法人格","法人之權利能力，受到性質上之限制，因此無法享有民法賦予自然人所有之人格權利","財團法人之設立，捐助人亦得以遺囑捐助之方式為之，且以此種方式設立之財團法人，無須訂立捐助章程"],"stem":"下列敘述，何者與民法法人之規定並不相容？","subject":"民法","topic":"法人","year":114},{"answer":"C","explain":"不得對抗善意第三人（§27 III），不是「任何第三人」","id":"mf-114-04","laws":[{"ref":"民法 §27","text":"法人應設董事。董事有數人者，法人事務之執行，除章程另有規定外，取決於全體董事過半數之同意。\n董事就法人一切事務，對外代表法人。董事有數人者，除章程另有規定外，各董事均得代表法人。\n對於董事代表權所加之限制，不得對抗善意第三人。\n法人得設監察人，監察法人事務之執行。監察人有數人者，除章程另有規定外，各監察人均得單獨行使監察權。"}],"no":4,"options":["就A 法人一切事務，甲可代表A 法人","A 法人可僅設甲一位董事","A 法人若對甲董事之代表權加以限制，其限制得對抗任何第三人","若A 法人僅有甲與丙兩位董事，則該法人事務之執行，若兩人意見相左，則恐陷入表決的僵局"],"stem":"甲當選A 法人董事，準備大顯身手，下列敘述何者錯誤？","subject":"民法","topic":"董事代表權限制","year":114},{"answer":"C","explain":"意思表示後 1 年（§90），不是 2 年；撤銷後要賠相對人信賴利益（§91）","id":"mf-114-07","laws":[{"ref":"民法 §90","text":"前二條之撤銷權，自意思表示後，經過一年而消滅。"},{"ref":"民法 §91","text":"依第八十八條及第八十九條之規定撤銷意思表示時，表意人對於信其意思表示為有效而受損害之相對人或第三人，應負賠償責任。但其撤銷之原因，受害人明知或可得而知者，不在此限。"}],"no":7,"options":["該錯誤之意思表示若因表意人之過失所致時，表意人不得撤銷其所為之意思表示","該錯誤必須在交易上被認為具有重要性","錯誤之表意人必須在意思表示後，於2 年內行使撤銷權，反之於除斥期間經過後，該法律關係即應繼續有效存續","錯誤之表意人撤銷其意思表示後，對於相對人應承擔信賴該法律行為有效而生之損害賠償責任"],"stem":"不同之權利主體以法律行為方式，形成了彼此間之法律關係。嗣後，當事人一方發現自己已為之意思表示發生錯誤，乃依民法第88 條規定行使撤銷權。下列相關之敘述，何者錯誤？","subject":"民法","topic":"錯誤撤銷除斥期間","year":114},{"answer":"D","explain":"超過授權部分＝無權代理，契約不能切成「1 億內有效」；不動產買賣委任及代理權授與都要書面（§531）","id":"mf-114-09","laws":[{"ref":"民法 §531","text":"為委任事務之處理，須為法律行為，而該法律行為，依法應以文字為之者，其處理權之授與，亦應以文字為之。其授與代理權者，代理權之授與亦同。"}],"no":9,"options":["本件代理權的授與和委任契約二者均須書面","若丙自始至終不知道乙為甲的代理人，且債權契約和物權契約當事人簽乙的名字，則本件法律效果無法歸屬於甲","若甲知道丙欺騙乙，把房屋的優點講得天花亂墜，但甲仍要乙代理他買下房屋，則甲事後不得主張受詐欺撤銷意思表示","甲跟乙說好，最多出價1 億元，1 億元的事情沒寫在書面，乙和丙講價的結果，被丙說服用行情價1 億1 千萬簽訂契約。該買賣契約在1 億元價金的範圍內有效"],"stem":"甲授與乙代理權，並委任乙與丙商談甲買受丙所有房屋及辦理移轉所有權之事宜。下列敘述何者錯誤？","subject":"民法","topic":"代理逾越權限","year":114},{"answer":"B","explain":"房屋一部轉租，無反對約定可以（§443）；超過 1 年沒書面→視為不定期租賃，不是無效；默示更新→視為不定期","id":"mf-114-12","laws":[{"ref":"民法 §443","text":"承租人非經出租人承諾，不得將租賃物轉租於他人。但租賃物為房屋者，除有反對之約定外，承租人得將其一部分轉租於他人。\n承租人違反前項規定，將租賃物轉租於他人者，出租人得終止契約。"}],"no":12,"options":["租期若超過1 年，且未寫書面契約，則租賃契約無效","若未特別約定，則乙有權將其中的房間分租給丙","若未特別約定，則乙有權將承租人的地位債權讓與給丙","若雙方約定租期3 年，3 年過後乙默默繳房租，甲默默收房租，則雙方均不得主張租賃契約默示更新"],"stem":"甲將房屋租給乙。下列何者正確？","subject":"民法","topic":"房屋租賃","year":114},{"answer":"D","explain":"贈與人只有故意不告知或保證無瑕疵才賠（§411）；贈與是諾成契約；公證贈與遲延不能請求遲延損害（§409 II）","id":"mf-114-13","laws":[{"ref":"民法 §411","text":"贈與之物或權利如有瑕疵，贈與人不負擔保責任。但贈與人故意不告知其瑕疵或保證其無瑕疵者，對於受贈人因瑕疵所生之損害，負賠償之義務。"},{"ref":"民法 §409","text":"贈與人就前條第二項所定之贈與給付遲延時，受贈人得請求交付贈與物；其因可歸責於自己之事由致給付不能時，受贈人得請求賠償贈與物之價額。\n前項情形，受贈人不得請求遲延利息或其他不履行之損害賠償。"}],"no":13,"options":["在經公證之贈與契約，贈與人因可歸責之事由致給付遲延，受贈人得依民法第231 條之規定請求贈與人對於遲延給付造成之損害，負賠償責任","依現行民法之規定，以不動產為標的之贈與契約，屬於具要物性之法律行為","贈與人所贈與之標的物本身具有瑕疵，贈與人應負無過失之擔保責任","贈與人所贈與之標的物具有瑕疵，造成受贈人之損害，僅於贈與人故意不告知其瑕疵或保證其無瑕疵時，始得請求賠償"],"stem":"對於權利主體間之贈與契約，依我國民法規定，下列何者為正確之論述？","subject":"民法","topic":"贈與瑕疵","year":114},{"answer":"D","explain":"出資屬合夥人全體公同共有（§668），不是各自所有","id":"mf-114-14","laws":[{"ref":"民法 §668","text":"各合夥人之出資及其他合夥財產，為合夥人全體之公同共有。"}],"no":14,"options":["如甲在麵館以外之場所猥褻K，乙無須對K 負連帶損害賠償責任","麵體供應商J 多次索取買賣價金均無果，J 得以M 為被告請求履行債務","甲、乙兩人想把M 收起來，尚須經清算程序","M 麵館的餐具是甲提供的、攤車是乙提供的，當麵館持續在營業時，餐具的所有權仍是甲的、攤車的所有權仍是乙的"],"stem":"甲、乙兩人合夥開了一家小麵館M，生意興隆。下列何者錯誤？","subject":"民法","topic":"合夥財產","year":114},{"answer":"A","explain":"故意越界不受 §796 保護→可請求移去；分割造成袋地通行他分割人土地不用付償金（§789）；果實落鄰地是「視為」不是推定；鄰地使用受損害只能要償金不能拒絕（§792）","id":"mf-114-15","laws":[{"ref":"民法 §796","text":"土地所有人建築房屋非因故意或重大過失逾越地界者，鄰地所有人如知其越界而不即提出異議，不得請求移去或變更其房屋。但土地所有人對於鄰地因此所受之損害，應支付償金。\n前項情形，鄰地所有人得請求土地所有人，以相當之價額購買越界部分之土地及因此形成之畸零地，其價額由當事人協議定之；不能協議者，得請求法院以判決定之。"},{"ref":"民法 §789","text":"因土地一部之讓與或分割，而與公路無適宜之聯絡，致不能為通常使用者，土地所有人因至公路，僅得通行受讓人或讓與人或他分割人之所有地。數宗土地同屬於一人所有，讓與其一部或同時分別讓與數人，而與公路無適宜之聯絡，致不能為通常使用者，亦同。\n前項情形，有通行權人，無須支付償金。"},{"ref":"民法 §792","text":"土地所有人因鄰地所有人在其地界或近旁，營造或修繕建築物或其他工作物有使用其土地之必要，應許鄰地所有人使用其土地。但因而受損害者，得請求償金。"}],"no":15,"options":["土地所有人建築房屋故意逾越地界者，法院得斟酌公共利益後，能允許鄰地所有人請求移去或變更","共有土地因分割，致其中一共有人所取得分得土地與公路無適宜之聯絡，無法為通常之使用，應支付償金，取得通行他分割人所有地之權利","果實自落於鄰地，推定由鄰地所有人取得所有權","鄰地所有人因營造或修繕建築物之必要，得使用土地所有人之土地及其上建物內部閒置之空間。但受有損害時，則得拒絕鄰地所有人之使用"],"stem":"依現行民法物權編有關不動產所有權相鄰關係規定之內容，下列之選項，何者正確？","subject":"民法","topic":"相鄰關係","year":114},{"answer":"A","explain":"約定不分割期間內，有重大事由仍得隨時請求分割（§823 III）；不分割約定最長 5 年","id":"mf-114-16","laws":[{"ref":"民法 §823","text":"各共有人，除法令另有規定外，得隨時請求分割共有物。但因物之使用目的不能分割或契約訂有不分割之期限者，不在此限。\n前項約定不分割之期限，不得逾五年；逾五年者，縮短為五年。但共有之不動產，其契約訂有管理之約定時，約定不分割之期限，不得逾三十年；逾三十年者，縮短為三十年。\n前項情形，如有重大事由，共有人仍得隨時請求分割。"}],"no":16,"options":["若甲、乙協議20 年內不得分割，則在該期限內，不論發生任何事由，甲、乙均不得請求分割","甲得在未經乙的同意下，將其應有部分贈與及移轉給丁","若甲商請乙分割A 地未果，甲可聲請法院分割A 地，此時法院須優先考慮原物分配","A 地由丙無權占有使用，乙得在未經甲的同意下請求丙返還A 地"],"stem":"甲、乙兩人共有A 地，應有部分甲為1/3、乙為2/3。下列何者錯誤？","subject":"民法","topic":"共有","year":114},{"answer":"D","explain":"預付地租已登記→可對抗受讓人；未定期限逾 20 年才能請求法院定期間（不是 30 年）；不可抗力不能減免地租（§837）；欠租 2 年要先定期催告才能終止","id":"mf-114-17","laws":[{"ref":"民法 §837","text":"地上權人，縱因不可抗力，妨礙其土地之使用，不得請求免除或減少租金。"}],"no":17,"options":["地上權未定有存續期間者，逾越30 年後，土地所有人始得向法院請求，定其後續之存續期間，或終止該地上權","地上權人因不可抗力之事由導致妨礙其行使地上權使用時，得拒絕或減少地租之支付","地上權人積欠地租達2 年總額時，除另有習慣外，土地所有人得逕行終止存續期限尚未屆至之地上權","已設定地上權之土地所有權人，於地上權存續期間讓與該土地所有權與第三人，已預收之地租如已登記，地上權人得以該預付地租對抗受讓之第三人"],"stem":"依我國民法關於地上權之規定，下列何者正確之論述？","subject":"民法","topic":"地上權","year":114},{"answer":"D","explain":"惡意占有人因保存支出必要費用，可依無因管理請求償還（§957）","id":"mf-114-18","laws":[{"ref":"民法 §957","text":"惡意占有人，因保存占有物所支出之必要費用，對於回復請求人，得依關於無因管理之規定，請求償還。"}],"no":18,"options":["占有於我國為事實，而非占有權","無權占有人亦有占有物返還請求權","占有與取得時效有關","惡意占有人，因保存占有物所支出之必要費用，不得請求償還"],"stem":"關於占有，下列何者錯誤？","subject":"民法","topic":"占有","year":114},{"answer":"B","explain":"自己任意行為造成袋地（自己築牆）→不適用法定通行權，要對方同意；非故意越界＋知情不異議→不能請求拆屋","id":"mf-114-19","laws":[],"no":19,"options":["A 地兩面環山、第三面環河，僅能經過B 地通行於道路，則甲須經乙的同意，始得取得對B 地的通行權","A 地一面環山、一面環河、一面接著大馬路、一面緊鄰B 地，甲聽信風水師的建議，將面臨大馬路的那一面築起無門的高牆因此無法通行，則甲須經乙的同意，始得取得對B 地的通行權","袋地通行權性質上並非供役地所有權本質上的限縮","若甲在A 地上蓋房子，因為土地測量單位的疏失，該建築有30 公分越界到B 地，此時乙得知此狀況，若沒有馬上阻止，則之後仍可請求甲拆屋還地"],"stem":"甲所有的A 地與乙所有的B 地相鄰。下列何者正確？","subject":"民法","topic":"袋地通行","year":114},{"answer":"C","explain":"婚後受贈財產不列入分配（§1030-1 I 第 1 款），不管有沒有書面聲明","id":"mf-114-20","laws":[{"ref":"民法 §1030-1","text":"法定財產制關係消滅時，夫或妻現存之婚後財產，扣除婚姻關係存續所負債務後，如有剩餘，其雙方剩餘財產之差額，應平均分配。但下列財產不在此限：\n一、因繼承或其他無償取得之財產。\n二、慰撫金。\n夫妻之一方對於婚姻生活無貢獻或協力，或有其他情事，致平均分配有失公平者，法院得調整或免除其分配額。\n法院為前項裁判時，應綜合衡酌夫妻婚姻存續期間之家事勞動、子女照顧養育、對家庭付出之整體協力狀況、共同生活及分居時間之久暫、婚後財產取得時間、雙方之經濟能力等因素。\n第一項請求權，不得讓與或繼承。但已依契約承諾，或已起訴者，不在此限。\n第一項剩餘財產差額之分配請求權，自請求權人知有剩餘財產之差額時起，二年間不行使而消滅。自法定財產制關係消滅時起，逾五年者，亦同。"}],"no":20,"options":["甲所有之婚前購買之有價證券，於甲、乙婚後，甲取得該有價證券分配之股息或利息，於甲、乙離婚時，乙得主張該分配之股息或利息，納入剩餘財產為分配計算之標的","甲於婚後以自己之財產清償乙所負之債務後，即使在婚姻關係中，仍得請求乙償還","甲、乙離婚時，對於婚後乙受贈之財產，如未經贈與人以書面聲明為乙之特有財產時，即應納入乙之婚後財產，成為剩餘財產分配計算之標的","甲、乙離婚時，乙知悉剩餘財產分配計算之差額，僅得自法定財產關係消滅時起2 年內，向甲主張給付該差額之二分之一"],"stem":"甲、乙結婚後未約定夫妻財產制時，下列有關甲、乙間之配偶財產關係之論述，何者錯誤？","subject":"民法","topic":"剩餘財產分配","year":114},{"answer":"A","explain":"拋棄繼承→應繼分歸同順序其他人，不是代位繼承；繼承債務以遺產為限負連帶；拋棄者管理遺產＝與處理自己事務同一注意","id":"mf-114-22","laws":[],"no":22,"options":["概括繼承人如對於被繼承人生前享有權利或負擔義務，不因被繼承人之死亡而隨之消滅","第1138 條所定第1 順序之繼承人中有拋棄繼承權者，其應繼分應由其直系血親卑親屬代位繼承之","繼承人對於被繼承人所遺留之債務，對於被繼承人之債權人，負連帶清償之責任","拋棄繼承者，就自己所管理之遺產，於其他繼承人或遺產管理人開始管理前，應以善良管理人之注意義務，繼續管理該遺產"],"stem":"我國現行民法對於繼承制度，原則上採取概括繼承有限責任之規範型態。下列何者屬於正確之敘述？","subject":"民法","topic":"概括繼承","year":114},{"answer":"A","explain":"受遺贈人比遺囑人先死→遺贈不生效力（§1201），受遺贈人的繼承人不能主張","id":"mf-114-23","laws":[{"ref":"民法 §1201","text":"受遺贈人於遺囑發生效力前死亡者，其遺贈不生效力。"}],"no":23,"options":["甲立遺囑，遺囑中將A 地贈與好友乙。乙於甲之遺囑生效前意外死亡，其後甲重病身亡，乙之繼承人丙得向甲之繼承人丁請求移轉交付A 地所有權予自己","甲遺囑中遺贈予乙之A 車，因丙之過失毀損，甲之遺囑生效時，推定對丙之權利成為遺贈之客體，乙得向甲之繼承人丁請求移轉該權利予自己","甲以遺囑贈與A 屋予好友乙，遺囑生效時，甲之繼承人丙寄存證信函請求乙30 日內回函確認，乙置之不理，期限屆滿時，該遺囑中之遺贈，仍然確定生效","甲以遺囑贈與A 屋予好友乙，遺囑生效前，甲將A 屋出賣予丙取得價金1 千萬元之債權，甲請求丙將該價金1 千萬元直接捐贈予丁慈善基金會。甲之遺囑生效時，遺囑中A 屋之遺贈應屬無效"],"stem":"依我國民法有關遺囑之規定，下列敘述何者錯誤？","subject":"民法","topic":"遺贈","year":114},{"answer":"B","explain":"無法證明先後→推定同時死亡（§11），互不繼承","id":"mf-114-25","laws":[{"ref":"民法 §11","text":"二人以上同時遇難，不能證明其死亡之先後時，推定其為同時死亡。"}],"no":25,"options":["甲、乙被發現時，由屍體的腐壞程度可以斷定甲比乙早10 小時死亡，則乙為甲的繼承人","甲、乙被發現時，即使經過法醫相驗，也無法確定誰先死，則雙方互為繼承人","3 年前，甲的家人為了擔心乙分家產，要求甲把全部的財產贈與給甲母，才允許雙方登記結婚此次事故甲死乙傷，乙無法對甲母主張詐害債權的撤銷","該事故實則是乙為了取得甲大筆的遺產所製造的車禍，若甲死乙傷，乙將喪失對甲的繼承權"],"stem":"甲夫乙妻，一起到夏威夷旅遊，租車亂跑，不幸墜入山谷。下列何者錯誤？","subject":"民法","topic":"同時死亡","year":114},{"id":"gj-107-02","subject":"估價","year":107,"no":2,"topic":"總費用項目","stem":"有關勘估標的總費用之推算項目，不包括下列那一項？","options":["管理費及維修費","地價稅或地租、房屋稅","保險費","貸款利息"],"answer":"D","explain":"貸款利息不算總費用（跟融資方式有關，不是不動產本身的費用）；管理維修費、地價稅房屋稅、保險費都是","laws":[]},{"id":"gj-107-04","subject":"估價","year":107,"no":4,"topic":"計量模型門檻","stem":"下列何者符合應用計量模型分析法關係式採用5 個自變數時所要求之所有條件？","options":["蒐集26 個比較標的、迴歸分析調整後判定係數為0.8、截距項以外其他各主要影響價格因素之係數估計值同時為零之顯著機率為0.04","蒐集36 個比較標的、迴歸分析調整後判定係數為0.8、截距項以外其他各主要影響價格因素之係數估計值同時為零之顯著機率為0.95","蒐集60 個比較標的、迴歸分析調整後判定係數為0.02、截距項以外其他各主要影響價格因素之係數估計值同時為零之顯著機率為0.03","蒐集20 個比較標的、迴歸分析調整後判定係數為0.8、截距項以外其他各主要影響價格因素之係數估計值同時為零之顯著機率為0.01"],"answer":"A","explain":"5 個自變數→比較標的至少 25 個（5 倍）；調整後判定係數 ≥ 0.7；係數同時為零顯著機率 ≤ 5%。A：26 個／0.8／0.04 全符合；B 機率 0.95 太高、C 判定係數 0.02 太低、D 只有 20 個","laws":[]},{"id":"gj-107-07","subject":"估價","year":107,"no":7,"topic":"收益法蒐集資料","stem":"收益法估價應蒐集勘估標的及與其特性相同或相似之比較標的最近幾年間總收入、總費用及收益資本化率或折現率等資料？","options":["2 年","3 年","4 年","5 年"],"answer":"B","explain":"蒐集最近 3 年間的總收入、總費用、收益資本化率或折現率","laws":[]},{"id":"gj-107-13","subject":"估價","year":107,"no":13,"topic":"違章建築","stem":"附有違章建築之房地估價，有關違建部分之處理方式，下列何者正確？","options":["違建部分不予以評估","委託人要求評估違建部分之價值時，只需就合法建物及違建部分於估價報告書中標示合併之總價格即可","委託人如果要求評估違建部分之價值時，應拒絕之","不論委託人有無要求，皆應就合法建物及違建部分於估價報告書中標示合併之總價格"],"answer":"A","explain":"違建部分不予評估；委託人要求時要把合法建物和違建分別標示價格（不是合併標示總價），也不用拒絕","laws":[]},{"id":"gj-107-15","subject":"估價","year":107,"no":15,"topic":"獨立估價","stem":"不動產估價有所謂的獨立估價，請問獨立估價是指：","options":["土地上原有地上建物，但於估價之價格日期時已頽壞傾倒，估價時仍視為有地上建物，併同土地一併估價","土地上無地上建物，純素地估價","土地上有地上建物，估價時將土地與地上建物併同估價","土地上有地上建物或他項權利存在，但估價時將土地視為素地予以估價，不考慮地上建物或他項權利對該土地的影響"],"answer":"D","explain":"土地上有建物或他項權利，估價時把土地當素地估，不考慮地上物的影響；B 純素地是本來就沒建物，不是獨立估價","laws":[]},{"id":"gj-107-17","subject":"估價","year":107,"no":17,"topic":"比較法調整率（選錯誤）","stem":"下列有關比較法的敘述，何者錯誤？","options":["試算價格調整運算過程中，情況因素、價格日期、區域因素、個別因素或區域因素及個別因素內之任一單獨項目之價格調整率不得大於15%，但勘估標的性質或區位特殊，於報告書敘明者，不在此限","試算價格調整運算過程中，情況因素、價格日期、區域因素及個別因素總調整率不得大於30%，但勘估標的性質或區位特殊，於報告書敘明者，不在此限","情況調整係指比較標的之價格形成條件中有非屬於一般正常情形而影響價格時，或有其他足以改變比較標的價格之情況存在時，就該影響部分所作之調整","估價師運用比較法估價時，應採用三件以上比較標的"],"answer":"A","explain":"單項 15% 門檻只管區域因素、個別因素（及其內單獨項目），不含情況、價格日期；A 把情況、價格日期塞進單項門檻所以錯。總調整率 30% 才是四項全算；比較標的要 3 件以上","laws":[]},{"id":"gj-107-18","subject":"估價","year":107,"no":18,"topic":"調整率 vs 試算價格差距","stem":"王先生手中取得一份不動產估價報告書，比較法推估過程中三個比較案例的價格依序為新臺幣63 萬元/坪、64.5 萬元/坪、68.5 萬元/坪，所推估之試算價格依序分別為新臺幣45 萬元/坪、50萬元/坪、57.5 萬元/坪，下列敘述何者正確？","options":["比較案例一總調整率不符規定","比較案例三總調整率不符規定","比較案例一與比較案例三試算價格之差距不符規定","比較案例一與比較案例二之試算價格較接近，應給予較高之權重"],"answer":"C","explain":"調整率分母＝比較價格：案例一 (63−45)÷63≈28.6% \u003c 30% 沒超、案例三 11÷68.5≈16% 沒超→A、B 錯。試算價格差距＝(57.5−45)÷ 平均 51.25≈24.4% > 20%→C 對。D 錯：權重看調整幅度（案例三調整最小），不是看價格接不接近","laws":[]},{"id":"gj-107-21","subject":"估價","year":107,"no":21,"topic":"收益資本化率方法","stem":"選擇數個與勘估標的相同或相似之比較標的，以其淨收益除以價格後，以所得之商數加以比較決定收益資本化率之方法為：","options":["加權平均資金成本法","有效總收入乘數法","債務保障比率法","市場萃取法"],"answer":"D","explain":"比較標的「淨收益 ÷ 價格」→市場萃取法；DCR 法是 DCR × 貸款常數 × 貸款比率；加權平均是資金成本加權","laws":[]},{"id":"gj-107-22","subject":"估價","year":107,"no":22,"topic":"工事、水利土壤改良","stem":"附著於土地之工事及水利土壤之改良，以何種方法估價為原則？","options":["收益法","成本法","比較法","土地開發分析法"],"answer":"B","explain":"成本法為原則（跟 114-9 同一題型，第二次錯）","laws":[]},{"id":"gj-109-01","subject":"估價","year":109,"no":1,"topic":"殘餘價格","stem":"下列有關成本法之建物殘餘價格之敘述，何者正確？","options":["建物之殘餘價格率以不超過百分之二十為原則","建物耐用年數終止後無殘餘價格者，於計算折舊時以最低殘餘價格率提列","殘餘價格率，指建物於經濟耐用年數屆滿後，於市場上出售之價格占房地總價格之比率","計算建物殘餘價格時，應考量建物耐用年數終止後所需清理或清除成本"],"answer":"D","explain":"§67：殘餘價格率不超過 10% 為原則（A 寫 20% 錯）；確實無殘餘價格者不提列（B 錯）；殘餘價格率分母是建物總成本（C 寫房地總價格錯）；要考量耐用年數終止後的清理清除成本（D 對）","laws":[{"ref":"不動產估價技術規則 §67","text":"建物之殘餘價格率應由全聯會公告之，並以不超過百分之十為原則。\n建物耐用年數終止後確實無殘餘價格者，於計算折舊時不予提列。\n第一項所稱殘餘價格率，指建物於經濟耐用年數屆滿後，其所賸餘之結構材料及內部設備仍能於市場上出售之價格占建物總成本之比率。\n依第一項殘餘價格率計算建物殘餘價格時，應考量建物耐用年數終止後所需清理或清除成本。"}]},{"id":"gj-109-03","subject":"估價","year":109,"no":3,"topic":"宗地估價（選錯誤）","stem":"進行宗地估價時，下列敘述何者錯誤？","options":["以分割為前提之宗地估價，應考慮分割前與分割後之價格變動情形，而予酌量增減","數筆土地合併為一宗進行土地利用之估價，應以合併後土地估價，並以合併前各筆土地價值比例分算其土地價格","一宗土地內有數種不同法定用途時，應考量其最有效使用及各種用途之相關性及分割之難易度後，決定分別估價或依主要用途估價","土地之上下有其他設施通過，致使用受限制之宗地，應先估算其特定價格，再考量該設施通過造成土地利用之影響，並計算其地價減損額後，從特定價格中扣除之，以其餘額為該宗地之價格"],"answer":"D","explain":"土地上下有設施通過→應先估正常價格，再扣地價減損額（D 寫「特定價格」錯）；A §83、B §84、C §85 都對","laws":[{"ref":"不動產估價技術規則 §83","text":"以合併或分割為前提之宗地估價，應考慮合併或分割前後之價格變動情形，而予酌量增減。"},{"ref":"不動產估價技術規則 §84","text":"數筆土地合併為一宗進行土地利用之估價，應以合併後土地估價，並以合併前各筆土地價值比例分算其土地價格。\n非以合併一宗進行土地利用為目的之數筆相連土地，其屬同一土地所有權人所有者，比照前項規定計算。"},{"ref":"不動產估價技術規則 §85","text":"一宗土地內有數種不同法定用途時，應考量其最有效使用及各種用途之相關性及分割之難易度後，決定分別估價或依主要用途估價。"}]},{"id":"gj-109-04","subject":"估價","year":109,"no":4,"topic":"有效總收入乘數法","stem":"經分析考量市場上類似不動產之正常租金為每年每坪12,000 元，合理空置率為5%，淨收益率為75%，貸款資金占不動產價格比率80%，有效總收入乘數為15，請以有效總收入乘數法計算出收益資本化率為多少？","options":["4.27%","4.67%","5.0%","5.33%"],"answer":"C","explain":"§43 第 5 款：收益資本化率＝淨收益率 ÷ 有效總收入乘數＝75% ÷ 15＝5%（租金、空置率、貸款比率都是干擾數字）","laws":[{"ref":"不動產估價技術規則 §43","text":"（因條文排版無法完整呈現內容，請詳閱完整條文檔案）\n收益資本化率或折現率應於下列各款方法中，綜合評估最適宜之方法決定：\n一、風險溢酬法：收益資本化率或折現率應考慮銀行定期存款利率、政府公債利率、不動產投資之風險性、貨幣變動狀況及不動產價格之變動趨勢等因素，選擇最具一般性財貨之投資報酬率為基準，比較觀察該投資財貨與勘估標的個別特性之差異，並就流通性、風險性、增值性及管理上之難易程度等因素加以比較決定之。\n二、市場萃取法：選擇數個與勘估標的相同或相似之比較標的，以其淨收益除以價格後，以所得之商數加以比較決定之。\n三、加權平均資金成本法：依加權平均資金成本方式決定，其計算式如下：                          n\n    收益資本化率或折現率＝Σ WiKi\n                          i=1\n    其中：                                n\n    Wi：第 i  個資金來源占總資金成本比例，Σ Wi＝1。\n                                         i=1\n    Ki：為第 i  個資金來源之利率或要求報酬率。\n四、債務保障比率法：依債務保障比率方式決定，其計算式如下：\n收益資本化率或折現率＝債務保障比率× 貸款常數× 貸款資金占不動產價格比率\n五、有效總收入乘數法：考量市場上類似不動產每年淨收益占每年有效總收入之合理淨收益率，及類似不動產合理價格除以每年有效總收入之有效總收入乘數，以下列公式計算之：\n收益資本化率或折現率＝淨收益率／有效總收入乘數\n收益資本化率或折現率之決定有採取其他方法計算之必要時，應於估價報告書中敘明。"}]},{"id":"gj-109-05","subject":"估價","year":109,"no":5,"topic":"樓層別效用比","stem":"對於區分所有建物估價運用樓層別效用比時，下列敘述何者正確？","options":["樓層別效用比是各層樓區分所有建物之立體地價差異所形成的樓層別效用比率","樓層別效用比可從各層樓出售價格案例，扣除開發利潤與土地成本費用後，推算區分所有建物各樓層效用比","樓層別效用比包含區分所有建物的土地效用與建築物效用","樓層別效用比通常地面層是最高，4 樓為最低；當樓層數越高，樓層別效用比就越高"],"answer":"C","explain":"樓層別效用比反映整個房地（土地＋建物效用），不只是立體地價（A 錯）；不用扣開發利潤土地成本（B 錯）；不是越高樓層越高、4 樓最低也不一定（D 錯）","laws":[]},{"id":"gj-109-07","subject":"估價","year":109,"no":7,"topic":"原核定用途與現行管制不符","stem":"某大樓座落於原為住宅區變更為商業區之土地，依據目前土地使用管制相關法令規定，該大樓應以商業與一般事務所為其法定用途，今勘估標的某層建物未變更為商業區前之原核定用途為住宅使用，請問勘估標的之估價處理方式，下列何者較為適當？","options":["以現行商業區允許之商業與一般事務所估價，並於估價報告書中敘明","以現行商業區允許之商業與一般事務所估價，並就住宅用途與建物法定用途估價之差額於估價報告書中敘明","以原核定住宅用途估價，並於估價報告書中敘明","以現行商業區允許之商業與一般事務所估價，同時以原核定住宅用途估價，再以兩者平均數為估價結論，並於估價報告書中敘明"],"answer":"B","explain":"§105：以現行土地使用管制允許的用途估價，並就與建物法定用途估價的差額在報告書敘明","laws":[{"ref":"不動產估價技術規則 §105","text":"建物原核定用途與現行土地使用管制不符之合法建物，應以現行土地使用分區管制允許之建物用途估價，並就其與建物法定用途估價之差額於估價報告書中敘明。"}]},{"id":"gj-109-08","subject":"估價","year":109,"no":8,"topic":"都更：區分所有建物（選錯誤）","stem":"有關都市更新權利變換估價，下列敘述何者錯誤？","options":["權利變換前為區分所有建物者，應以全棟建物價值比率，分算各區分所有建物房地總價之基地權利價值","權利變換前區分所有建物之基地總價值低於區分所有建物坐落基地之素地總價值者，應以各區分所有建物房地總價乘上基地價值比率，計算出各區分所有建物之基地權利價值","權利變換前之基地未建築使用者，以素地價值推估其土地權利價值","權利變換前為非屬區分所有之建物者，應以該建物之房地總價乘以基地價值比率計算基地權利價值"],"answer":"A","explain":"§125：應以全棟建物之基地價值比率分算（A 寫「全棟建物價值比率」錯）；B §126、C §127、D §126-1 都對","laws":[{"ref":"不動產估價技術規則 §125","text":"權利變換前為區分所有建物者，應以全棟建物之基地價值比率，分算各區分所有建物房地總價之基地權利價值，公式如下：\n各區分所有建物之基地權利價值＝各區分所有建物房地總價× 基地價值比率\n前項基地價值比率之計算公式如下：基地                    素地單價× 基地總面積\n價值＝─────────────────────────────\n比率  素地單價× 基地總面積＋〔營造或施工費單價× （1－累積折舊率）×全棟建物面積〕\n區分所有建物情況特殊致依第一項計算之基地權利價值顯失公平者，得依第一百二十六條之二計算之基地權利價值予以調整。"},{"ref":"不動產估價技術規則 §126","text":"權利變換前區分所有建物之基地總價值低於區分所有建物坐落基地之素地總價值者，各區分所有建物之基地權利價值，計算方式如下：\n一、依前條規定計算基地價值比率。\n二、各區分所有建物基地權利價值＝各區分所有建物房地總價× 基地價值比率。\n三、各區分所有建物基地權利價值比率＝各區分所有建物基地權利價值／Σ（各區分所有建物基地權利價值）。\n四、各區分所有建物調整後基地權利價值＝區分所有建物坐落基地之素地總價值×各區分所有建物基地權利價值比率。"},{"ref":"不動產估價技術規則 §127","text":"權利變換前之基地未建築使用者，以素地價值推估其土地權利價值。"},{"ref":"不動產估價技術規則 §126-1","text":"權利變換前為非屬區分所有之建物者，應以該建物之房地總價乘以基地價值比率計算基地權利價值。但基地權利價值低於素地價值者，以素地價值為準。"}]},{"id":"gj-109-09","subject":"估價","year":109,"no":9,"topic":"有效總收入","stem":"勘估標的為辦公大樓之第10 層，建物登記面積50 坪，每月每坪正常租金收入為2,000 元，該建物大樓經合理市場分析推算空置率為5%，勘估標的每年地價稅、房屋稅及保險費等相關總費用推算為200,000 元。請問該建物以直接資本化法估價時，推算其有效總收入為多少？","options":["940,000 元","1,000,000 元","1,140,000 元","1,200,000 元"],"answer":"C","explain":"50 坪 × 2,000 × 12 × (1－5%)＝114 萬；地價稅等 20 萬是總費用，算淨收益才扣","laws":[]},{"id":"gj-109-10","subject":"估價","year":109,"no":10,"topic":"資本利息綜合利率反推","stem":"某一筆建築用地將以土地開發分析法推估價格，其資本利息綜合利率為4.8%，該土地開發之土地價值比率占60%，建物價值比率占40%，預計開發年數為2 年，請問資本利息年利率應為多少？","options":["2.4%","3.0%","7.68%","9.6%"],"answer":"B","explain":"綜合利率＝年利率 ×（土地 60%＋建物 40% × 1/2）× 2 年＝年利率 × 1.6→4.8% ÷ 1.6＝3%","laws":[]},{"id":"gj-109-12","subject":"估價","year":109,"no":12,"topic":"正常價格要件","stem":"正常價格的定義中，不包含下列那一要件？","options":["形成正常價格的不動產具備市場性","係為有意願的買賣雙方，依專業知識分析與謹慎行動的交易","有意願之買賣雙方不受債權債務關係或親友關係人等等壓力或脅迫","經適當市場行銷及交易雙方條件形成之價值"],"answer":"D","explain":"§2：經適當市場行銷及「正常交易條件」形成（D 寫「交易雙方條件」錯）；市場性、有意願、專業謹慎、不受脅迫都是要件","laws":[{"ref":"不動產估價技術規則 §2","text":"本規則用詞定義如下：\n一、正常價格：指具有市場性之不動產，於有意願之買賣雙方，依專業知識、謹慎行動，不受任何脅迫，經適當市場行銷及正常交易條件形成之合理價值，並以貨幣金額表示者。\n二、限定價格：指具有市場性之不動產，在下列限定條件之一所形成之價值，並以貨幣金額表示者：\n（一）以不動產所有權以外其他權利與所有權合併為目的。\n（二）以不動產合併為目的。\n（三）以違反經濟合理性之不動產分割為前提。\n三、特定價格：指具有市場性之不動產，基於特定條件下形成之價值，並以貨幣金額表示者。\n四、特殊價格：指對不具市場性之不動產所估計之價值，並以貨幣金額表示者。\n五、正常租金：指具有市場性之不動產，於有意願之租賃雙方，依專業知識、謹慎行動，不受任何脅迫，經適當市場行銷及正常租賃條件形成之合理租賃價值，並以貨幣金額表示者。\n六、限定租金：指基於續訂租約或不動產合併為目的形成之租賃價值，並以貨幣金額表示者。\n七、價格日期：指表示不動產價格之基準日期。\n八、勘察日期：指赴勘估標的現場從事調查分析之日期。\n九、勘估標的：指不動產估價師接受委託所估價之土地、建築改良物（以下簡稱建物）、農作改良物及其權利。\n十、比較標的：指可供與勘估標的間，按情況、價格日期、區域因素及個別因素之差異進行比較之標的。\n十一、同一供需圈：指比較標的與勘估標的間能成立替代關係，且其價格互為影響之最適範圍。\n十二、近鄰地區：指勘估標的或比較標的周圍，供相同或類似用途之不動產，形成同質性較高之地區。\n十三、類似地區：指同一供需圈內，近鄰地區以外而與勘估標的使用性質相近之其他地區。\n十四、一般因素：指對於不動產市場及其價格水準發生全面影響之自然、政治、社會、經濟等共同因素。\n十五、區域因素：指影響近鄰地區不動產價格水準之因素。\n十六、個別因素：指不動產因受本身條件之影響，而產生價格差異之因素。\n十七、最有效使用：指客觀上具有良好意識及通常之使用能力者，在合法、實質可能、正當合理、財務可行前提下，所作得以獲致最高利益之使用。"}]},{"id":"gj-109-13","subject":"估價","year":109,"no":13,"topic":"變動原則（選錯誤）","stem":"不動產市場是一動態的市場，對於估價的變動原則，下列敘述何者錯誤？","options":["不動產估價應掌握影響價格的一般因素、區域因素與個別因素變動，以切合勘察日期當時之價值","影響不動產價格因素不斷變動，因此估價報告書應載明價格日期與勘察日期","運用成本法估價時，應分析使用建築材料隨時間變動的成本差異對不動產造成的價格影響","分析不動產價格景氣週期性變動，以利不動產價格變動趨勢之掌握"],"answer":"A","explain":"要切合價格日期當時的價值，不是「勘察日期」","laws":[]},{"id":"gj-109-15","subject":"估價","year":109,"no":15,"topic":"折舊提存率（等速）","stem":"估價人員應用收益法估價時，若某建物經濟耐用年數45 年、經歷年數10 年、殘價率10%，當採取等速折舊型時，建物價格日期當時價值未來每年折舊提存率為何？","options":["2%","2.25%","2.5%","3%"],"answer":"C","explain":"§41：d＝折舊率 ÷（1－累積折舊率）＝(0.9 ÷ 45) ÷ (1－0.9 × 10 ÷ 45)＝2% ÷ 0.8＝2.5%","laws":[{"ref":"不動產估價技術規則 §41","text":"（因條文排版無法完整呈現內容，請詳閱完整條文檔案）\n建物價格日期當時價值未來每年折舊提存率，得依下列方式計算：                     （1－s）／N\n一、等速折舊型：d＝————————\n                   1－（1－s）n／N\n                          i\n二、償債基金型：d＝———————\n                          n’\n                   （1＋i）－1\n其中：\nd ：建物價格日期當時價值未來每年折舊提存率。\n        1\n（1－s）—：折舊率。\n        N\nn ：已經歷年數。\nn’ ：剩餘可收益之年數。\ni ：自有資金之計息利率。\n前項折舊率，依成本法相關規定估計之。"}]},{"id":"gj-109-17","subject":"估價","year":109,"no":17,"topic":"資本利息（選錯誤）","stem":"依據不動產估價技術規則，有關成本法資本利息的敘述，下列敘述何者錯誤？","options":["資金中自有資金之計息利率應不高於1 年期定存利率","資金中自有資金之計息利率應不低於活存利率","借款則以銀行短期放款利率計息","預售收入之資金以定存利率計息"],"answer":"D","explain":"自有資金：活存 ≤ 利率 ≤ 一年期定存；借款用短期放款利率；預售收入不計息（D 寫以定存計息錯；跟 112-11 同觀念，第二次錯）","laws":[]},{"id":"gj-109-18","subject":"估價","year":109,"no":18,"topic":"營造施工費四方法","stem":"成本法營造施工費求取方式，有分為直接法及間接法兩大類，其中以建築細部工程之各項目單價乘以該工程施工數量合計之方法係指下列何者？","options":["淨計法","單位工程法","工程造價比較法","單位面積（或體積）比較法"],"answer":"B","explain":"細部工程單價 × 施工數量＝單位工程法（直接法）","laws":[]},{"id":"gj-109-21","subject":"估價","year":109,"no":21,"topic":"重建成本","stem":"估價人員就某建物使用與勘估標的相同之建材標準、設計、配置及施工品質，於價格日期重新複製建築所需之成本，是指下列何者？","options":["重置成本","重製成本","重建成本","複舊成本"],"answer":"C","explain":"相同或極類似建材、設計、配置、施工品質「重新複製」＝重建成本；重置成本是相同效用、現代建材","laws":[]},{"id":"gj-109-22","subject":"估價","year":109,"no":22,"topic":"證券化 DCF 權重","stem":"國內已有不動產證券化的個案，依據不動產估價技術規則規定，以契約約定租金作為不動產證券化受益證券信託利益分配基礎者，何種價格應視不同價格所蒐集資料可信度及估價種類目的條件差異，考量價格形成因素之相近程度情形賦予相對較大之權重？","options":["比較法之實例價格","土地開發分析價格","直接資本化法之收益價格","折現現金流量分析法之收益價格"],"answer":"D","explain":"§15Ⅱ：以契約租金作為信託利益分配基礎→DCF 收益價格賦予較大權重（清算時除外）","laws":[{"ref":"不動產估價技術規則 §15","text":"不動產估價師應就不同估價方法估價所獲得之價格進行綜合比較，就其中金額顯著差異者重新檢討。並視不同價格所蒐集資料可信度及估價種類目的條件差異，考量價格形成因素之相近程度，決定勘估標的價格，並將決定理由詳予敘明。\n以契約約定租金作為不動產證券化受益證券信託利益分配基礎者，折現現金流量分析法之收益價格應視前項情形賦予相對較大之權重。但不動產證券化標的進行清算時，不在此限。"}]},{"id":"gj-110-03","subject":"估價","year":110,"no":3,"topic":"外部性原則","stem":"不動產因鄰近殯儀館，造成價格之減損，此屬於何種原則？","options":["競爭原則","供需原則","替代原則","外部性原則"],"answer":"D","explain":"鄰近殯儀館價格下跌＝外在環境影響→外部性原則","laws":[]},{"id":"gj-110-06","subject":"估價","year":110,"no":6,"topic":"土開法每坪","stem":"有一500 坪建地可興建大樓出售，預期新大樓之總銷售金額為10 億元，若營建施工費為3 億元、管理銷售費用等間接成本為9 千萬元、要求的利潤率為18%、資本綜合利率為5%。請問該建地每坪價格約為多少？","options":["100.5 萬元","83.4 萬元","65.8 萬元","41.7 萬元"],"answer":"B","explain":"10 億 ÷ 1.18 ÷ 1.05－(3 億＋0.9 億)＝4.171 億；÷ 500 坪＝83.4 萬（D 41.7 是忘了除坪數的陷阱）","laws":[]},{"id":"gj-110-08","subject":"估價","year":110,"no":8,"topic":"營造施工費項目","stem":"勘估標的之營造或施工費，依不動產估價技術規則之規定，不包含下列那一項目？","options":["間接材料費","稅捐","資本利息","廣告費"],"answer":"D","explain":"§53 八款：直接材料、直接人工、間接材料、間接人工、管理費、稅捐、資本利息、營造施工利潤；廣告費不在內（廣告費、銷售費是土開法的間接成本 §76）","laws":[{"ref":"不動產估價技術規則 §53","text":"勘估標的之營造或施工費，項目如下：\n一、直接材料費。\n二、直接人工費。\n三、間接材料費。\n四、間接人工費。\n五、管理費。\n六、稅捐。\n七、資本利息。\n八、營造或施工利潤。"},{"ref":"不動產估價技術規則 §76","text":"土地建築開發之直接成本、間接成本項目如下：\n一、直接成本：營造或施工費。\n二、間接成本，其內容如下：\n（一）規劃設計費。\n（二）廣告費、銷售費。\n（三）管理費。\n（四）稅捐及其他負擔。"}]},{"id":"gj-110-10","subject":"估價","year":110,"no":10,"topic":"淨收益","stem":"100 坪之辦公室出租，每月每坪正常租金為1,000 元，推估該辦公室合理空置率為8%，每年之地價稅、房屋稅、保險費、管理費及維修費為120,000 元，貸款支出為200,000 元。該辦公室每年之淨收益為多少？","options":["1,080,000 元","984,000 元","880,000 元","784,000 元"],"answer":"B","explain":"100 × 1,000 × 12 × 0.92－12 萬＝98.4 萬；貸款支出不扣（§42 不屬於不動產本身的收益費用）","laws":[{"ref":"不動產估價技術規則 §42","text":"有效總收入減總費用即為淨收益。\n前項淨收益為營運性不動產之淨收益者，應扣除不屬於不動產所產生之其他淨收益。"}]},{"id":"gj-110-11","subject":"估價","year":110,"no":11,"topic":"證券化總費用","stem":"依不動產估價技術規則規定，以不動產證券化為估價目的者，其折現現金流量分析法之總費用應依何種資料加以推算？","options":["市場相關資料","信託計畫資料","類似產品資料","歷史費用資料"],"answer":"B","explain":"§38Ⅱ：證券化 DCF 的總費用依信託計畫資料推算","laws":[{"ref":"不動產估價技術規則 §38","text":"勘估標的總費用之推算，應根據相同或相似不動產所支出之費用資料或會計報表所載資料加以推算，其項目包括地價稅或地租、房屋稅、保險費、管理費及維修費等。其為營運性不動產者，並應加計營運費用。\n以不動產證券化為估價目的者，其折現現金流量分析法之總費用應依信託計畫資料加以推算。"}]},{"id":"gj-110-13","subject":"估價","year":110,"no":13,"topic":"實質租金／契約租金","stem":"依不動產估價技術規則規定，下列有關租金之兩種敘述，何者正確？","options":["不動產租金估計，以估計勘估標的之實質租金為原則；以不動產證券化為估價目的，採折現現金流量分析法估價時，各期淨收益應以勘估標的之經濟租金計算為原則","不動產租金估計，以估計勘估標的之契約租金為原則；以不動產證券化為估價目的，採折現現金流量分析法估價時，各期淨收益應以勘估標的之經濟租金計算為原則","不動產租金估計，以估計勘估標的之實質租金為原則；以不動產證券化為估價目的，採折現現金流量分析法估價時，各期淨收益應以勘估標的之契約租金計算為原則","不動產租金估計，以估計勘估標的之契約租金為原則；以不動產證券化為估價目的，採折現現金流量分析法估價時，各期淨收益亦以勘估標的之契約租金計算為原則"],"answer":"C","explain":"§130 租金估計以實質租金為原則；證券化 DCF 各期淨收益以契約租金為原則","laws":[{"ref":"不動產估價技術規則 §130","text":"不動產租金估計，以估計勘估標的之實質租金為原則。\n前項所稱實質租金，指承租人每期支付予出租人之租金，加計押金或保證金、權利金及其他相關運用收益之總數。"}]},{"id":"gj-110-14","subject":"估價","year":110,"no":14,"topic":"都更：非區分所有建物","stem":"都市更新權利變換前之透天厝（僅有一所有權人）房地總價為1,500 萬元，房地價值比為1:9。若該基地素地價格經評估為1,300 萬元整，請問該基地之權利價值依不動產估價技術規則規定應為多少？","options":["1,500 萬元","1,400 萬元","1,350 萬元","1,300 萬元"],"answer":"C","explain":"§126-1：房地總價 × 基地價值比率＝1,500 × 9/10＝1,350 萬；只有低於素地價值時才以素地為準（1,350 > 1,300，用 1,350）","laws":[{"ref":"不動產估價技術規則 §126-1","text":"權利變換前為非屬區分所有之建物者，應以該建物之房地總價乘以基地價值比率計算基地權利價值。但基地權利價值低於素地價值者，以素地價值為準。"}]},{"id":"gj-110-15","subject":"估價","year":110,"no":15,"topic":"特殊宗地（選錯誤）","stem":"依不動產估價技術規則規定，下列有關特殊宗地之估價，何者敘述錯誤？","options":["公共設施保留地之估價，以比較法估價為原則","林地之估價，以比較法估價為原則","農場之估價，以比較法估價為原則","墓地之估價，以比較法估價為原則"],"answer":"B","explain":"§92 林地比較法、收益法、成本法都可（不是「以比較法為原則」）；公設保留地、農場、墓地都是比較法為原則","laws":[{"ref":"不動產估價技術規則 §92","text":"林地之估價，得視林木之成長情形而分別採取比較法、收益法及成本法估計之。於採成本法估價時，其總費用之計算，應考量造林費、林地改良費及道路開挖費用。"}]},{"id":"gj-110-16","subject":"估價","year":110,"no":16,"topic":"限定價格","stem":"土地承租人欲購買所承租土地供未來繼續使用，委託不動產估價師進行估價，其價格種類為何？","options":["正常價格","限定價格","特定價格","特殊價格"],"answer":"B","explain":"承租人買下承租的土地＝租賃權與所有權合併→限定價格（§2 第 2 款第 1 目）","laws":[{"ref":"不動產估價技術規則 §2","text":"本規則用詞定義如下：\n一、正常價格：指具有市場性之不動產，於有意願之買賣雙方，依專業知識、謹慎行動，不受任何脅迫，經適當市場行銷及正常交易條件形成之合理價值，並以貨幣金額表示者。\n二、限定價格：指具有市場性之不動產，在下列限定條件之一所形成之價值，並以貨幣金額表示者：\n（一）以不動產所有權以外其他權利與所有權合併為目的。\n（二）以不動產合併為目的。\n（三）以違反經濟合理性之不動產分割為前提。\n三、特定價格：指具有市場性之不動產，基於特定條件下形成之價值，並以貨幣金額表示者。\n四、特殊價格：指對不具市場性之不動產所估計之價值，並以貨幣金額表示者。\n五、正常租金：指具有市場性之不動產，於有意願之租賃雙方，依專業知識、謹慎行動，不受任何脅迫，經適當市場行銷及正常租賃條件形成之合理租賃價值，並以貨幣金額表示者。\n六、限定租金：指基於續訂租約或不動產合併為目的形成之租賃價值，並以貨幣金額表示者。\n七、價格日期：指表示不動產價格之基準日期。\n八、勘察日期：指赴勘估標的現場從事調查分析之日期。\n九、勘估標的：指不動產估價師接受委託所估價之土地、建築改良物（以下簡稱建物）、農作改良物及其權利。\n十、比較標的：指可供與勘估標的間，按情況、價格日期、區域因素及個別因素之差異進行比較之標的。\n十一、同一供需圈：指比較標的與勘估標的間能成立替代關係，且其價格互為影響之最適範圍。\n十二、近鄰地區：指勘估標的或比較標的周圍，供相同或類似用途之不動產，形成同質性較高之地區。\n十三、類似地區：指同一供需圈內，近鄰地區以外而與勘估標的使用性質相近之其他地區。\n十四、一般因素：指對於不動產市場及其價格水準發生全面影響之自然、政治、社會、經濟等共同因素。\n十五、區域因素：指影響近鄰地區不動產價格水準之因素。\n十六、個別因素：指不動產因受本身條件之影響，而產生價格差異之因素。\n十七、最有效使用：指客觀上具有良好意識及通常之使用能力者，在合法、實質可能、正當合理、財務可行前提下，所作得以獲致最高利益之使用。"}]},{"id":"gj-110-18","subject":"估價","year":110,"no":18,"topic":"價格日期調整","stem":"勘估標的乙之價格日期、勘察日期分別為110 年8 月15 日、110 年9 月15 日，若比較標的交易日期為110 年7 月10 日（經查110 年7 至9 月不動產指數分別為：106%、108%、107%），其價格日期調整百分率為何？","options":["98%","99%","101%","102%"],"answer":"D","explain":"比較標的交易日 7 月（106%）→勘估標的價格日期 8 月（108%）：108 ÷ 106≈102%；勘察日期 9 月是陷阱","laws":[]},{"id":"gj-110-22","subject":"估價","year":110,"no":22,"topic":"新訂租約租金","stem":"勘估標的丙之市場價格1,000 萬元，經分析當地同類型不動產之租金收益率5%，必要費用20 萬元/年，租賃所得稅約2 萬元。若丙為新訂租約，根據上開資料估計之年租金為？","options":["50 萬元","52 萬元","70 萬元","72 萬元"],"answer":"C","explain":"§132：價格 × 租金收益率＋必要費用＝1,000 × 5%＋20＝70 萬；租賃所得稅不加","laws":[{"ref":"不動產估價技術規則 §132","text":"新訂租約之租金估計，得採下列方式為之：\n一、以新訂租約之租賃實例為比較標的，運用比較法估計之。\n二、以勘估標的價格乘以租金收益率，以估計淨收益，再加計必要費用。\n三、分析企業經營之總收入，據以估計勘估標的在一定期間內之淨收益，再加計必要費用。"}]},{"id":"gj-110-23","subject":"估價","year":110,"no":23,"topic":"差額分配法","stem":"續訂租約之租金估計方法中，差額分配法係指下列何種差額？","options":["市場經濟租金與原契約租金之差額","原實質租金與市場經濟租金之差額","市場正常租金與原實質租金之差額","原契約租金與市場正常租金之差額"],"answer":"A","explain":"§133 第 4 款：原契約租金與市場經濟租金之差額中歸屬出租人的部分，加計契約租金","laws":[{"ref":"不動產估價技術規則 §133","text":"續訂租約之租金估計，得採下列方式為之：\n一、以續訂租約之租賃實例為比較標的，運用比較法估計之。\n二、以勘估標的於價格日期當時之正常價格為基礎，乘以續租之租金收益率，以估計淨收益，再加計必要費用。\n三、以勘估標的原契約租金之淨收益，就其租金變動趨勢調整後，再加計必要費用。\n四、分析勘估標的原契約租金與市場經濟租金之差額中，應歸屬於出租人之適當部分，加計契約租金。"}]},{"id":"gj-110-24","subject":"估價","year":110,"no":24,"topic":"容積超過法定","stem":"實際建築使用之容積率超過法定容積率之房地，應以何種方式估價？","options":["以原規定之法定容積進行估價","以原規定法定容積的上限進行估價","以實際建築使用部分之現況進行估價","以實際建築使用合法部分之現況估價"],"answer":"D","explain":"§102：以實際建築使用合法部分之現況估價，並敘明法定容積對估值的影響","laws":[{"ref":"不動產估價技術規則 §102","text":"實際建築使用之容積率超過法定容積率之房地估價，應以實際建築使用合法部分之現況估價，並敘明法定容積對估值之影響。"}]},{"id":"gj-110-25","subject":"估價","year":110,"no":25,"topic":"地價分配率","stem":"某區分所有建物位於住宅大樓十樓，其樓層別效用比為110%，平均樓層別效用比為105%。假設全棟建物成本價格占全棟房地總價格比率為40%，該區分所有建物之地價分配率為何？","options":["65%","66%","68%","70%"],"answer":"C","explain":"§100：樓層別效用比－平均樓層別效用比 × 全棟建物成本比率＝110%－105% × 40%＝68%","laws":[{"ref":"不動產估價技術規則 §100","text":"前條勘估標的屬區分所有建物時，以其房地價格推估該區分所有建物基地單價時，得以下列方式估計之：\n一、該區分所有建物基地權利價格＝該區分所有建物房地價格－該區分所有建物之建物成本價格。\n二、該區分所有建物之基地權利單價＝該區分所有建物基地權利價格／該區分所有建物之基地持分面積。\n三、基地單價＝該區分所有建物之基地權利單價× 平均地價分配率／該區分所有建物之地價分配率。\n前項第三款該區分所有建物之地價分配率公式如下：\n該區分所有建物之地價分配率＝該區分所有建物之樓層別效用比－平均樓層別效用比× 全棟建物成本價格占全棟房地總價格比率。"}]},{"id":"gj-111-04","subject":"估價","year":111,"no":4,"topic":"一宗土地數種法定用途","stem":"依據不動產估價技術規則之規定，在一宗土地內有不同法定用途時，應如何估價？","options":["應考量不同用途之合併或分割前後之價格變動情形，予酌量增減","應以合併用途後估價，並以合併用途前各筆土地價值比例分算其土地價格","應考慮不同用途之建築物對宗地價格造成之影響，予以酌量增減","應考量其最有效使用及各種用途之相關性及分割之難易度後，決定分別估價或依主要用途估價"],"answer":"D","explain":"§85：考量最有效使用及各用途相關性、分割難易度後，決定分別估價或依主要用途估價；A 是合併分割（§83）、B 是數筆合併（§84）、C 是附有建物的宗地（§86）","laws":[{"ref":"不動產估價技術規則 §85","text":"一宗土地內有數種不同法定用途時，應考量其最有效使用及各種用途之相關性及分割之難易度後，決定分別估價或依主要用途估價。"},{"ref":"不動產估價技術規則 §83","text":"以合併或分割為前提之宗地估價，應考慮合併或分割前後之價格變動情形，而予酌量增減。"},{"ref":"不動產估價技術規則 §84","text":"數筆土地合併為一宗進行土地利用之估價，應以合併後土地估價，並以合併前各筆土地價值比例分算其土地價格。\n非以合併一宗進行土地利用為目的之數筆相連土地，其屬同一土地所有權人所有者，比照前項規定計算。"},{"ref":"不動產估價技術規則 §86","text":"附有建物之宗地估價，應考慮該建物對該宗地價格造成之影響。但以素地估價為前提並於估價報告書敘明者，不在此限。"}]},{"id":"gj-111-05","subject":"估價","year":111,"no":5,"topic":"最有效使用定義（選錯誤）","stem":"不動產估價原則是估價之根基，不動產估價技術規則對「最有效使用」原則有所定義，請問下列敘述何者錯誤？","options":["得以獲致最高利益之使用","基於合法、實質可能前提","正當合理、財務可行前提下者","具有超凡意識及使用能力者"],"answer":"D","explain":"§2：客觀上具有良好意識及通常之使用能力者（不是「超凡意識」），在合法、實質可能、正當合理、財務可行前提下，獲致最高利益之使用","laws":[{"ref":"不動產估價技術規則 §2","text":"本規則用詞定義如下：\n一、正常價格：指具有市場性之不動產，於有意願之買賣雙方，依專業知識、謹慎行動，不受任何脅迫，經適當市場行銷及正常交易條件形成之合理價值，並以貨幣金額表示者。\n二、限定價格：指具有市場性之不動產，在下列限定條件之一所形成之價值，並以貨幣金額表示者：\n（一）以不動產所有權以外其他權利與所有權合併為目的。\n（二）以不動產合併為目的。\n（三）以違反經濟合理性之不動產分割為前提。\n三、特定價格：指具有市場性之不動產，基於特定條件下形成之價值，並以貨幣金額表示者。\n四、特殊價格：指對不具市場性之不動產所估計之價值，並以貨幣金額表示者。\n五、正常租金：指具有市場性之不動產，於有意願之租賃雙方，依專業知識、謹慎行動，不受任何脅迫，經適當市場行銷及正常租賃條件形成之合理租賃價值，並以貨幣金額表示者。\n六、限定租金：指基於續訂租約或不動產合併為目的形成之租賃價值，並以貨幣金額表示者。\n七、價格日期：指表示不動產價格之基準日期。\n八、勘察日期：指赴勘估標的現場從事調查分析之日期。\n九、勘估標的：指不動產估價師接受委託所估價之土地、建築改良物（以下簡稱建物）、農作改良物及其權利。\n十、比較標的：指可供與勘估標的間，按情況、價格日期、區域因素及個別因素之差異進行比較之標的。\n十一、同一供需圈：指比較標的與勘估標的間能成立替代關係，且其價格互為影響之最適範圍。\n十二、近鄰地區：指勘估標的或比較標的周圍，供相同或類似用途之不動產，形成同質性較高之地區。\n十三、類似地區：指同一供需圈內，近鄰地區以外而與勘估標的使用性質相近之其他地區。\n十四、一般因素：指對於不動產市場及其價格水準發生全面影響之自然、政治、社會、經濟等共同因素。\n十五、區域因素：指影響近鄰地區不動產價格水準之因素。\n十六、個別因素：指不動產因受本身條件之影響，而產生價格差異之因素。\n十七、最有效使用：指客觀上具有良好意識及通常之使用能力者，在合法、實質可能、正當合理、財務可行前提下，所作得以獲致最高利益之使用。"}]},{"id":"gj-111-06","subject":"估價","year":111,"no":6,"topic":"計量模型筆數","stem":"利用計量模型分析法進行估價，應蒐集相當數量具代表性之比較標的，在計量模型的影響不動產價格之因素中，現有6 項區域因素，5 項個別因素，因此至少要蒐集多少數量以上之比較標的才符合不動產估價技術規則之規定？","options":["55 筆以上","40 筆以上","30 筆以上","25 筆以上"],"answer":"A","explain":"自變數 6＋5＝11 個 × 5 倍＝55 筆以上","laws":[]},{"id":"gj-111-13","subject":"估價","year":111,"no":13,"topic":"特定價格","stem":"不動產估價，應註明其價格種類；以何種價格估價時應敘明其估價條件，並同時估計其正常價格？","options":["限定價格","特殊價格","特定價格","特別價格"],"answer":"C","explain":"§6：以特定價格估價者，應敘明估價條件，並同時估計正常價格","laws":[{"ref":"不動產估價技術規則 §6","text":"不動產估價，應切合價格日期當時之價值。其估計價格種類包括正常價格、限定價格、特定價格及特殊價格；估計租金種類包括正常租金及限定租金。\n不動產估價，應註明其價格種類；其以特定價格估價者，應敘明其估價條件，並同時估計其正常價格。"}]},{"id":"gj-111-21","subject":"估價","year":111,"no":21,"topic":"估價基本事項","stem":"依據不動產估價技術規則，在進行不動產估價作業程序時，下列何者屬於估價要確定的基本事項？","options":["作業所需時間","估價目的","勘估標的之狀態","勘估標的相關交易、收益及成本資料"],"answer":"B","explain":"基本事項＝勘估標的內容、價格日期、價格種類及條件、估價目的；A 作業所需時間是「擬定估價計畫」，C 標的狀態是「確認勘估標的狀態」，D 交易收益成本資料是「蒐集資料」","laws":[]},{"id":"gj-111-23","subject":"估價","year":111,"no":23,"topic":"違章建築","stem":"某甲有一棟5 層透天住宅，其中第一層到第四層為合法建築物，頂樓層為違章建築物，某甲委託估價人員進行房地估價，並要求估價人員對所有樓層進行估價，估價人員應如何估價較為恰當？","options":["僅針對合法建築物進行估價","拒絕對建築物估價","就合法建築物與違章建築物分別標示各該部分之價格","合法建築物以成本法估價，違章建築物則以加速折舊方式估價"],"answer":"C","explain":"§103：違建不予評估；委託人要求時，合法建物與違建分別標示價格（跟 107-13 同題型，第二次錯）","laws":[{"ref":"不動產估價技術規則 §103","text":"附有違章建築之房地估價，其違建部分不予以評估。但委託人要求評估其價值，並就合法建物及違建部分於估價報告書中分別標示各該部分之價格者，不在此限。"}]},{"id":"gj-111-25","subject":"估價","year":111,"no":25,"topic":"土開法現況勘察（選不屬於）","stem":"在土地開發分析法之估價程序中，應進行現況勘查與環境發展程度調查與分析，下列何者不屬於要勘查與調查分析的事項：","options":["影響總銷售金額、成本及費用等因素","勘估標的之工程進度、施工及環境狀況","比較標的之工程進度、施工及環境狀況","週遭環境土地建物及公共設施開發程度"],"answer":"C","explain":"§73：勘察的是勘估標的的工程進度、施工及環境狀況，不是「比較標的」","laws":[{"ref":"不動產估價技術規則 §73","text":"現況勘察與環境發展程度之調查及分析包括下列事項：\n一、調查影響總銷售金額、成本及費用等因素。\n二、確認勘估標的之工程進度、施工及環境狀況並攝製必要照片或影像檔。\n三、市場交易資料之蒐集、調查。\n四、週遭環境土地建物及公共設施開發程度。"}]},{"id":"gj-112-09","subject":"估價","year":112,"no":9,"topic":"總費用項目","stem":"下列何者不是收益法推算勘估標的總費用之項目？","options":["地價稅","房屋稅","土地增值稅","維修費"],"answer":"C","explain":"土地增值稅是賣的時候才課，不是每年持有費用；地價稅、房屋稅、維修費都是","laws":[]},{"id":"gj-112-11","subject":"估價","year":112,"no":11,"topic":"資本利息利率","stem":"目前銀行之一年期定存利率為1.57%，活存利率為0.58%，短期放款利率為7.11%，下列之敘述何者正確？","options":["資金中自有資金之計息利率為7.11%","資金中預售收入之計息利率為0.58%","資金中自有資金之計息利率為1.52%","資金中借款之計息利率為1.57%"],"answer":"C","explain":"自有資金：活存 0.58% ≤ 利率 ≤ 定存 1.57%→1.52% 可以；借款用短期放款 7.11%；預售收入不計息","laws":[]},{"id":"gj-112-15","subject":"估價","year":112,"no":15,"topic":"特殊宗地","stem":"依不動產估價技術規則之規定，有關特殊宗地估價之敘述，下列何者正確？","options":["高爾夫球場之估價，以比較法估價為原則","溫泉地之估價，以比較法估價為原則","鹽田之估價，以比較法估價為原則","林地之估價，以比較法估價為原則"],"answer":"C","explain":"鹽田以比較法為原則；高球場、溫泉地沒指定方法；林地三法都可","laws":[]},{"id":"gj-112-16","subject":"估價","year":112,"no":16,"topic":"計量模型","stem":"有關計量模型分析法之敘述，下列何者錯誤？","options":["計量模型分析法截距項以外其他各主要影響價格因素之係數估計值同時為零之顯著機率不得大於百分之五","計量模型分析法只能用以推算各主要影響價格因素之調整率","計量模型分析法可求出各主要影響價格因素與比較標的價格二者之關係式","計量模型分析採迴歸分析者，其調整後判定係數不得低於零點七"],"answer":"B","explain":"可以推算調整率及調整額，「只能」推算調整率錯；係數同時為零顯著機率 ≤ 5%、調整後判定係數 ≥ 0.7","laws":[]},{"id":"gj-112-17","subject":"估價","year":112,"no":17,"topic":"租金估計","stem":"有關不動產租金估計之敘述，下列何者正確？","options":["不動產租金估計，以估計勘估標的之承租人每期支付予出租人之租金，加計押金或保證金、權利金及其他相關運用收益之總數為原則","新訂租約之租金估計得以勘估標的預估契約租金之淨收益，估計租金未來變動趨勢調整後，再加計必要費用","續訂租約之租金估計得以勘估標的價格乘以租金收益率，以估計淨收益，再加計必要費用","不動產之租金估計不應考慮使用目的"],"answer":"A","explain":"實質租金定義正確；B 用「原契約租金」調整是續訂的方法，題目寫新訂；C（價格 × 租金收益率）是新訂方法；要考慮使用目的","laws":[]},{"id":"gj-112-18","subject":"估價","year":112,"no":18,"topic":"DCR 法","stem":"當債務保障比率要求為1.5 倍，貸款常數為0.1，不動產價格為新臺幣60 億元，自有資金為新臺幣15 億元，不足資金則跟銀行貸款。請問在前述情況下收益資本化率（折現率）為何？","options":["15%","11.25%","5%","3.75%"],"answer":"B","explain":"貸款比率＝45 ÷ 60＝75%；1.5 × 0.1 × 0.75＝11.25%","laws":[]},{"id":"gj-112-24","subject":"估價","year":112,"no":24,"topic":"土開法","stem":"如果一開發案開發後預期總銷售金額為新臺幣10 億元，適當之利潤率為10%，開發所需之直接成本為新臺幣6 億元，開發所需之間接成本為新臺幣2 億元，開發所需總成本之資本利息綜合利率為5%。請問下列何者最接近此一開發案之土地開發分析價格？","options":["新臺幣2 億元","新臺幣1.5 億元","新臺幣1.091 億元","新臺幣0.658 億元"],"answer":"D","explain":"10 ÷ 1.1 ÷ 1.05－(6＋2)＝8.658－8＝0.658 億","laws":[]},{"id":"gj-113-06","subject":"估價","year":113,"no":6,"topic":"證券化 DCF 權重","stem":"不動產估價技術規則對不動產估價方法運用的規定，下列何者錯誤？","options":["不動產估價師應兼採二種以上估價方法推算勘估標的價格","不動產估價師應就不同估價方法估價所獲得之價格進行綜合比較，就其中金額顯著差異者重新檢討","評估證券化不動產清算價格時，對於折現現金流量分析法之收益價格應賦予相對較大之權重","對於各方法試算價格應視不同價格所蒐集資料可信度及估價種類目的條件差異，考量價格形成因素之相近程度，決定勘估標的價格，並將決定理由詳予敘明"],"answer":"C","explain":"技術規則 §15Ⅱ：以契約租金作為證券化信託利益分配基礎者，DCF 收益價格賦予較大權重，但證券化標的進行清算時不在此限→題目說清算時要給較大權重，錯","laws":[{"ref":"不動產估價技術規則 §15","text":"不動產估價師應就不同估價方法估價所獲得之價格進行綜合比較，就其中金額顯著差異者重新檢討。並視不同價格所蒐集資料可信度及估價種類目的條件差異，考量價格形成因素之相近程度，決定勘估標的價格，並將決定理由詳予敘明。\n以契約約定租金作為不動產證券化受益證券信託利益分配基礎者，折現現金流量分析法之收益價格應視前項情形賦予相對較大之權重。但不動產證券化標的進行清算時，不在此限。"}]},{"id":"gj-113-08","subject":"估價","year":113,"no":8,"topic":"試算價格差距 20%","stem":"不動產估價技術規則第26 條第1 項：經比較調整後求得之勘估標的試算價格，應就價格偏高或偏低者重新檢討，經檢討確認適當合理者，始得作為決定比較價格之基礎。檢討後試算價格之間差距仍達百分之二十以上者，應排除該試算價格之適用。若比較標的一、二、三之試算價格分別為79 萬元/坪，77 萬元/坪及95 萬元/坪，下列敘述何者正確？","options":["三個試算價格之間皆符合排除條件","三個試算價格之間皆不符合排除條件","比較標的一與三之間符合排除條件","比較標的二與三之間符合排除條件"],"answer":"D","explain":"差距＝(高－低) ÷ 平均：1 vs 3＝16 ÷ 87＝18.4%（不排除）；2 vs 3＝18 ÷ 86＝20.9%（排除）","laws":[]},{"id":"gj-113-10","subject":"估價","year":113,"no":10,"topic":"營造施工費","stem":"有關營造或施工費的敘述何者錯誤？","options":["營造或施工費屬於建物總成本的一部分，房屋愈舊，營造或施工費就愈低","勘估標的之營造或施工費，得按直接法或間接法擇一求取之。功能性退化造成的折舊屬於房屋折舊的一部分","淨計法屬於直接法的一種，是指就勘估標的所需要各種建築材料及人工之數量，逐一乘以價格日期當時該建築材料之單價及人工工資，並加計管理費、稅捐、資本利息及利潤","單位工程法也屬於直接法，係以建築細部工程之各項目單價乘以該工程施工數量，並合計之"],"answer":"A","explain":"是價格日期的重建費用，屋齡舊不會讓營造施工費變低（舊是反映在折舊）","laws":[]},{"id":"gj-113-12","subject":"估價","year":113,"no":12,"topic":"有效總收入","stem":"下列對於有效總收入與總收入之間關係的敘述何者正確？","options":["總收入必定大於或等於有效總收入","有效總收入與總收入只是說法上不同，兩者在實質的意義上一樣","總收入減去總費用等於淨收益","總收入=有效總收入+總費用"],"answer":"A","explain":"有效總收入＝總收入－閒置等損失→總收入 ≥ 有效總收入；淨收益＝有效總收入－總費用","laws":[]},{"id":"gj-113-13","subject":"估價","year":113,"no":13,"topic":"跟貸款成數有關","stem":"收益資本化率決定的方法中與銀行貸款成數相關的是那一個方法？","options":["市場萃取法","有效總收入乘數法","債務保障比率法","風險溢酬法"],"answer":"C","explain":"債務保障比率法","laws":[]},{"id":"gj-113-14","subject":"估價","year":113,"no":14,"topic":"收益法公式","stem":"有關收益法的公式，下列何者錯誤？","options":["淨收益未扣除折舊提存費者，建物收益價格＝建物淨收益／建物收益資本化率","直接資本化法之收益價格＝勘估標的未來平均一年期間之客觀淨收益／收益資本化率","地上有建物者，土地收益價格＝（房地淨收益－建物淨收益）／土地收益資本化率","淨收益已扣除折舊提存費者，房地綜合收益資本化率＝土地收益資本化率×土地價值比率＋建物收益資本化率×建物價值比率"],"answer":"A","explain":"淨收益未扣折舊提存→建物收益價格＝建物淨收益 ÷ (建物收益資本化率＋折舊提存率)，A 少了折舊提存率","laws":[]},{"id":"gj-113-15","subject":"估價","year":113,"no":15,"topic":"公設地估價","stem":"有關特殊宗地估價敘述，下列何者錯誤？","options":["農場或牧場之估價，以比較法估價為原則","公共設施用地及公共設施保留地之估價，應考慮政府徵收土地之可能價格評估之","高爾夫球場之估價，應考慮會員制度、球場設施、開發成本、收益及營運費用等因素","鹽田之估價無買賣實例者，得以附近土地價格為基礎，考慮其日照、通風、位置及形狀等差異，比較推估之"],"answer":"B","explain":"比較法為原則，沒實例時比較毗鄰土地使用分區及強度差異；不是考慮徵收可能價格","laws":[]},{"id":"gj-113-24","subject":"估價","year":113,"no":24,"topic":"加權平均資金成本法","stem":"某一開發案自有資金比例是30%，其餘資金向銀行貸款，貸款利率為3%，自有資金報酬率為2%，其資本化率為何？","options":["2.3%","2.7%","2.5%","2.6%"],"answer":"B","explain":"30% × 2%＋70% × 3%＝0.6%＋2.1%＝2.7%","laws":[]},{"id":"gj-113-25","subject":"估價","year":113,"no":25,"topic":"樓層別效用比","stem":"某一棟四層樓公寓，各樓層面積皆相同，一樓單價每坪50 萬元，4 樓單價每坪40 萬元，假設4樓之樓層別效用比為100%，請問一樓的樓層別效用比是多少？","options":["150%","130%","115%","125%"],"answer":"D","explain":"各層面積相同→50 ÷ 40＝125%","laws":[]},{"id":"gj-114-01","subject":"估價","year":114,"no":1,"topic":"適合原則","stem":"鄰近國小的店舖，做販賣文具及圖書生意使用，此為何種不動產估價原則之掌握？","options":["外部性原則","貢獻原則","適合原則","內部性原則"],"answer":"C","explain":"不動產用途跟周遭環境配合（學校旁賣文具）＝適合原則","laws":[]},{"id":"gj-114-02","subject":"估價","year":114,"no":2,"topic":"總成本項目","stem":"以成本法進行不動產估價，下列何者非為總成本應包括之項目？","options":["營造或施工費","出售不動產之所得稅","資本利息","建築利潤"],"answer":"B","explain":"出售不動產的所得稅不算；營造施工費、資本利息、建築利潤都算","laws":[]},{"id":"gj-114-05","subject":"估價","year":114,"no":5,"topic":"調整率","stem":"下列價格調整率何者符合不動產估價技術規則之規定？","options":["區域因素總價格調整率為18%","個別因素總價格調整率為18%","個別因素內之任一單獨項目之價格調整率為18%","情況、價格日期、區域因素及個別因素調整總調整率為18%"],"answer":"D","explain":"四項總調整率 18% ≤ 30% 可用；區域、個別因素總調整率或單項 18% > 15% 要排除","laws":[]},{"id":"gj-114-09","subject":"估價","year":114,"no":9,"topic":"工事、水利土壤改良","stem":"附著於土地之工事及水利土壤之改良，以何種方法估價為原則？","options":["比較法","收益法","成本法","土地殘餘法"],"answer":"C","explain":"成本法為原則（§112）","laws":[{"ref":"不動產估價技術規則 §112","text":"附著於土地之工事及水利土壤之改良，以成本法估價為原則。但得斟酌比較法及收益法估價之結果，決定其估價額。"}]},{"id":"gj-114-10","subject":"估價","year":114,"no":10,"topic":"直接資本化法","stem":"下列有關直接資本化法之敘述何者正確？","options":["屬於比較法之一種","應以勘估標的作最合理使用之客觀淨收益為基準","應用價格日期當時適當之收益資本化率推算","計算過程應另加計期末價值"],"answer":"C","explain":"用價格日期當時的收益資本化率；屬收益法；用「未來平均一年」客觀淨收益；期末價值是 DCF 才有","laws":[]},{"id":"gj-114-12","subject":"估價","year":114,"no":12,"topic":"資本利息綜合利率","stem":"有關土地開發分析法之資本利息綜合利率之敘述何者正確？","options":["資本利息綜合利率＝貸款利息年利率×（建物價值比率＋土地價值比率×1/2）× 開發年數","資本利息綜合利率＝資本利息年利率×（建物價值比率＋土地價值比率×1/2）× 開發年數","資本利息綜合利率＝資本利息年利率×（土地價值比率＋建物價值比率×1/2）× 開發年數","資本利息綜合利率＝貸款利息年利率×（土地價值比率＋建物價值比率×1/2）× 開發年數"],"answer":"C","explain":"資本利息年利率 ×（土地價值比率＋建物價值比率 × 1/2）× 開發年數；土地一開始就投入，建物邊蓋邊投入所以算一半","laws":[]},{"id":"gj-114-25","subject":"估價","year":114,"no":25,"topic":"估價基本事項","stem":"估價事務所接受委託展開估價作業前應先確定估價基本事項，於下列各項中應包含那些項目？①確定勘估標的內容 ②確定勘查日期 ③確定價格種類 ④確定估價目的 ⑤確定估價條件","options":["僅①③④","①②③④","①③④⑤","①②③④⑤"],"answer":"C","explain":"勘估標的內容、價格日期、價格種類及條件、估價目的；勘查日期不是基本事項","laws":[]},{"id":"jjf-106-03","subject":"經紀法","year":106,"no":3,"topic":"經紀人員消極資格 §14 III","stem":"依不動產經紀業管理條例規定，關於不動產經紀人員之資格，下列敘述何者錯誤？","options":["經不動產經紀人考試及格者，應具備1 年以上經紀營業員經驗，始得向直轄市或縣市政府請領經紀人證書","經紀人證書有效期限為4 年。期滿時，應檢附4 年內完成專業訓練30 個小時以上之證明文件辦理換證","曾經營經紀業，經主管機關撤銷或廢止許可，自撤銷或廢止之日起未滿5 年者，不得充任經紀人員","經紀人員應專任一經紀業，並不得為自己或他經紀業執行仲介或代銷業務。但經所屬經紀業同意為他經紀業執行業務者，不在此限"],"answer":"C","explain":"只看 §6 I 第 1～4 款、第 7 款；「曾經營經紀業被撤銷廢止未滿 5 年」（第 5 款）不在內","laws":[{"ref":"不動產經紀業管理條例 §14","text":"經不動產經紀人考試及格者，應具備一年以上經紀營業員經驗，始得向直轄市或縣（市）政府請領經紀人證書。\n前項經紀營業員經驗，依下列情形之一認定：\n一、取得經紀營業員資格並附有仲介或代銷業務所得扣繳資料證明者。\n二、本條例施行前已實際從事仲介或代銷業務有所得扣繳資料證明者。\n有第六條第一項第一款至第四款或第七款情形之一者，不得充任經紀人員。已充任者，應撤銷或廢止其證書或證明。"},{"ref":"不動產經紀業管理條例 §6","text":"有下列各款情形之一者，不得申請經營經紀業，其經許可者，撤銷或廢止其許可：\n一、無行為能力或限制行為能力者。\n二、受破產之宣告尚未復權者。\n三、犯詐欺、背信、侵占罪、性侵害犯罪防治法第二條所定之罪、組織犯罪防制條例第三條第一項、第二項、第六條、第九條之罪，經受有期徒刑一年以上刑之宣告確定，尚未執行完畢或執行完畢或赦免後未滿三年者。但受緩刑宣告者，不在此限。\n四、受感訓處分之裁定確定，尚未執行完畢或執行完畢後未滿三年者。\n五、曾經營經紀業，經主管機關撤銷或廢止許可，自撤銷或廢止之日起未滿五年者。但依第七條第一項逾期未開始營業或第三十條自行停止業務者，不在此限。\n六、受第二十九條之停止營業處分，尚未執行完畢者。\n七、受第三十一條停止執行業務處分尚未執行完畢，或廢止經紀人員證書或證明處分未滿五年者。\n經紀業經公司登記或商業登記後，其公司負責人、董事、監察人、經理人或商號負責人、經理人有前項各款情形之一者，由主管機關命其限期改善；逾期未改善者，廢止其許可，並通知其公司或商業登記主管機關廢止其登記。"}]},{"id":"jjf-106-09","subject":"經紀法","year":106,"no":9,"topic":"主管機關 §3","stem":"不動產經紀業管理條例所稱主管機關，下列敘述何者錯誤？","options":["內政部營建署","內政部","直轄市政府地政處","縣（市）政府"],"answer":"A","explain":"內政部、直轄市地政處、縣市政府；不是營建署","laws":[{"ref":"不動產經紀業管理條例 §3","text":"本條例所稱主管機關︰在中央為內政部；在直轄市為直轄市政府地政處；在縣（市）為縣（市）政府。"}]},{"id":"jjf-106-18","subject":"經紀法","year":106,"no":18,"topic":"公平法 §20","stem":"依公平交易法第20 條之規定，妨害公平競爭之行為不包括下列何者？","options":["無正當理由，對他事業給予差別待遇之行為","以低價利誘或其他不正當方法，阻礙競爭者參與或從事競爭之行為","以脅迫、利誘或其他不正當之方法，使競爭者之交易相對人與自己交易之行為","以不正當限制交易相對人之事業活動為條件，而與其交易之行為"],"answer":"C","explain":"「使競爭者之交易相對人與自己交易」不在 §20 五款內","laws":[{"ref":"公平交易法 §20","text":"有下列各款行為之一，而有限制競爭之虞者，事業不得為之：\n一、以損害特定事業為目的，促使他事業對該特定事業斷絕供給、購買或其他交易之行為。\n二、無正當理由，對他事業給予差別待遇之行為。\n三、以低價利誘或其他不正當方法，阻礙競爭者參與或從事競爭之行為。\n四、以脅迫、利誘或其他不正當方法，使他事業不為價格之競爭、參與結合、聯合或為垂直限制競爭之行為。\n五、以不正當限制交易相對人之事業活動為條件，而與其交易之行為。"}]},{"id":"jjf-106-20","subject":"經紀法","year":106,"no":20,"topic":"預售屋審閱","stem":"不動產開發業者或不動產經紀業者銷售預售屋時，要求購屋人須給付定金或一定費用始提供預售屋買賣契約書攜回審閱，可能違反公平交易法之何種行為？","options":["第20 條之妨害公平競爭行為","第25 條之欺罔或顯失公平行為","第21 條之虛偽不實廣告行為","第15 條之聯合行為"],"answer":"B","explain":"要求付訂金才給契約攜回審閱→§25 欺罔或顯失公平","laws":[{"ref":"公平交易法 §25"
