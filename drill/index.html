,"text":"除本法另有規定者外，事業亦不得為其他足以影響交易秩序之欺罔或顯失公平之行為。"}]},{"id":"jjf-106-21","subject":"經紀法","year":106,"no":21,"topic":"反托拉斯基金 §47-1","stem":"下列何者非反托拉斯法基金之用途？","options":["辦理競爭法之教育及宣傳","補助本法與涉及檢舉獎金訴訟案件相關費用之支出","推動國際競爭法執法機關之合作","補助消費者因聯合行為而受之損害"],"answer":"D","explain":"用途沒有補助消費者損害","laws":[{"ref":"公平交易法 §47-1","text":"主管機關為強化聯合行為查處，促進市場競爭秩序之健全發展，得設立反托拉斯基金。\n前項基金之來源如下：\n一、提撥違反本法罰鍰之百分之三十。\n二、基金孳息收入。\n三、循預算程序之撥款。\n四、其他有關收入。\n第一項基金之用途如下：\n一、檢舉違法聯合行為獎金之支出。\n二、推動國際競爭法執法機關之合作、調查及交流事項。\n三、補助本法與涉及檢舉獎金訴訟案件相關費用之支出。\n四、辦理競爭法相關資料庫之建置及維護。\n五、辦理競爭法相關制度之研究發展。\n六、辦理競爭法之教育及宣導。\n七、其他維護市場交易秩序之必要支出。\n前項第一款有關檢舉獎金適用之範圍、檢舉人資格、發給標準、發放程序、獎金之撤銷、廢止與追償、身分保密等事項之辦法，由主管機關定之。"}]},{"id":"jjf-106-22","subject":"經紀法","year":106,"no":22,"topic":"聯合行為許可 §16","stem":"依公平交易法規定，下列關於期間之敘述何者錯誤？","options":["主管機關對於違反獨占、聯合行為之裁處權，因5 年期間經過而消滅","損害賠償請求權，自請求權人知有行為及賠償義務人時起，2 年間不行使而消滅","損害賠償請求權，自行為時起，逾10 年不行使而消滅","聯合行為許可應附期限，其期限不得逾3 年。以書面申請延展，其延展期限每次不得逾3 年"],"answer":"D","explain":"期限 ≤ 5 年，延展每次 ≤ 5 年（題目寫 3 年錯）；損害賠償時效知悉 2 年、行為 10 年","laws":[{"ref":"公平交易法 §16","text":"主管機關為前條之許可時，得附加條件或負擔。\n許可應附期限，其期限不得逾五年；事業如有正當理由，得於期限屆滿前三個月至六個月期間內，以書面向主管機關申請延展；其延展期限，每次不得逾五年。"}]},{"id":"jjf-106-23","subject":"經紀法","year":106,"no":23,"topic":"調解方案異議 §45-3","stem":"依消費者保護法規定，關於消費爭議之處理，當事人對於調解委員依職權提出之解決方案若有異議，最遲得於送達後幾日內提出？","options":["7日","10日","15日","20日"],"answer":"B","explain":"10 日","laws":[{"ref":"消費者保護法 §45-3","text":"當事人對於前條所定之方案，得於送達後十日之不變期間內，提出異議。\n於前項期間內提出異議者，視為調解不成立；其未於前項期間內提出異議者，視為已依該方案成立調解。\n第一項之異議，消費爭議調解委員會應通知他方當事人。"}]},{"id":"jjf-106-25","subject":"經紀法","year":106,"no":25,"topic":"§24 輸入商品","stem":"輸入之商品或服務，須以何種方式為之？","options":["應附中文標示","得附中文標示","無須附中文標示","應附中文及外文標示"],"answer":"A","explain":"應附中文標示及說明書","laws":[{"ref":"消費者保護法 §24","text":"企業經營者應依商品標示法等法令為商品或服務之標示。\n輸入之商品或服務，應附中文標示及說明書，其內容不得較原產地之標示及說明書簡略。\n輸入之商品或服務在原產地附有警告標示者，準用前項之規定。"}]},{"id":"jjf-106-26","subject":"經紀法","year":106,"no":26,"topic":"§12 推定顯失公平","stem":"下列何者不是消費者保護法第12 條所規定推定定型化契約條款顯失公平之情形？","options":["契約之主要權利或義務，因受條款之限制，致契約之目的難以達成者","條款與其所排除不予適用之任意規定之立法意旨顯相矛盾者","違反平等互惠原則者","違反誠信原則者"],"answer":"D","explain":"推定 3 款：平等互惠、任意規定立法意旨矛盾、主要權利受限；違反誠信原則是 §12 I 直接無效","laws":[{"ref":"消費者保護法 §12","text":"定型化契約中之條款違反誠信原則，對消費者顯失公平者，無效。\n定型化契約中之條款有下列情形之一者，推定其顯失公平：\n一、違反平等互惠原則者。\n二、條款與其所排除不予適用之任意規定之立法意旨顯相矛盾者。\n三、契約之主要權利或義務，因受條款之限制，致契約之目的難以達成者。"}]},{"id":"jjf-106-27","subject":"經紀法","year":106,"no":27,"topic":"內政部定型化契約範本","stem":"下列何者非屬於內政部依消費者保護法之規定所訂定之定型化契約應記載不得記載事項類型？","options":["預售屋買賣定型化契約應記載及不得記載事項","成屋買賣定型化契約應記載及不得記載事項","不動產委託銷售定型化契約應記載及不得記載事項","停車位租賃定型化契約應記載及不得記載事項"],"answer":"D","explain":"預售屋、成屋買賣、委託銷售有；停車位租賃不是內政部訂的","laws":[]},{"id":"jjf-106-29","subject":"經紀法","year":106,"no":29,"topic":"§25 書面保證書","stem":"依消費者保護法規定，企業經營者對消費者保證商品或服務品質所出具之書面保證書，應載明事項不包括下列何者？","options":["商品或服務之名稱","保證之內容","製造日期","製造商之名稱、地址"],"answer":"C","explain":"載明交易日期，沒有製造日期","laws":[{"ref":"消費者保護法 §25","text":"企業經營者對消費者保證商品或服務之品質時，應主動出具書面保證書。\n前項保證書應載明下列事項：\n一、商品或服務之名稱、種類、數量，其有製造號碼或批號者，其製造號碼或批號。\n二、保證之內容。\n三、保證期間及其起算方法。\n四、製造商之名稱、地址。\n五、由經銷商售出者，經銷商之名稱、地址。\n六、交易日期。"}]},{"id":"jjf-106-31","subject":"經紀法","year":106,"no":31,"topic":"§19 V","stem":"依消費者保護法規定，關於特種交易之敘述何者正確？","options":["通訊交易係指企業經營者未經邀約而與消費者在公共場所或其他場所等所定之契約","訪問交易之消費者，除有合理例外情事，得於收受商品後7 日內，以退回商品或書面通知方式解除契約，無須說明理由","通訊交易違反消費者解約權所為之約定，其約定無效","企業經營者應於收到消費者退回商品通知之次日起7 日內，返還消費者已支付之對價"],"answer":"C","explain":"通訊、訪問交易違反解約權的約定無效；A 是訪問交易定義；B 合理例外是通訊交易；D 返還期限是 15 日","laws":[{"ref":"消費者保護法 §19","text":"通訊交易或訪問交易之消費者，得於收受商品或接受服務後七日內，以退回商品或書面通知方式解除契約，無須說明理由及負擔任何費用或對價。但通訊交易有合理例外情事者，不在此限。\n前項但書合理例外情事，由行政院定之。\n企業經營者於消費者收受商品或接受服務時，未依前條第一項第三款規定提供消費者解除契約相關資訊者，第一項七日期間自提供之次日起算。但自第一項七日期間起算，已逾四個月者，解除權消滅。\n消費者於第一項及第三項所定期間內，已交運商品或發出書面者，契約視為解除。\n通訊交易或訪問交易違反本條規定所為之約定，其約定無效。"}]},{"id":"jjf-106-34","subject":"經紀法","year":106,"no":34,"topic":"樓梯間鞋櫃上鎖","stem":"在規約並未特別約定之情形下，一層一戶之住戶在樓梯間與走廊置放鞋櫃，並將安全門上鎖防止他人出入該樓層。下列敘述，何者正確？","options":["住戶不得於樓梯間與共同走廊間堆置雜物。若有違反，管理委員會有權制止並移除鞋櫃與剪斷鎖頭","主管機關得處該住戶新臺幣4 萬元以上20 萬元以下罰鍰，並限期改善","管理委員會促請該住戶改善，若於3 個月內仍未改善，管理委員會得依區分所有權人會議決議，強制其遷離","若該住戶拒絕依照區分所有權人會議決議遷離並完成移轉登記手續者，管理委員會得聲請法院拍賣之"],"answer":"B","explain":"違反 §16 II→§49 I④ 4～20 萬；管委會只能制止、報主管機關，不能自行移除剪鎖","laws":[{"ref":"公寓大廈管理條例 §16","text":"住戶不得任意棄置垃圾、排放各種污染物、惡臭物質或發生喧囂、振動及其他與此相類之行為。\n住戶不得於私設通路、防火間隔、防火巷弄、開放空間、退縮空地、樓梯間、共同走廊、防空避難設備等處所堆置雜物、設置柵欄、門扇或營業使用，或違規設置廣告物或私設路障及停車位侵占巷道妨礙出入。但開放空間及退縮空地，在直轄市、縣（市）政府核准範圍內，得依規約或區分所有權人會議決議供營業使用；防空避難設備，得為原核准範圍之使用；其兼作停車空間使用者，得依法供公共收費停車使用。\n住戶為維護、修繕、裝修或其他類似之工作時，未經申請主管建築機關核准，不得破壞或變更建築物之主要構造。\n住戶飼養動物，不得妨礙公共衛生、公共安寧及公共安全。但法令或規約另有禁止飼養之規定時，從其規定。\n住戶違反前四項規定時，管理負責人或管理委員會應予制止或按規約處理，經制止而不遵從者，得報請直轄市、縣（市）主管機關處理。"},{"ref":"公寓大廈管理條例 §49","text":"有下列行為之一者，由直轄市、縣（市）主管機關處新臺幣四萬元以上二十萬元以下罰鍰，並得令其限期改善或履行義務；屆期不改善或不履行者，得連續處罰：\n一、區分所有權人對專有部分之利用違反第五條規定者。\n二、住戶違反第八條第一項或第九條第二項關於公寓大廈變更使用限制規定，經制止而不遵從者。\n三、住戶違反第十五條第一項規定擅自變更專有或約定專用之使用者。\n四、住戶違反第十六條第二項或第三項規定者。\n五、住戶違反第十七條所定投保責任保險之義務者。\n六、區分所有權人違反第十八條第一項第二款規定未繳納公共基金者。\n七、管理負責人、主任委員或管理委員違反第二十條所定之公告或移交義務者。\n八、起造人或建築業者違反第五十七條或第五十八條規定者。\n有供營業使用事實之住戶有前項第三款或第四款行為，因而致人於死者，處一年以上七年以下有期徒刑，得併科新臺幣一百萬元以上五百萬元以下罰金；致重傷者，處六個月以上五年以下有期徒刑，得併科新臺幣五十萬元以上二百五十萬元以下罰金。"}]},{"id":"jjf-106-40","subject":"經紀法","year":106,"no":40,"topic":"區權會臨時會 §25","stem":"依公寓大廈管理條例規定，關於召開區分所有權人會議，下列敘述何者錯誤？","options":["每年至少應召開定期會議一次","發生重大事故有及時處理之必要，經管理委員會請求者，應召開臨時會議","須經區分所有權人三分之一以上及其區分所有權比例合計三分之一以上，以書面載明召集之目的及理由請求召集者，始得召開臨時會議","區分所有權人會議可由具區分所有權人身分之管理委員為召集人"],"answer":"C","explain":"區分所有權人 1/5 以上及比例 1/5 以上書面請求（不是 1/3）","laws":[{"ref":"公寓大廈管理條例 §25","text":"區分所有權人會議，由全體區分所有權人組成，每年至少應召開定期會議一次。\n有下列情形之一者，應召開臨時會議：\n一、發生重大事故有及時處理之必要，經管理負責人或管理委員會請求者。\n二、經區分所有權人五分之一以上及其區分所有權比例合計五分之一以上，以書面載明召集之目的及理由請求召集者。\n區分所有權人會議除第二十八條規定外，由具區分所有權人身分之管理負責人、管理委員會主任委員或管理委員為召集人；管理負責人、管理委員會主任委員或管理委員喪失區分所有權人資格日起，視同解任。無管理負責人或管理委員會，或無區分所有權人擔任管理負責人、主任委員或管理委員時，由區分所有權人互推一人為召集人；召集人任期依區分所有權人會議或依規約規定，任期一至二年，連選得連任一次。但區分所有權人會議或規約未規定者，任期一年，連選得連任一次。\n召集人無法依前項規定互推產生時，各區分所有權人得申請直轄市、縣（市）主管機關指定臨時召集人，區分所有權人不申請指定時，直轄市、縣（市）主管機關得視實際需要指定區分所有權人一人為臨時召集人，或依規約輪流擔任，其任期至互推召集人為止。"}]},{"id":"jjf-107-03","subject":"經紀法","year":107,"no":3,"topic":"遷址（細則 §7）","stem":"甲於A 市經營不動產經紀業，數年後欲遷出所在地A 市到B 縣，應於遷出後多久時間內，以書面向遷入之B 縣主管機關申請遷入備查，並向原所屬之同業公會報備，及加入B 縣同業公會，該遷入之同業公會並應轉知其全國聯合會？","options":["三十日","四十五日","二個月","三個月"],"answer":"A","explain":"遷出後 30 日內向遷入地主管機關申請備查、加入遷入地公會","laws":[{"ref":"不動產經紀業管理條例施行細則 §7","text":"經紀業遷出所在地直轄市或縣（市）主管機關管轄區域以外時，應於遷出後三十日內，以書面向遷入之直轄市或縣（市）主管機關申請遷入備查，並向原所屬之同業公會報備，及加入遷入之直轄市或縣（市）同業公會，該遷入之同業公會並應轉知其全國聯合會。\n前項經紀業遷入之直轄市或縣（市）主管機關，於辦理該經紀業之遷入備查後，應通知該經紀業遷出之直轄市或縣（市）主管機關。經紀業分設之營業處所非在其所轄區域內者，並應通知該營業處所所在地直轄市或縣（市）主管機關。"}]},{"id":"jjf-107-04","subject":"經紀法","year":107,"no":4,"topic":"停止營業","stem":"依不動產經紀業管理條例之規定，何者為應予停止營業處分之情形？","options":["經紀業未於經紀人到職之日起十五日內，造具名冊報請所在地主管機關層報中央主管機關備查","經紀業繳存之營業保證金低於規定之額度時，經中華民國不動產仲介經紀業或代銷經紀業同業公會全國聯合會通知經紀業者於一個月內補足而未補足","經紀業僱用未具備經紀人員資格者從事仲介或代銷業務","經營仲介業務者，對於買賣或租賃委託案件，未依規定於簽訂買賣契約書並辦竣所有權移轉登記或簽訂租賃契約書後三十日內，向主管機關申報登錄成交案件實際資訊"],"answer":"B","explain":"保證金低於額度、全聯會通知 1 個月內補足而未補足→§29 I⑦ 停止營業；名冊 15 日（§12）、僱用無資格者（§17）、實價登錄都是罰鍰","laws":[{"ref":"不動產經紀業管理條例 §29","text":"經紀業違反本條例者，依下列規定處罰之：\n一、違反第七條第六項、第十一條、第十七條、第十九條第一項、第二十一條第一項、第二項或第二十二條第一項規定，由直轄市、縣（市）主管機關處新臺幣六萬元以上三十萬元以下罰鍰。\n二、違反第二十四條之一第二項規定，未依限申報登錄資訊或申報登錄價格、交易面積資訊不實，由直轄市、縣（市）主管機關按戶（棟）處新臺幣三萬元以上十五萬元以下罰鍰，並令其限期改正；屆期未改正者，按次處罰。經處罰二次仍未改正者，按次處新臺幣三十萬元以上一百萬元以下罰鍰。\n三、違反第二十四條之一第二項規定，未依限將委託代銷契約相關書件報備查，或違反第二十四條之一第六項規定，規避、妨礙或拒絕查核，或違反第二十四條之二規定，由主管機關處新臺幣三萬元以上十五萬元以下罰鍰。\n四、違反第十二條、第十八條、第二十條或第二十七條規定，直轄市、縣（市）主管機關應令其限期改正；屆期未改正，處新臺幣三萬元以上十五萬元以下罰鍰。\n五、違反第二十四條之一第一項規定，未依限申報登錄資訊、申報登錄租金或面積資訊不實，由直轄市、縣（市）主管機關處新臺幣一萬元以上五萬元以下罰鍰。\n六、違反第二十四條之一第一項或第二項規定，申報登錄租金、價格及面積以外資訊不實，直轄市、縣（市）主管機關應令其限期改正；屆期未改正，處新臺幣六千元以上三萬元以下罰鍰。\n七、違反第七條第三項、第四項或第八條第四項規定，直轄市、縣（市）主管機關應予停止營業處分，其期間至補足營業保證金為止。但停止營業期間達一年者，應廢止其許可。\n經紀業經依前項第一款、第三款至第六款處罰鍰者，主管機關並應令其限期改正；屆期未改正者，按次處罰。\n金融機構、交易當事人違反第二十四條之一第六項規定，規避、妨礙或拒絕查核者，由主管機關處新臺幣三萬元以上十五萬元以下罰鍰，並令其限期改正；屆期未改正者，按次處罰。"},{"ref":"不動產經紀業管理條例 §12","text":"經紀業應於經紀人到職之日起十五日內，造具名冊報請所在地主管機關層報中央主管機關備查，異動時，亦同。"},{"ref":"不動產經紀業管理條例 §17","text":"經紀業不得僱用未具備經紀人員資格者從事仲介或代銷業務。"}]},{"id":"jjf-107-08","subject":"經紀法","year":107,"no":8,"topic":"聯合行為","stem":"不動產經紀業者共同約束專任委託契約之期間，致使不動產經紀業者縱未積極努力撮合，委託人卻因受限於契約而無法另行委託其他不動產經紀業者，該行為將違反公平交易法所規範之那一種行為？","options":["以著名之他人姓名、商號或公司名稱、標章或其他表示他人營業、服務之表徵，於同一或類似之服務為相同或近似之使用，致與他人營業或服務之設施或活動混淆","結合","聯合行為","為其他足以影響交易秩序之欺罔或顯失公平之行為"],"answer":"C","explain":"同業共同約束專任委託期間→聯合行為","laws":[]},{"id":"jjf-107-09","subject":"經紀法","year":107,"no":9,"topic":"§42 罰鍰","stem":"甲為不動產經紀業者，受乙不動產開發業者委託從事銷售行為，甲外包請丙廣告公司設計廣告，經消費者丁舉報該廣告之內容，有虛偽不實或引人錯誤之情形，經公平交易委員會認定為違反規定。依公平交易法之規定，下列敘述情形，何者錯誤？","options":["主管機關對於甲，得限期令停止、改正其行為或採取必要更正措施，並得處新臺幣二十萬元以上五千萬元以下罰鍰","若甲與乙共同具名製作不實房屋銷售廣告，且收取建案底價或總銷售金額一定成數之銷售服務費用，與乙共同獲有利益，可認為甲乙俱為廣告主","丙在明知或可得而知情形下，仍製作或設計有引人錯誤之廣告，與廣告主負連帶損害賠償責任","甲違反公平交易法之規定，致侵害丁之權益，應負損害賠償責任"],"answer":"A","explain":"違反 §21 罰 5 萬～2,500 萬（題目寫 20 萬～5,000 萬錯）；共同具名並抽成的代銷也是廣告主","laws":[{"ref":"公平交易法 §42","text":"主管機關對於違反第二十一條、第二十三條至第二十五條規定之事業，得限期令停止、改正其行為或採取必要更正措施，並得處新臺幣五萬元以上二千五百萬元以下罰鍰；屆期仍不停止、改正其行為或未採取必要更正措施者，得繼續限期令停止、改正其行為或採取必要更正措施，並按次處新臺幣十萬元以上五千萬元以下罰鍰，至停止、改正其行為或採取必要更正措施為止。"},{"ref":"公平交易法 §21","text":"事業不得在商品或廣告上，或以其他使公眾得知之方法，對於與商品相關而足以影響交易決定之事項，為虛偽不實或引人錯誤之表示或表徵。\n前項所定與商品相關而足以影響交易決定之事項，包括商品之價格、數量、品質、內容、製造方法、製造日期、有效期限、使用方法、用途、原產地、製造者、製造地、加工者、加工地，及其他具有招徠效果之相關事項。\n事業對於載有前項虛偽不實或引人錯誤表示之商品，不得販賣、運送、輸出或輸入。\n前三項規定，於事業之服務準用之。\n廣告代理業在明知或可得而知情形下，仍製作或設計有引人錯誤之廣告，與廣告主負連帶損害賠償責任。廣告媒體業在明知或可得而知其所傳播或刊載之廣告有引人錯誤之虞，仍予傳播或刊載，亦與廣告主負連帶損害賠償責任。廣告薦證者明知或可得而知其所從事之薦證有引人錯誤之虞，而仍為薦證者，與廣告主負連帶損害賠償責任。但廣告薦證者非屬知名公眾人物、專業人士或機構，僅於受廣告主報酬十倍之範圍內，與廣告主負連帶損害賠償責任。\n前項所稱廣告薦證者，指廣告主以外，於廣告中反映其對商品或服務之意見、信賴、發現或親身體驗結果之人或機構。"}]},{"id":"jjf-107-11","subject":"經紀法","year":107,"no":11,"topic":"薦證者 §21 V","stem":"甲為一位知名影星，曾拍攝二個不動產廣告，且知悉該等廣告有不實的情形。在成名之前，甲接拍廣告主乙的不動產廣告，廣告中反映甲對不動產商品的信賴，結果當時消費者丙即曾經檢舉廣告不實。十二年之後，甲已成為知名公眾人物，接了第二個廣告主丁的不動產廣告，反映甲對該廣告商品的親身體驗。此時，消費者戊檢舉廣告不實。依公平交易法之規定，下列敘述，何者正確？","options":["甲必須是「明知」其所從事之薦證有引人錯誤之虞，而仍為薦證，才需要負責","第一個廣告，甲仍非知名公眾人物，僅於受乙報酬五倍之範圍內，與乙負連帶損害賠償責任","第二個廣告，甲為知名人士，須與丁負連帶損害賠償責任","丙和戊的請求權尚未超過法定期限，故其請求權尚未消滅"],"answer":"C","explain":"知名公眾人物→與廣告主連帶、無上限；非知名→報酬 10 倍（不是 5 倍）；要件是「明知或可得而知」；12 年前的請求權已逾 10 年","laws":[{"ref":"公平交易法 §21","text":"事業不得在商品或廣告上，或以其他使公眾得知之方法，對於與商品相關而足以影響交易決定之事項，為虛偽不實或引人錯誤之表示或表徵。\n前項所定與商品相關而足以影響交易決定之事項，包括商品之價格、數量、品質、內容、製造方法、製造日期、有效期限、使用方法、用途、原產地、製造者、製造地、加工者、加工地，及其他具有招徠效果之相關事項。\n事業對於載有前項虛偽不實或引人錯誤表示之商品，不得販賣、運送、輸出或輸入。\n前三項規定，於事業之服務準用之。\n廣告代理業在明知或可得而知情形下，仍製作或設計有引人錯誤之廣告，與廣告主負連帶損害賠償責任。廣告媒體業在明知或可得而知其所傳播或刊載之廣告有引人錯誤之虞，仍予傳播或刊載，亦與廣告主負連帶損害賠償責任。廣告薦證者明知或可得而知其所從事之薦證有引人錯誤之虞，而仍為薦證者，與廣告主負連帶損害賠償責任。但廣告薦證者非屬知名公眾人物、專業人士或機構，僅於受廣告主報酬十倍之範圍內，與廣告主負連帶損害賠償責任。\n前項所稱廣告薦證者，指廣告主以外，於廣告中反映其對商品或服務之意見、信賴、發現或親身體驗結果之人或機構。"}]},{"id":"jjf-107-20","subject":"經紀法","year":107,"no":20,"topic":"退縮空地 §16 II","stem":"依公寓大廈管理條例之規定，開放空間及退縮空地，在直轄市、縣（市）政府核准範圍內，應經下列何種程序，始得供營業使用？","options":["經向直轄市、縣市主管機關申請許可之許可函","依規約或區分所有權人會議決議","依管理負責人或管理委員會之決定","依開放空間及退縮空地鄰近之區分所有權人之同意"],"answer":"B","explain":"縣市核准範圍內，依規約或區權會決議供營業使用","laws":[{"ref":"公寓大廈管理條例 §16","text":"住戶不得任意棄置垃圾、排放各種污染物、惡臭物質或發生喧囂、振動及其他與此相類之行為。\n住戶不得於私設通路、防火間隔、防火巷弄、開放空間、退縮空地、樓梯間、共同走廊、防空避難設備等處所堆置雜物、設置柵欄、門扇或營業使用，或違規設置廣告物或私設路障及停車位侵占巷道妨礙出入。但開放空間及退縮空地，在直轄市、縣（市）政府核准範圍內，得依規約或區分所有權人會議決議供營業使用；防空避難設備，得為原核准範圍之使用；其兼作停車空間使用者，得依法供公共收費停車使用。\n住戶為維護、修繕、裝修或其他類似之工作時，未經申請主管建築機關核准，不得破壞或變更建築物之主要構造。\n住戶飼養動物，不得妨礙公共衛生、公共安寧及公共安全。但法令或規約另有禁止飼養之規定時，從其規定。\n住戶違反前四項規定時，管理負責人或管理委員會應予制止或按規約處理，經制止而不遵從者，得報請直轄市、縣（市）主管機關處理。"}]},{"id":"jjf-107-23","subject":"經紀法","year":107,"no":23,"topic":"§24-2 雙方委託","stem":"下列有關經紀業及經紀人員業務及責任之敘述，何者正確？","options":["不動產說明書應由經紀業指派經紀人員簽章","經營仲介業務者，應依實際成交價金按中華民國不動產仲介經紀業同業公會全國聯合會規定之報酬標準計收","不動產廣告及銷售內容，應與事實相符，並註明經紀業及經紀人員名稱","經營仲介業務者經買賣雙方當事人之書面同意，得同時接受雙方之委託，並提供買受人關於不動產必要之資訊"],"answer":"D","explain":"經雙方書面同意可同時受託（正確）；說明書由經紀人簽章（不是經紀人員）、報酬標準由中央定、廣告註明經紀業名稱（不含人員）","laws":[{"ref":"不動產經紀業管理條例 §24-2","text":"經營仲介業務者經買賣或租賃雙方當事人之書面同意，得同時接受雙方之委託，並依下列規定辦理：\n一、公平提供雙方當事人類似不動產之交易價格。\n二、公平提供雙方當事人有關契約內容規範之說明。\n三、提供買受人或承租人關於不動產必要之資訊。\n四、告知買受人或承租人依仲介專業應查知之不動產之瑕疵。\n五、協助買受人或承租人對不動產進行必要之檢查。\n六、其他經中央主管機關為保護買賣或租賃當事人所為之規定。"}]},{"id":"jjf-107-24","subject":"經紀法","year":107,"no":24,"topic":"換證（細則 §17）","stem":"下列有關不動產經紀人辦理換發證書之規定敘述，何者正確？","options":["換發之證書，其有效期限自原證書有效期限屆滿之次日起算四年","應於證書有效期限屆滿前三個月內申請","應完成專業訓練至少二十個小時","應向執業所在地之直轄市或縣（市）政府申請"],"answer":"A","explain":"新證自原證屆滿次日起算 4 年；屆滿前 6 個月；30 小時；向原核發機關","laws":[{"ref":"不動產經紀業管理條例施行細則 §17","text":"經紀人依本條例第十五條第一項規定辦理換發證書時，應於證書有效期限屆滿前六個月內，檢附下列文件，向原核發機關申請之：\n一、申請書。\n二、完成專業訓練三十個小時以上之證明文件。\n三、原核發之經紀人證書。\n直轄市或縣（市）主管機關受理前項申請，經審查合於規定者，應即換發證書；不合規定者，應通知其於十五日內補正，屆期未補正者，駁回其申請，並退還前項第二款及第三款文件。\n換發之證書，其有效期限自原證書有效期限屆滿之次日起算四年。\n換發證書，得以於原證書加註延長有效期限之方式為之。"}]},{"id":"jjf-109-01","subject":"經紀法","year":109,"no":1,"topic":"經紀條例立法目的","stem":"關於不動產經紀業管理條例立法目的之敘述，下列何者正確？","options":["加強公寓大廈之管理維護","發展租賃住宅服務業","保障國民消費生活安全","促進不動產交易市場健全發展"],"answer":"D","explain":"促進不動產交易市場健全發展；A 是公寓條例、B 是租賃住宅條例、C 是消保法","laws":[]},{"id":"jjf-109-02","subject":"經紀法","year":109,"no":2,"topic":"主管機關 §3","stem":"不動產經紀業管理條例所稱主管機關︰在中央為內政部；在直轄市為直轄市政府何等局處？","options":["都市發展、城鄉發展","產業發展","地政","財政"],"answer":"C","explain":"中央內政部；直轄市為直轄市政府地政處；縣市為縣市政府","laws":[{"ref":"不動產經紀業管理條例 §3","text":"本條例所稱主管機關︰在中央為內政部；在直轄市為直轄市政府地政處；在縣（市）為縣（市）政府。"}]},{"id":"jjf-109-03","subject":"經紀法","year":109,"no":3,"topic":"自行停業","stem":"除依法辦理停業登記者外，經紀業開始營業後自行停止營業達多久以上者，直轄市或縣（市）主管機關得廢止其許可？","options":["連續三個月以上者","合計三個月以上者","連續六個月以上者","合計六個月以上者"],"answer":"C","explain":"經紀業自行停止營業連續 6 個月以上→得廢止許可（不是「合計」、不是 3 個月）","laws":[]},{"id":"jjf-109-07","subject":"經紀法","year":109,"no":7,"topic":"公平法損害賠償","stem":"事業違反公平交易法，致侵害他人權益者，如為事業之故意行為，法院得酌定損害額以上之賠償。但不得超過已證明損害額之幾倍？","options":["一倍","三倍","五倍","十倍"],"answer":"B","explain":"故意→法院可酌定損害額以上賠償，但不得超過已證明損害額 3 倍","laws":[]},{"id":"jjf-109-08","subject":"經紀法","year":109,"no":8,"topic":"消保懲罰性賠償金 §51","stem":"依消費者保護法所提之訴訟，因企業經營者之故意所致之損害，消費者得請求損害額幾倍以下之懲罰性賠償金？","options":["一倍","三倍","五倍","十倍"],"answer":"C","explain":"故意 5 倍／重大過失 3 倍／過失 1 倍","laws":[{"ref":"消費者保護法 §51","text":"依本法所提之訴訟，因企業經營者之故意所致之損害，消費者得請求損害額五倍以下之懲罰性賠償金；但因重大過失所致之損害，得請求三倍以下之懲罰性賠償金，因過失所致之損害，得請求損害額一倍以下之懲罰性賠償金。"}]},{"id":"jjf-109-10","subject":"經紀法","year":109,"no":10,"topic":"分期付款 §21","stem":"關於企業經營者與消費者分期付款買賣契約之敘述，下列何者正確？","options":["企業經營者應於契約書載明各期價款與其他附加費用合計之總價款與現金交易價格之差額","企業經營者未於契約書記載總價款者，消費者不負現金交易價格加計週年利率百分之五以外價款之給付義務","企業經營者未於契約書記載利率者，其利率按總價款週年利率百分之六計算之","企業經營者未於契約書記載利率者，消費者不負現金交易價格以外價款之給付義務"],"answer":"A","explain":"契約書載明頭期款、總價款與現金價差額、利率；未記載利率→按現金交易價格週年 5%（不是 6%、不是總價款）；未記載頭期款或差額→消費者不負現金交易價格以外的給付義務","laws":[{"ref":"消費者保護法 §21","text":"企業經營者與消費者分期付款買賣契約應以書面為之。\n前項契約書應載明下列事項：\n一、頭期款。\n二、各期價款與其他附加費用合計之總價款與現金交易價格之差額。\n三、利率。\n企業經營者未依前項規定記載利率者，其利率按現金交易價格週年利率百分之五計算之。\n企業經營者違反第二項第一款、第二款之規定者，消費者不負現金交易價格以外價款之給付義務。"}]},{"id":"jjf-109-11","subject":"經紀法","year":109,"no":11,"topic":"消保罰鍰","stem":"企業經營者違反消費者保護法之定型化契約應記載或不得記載事項者，經主管機關令其限期改正而屆期不改正者，第一次處多少罰鍰？","options":["新臺幣一萬元以上十萬元以下","新臺幣二萬元以上二十萬元以下","新臺幣三萬元以上三十萬元以下","新臺幣十萬元以上一百萬元以下"],"answer":"C","explain":"違反定型化契約應記載／不得記載事項，限期改正屆期不改→第一次 3～30 萬","laws":[]},{"id":"jjf-109-12","subject":"經紀法","year":109,"no":12,"topic":"公共基金 §18、§19","stem":"關於公寓大廈之公共基金，下列敘述何者正確？","options":["起造人就公寓大廈領得使用執照三年內之管理維護事項，應按工程造價一定比例或金額提列","區分所有權人依管理委員會議決議繳納","區分所有權人對於公共基金之權利應隨區分所有權之移轉而移轉","區分所有權人積欠應繳納之公共基金已逾一期或達相當金額，經催告仍不給付者，管理負責人或管理委員會得訴請法院命其給付"],"answer":"C","explain":"公共基金權利隨區分所有權移轉而移轉；起造人提列的是使用執照 1 年內（不是 3 年）；繳納依區權會決議（不是管委會）；積欠逾 2 期才可訴請給付","laws":[{"ref":"公寓大廈管理條例 §18","text":"公寓大廈應設置公共基金，其來源如下：\n一、起造人就公寓大廈領得使用執照一年內之管理維護事項，應按工程造價一定比例或金額提列。\n二、區分所有權人依區分所有權人會議決議繳納。\n三、本基金之孳息。\n四、其他收入。\n依前項第一款規定提列之公共基金，起造人於該公寓大廈使用執照申請時，應提出繳交各直轄市、縣（市）主管機關公庫代收之證明；於公寓大廈成立管理委員會或推選管理負責人，並完成依第五十七條規定點交共用部分、約定共用部分及其附屬設施設備後向直轄市、縣（市）主管機關報備，由公庫代為撥付。同款所稱比例或金額，由中央主管機關定之。\n公共基金應設專戶儲存，並由管理負責人或管理委員會負責管理；如經區分所有權人會議決議交付信託者，由管理負責人或管理委員會交付信託。其運用應依區分所有權人會議之決議為之。\n第一項及第二項所規定起造人應提列之公共基金，於本條例公布施行前，起造人已取得建造執照者，不適用之。"},{"ref":"公寓大廈管理條例 §19","text":"區分所有權人對於公共基金之權利應隨區分所有權之移轉而移轉；不得因個人事由為讓與、扣押、抵銷或設定負擔。"}]},{"id":"jjf-109-15","subject":"經紀法","year":109,"no":15,"topic":"經紀條例 §21 廣告","stem":"近來針對不動產經紀業的廣告行為，發生許多爭議。依不動產經紀業管理條例之規定，下列敘述何者正確？","options":["經紀業與委託人簽訂委託契約書後，方得刊登廣告及銷售","廣告及銷售內容，應與事實相符，並應註明廣告業名稱","廣告及銷售內容與事實不符者，經紀業應負行政之損失補償責任","主管機關僅能就經紀業違反得刊登廣告及銷售時間之規定，處罰經紀業新臺幣六萬元以上三十萬元以下罰鍰"],"answer":"A","explain":"簽委託契約書後才能刊登廣告及銷售；應註明經紀業名稱（不是廣告業）；不實→經紀業負連帶賠償責任（不是行政損失補償）","laws":[{"ref":"不動產經紀業管理條例 §21","text":"經紀業與委託人簽訂委託契約書後，方得刊登廣告及銷售。\n前項廣告及銷售內容，應與事實相符，並註明經紀業名稱。\n廣告及銷售內容與事實不符者，應負損害賠償責任。"}]},{"id":"jjf-109-16","subject":"經紀法","year":109,"no":16,"topic":"用辭定義 §4","stem":"關於不動產經紀業管理條例之用辭定義，下列敘述何者正確？","options":["預售屋指領有使用執照尚未建造完成而以將來完成之建築物為交易標的之物","差價係指買方支付斡旋金之交易價格與賣方委託銷售價格之差額","經紀人員包含經紀人或經紀營業員。經紀人指依本條例規定經營仲介或代銷業務之公司或商號；經紀營業員之職務為協助經紀人執行仲介或代銷業務","加盟經營者係指經紀業之一方以契約約定使用他方所發展之服務、營運方式、商標或服務標章等，並受其規範或監督"],"answer":"D","explain":"預售屋是領有建造執照（不是使用執照）；差價＝實際成交價－委託銷售價（與斡旋金無關）；經紀人是「人」，經營仲介代銷的公司商號是「經紀業」","laws":[{"ref":"不動產經紀業管理條例 §4","text":"本條例用辭定義如下︰\n一、不動產︰指土地、土地定著物或房屋及其可移轉之權利；房屋指成屋、預售屋及其可移轉之權利。\n二、成屋︰指領有使用執照，或於實施建築管理前建造完成之建築物。\n三、預售屋︰指領有建造執照尚未建造完成而以將來完成之建築物為交易標的之物。\n四、經紀業︰指依本條例規定經營仲介或代銷業務之公司或商號。\n五、仲介業務︰指從事不動產買賣、互易、租賃之居間或代理業務。\n六、代銷業務︰指受起造人或建築業之委託，負責企劃並代理銷售不動產之業務。\n七、經紀人員︰指經紀人或經紀營業員。經紀人之職務為執行仲介或代銷業務；經紀營業員之職務為協助經紀人執行仲介或代銷業務。\n八、加盟經營者︰經紀業之一方以契約約定使用他方所發展之服務、營運方式、商標或服務標章等，並受其規範或監督。\n九、差價︰係指實際買賣交易價格與委託銷售價格之差額。\n十、營業處所︰指經紀業經營仲介或代銷業務之店面、辦公室或非常態之固定場所。"}]},{"id":"jjf-109-17","subject":"經紀法","year":109,"no":17,"topic":"斡旋金未告知","stem":"不動產經紀業者從事不動產買賣之仲介業務時，在向買方收取斡旋金前，未以書面告知買方斡旋金契約與內政部版「要約書」之區別及其替代關係等資訊，將違反下列那一項規定？","options":["構成欺罔行為，且足以影響交易秩序者，將違反公平交易法第二十五條規定","不當爭取交易之機會，將違反公平交易法第二十三條規定","為虛偽不實或引人錯誤之表示或表徵，將違反公平交易法第二十一條規定","致與他人營業或服務之設施或活動混淆者，將違反公平交易法第二十二條規定"],"answer":"A","explain":"未書面告知斡旋金與要約書的區別→公平法 §25 欺罔或顯失公平（不是 §21 不實廣告）","laws":[{"ref":"公平交易法 §25","text":"除本法另有規定者外，事業亦不得為其他足以影響交易秩序之欺罔或顯失公平之行為。"},{"ref":"公平交易法 §21","text":"事業不得在商品或廣告上，或以其他使公眾得知之方法，對於與商品相關而足以影響交易決定之事項，為虛偽不實或引人錯誤之表示或表徵。\n前項所定與商品相關而足以影響交易決定之事項，包括商品之價格、數量、品質、內容、製造方法、製造日期、有效期限、使用方法、用途、原產地、製造者、製造地、加工者、加工地，及其他具有招徠效果之相關事項。\n事業對於載有前項虛偽不實或引人錯誤表示之商品，不得販賣、運送、輸出或輸入。\n前三項規定，於事業之服務準用之。\n廣告代理業在明知或可得而知情形下，仍製作或設計有引人錯誤之廣告，與廣告主負連帶損害賠償責任。廣告媒體業在明知或可得而知其所傳播或刊載之廣告有引人錯誤之虞，仍予傳播或刊載，亦與廣告主負連帶損害賠償責任。廣告薦證者明知或可得而知其所從事之薦證有引人錯誤之虞，而仍為薦證者，與廣告主負連帶損害賠償責任。但廣告薦證者非屬知名公眾人物、專業人士或機構，僅於受廣告主報酬十倍之範圍內，與廣告主負連帶損害賠償責任。\n前項所稱廣告薦證者，指廣告主以外，於廣告中反映其對商品或服務之意見、信賴、發現或親身體驗結果之人或機構。"}]},{"id":"jjf-109-19","subject":"經紀法","year":109,"no":19,"topic":"定型化契約 §13","stem":"消費者保護法針對企業經營者在定型化契約中所用之條款，有非常多的規定。下列敘述何者正確？","options":["企業經營者應給與消費者定型化契約書。但依其契約之性質致給與顯有困難者，不在此限","企業經營者應向消費者明示定型化契約條款之內容；明示其內容顯有困難者，應以顯著之方式，公告其內容後，該條款立即成為契約之內容","定型化契約書經消費者簽名或蓋章者，企業經營者應給與消費者該定型化契約書副本","定型化契約條款如有疑義時，應為有利於雙方當事人之解釋"],"answer":"A","explain":"A 正確；B 少了「並經消費者同意」；C 是給正本不是副本；D 疑義要作有利於消費者的解釋","laws":[{"ref":"消費者保護法 §13","text":"企業經營者應向消費者明示定型化契約條款之內容；明示其內容顯有困難者，應以顯著之方式，公告其內容，並經消費者同意者，該條款即為契約之內容。\n企業經營者應給與消費者定型化契約書。但依其契約之性質致給與顯有困難者，不在此限。\n定型化契約書經消費者簽名或蓋章者，企業經營者應給與消費者該定型化契約書正本。"}]},{"id":"jjf-109-20","subject":"經紀法","year":109,"no":20,"topic":"消費爭議處理 §43、§44","stem":"甲於網路上看到乙不動產開發商委託丙廣告媒體經營者刊登不動產買賣廣告後，向乙購買了一戶房屋。於交屋後發現有廣告不實的爭議。下列敘述何者錯誤？","options":["乙應確保廣告內容之真實，其對甲所負之義務不得低於廣告之內容。乙之商品或服務廣告內容，於契約成立後，應確實履行","甲可以向消費者保護團體提出廣告爭議之申訴、調解，或是直接向直轄市或縣（市）消費爭議調解委員會申請調解","丙明知或可得而知廣告內容與事實不符者，就甲因信賴該廣告所受之損害與企業經營者負連帶責任","甲與乙因商品或服務發生廣告之消費爭議時，甲得向企業經營者、消費者保護團體或消費者服務中心或其分中心申訴"],"answer":"B","explain":"申訴對象：企業經營者／消保團體／消費者服務中心；申訴未獲妥適處理才能向縣市調解委員會申請調解→不能直接調解，消保團體也不辦調解","laws":[{"ref":"消費者保護法 §43","text":"消費者與企業經營者因商品或服務發生消費爭議時，消費者得向企業經營者、消費者保護團體或消費者服務中心或其分中心申訴。\n企業經營者對於消費者之申訴，應於申訴之日起十五日內妥適處理之。\n消費者依第一項申訴，未獲妥適處理時，得向直轄市、縣（市）政府消費者保護官申訴。"},{"ref":"消費者保護法 §44","text":"消費者依前條申訴未能獲得妥適處理時，得向直轄市或縣（市）消費爭議調解委員會申請調解。"}]},{"id":"jjf-109-21","subject":"經紀法","year":109,"no":21,"topic":"消保法適用","stem":"甲為A 屋的所有權人，委託乙仲介公司幫忙賣房子。關於甲乙適用消費者保護法的情形，下列敘述何者錯誤？","options":["甲和乙所發生之法律關係，屬於消費關係","乙提出乙定型化契約條款作為契約內容而訂立之委託銷售契約屬於定型化契約","甲和乙訂定買賣契約約定消費者支付頭期款，餘款分期支付，而企業經營者於收受頭期款時，交付標的物與消費者之交易型態，屬於分期付款之契約","甲和乙如果適用乙所提出的定型化契約，仍然可以由契約當事人個別磋商而合意擬定個別磋商條款"],"answer":"C","explain":"甲（屋主）委託乙（仲介）賣房，甲乙之間是委託銷售，不是分期付款買賣；分期付款定義本身沒錯，錯在套用到甲乙","laws":[]},{"id":"jjf-109-22","subject":"經紀法","year":109,"no":22,"topic":"商品責任 §7～§9","stem":"為維護消費者之權益，保障消費者之健康與安全，消費者保護法於第二章第一節規定「健康與安全保障」專節。下列敘述何者錯誤？","options":["從事經銷之企業經營者，就商品或服務所生之損害，與設計、生產、製造商品或提供服務之企業經營者連帶負賠償責任","企業經營者對消費者或第三人之損害賠償責任，不得預先約定限制或免除","輸入商品或服務之企業經營者，視為該商品之設計、生產、製造者或服務之提供者，需負第三人責任","企業經營者於有事實足認其提供之商品或服務有危害消費者安全與健康之虞時，應即回收該批商品或停止其服務"],"answer":"C","explain":"輸入業者視為設計生產製造者，負 §7 製造者責任（不是「第三人責任」）","laws":[{"ref":"消費者保護法 §7","text":"從事設計、生產、製造商品或提供服務之企業經營者，於提供商品流通進入市場，或提供服務時，應確保該商品或服務，符合當時科技或專業水準可合理期待之安全性。\n商品或服務具有危害消費者生命、身體、健康、財產之可能者，應於明顯處為警告標示及緊急處理危險之方法。\n企業經營者違反前二項規定，致生損害於消費者或第三人時，應負連帶賠償責任。但企業經營者能證明其無過失者，法院得減輕其賠償責任。"},{"ref":"消費者保護法 §9","text":"輸入商品或服務之企業經營者，視為該商品之設計、生產、製造者或服務之提供者，負本法第七條之製造者責任。"}]},{"id":"jjf-109-23","subject":"經紀法","year":109,"no":23,"topic":"約定專用部分 §6","stem":"約定專用部分係指公寓大廈共用部分經約定供特定區分所有權人使用者。請問，就公寓大廈管理條例之規定，下列敘述何者錯誤？","options":["於維護、修繕約定專用部分，必須使用共用部分時，應經區分所有權人會議之同意後為之","公寓大廈本身所占之地面不得為約定專用部分","規約除應載明專有部分及共用部分範圍外，約定專用部分之範圍及使用主體，非經載明於規約者，不生效力","成立之約定專用部分變更時，應經使用該約定專用部分之區分所有權人同意。但該約定專用顯已違反公共利益，經管理委員會或管理負責人訴請法院判決確定者，不在此限"],"answer":"A","explain":"修繕專有／約定專用部分要用到共用部分→經管理負責人或管委會同意（不是區權會）；公寓大廈本身所占地面不得約定專用","laws":[{"ref":"公寓大廈管理條例 §6","text":"住戶應遵守下列事項：\n一、於維護、修繕專有部分、約定專用部分或行使其權利時，不得妨害其他住戶之安寧、安全及衛生。\n二、他住戶因維護、修繕專有部分、約定專用部分或設置管線，必須進入或使用其專有部分或約定專用部分時，不得拒絕。\n三、管理負責人或管理委員會因維護、修繕共用部分或設置管線，必須進入或使用其專有部分或約定專用部分時，不得拒絕。\n四、於維護、修繕專有部分、約定專用部分或設置管線，必須使用共用部分時，應經管理負責人或管理委員會之同意後為之。\n五、其他法令或規約規定事項。\n前項第二款至第四款之進入或使用，應擇其損害最少之處所及方法為之，並應修復或補償所生損害。\n住戶違反第一項規定，經協調仍不履行時，住戶、管理負責人或管理委員會得按其性質請求各該主管機關或訴請法院為必要之處置。"}]},{"id":"jjf-110-02","subject":"經紀法","year":110,"no":2,"topic":"住戶違反 §9 II","stem":"住戶違反公寓大廈管理條例第9 條第2 項關於公寓大廈變更使用限制規定，以下敘述何者錯誤？","options":["直轄市、縣（市）主管機關得令住戶限期改善；屆期不改善者，得連續處罰之","住戶經制止而不遵從者，由直轄市、縣（市）主管機關處4 萬元以上20 萬元以下罰鍰","管理委員會應予制止，並得按其性質請求各該主管機關為必要之處置。如有損害並得請求損害賠償","由管理委員會促請住戶改善，住戶於3 個月內仍未改善者，由管理委員會決議訴請法院強制其遷離"],"answer":"D","explain":"強制遷離（§22 I②）要先被 §49 罰鍰後仍不改善或續犯，不能直接促請 3 個月遷離","laws":[{"ref":"公寓大廈管理條例 §9","text":"各區分所有權人按其共有之應有部分比例，對建築物之共用部分及其基地有使用收益之權。但另有約定者從其約定。\n住戶對共用部分之使用應依其設置目的及通常使用方法為之。但另有約定者從其約定。\n前二項但書所約定事項，不得違反本條例、區域計畫法、都市計畫法及建築法令之規定。\n住戶違反第二項規定，管理負責人或管理委員會應予制止，並得按其性質請求各該主管機關或訴請法院為必要之處置。如有損害並得請求損害賠償。"},{"ref":"公寓大廈管理條例 §22","text":"住戶有下列情形之一者，由管理負責人或管理委員會促請其改善，於三個月內仍未改善者，管理負責人或管理委員會得依區分所有權人會議之決議，訴請法院強制其遷離：\n一、積欠依本條例規定應分擔之費用，經強制執行後再度積欠金額達其區分所有權總價百分之一者。\n二、違反本條例規定經依第四十九條第一項第一款至第四款規定處以罰鍰後，仍不改善或續犯者。\n三、其他違反法令或規約情節重大者。\n前項之住戶如為區分所有權人時，管理負責人或管理委員會得依區分所有權人會議之決議，訴請法院命區分所有權人出讓其區分所有權及其基地所有權應有部分；於判決確定後三個月內不自行出讓並完成移轉登記手續者，管理負責人或管理委員會得聲請法院拍賣之。\n前項拍賣所得，除其他法律另有規定外，於積欠本條例應分擔之費用，其受償順序與第一順位抵押權同。"},{"ref":"公寓大廈管理條例 §49","text":"有下列行為之一者，由直轄市、縣（市）主管機關處新臺幣四萬元以上二十萬元以下罰鍰，並得令其限期改善或履行義務；屆期不改善或不履行者，得連續處罰：\n一、區分所有權人對專有部分之利用違反第五條規定者。\n二、住戶違反第八條第一項或第九條第二項關於公寓大廈變更使用限制規定，經制止而不遵從者。\n三、住戶違反第十五條第一項規定擅自變更專有或約定專用之使用者。\n四、住戶違反第十六條第二項或第三項規定者。\n五、住戶違反第十七條所定投保責任保險之義務者。\n六、區分所有權人違反第十八條第一項第二款規定未繳納公共基金者。\n七、管理負責人、主任委員或管理委員違反第二十條所定之公告或移交義務者。\n八、起造人或建築業者違反第五十七條或第五十八條規定者。\n有供營業使用事實之住戶有前項第三款或第四款行為，因而致人於死者，處一年以上七年以下有期徒刑，得併科新臺幣一百萬元以上五百萬元以下罰金；致重傷者，處六個月以上五年以下有期徒刑，得併科新臺幣五十萬元以上二百五十萬元以下罰金。"}]},{"id":"jjf-110-03","subject":"經紀法","year":110,"no":3,"topic":"住戶 §16","stem":"依據公寓大廈管理條例規定，下列敘述何者正確？","options":["在住戶互相協議同意之下，住戶在樓梯間即得放置雜物","未經申請主管建築機關之核准，住戶為修繕時不得破壞建築物之主要構造","住戶對於退縮空地，不得依規約或區分所有權人會議決議供營業使用","依規約或區分所有權人會議決議，住戶即可在公共走道加設鐵門"],"answer":"B","explain":"未經主管建築機關核准不得破壞主要構造；樓梯間不得堆放（協議也不行）；退縮空地依規約或區權會決議可以營業；走道加鐵門不行","laws":[{"ref":"公寓大廈管理條例 §16","text":"住戶不得任意棄置垃圾、排放各種污染物、惡臭物質或發生喧囂、振動及其他與此相類之行為。\n住戶不得於私設通路、防火間隔、防火巷弄、開放空間、退縮空地、樓梯間、共同走廊、防空避難設備等處所堆置雜物、設置柵欄、門扇或營業使用，或違規設置廣告物或私設路障及停車位侵占巷道妨礙出入。但開放空間及退縮空地，在直轄市、縣（市）政府核准範圍內，得依規約或區分所有權人會議決議供營業使用；防空避難設備，得為原核准範圍之使用；其兼作停車空間使用者，得依法供公共收費停車使用。\n住戶為維護、修繕、裝修或其他類似之工作時，未經申請主管建築機關核准，不得破壞或變更建築物之主要構造。\n住戶飼養動物，不得妨礙公共衛生、公共安寧及公共安全。但法令或規約另有禁止飼養之規定時，從其規定。\n住戶違反前四項規定時，管理負責人或管理委員會應予制止或按規約處理，經制止而不遵從者，得報請直轄市、縣（市）主管機關處理。"}]},{"id":"jjf-110-04","subject":"經紀法","year":110,"no":4,"topic":"§33 決議特別生效要件","stem":"有關公寓大廈區分所有權人會議決議之特別生效要件，下列何者正確？","options":["無線電台基地台等類似強波發射設備，設置於屋頂者，應經頂層住戶同意；設置其他樓層者，應經該樓層住戶同意","約定專用部分變更時，應經使用該約定專用部分之區分所有權人同意。但該約定專用顯已違反公共利益，經區分所有權人會議決議者，不在此限","專有部分經依區分所有權人會議約定為約定共用部分者，應經該專有部分區分所有權人同意","共用部分經依區分所有權人會議約定為約定專用部分者，應經該專有部分區分所有權人同意"],"answer":"C","explain":"專有→約定共用：該專有部分區權人同意（正確）；A 是「頂層區分所有權人」不是住戶；B 例外是法院判決確定不是區權會決議","laws":[{"ref":"公寓大廈管理條例 §33","text":"區分所有權人會議之決議，未經依下列各款事項辦理者，不生效力：\n一、專有部分經依區分所有權人會議約定為約定共用部分者，應經該專有部分區分所有權人同意。\n二、公寓大廈外牆面、樓頂平臺，設置廣告物、無線電台基地台等類似強波發射設備或其他類似之行為，設置於屋頂者，應經頂層區分所有權人同意；設置其他樓層者，應經該樓層區分所有權人同意。該層住戶，並得參加區分所有權人會議陳述意見。\n三、依第五十六條第一項規定成立之約定專用部分變更時，應經使用該約定專用部分之區分所有權人同意。但該約定專用顯已違反公共利益，經管理委員會或管理負責人訴請法院判決確定者，不在此限。"}]},{"id":"jjf-110-09","subject":"經紀法","year":110,"no":9,"topic":"營業員","stem":"依不動產經紀業管理條例規定，有關不動產經紀營業員之敘述，下列何者正確？","options":["經中央主管機關或其認可之機構、團體舉辦不動產經紀營業員訓練合格者，即得充任不動產經紀營業員","領有不動產經紀人考試及格證書者，即得充任不動產經紀營業員","取得不動產經紀營業員資格訓練不得少於二十個小時，其證明有效期限為四年","不動產經紀營業員證明因受破產之宣告尚未復權而被撤銷者，於原因消滅後，得重新請領證明"],"answer":"D","explain":"訓練合格或考試及格都還要登錄領證；訓練 30 小時；破產被撤銷，原因消滅後可重新請領","laws":[]},{"id":"jjf-110-11","subject":"經紀法","year":110,"no":11,"topic":"換證（細則 §17）","stem":"有關不動產經紀人請領或換發、補發證書之相關規定，下列敘述何者正確？","options":["不動產經紀人考試及格後，並領取其考試及格證書，即得請領不動產經紀人證書","不動產經紀人辦理換發證書時，應於證書有效期限屆滿前六個月內申辦之","不動產經紀人換發之證書，其有效期限自原證書有效期限屆滿之日起算四年","不動產經紀人證書滅失、申請補發者，應敘明其滅失之原因，向中央機關申請之"],"answer":"B","explain":"屆滿前 6 個月內申辦；新證自原證屆滿次日起算 4 年；向原核發機關申請（不是中央）","laws":[{"ref":"不動產經紀業管理條例施行細則 §17","text":"經紀人依本條例第十五條第一項規定辦理換發證書時，應於證書有效期限屆滿前六個月內，檢附下列文件，向原核發機關申請之：\n一、申請書。\n二、完成專業訓練三十個小時以上之證明文件。\n三、原核發之經紀人證書。\n直轄市或縣（市）主管機關受理前項申請，經審查合於規定者，應即換發證書；不合規定者，應通知其於十五日內補正，屆期未補正者，駁回其申請，並退還前項第二款及第三款文件。\n換發之證書，其有效期限自原證書有效期限屆滿之次日起算四年。\n換發證書，得以於原證書加註延長有效期限之方式為之。"}]},{"id":"jjf-110-13","subject":"經紀法","year":110,"no":13,"topic":"廣告不符誰處理","stem":"不動產經紀業者與委託人簽訂委託契約後，刊登之廣告及銷售內容與事實不符者，應由何機關依法處理？","options":["由直轄市、縣（市）政府依公平交易法處理","由行政院依消費者保護法處理","由行政院公平交易委員會依公平交易法處理","由內政部依不動產經紀業管理條例處理"],"answer":"D","explain":"簽委託契約後刊登的廣告與事實不符→內政部依經紀條例處理（與 112-15 同觀念）","laws":[]},{"id":"jjf-110-14","subject":"經紀法","year":110,"no":14,"topic":"調解方案異議 §45-3","stem":"消費爭議調解委員會於不違反消費爭議兩造當事人之主要意思範圍內，依職權所提出解決事件之方案，當事人得於該方案送達後幾日內，提出異議，就視為調解不成立？","options":["10 日","15 日","20 日","30 日"],"answer":"A","explain":"送達後 10 日內","laws":[{"ref":"消費者保護法 §45-3","text":"當事人對於前條所定之方案，得於送達後十日之不變期間內，提出異議。\n於前項期間內提出異議者，視為調解不成立；其未於前項期間內提出異議者，視為已依該方案成立調解。\n第一項之異議，消費爭議調解委員會應通知他方當事人。"}]},{"id":"jjf-110-16","subject":"經紀法","year":110,"no":16,"topic":"通訊訪問交易 §19、§19-2","stem":"依消費者保護法規定，下列有關通訊交易或訪問交易之消費者解除契約之敘述，何者正確？","options":["消費者得於收受商品或接受服務後十日內，以退回商品或書面通知方式解除契約，無須說明理由及負擔任何費用","訪問交易有合理例外情事者，不適用消費者保護法之猶豫期間及解約權規定","消費者依規定以書面通知解除契約者，除當事人另有個別磋商外，企業經營者應於收到通知之次日起十五日內，至原交付處所或約定處所取回商品","企業經營者應於取回商品、收到消費者退回商品或解除服務契約通知之日起十五日內，返還消費者已支付之對價"],"answer":"C","explain":"7 日內解約（不是 10 日）；合理例外只限通訊交易；取回、返還都是「次日」起 15 日","laws":[{"ref":"消費者保護法 §19","text":"通訊交易或訪問交易之消費者，得於收受商品或接受服務後七日內，以退回商品或書面通知方式解除契約，無須說明理由及負擔任何費用或對價。但通訊交易有合理例外情事者，不在此限。\n前項但書合理例外情事，由行政院定之。\n企業經營者於消費者收受商品或接受服務時，未依前條第一項第三款規定提供消費者解除契約相關資訊者，第一項七日期間自提供之次日起算。但自第一項七日期間起算，已逾四個月者，解除權消滅。\n消費者於第一項及第三項所定期間內，已交運商品或發出書面者，契約視為解除。\n通訊交易或訪問交易違反本條規定所為之約定，其約定無效。"},{"ref":"消費者保護法 §19-2","text":"消費者依第十九條第一項或第三項規定，以書面通知解除契約者，除當事人另有個別磋商外，企業經營者應於收到通知之次日起十五日內，至原交付處所或約定處所取回商品。\n企業經營者應於取回商品、收到消費者退回商品或解除服務契約通知之次日起十五日內，返還消費者已支付之對價。\n契約經解除後，企業經營者與消費者間關於回復原狀之約定，對於消費者較民法第二百五十九條之規定不利者，無效。"}]},{"id":"jjf-110-19","subject":"經紀法","year":110,"no":19,"topic":"小額消費爭議 §45-4","stem":"依消費者保護法規定，關於小額消費爭議之調解，當事人之一方無正當理由，不於調解期日到場之處理方式為何？","options":["調解委員得斟酌一切情形，求兩造利益之平衡，於不違反兩造當事人之主要意思範圍內，依職權提出解決事件之方案，並送達於當事人。前項方案，應經參與調解委員過半數之同意","調解委員得斟酌一切情形，求兩造利益之平衡，於不違反兩造當事人之主要意思範圍內，依職權提出解決事件之方案，並送達於當事人。前項方案，應經全體調解委員過半數之同意","調解委員得審酌情形，依到場當事人一造之請求或依職權提出解決方案，並送達於當事人。前項方案，應經參與調解委員過半數之同意","調解委員得審酌情形，依到場當事人一造之請求或依職權提出解決方案，並送達於當事人。前項方案，應經全體調解委員過半數之同意"],"answer":"D","explain":"依到場一造請求或依職權提方案，經全體調解委員過半數","laws":[{"ref":"消費者保護法 §45-4","text":"關於小額消費爭議，當事人之一方無正當理由，不於調解期日到場者，調解委員得審酌情形，依到場當事人一造之請求或依職權提出解決方案，並送達於當事人。\n前項之方案，應經全體調解委員過半數之同意，並記載第四十五條之五所定異議期間及未於法定期間提出異議之法律效果。\n第一項之送達，不適用公示送達之規定。\n第一項小額消費爭議之額度，由行政院定之。"}]},{"id":"jjf-110-20","subject":"經紀法","year":110,"no":20,"topic":"公平法適用","stem":"下列何者屬於公平交易法之適用範圍？","options":["依照著作權法、商標法、專利法或其他智慧財產權法規行使權利之正當行為","不動產仲介業與不動產買方有關斡旋金返還之糾紛處理","不動產開發業者銷售預售屋時要求購屋人須給付定金始提供預售屋買賣契約書攜回審閱之情形","不動產經紀業加盟店未於廣告中標明加盟店或加盟經營字樣之處理"],"answer":"C","explain":"預售屋要求付定金才給契約審閱→§25；斡旋金返還糾紛是民事；加盟標示歸經紀條例；智財權正當行使排除適用","laws":[{"ref":"公平交易法 §25","text":"除本法另有規定者外，事業亦不得為其他足以影響交易秩序之欺罔或顯失公平之行為。"}]},{"id":"jjf-110-21","subject":"經紀法","year":110,"no":21,"topic":"聯合行為 §15","stem":"下列有關公平交易法對於事業聯合行為規定之敘述，何者錯誤？","options":["主管機關對事業聯合行為原則上是採限制原則","主管機關對事業聯合行為有益於整體經濟與公共利益時得例外許可","主管機關對事業聯合行為之許可事項得附加條件","主管機關對事業聯合行為許可事項及其有關之條件、負擔、期限，應主動公開"],"answer":"A","explain":"原則禁止（不是限制）、例外許可；可附條件、主動公開","laws":[{"ref":"公平交易法 §15","text":"事業不得為聯合行為。但有下列情形之一，而有益於整體經濟與公共利益，經申請主管機關許可者，不在此限：\n一、為降低成本、改良品質或增進效率，而統一商品或服務之規格或型式。\n二、為提高技術、改良品質、降低成本或增進效率，而共同研究開發商品、服務或市場。\n三、為促進事業合理經營，而分別作專業發展。\n四、為確保或促進輸出，而專就國外市場之競爭予以約定。\n五、為加強貿易效能，而就國外商品或服務之輸入採取共同行為。\n六、因經濟不景氣，致同一行業之事業難以繼續維持或生產過剩，為有計畫適應需求而限制產銷數量、設備或價格之共同行為。\n七、為增進中小企業之經營效率，或加強其競爭能力所為之共同行為。\n八、其他為促進產業發展、技術創新或經營效率所必要之共同行為。\n主管機關收受前項之申請，應於三個月內為決定；必要時得延長一次。"}]},{"id":"jjf-110-23","subject":"經紀法","year":110,"no":23,"topic":"§22 II","stem":"經營代銷業務者，依不動產經紀業管理條例之規定，應指派不動產經紀人簽章之文件，下列何者錯誤？","options":["不動產廣告稿","不動產出租、出售委託契約書","不動產租賃、買賣契約書","不動產說明書"],"answer":"B","explain":"代銷不適用委託契約書、要約書","laws":[{"ref":"不動產經紀業管理條例 §22","text":"不動產之買賣、互易、租賃或代理銷售，如委由經紀業仲介或代銷者，下列文件應由經紀業指派經紀人簽章：\n一、不動產出租、出售委託契約書。\n二、不動產承租、承購要約書。\n三、定金收據。\n四、不動產廣告稿。\n五、不動產說明書。\n六、不動產租賃、買賣契約書。\n前項第一款及第二款之規定，於經營代銷業務者不適用之。\n第一項第五款之不動產說明書應記載及不得記載事項，由中央主管機關定之。"}]},{"id":"jjf-111-02","subject":"經紀法","year":111,"no":2,"topic":"經紀人員資格","stem":"不動產經紀業管理條例對不動產經紀人員之規定，下列敘述何者正確？","options":["經不動產經紀人考試及格者，應具備半年以上經紀營業員經驗，始得向直轄市或縣（市）政府請領經紀人證書","經紀人證書有效期限為三年","經紀營業員訓練不得少於三十個小時","未具備經紀人員資格者，於簽訂專任約後，經紀業得僱用其從事仲介或代銷業務"],"answer":"C","explain":"營業員訓練 ≥ 30 小時（正確）；經紀人要 1 年經驗（不是半年）、證書有效 4 年；未具資格者簽專任約也不能僱用（§17）","laws":[{"ref":"不動產經紀業管理條例 §17","text":"經紀業不得僱用未具備經紀人員資格者從事仲介或代銷業務。"}]},{"id":"jjf-111-05","subject":"經紀法","year":111,"no":5,"topic":"獎懲委員會","stem":"依不動產經紀業管理條例關於獎懲之規定，下列敘述何者錯誤？","options":["非經紀業而經營仲介或代銷業務者，主管機關應禁止其營業，並處公司負責人、商號負責人或行為人罰鍰","經紀業開始營業後自行停止營業連續六個月以上者，直轄市或縣（市）主管機關得廢止其許可","中央主管機關對於經紀人員獎懲事項，應設置獎懲委員會處理之","依本條例所處罰鍰，經通知繳納而逾期不繳納者，移送法院強制執行"],"answer":"C","explain":"由直轄市、縣市主管機關設置（§33 II），中央只定組織","laws":[{"ref":"不動產經紀業管理條例 §33","text":"經紀人員有第三十一條第一項各款情事之一時，利害關係人、各級主管機關或其同業公會得列舉事實，提出證據，報請直轄市或縣（市）主管機關交付懲戒。\n直轄市或縣（市）主管機關對於經紀人員獎懲事項，應設置獎懲委員會處理之。\n前項獎懲委員會之組織，由中央主管機關定之。"}]},{"id":"jjf-111-07","subject":"經紀法","year":111,"no":7,"topic":"結合申報 §11","stem":"公平交易法關於結合之規定，下列敘述何者錯誤？","options":["直接或間接控制他事業之業務經營或人事任免屬於結合之一種","事業因結合而使其市場占有率達四分之一應先向主管機關提出申報","對於事業結合之申報，如其結合，對整體經濟利益大於限制競爭之不利益者，主管機關不得禁止其結合","主管機關就事業結合之申報，得徵詢外界意見，必要時得委請學術研究機構提供產業經濟分析意見"],"answer":"B","explain":"結合後市占 1/3、或參與結合的一事業市占 1/4；題目寫「因結合而使市占達 1/4」錯","laws":[{"ref":"公平交易法 §11","text":"事業結合時，有下列情形之一者，應先向主管機關提出申報：\n一、事業因結合而使其市場占有率達三分之一。\n二、參與結合之一事業，其市場占有率達四分之一。\n三、參與結合之事業，其上一會計年度銷售金額，超過主管機關所公告之金額。\n前項第三款之銷售金額，應將與參與結合之事業具有控制與從屬關係之事業及與參與結合之事業受同一事業或數事業控制之從屬關係事業之銷售金額一併計入，其計算方法由主管機關公告之。\n對事業具有控制性持股之人或團體，視為本法有關結合規定之事業。\n前項所稱控制性持股，指前項之人或團體及其關係人持有他事業有表決權之股份或出資額，超過他事業已發行有表決權之股份總數或資本總額半數者。\n前項所稱關係人，其範圍如下：\n一、同一自然人與其配偶及二親等以內血親。\n二、前款之人持有已發行有表決權股份總數或資本總額超過半數之事業。\n三、第一款之人擔任董事長、總經理或過半數董事之事業。\n四、同一團體與其代表人、管理人或其他有代表權之人及其配偶與二親等以內血親。\n五、同一團體及前款之自然人持有已發行有表決權股份總數或資本總額超過半數之事業。\n第一項第三款之銷售金額，得由主管機關擇定行業分別公告之。\n事業自主管機關受理其提出完整申報資料之日起算三十工作日內，不得為結合。但主管機關認為必要時，得將該期間縮短或延長，並以書面通知申報事業。\n主管機關依前項但書延長之期間，不得逾六十工作日；對於延長期間之申報案件，應依第十三條規定作成決定。\n主管機關屆期未為第七項但書之延長通知或前項之決定者，事業得逕行結合。但有下列情形之一者，不得逕行結合：\n一、經申報之事業同意再延長期間。\n二、事業之申報事項有虛偽不實。\n主管機關就事業結合之申報，得徵詢外界意見，必要時得委請學術研究機構提供產業經濟分析意見。但參與結合事業之一方不同意結合者，主管機關應提供申報結合事業之申報事由予該事業，並徵詢其意見。\n前項但書之申報案件，主管機關應依第十三條規定作成決定。"}]},{"id":"jjf-111-12","subject":"經紀法","year":111,"no":12,"topic":"審閱期 §11-1","stem":"甲建商與乙消費者訂立預售屋定型化契約前，並沒有給合理期間供乙審閱全部條款內容，依消費者保護法之規定，乙可以如何主張權利？","options":["要求甲建商回收該批商品或停止其服務","主張甲建商應負損害賠償責任","主張除去其危害","主張其條款不構成契約之內容。但乙得主張該條款仍構成契約之內容"],"answer":"D","explain":"沒給合理審閱期→條款不構成契約內容，但消費者得主張仍構成","laws":[{"ref":"消費者保護法 §11-1","text":"企業經營者與消費者訂立定型化契約前，應有三十日以內之合理期間，供消費者審閱全部條款內容。\n企業經營者以定型化契約條款使消費者拋棄前項權利者，無效。\n違反第一項規定者，其條款不構成契約之內容。但消費者得主張該條款仍構成契約之內容。\n中央主管機關得選擇特定行業，參酌定型化契約條款之重要性、涉及事項之多寡及複雜程度等事項，公告定型化契約之審閱期間。"}]},{"id":"jjf-111-15","subject":"經紀法","year":111,"no":15,"topic":"申訴 §43","stem":"企業經營者對於消費者之申訴，依消費者保護法規定，應於申訴之日起，至多幾日內妥適處理之？","options":["七日","十日","十五日","三十日"],"answer":"C","explain":"企業經營者應於申訴之日起 15 日內妥適處理","laws":[{"ref":"消費者保護法 §43","text":"消費者與企業經營者因商品或服務發生消費爭議時，消費者得向企業經營者、消費者保護團體或消費者服務中心或其分中心申訴。\n企業經營者對於消費者之申訴，應於申訴之日起十五日內妥適處理之。\n消費者依第一項申訴，未獲妥適處理時，得向直轄市、縣（市）政府消費者保護官申訴。"}]},{"id":"jjf-111-17","subject":"經紀法","year":111,"no":17,"topic":"公寓 §3 定義","stem":"依公寓大廈管理條例之規定，下列之定義何者正確？","options":["約定專用部分：指公寓大廈專有部分經約定供共同使用者","管理負責人：指由區分所有權人會議決議執行建築物管理維護事務之公寓大廈管理服務人員或管理維護公司","專有部分：指數人區分一建築物而各有其專有部分，並就其共用部分按其應有部分有所有權","公寓大廈：指構造上或使用上或在建築執照設計圖樣標有明確界線，得區分為數部分之建築物及其基地"],"answer":"D","explain":"公寓大廈定義正確；A 是約定共用的定義、B 是管理服務人、C 是區分所有的定義","laws":[{"ref":"公寓大廈管理條例 §3","text":"本條例用辭定義如下：\n一、公寓大廈：指構造上或使用上或在建築執照設計圖樣標有明確界線，得區分為數部分之建築物及其基地。\n二、區分所有：指數人區分一建築物而各有其專有部分，並就其共用部分按其應有部分有所有權。\n三、專有部分：指公寓大廈之一部分，具有使用上之獨立性，且為區分所有之標的者。\n四、共用部分：指公寓大廈專有部分以外之其他部分及不屬專有之附屬建築物，而供共同使用者。\n五、約定專用部分：公寓大廈共用部分經約定供特定區分所有權人使用者。\n六、約定共用部分：指公寓大廈專有部分經約定供共同使用者。\n七、區分所有權人會議：指區分所有權人為共同事務及涉及權利義務之有關事項，召集全體區分所有權人所舉行之會議。\n八、住戶：指公寓大廈之區分所有權人、承租人或其他經區分所有權人同意而為專有部分之使用者或業經取得停車空間建築物所有權者。\n九、管理委員會：指為執行區分所有權人會議決議事項及公寓大廈管理維護工作，由區分所有權人選任住戶若干人為管理委員所設立之組織。\n十、管理負責人：指未成立管理委員會，由區分所有權人推選住戶一人或依第二十八條第三項、第二十九條第六項規定為負責管理公寓大廈事務者。\n十一、管理服務人：指由區分所有權人會議決議或管理負責人或管理委員會僱傭或委任而執行建築物管理維護事務之公寓大廈管理服務人員或管理維護公司。\n十二、規約：公寓大廈區分所有權人為增進共同利益，確保良好生活環境，經區分所有權人會議決議之共同遵守事項。"}]},{"id":"jjf-111-20","subject":"經紀法","year":111,"no":20,"topic":"規約 §23 II","stem":"規約除應載明專有部分及共用部分範圍外，有特定之情形，非經載明於規約者，不生效力。下列敘述何者非屬之？","options":["違反義務之處理方式","禁止住戶飼養動物之特別約定","財務運作之監督規定","他住戶因維護、修繕專有部分，必須進入或使用其專有部分或約定專用部分時，不得拒絕"],"answer":"D","explain":"他住戶修繕要進入專有部分不得拒絕→是法定義務（§6），不是規約非載明不生效力事項","laws":[{"ref":"公寓大廈管理條例 §23","text":"有關公寓大廈、基地或附屬設施之管理使用及其他住戶間相互關係，除法令另有規定外，得以規約定之。\n規約除應載明專有部分及共用部分範圍外，下列各款事項，非經載明於規約者，不生效力：\n一、約定專用部分、約定共用部分之範圍及使用主體。\n二、各區分所有權人對建築物共用部分及其基地之使用收益權及住戶對共用部分使用之特別約定。\n三、禁止住戶飼養動物之特別約定。\n四、違反義務之處理方式。\n五、財務運作之監督規定。\n六、區分所有權人會議決議有出席及同意之區分所有權人人數及其區分所有權比例之特別約定。\n七、糾紛之協調程序。"},{"ref":"公寓大廈管理條例 §6","text":"住戶應遵守下列事項：\n一、於維護、修繕專有部分、約定專用部分或行使其權利時，不得妨害其他住戶之安寧、安全及衛生。\n二、他住戶因維護、修繕專有部分、約定專用部分或設置管線，必須進入或使用其專有部分或約定專用部分時，不得拒絕。\n三、管理負責人或管理委員會因維護、修繕共用部分或設置管線，必須進入或使用其專有部分或約定專用部分時，不得拒絕。\n四、於維護、修繕專有部分、約定專用部分或設置管線，必須使用共用部分時，應經管理負責人或管理委員會之同意後為之。\n五、其他法令或規約規定事項。\n前項第二款至第四款之進入或使用，應擇其損害最少之處所及方法為之，並應修復或補償所生損害。\n住戶違反第一項規定，經協調仍不履行時，住戶、管理負責人或管理委員會得按其性質請求各該主管機關或訴請法院為必要之處置。"}]},{"id":"jjf-111-25","subject":"經紀法","year":111,"no":25,"topic":"§21 I 罰鍰","stem":"經紀業尚未與委託人簽訂委託契約書便刊登廣告及銷售時，依規定由直轄市、縣（市）主管機關處多少罰鍰？","options":["新臺幣六千元以上三萬元以下罰鍰","新臺幣一萬元以上五萬元以下罰鍰","新臺幣三萬元以上十五萬元以下罰鍰","新臺幣六萬元以上三十萬元以下罰鍰"],"answer":"D","explain":"未簽委託契約書就刊廣告銷售→§29 I①，6～30 萬","laws":[{"ref":"不動產經紀業管理條例 §21","text":"經紀業與委託人簽訂委託契約書後，方得刊登廣告及銷售。\n前項廣告及銷售內容，應與事實相符，並註明經紀業名稱。\n廣告及銷售內容與事實不符者，應負損害賠償責任。"},{"ref":"不動產經紀業管理條例 §29","text":"經紀業違反本條例者，依下列規定處罰之：\n一、違反第七條第六項、第十一條、第十七條、第十九條第一項、第二十一條第一項、第二項或第二十二條第一項規定，由直轄市、縣（市）主管機關處新臺幣六萬元以上三十萬元以下罰鍰。\n二、違反第二十四條之一第二項規定，未依限申報登錄資訊或申報登錄價格、交易面積資訊不實，由直轄市、縣（市）主管機關按戶（棟）處新臺幣三萬元以上十五萬元以下罰鍰，並令其限期改正；屆期未改正者，按次處罰。經處罰二次仍未改正者，按次處新臺幣三十萬元以上一百萬元以下罰鍰。\n三、違反第二十四條之一第二項規定，未依限將委託代銷契約相關書件報備查，或違反第二十四條之一第六項規定，規避、妨礙或拒絕查核，或違反第二十四條之二規定，由主管機關處新臺幣三萬元以上十五萬元以下罰鍰。\n四、違反第十二條、第十八條、第二十條或第二十七條規定，直轄市、縣（市）主管機關應令其限期改正；屆期未改正，處新臺幣三萬元以上十五萬元以下罰鍰。\n五、違反第二十四條之一第一項規定，未依限申報登錄資訊、申報登錄租金或面積資訊不實，由直轄市、縣（市）主管機關處新臺幣一萬元以上五萬元以下罰鍰。\n六、違反第二十四條之一第一項或第二項規定，申報登錄租金、價格及面積以外資訊不實，直轄市、縣（市）主管機關應令其限期改正；屆期未改正，處新臺幣六千元以上三萬元以下罰鍰。\n七、違反第七條第三項、第四項或第八條第四項規定，直轄市、縣（市）主管機關應予停止營業處分，其期間至補足營業保證金為止。但停止營業期間達一年者，應廢止其許可。\n經紀業經依前項第一款、第三款至第六款處罰鍰者，主管機關並應令其限期改正；屆期未改正者，按次處罰。\n金融機構、交易當事人違反第二十四條之一第六項規定，規避、妨礙或拒絕查核者，由主管機關處新臺幣三萬元以上十五萬元以下罰鍰，並令其限期改正；屆期未改正者，按次處罰。"}]},{"id":"jjf-112-01","subject":"經紀法","year":112,"no":1,"topic":"營業保證金","stem":"有關不動產經紀業營業保證金之敘述，下列何者錯誤？","options":["營業保證金由中華民國不動產仲介經紀業或代銷經紀業同業公會全國聯合會統一於指定之金融機構設置營業保證基金專戶儲存","經紀業未依規定繳存營業保證金者，應予停止營業處分，其停止營業期間達一年者，應撤銷其許可","營業保證金獨立於經紀業及經紀人員之外，除不動產經紀業管理條例另有規定外，不因經紀業或經紀人員之債務債權關係而為讓與、扣押、抵銷或設定負擔","經紀業申請解散者，得自核准註銷營業之日滿一年後二年內，請求退還原繳存之營業保證金"],"answer":"B","explain":"停業滿 1 年應「廢止」許可，題目寫「撤銷」所以錯（§29 I 第 7 款）","laws":[{"ref":"不動產經紀業管理條例 §29","text":"經紀業違反本條例者，依下列規定處罰之：\n一、違反第七條第六項、第十一條、第十七條、第十九條第一項、第二十一條第一項、第二項或第二十二條第一項規定，由直轄市、縣（市）主管機關處新臺幣六萬元以上三十萬元以下罰鍰。\n二、違反第二十四條之一第二項規定，未依限申報登錄資訊或申報登錄價格、交易面積資訊不實，由直轄市、縣（市）主管機關按戶（棟）處新臺幣三萬元以上十五萬元以下罰鍰，並令其限期改正；屆期未改正者，按次處罰。經處罰二次仍未改正者，按次處新臺幣三十萬元以上一百萬元以下罰鍰。\n三、違反第二十四條之一第二項規定，未依限將委託代銷契約相關書件報備查，或違反第二十四條之一第六項規定，規避、妨礙或拒絕查核，或違反第二十四條之二規定，由主管機關處新臺幣三萬元以上十五萬元以下罰鍰。\n四、違反第十二條、第十八條、第二十條或第二十七條規定，直轄市、縣（市）主管機關應令其限期改正；屆期未改正，處新臺幣三萬元以上十五萬元以下罰鍰。\n五、違反第二十四條之一第一項規定，未依限申報登錄資訊、申報登錄租金或面積資訊不實，由直轄市、縣（市）主管機關處新臺幣一萬元以上五萬元以下罰鍰。\n六、違反第二十四條之一第一項或第二項規定，申報登錄租金、價格及面積以外資訊不實，直轄市、縣（市）主管機關應令其限期改正；屆期未改正，處新臺幣六千元以上三萬元以下罰鍰。\n七、違反第七條第三項、第四項或第八條第四項規定，直轄市、縣（市）主管機關應予停止營業處分，其期間至補足營業保證金為止。但停止營業期間達一年者，應廢止其許可。\n經紀業經依前項第一款、第三款至第六款處罰鍰者，主管機關並應令其限期改正；屆期未改正者，按次處罰。\n金融機構、交易當事人違反第二十四條之一第六項規定，規避、妨礙或拒絕查核者，由主管機關處新臺幣三萬元以上十五萬元以下罰鍰，並令其限期改正；屆期未改正者，按次處罰。"}]},{"id":"jjf-112-02","subject":"經紀法","year":112,"no":2,"topic":"外國人任職","stem":"有關外國人任職不動產經紀業之規定，下列何者正確？","options":["外國人得依中華民國法律參加營業員訓練，經內政部許可後得應不動產經紀人考試","經內政部許可後，始得受僱於經紀業為經紀人員；如為大陸地區人民，尚須經大陸委員會許可","經內政部或其認可之機構、團體舉辦不動產經紀營業員訓練合格或不動產經紀人考試及格，並向內政部指定之機構、團體登錄及領有不動產經紀營業員證明者，得充任不動產經紀營業員","外國人經許可在中華民國充任經紀人員者，其有關業務上所為之文件、圖說，可不限以中華民國文字為之"],"answer":"C","explain":"外國人可直接依法應考或參訓（不用先許可）；許可後才能受僱；業務文件應用中文（§38）","laws":[{"ref":"不動產經紀業管理條例 §38","text":"外國人得依中華民國法律應不動產經紀人考試或參加營業員訓練。\n前項領有及格證書或訓練合格並依第十三條第二項登錄及領有證明之外國人，應經中央主管機關許可，並遵守中華民國一切法令，始得受僱於經紀業為經紀人員。\n外國人經許可在中華民國充任經紀人員者，其有關業務上所為之文件、圖說，應以中華民國文字為之。"}]},{"id":"jjf-112-05","subject":"經紀法","year":112,"no":5,"topic":"§24-1 實價登錄","stem":"根據不動產經紀業管理條例第24 條之1 之現行規定，下列何者正確？","options":["中華民國一百零九年十二月三十日修正之條文施行前，提供查詢之申報登錄資訊，於修正施行後，維持以區段化、去識別化方式，提供查詢","中華民國一百零九年十二月三十日修正之條文施行前，提供查詢之申報登錄資訊，於修正施行後，應依同條第三項規定，除涉及個人資料外，重新提供查詢","經營代銷業務，受起造人或建築業委託代銷預售屋者，應於簽訂買賣契約之日起三十日內，將委託代銷契約及買賣契約相關書件報請所在地直轄市、縣（市）主管機關備查","經營仲介業務者，對於居間或代理成交之租賃案件，應於租賃物交付後，承租人占有中之日起三十日內，向直轄市、縣（市）主管機關申報登錄成交案件實際資訊"],"answer":"B","explain":"109 年修法前區段化提供的資料，修法後應重新提供查詢；代銷 30 日是從「簽訂委託代銷契約」起報備查；租賃從「簽訂租約」起 30 日","laws":[{"ref":"不動產經紀業管理條例 §24-1","text":"經營仲介業務者，對於居間或代理成交之租賃案件，應於簽訂租賃契約書之日起三十日內，向直轄市、縣（市）主管機關申報登錄成交案件實際資訊（以下簡稱申報登錄資訊）。\n經營代銷業務，受起造人或建築業委託代銷預售屋者，應於簽訂、變更或終止委託代銷契約之日起三十日內，將委託代銷契約相關書件報請所在地直轄市、縣（市）主管機關備查；並應於簽訂買賣契約書之日起三十日內，向直轄市、縣（市）主管機關申報登錄資訊。\n前二項申報登錄資訊，除涉及個人資料外，得提供查詢。\n已登錄之不動產交易價格資訊，在相關配套措施完全建立並完成立法後，始得為課稅依據。\n第一項、第二項申報登錄資訊類別、內容與第三項提供之內容、方式、收費費額及其他應遵行事項之辦法，由中央主管機關定之。\n直轄市、縣（市）主管機關為查核申報登錄資訊，得向交易當事人或不動產經紀業要求查詢、取閱有關文件或提出說明；中央主管機關為查核疑有不實之申報登錄價格資訊，得向相關機關或金融機構查詢、取閱價格資訊有關文件。受查核者不得規避、妨礙或拒絕。\n前項查核，不得逾確保申報登錄資訊正確性目的之必要範圍。\n第一項、第二項受理及第六項查核申報登錄資訊，直轄市、縣（市）主管機關得委任所屬機關辦理。\n本條例中華民國一百零九年十二月三十日修正之條文施行前，以區段化、去識別化方式提供查詢之申報登錄資訊，於修正施行後，應依第三項規定重新提供查詢。"}]},{"id":"jjf-112-06","subject":"經紀法","year":112,"no":6,"topic":"§4 用辭定義","stem":"不動產經紀業管理條例之「用辭定義」，下列何者正確？","options":["不動產︰指土地、土地定著物或房屋及其可移轉之權利","成屋︰指領有建造執照之建築物","經紀人員︰經紀營業員之職務為執行仲介或代銷業務","營業處所︰指經紀業經營仲介或代銷業務之店面、辦公室或常態之非固定場所"],"answer":"A","explain":"成屋＝使用執照；營業員是「協助」經紀人；營業處所是「非常態之固定場所」","laws":[{"ref":"不動產經紀業管理條例 §4","text":"本條例用辭定義如下︰\n一、不動產︰指土地、土地定著物或房屋及其可移轉之權利；房屋指成屋、預售屋及其可移轉之權利。\n二、成屋︰指領有使用執照，或於實施建築管理前建造完成之建築物。\n三、預售屋︰指領有建造執照尚未建造完成而以將來完成之建築物為交易標的之物。\n四、經紀業︰指依本條例規定經營仲介或代銷業務之公司或商號。\n五、仲介業務︰指從事不動產買賣、互易、租賃之居間或代理業務。\n六、代銷業務︰指受起造人或建築業之委託，負責企劃並代理銷售不動產之業務。\n七、經紀人員︰指經紀人或經紀營業員。經紀人之職務為執行仲介或代銷業務；經紀營業員之職務為協助經紀人執行仲介或代銷業務。\n八、加盟經營者︰經紀業之一方以契約約定使用他方所發展之服務、營運方式、商標或服務標章等，並受其規範或監督。\n九、差價︰係指實際買賣交易價格與委託銷售價格之差額。\n十、營業處所︰指經紀業經營仲介或代銷業務之店面、辦公室或非常態之固定場所。"}]},{"id":"jjf-112-07","subject":"經紀法","year":112,"no":7,"topic":"公會入退會","stem":"依據不動產經紀業管理條例之規定，直轄市、縣（市）同業公會關於會員入會、停權、退會情形應如何處理？","options":["報請所在地主管機關核定","報請所在地主管機關備查","報請所在地主管機關層轉中央主管機關核定","報請所在地主管機關層轉中央主管機關備查"],"answer":"D","explain":"報所在地主管機關層轉中央備查（§10）","laws":[{"ref":"不動產經紀業管理條例 §10","text":"直轄市、縣（市）同業公會應將會員入會、停權、退會情形報請所在地主管機關層轉中央主管機關備查。"}]},{"id":"jjf-112-08","subject":"經紀法","year":112,"no":8,"topic":"防墜設施","stem":"有關公寓大廈周圍上下、外牆面設置防墜設施之規定，下列何者錯誤？","options":["須公寓大廈有十二歲以下兒童或六十歲以上老人之住戶","須於外牆開口部或陽臺設置","防墜設施須不妨礙逃生且不突出外牆面","防墜設施設置後，設置理由消失且不符公寓大廈管理條例之限制者，區分所有權人應予改善或回復原狀"],"answer":"A","explain":"12 歲以下兒童或 65 歲以上老人，題目寫 60 歲（筆記有標這個誘答）","laws":[]},{"id":"jjf-112-09","subject":"經紀法","year":112,"no":9,"topic":"管委會職務 §36","stem":"依公寓大廈管理條例之規定，有關公寓大廈管理委員會職務之敘述，下列何者正確？","options":["住戶大會決議事項之執行","住戶違規情事之制止及相關資料之提供","共有及共用部分之清潔、維護、重大修繕及改良","住戶共同事務應興革事項之決定與管理"],"answer":"B","explain":"「住戶違規之制止及資料提供」正確；其他錯在：區權會（非住戶大會）決議之執行、一般改良（非重大修繕）、興革事項是「建議」不是「決定」","laws":[{"ref":"公寓大廈管理條例 §36","text":"管理委員會之職務如下：\n一、區分所有權人會議決議事項之執行。\n二、共有及共用部分之清潔、維護、修繕及一般改良。\n三、公寓大廈及其周圍之安全及環境維護事項。\n四、住戶共同事務應興革事項之建議。\n五、住戶違規情事之制止及相關資料之提供。\n六、住戶違反第六條第一項規定之協調。\n七、收益、公共基金及其他經費之收支、保管及運用。\n八、規約、會議紀錄、使用執照謄本、竣工圖說、水電、消防、機械設施、管線圖說、會計憑證、會計帳簿、財務報表、公共安全檢查及消防安全設備檢修之申報文件、印鑑及有關文件之保管。\n九、管理服務人之委任、僱傭及監督。\n十、會計報告、結算報告及其他管理事項之提出及公告。\n十一、共用部分、約定共用部分及其附屬設施設備之點收及保管。\n十二、依規定應由管理委員會申報之公共安全檢查與消防安全設備檢修之申報及改善之執行。\n十三、其他依本條例或規約所定事項。"}]},{"id":"jjf-112-10","subject":"經紀法","year":112,"no":10,"topic":"公共基金撥付","stem":"有關公寓大廈公共基金之設置，下列何者錯誤？","options":["起造人就公寓大廈領得使用執照一年內之管理維護事項，應按工程造價一定比例或金額提列","起造人於該公寓大廈使用執照申請時，應提出繳交公庫代收之證明；於公寓大廈召開區分所有權人會議時，由公庫代為撥付","公共基金應設專戶儲存，並由管理負責人或管理委員會負責管理","公共基金經區分所有權人會議決議交付信託者，其運用應依區分所有權人會議之決議為之"],"answer":"B","explain":"起造人申請使照時提公庫代收證明；要等成立管委會並完成點交後才由公庫撥付，不是開區權會時","laws":[]},{"id":"jjf-112-11","subject":"經紀法","year":112,"no":11,"topic":"起造人責任","stem":"依公寓大廈管理條例規定，有關起造人責任之敘述，下列何者錯誤？","options":["就公寓大廈領得使用執照一年內之管理維護事項，起造人應按工程造價一定比例或金額提列公共基金","公寓大廈之起造人，非經領得建造執照，不得辦理銷售","公寓大廈之起造人於申請建造執照時，應檢附專有部分、共用部分、約定專用部分、約定共用部分標示之詳細圖說及規約","起造人應將公寓大廈共用部分、約定共用部分與其附屬設施設備等，確認其功能正常無誤後，移交管理委員會或管理負責人"],"answer":"C","explain":"申請建照時附的是「規約草約」（§56）","laws":[{"ref":"公寓大廈管理條例 §56","text":"公寓大廈之起造人於申請建造執照時，應檢附專有部分、共用部分、約定專用部分、約定共用部分標示之詳細圖說及規約草約。於設計變更時亦同。\n前項規約草約經承受人簽署同意後，於區分所有權人會議訂定規約前，視為規約。\n公寓大廈之起造人或區分所有權人應依使用執照所記載之用途及下列測繪規定，辦理建物所有權第一次登記：\n一、獨立建築物所有權之牆壁，以牆之外緣為界。\n二、建築物共用之牆壁，以牆壁之中心為界。\n三、附屬建物以其外緣為界辦理登記。\n四、有隔牆之共用牆壁，依第二款之規定，無隔牆設置者，以使用執照竣工平面圖區分範圍為界，其面積應包括四周牆壁之厚度。\n第一項共用部分之圖說，應包括設置管理維護使用空間之詳細位置圖說。\n本條例中華民國九十二年十二月九日修正施行前，領得使用執照之公寓大廈，得設置一定規模、高度之管理維護使用空間，並不計入建築面積及總樓地板面積；其免計入建築面積及總樓地板面積之一定規模、高度之管理維護使用空間及設置條件等事項之辦法，由直轄市、縣（市）主管機關定之。"}]},{"id":"jjf-112-13","subject":"經紀法","year":112,"no":13,"topic":"管理維護公司","stem":"關於公寓大廈管理維護公司之執業，下列何者正確？","options":["應經直轄市、縣（市）政府許可及辦理公司登記，並向直轄市、縣（市）政府申領登記證後，始得執業","應經直轄市、縣（市）政府許可及辦理公司登記，並向中央主管機關申領登記證後，始得執業","應經中央主管機關許可及辦理公司登記，並向直轄市、縣（市）政府申領登記證後，始得執業","應經中央主管機關許可及辦理公司登記，並向中央主管機關申領登記證後，始得執業"],"answer":"D","explain":"許可、登記證都向中央主管機關（§41）","laws":[{"ref":"公寓大廈管理條例 §41","text":"公寓大廈管理維護公司應經中央主管機關許可及辦理公司登記，並向中央主管機關申領登記證後，始得執業。"}]},{"id":"jjf-112-15","subject":"經紀法","year":112,"no":15,"topic":"該用哪部法","stem":"下列何者應以公平交易法之規定處理？","options":["不動產經紀業加盟店，未於廣告、市招及名片等明顯處，標明加盟店或加盟經營字樣者","不動產經紀業者對於涉及事業服務品質、企業形象、行銷策略等內容之廣告，有虛偽不實或引人錯誤者","不動產經紀業者與委託人簽訂委託契約後，刊登之廣告及銷售內容與事實不符者","不動產經紀業者未依成屋買賣定型化契約書應記載及不得記載事項製作契約書者"],"answer":"B","explain":"服務品質、企業形象、行銷策略的廣告不實→公平法；加盟標示、廣告與事實不符→經紀條例；定型化契約→消保法／地方政府","laws":[]},{"id":"jjf-112-16","subject":"經紀法","year":112,"no":16,"topic":"限制競爭 vs 不公平競爭","stem":"下列何者屬於限制競爭之行為，事業不得為之？","options":["以著名之他人姓名、商號或公司名稱於同一或類似之商品，為相同或近似之使用，致與他人商品混淆","事業為競爭之目的，而陳述或散布足以損害他人營業信譽之不實情事","事業以不當提供贈品、贈獎之方法，爭取交易之機會","無正當理由，對他事業給予差別待遇之行為"],"answer":"D","explain":"差別待遇（§20）＝限制競爭；仿冒、營業誹謗、不當贈品＝不公平競爭","laws":[{"ref":"公平交易法 §20","text":"有下列各款行為之一，而有限制競爭之虞者，事業不得為之：\n一、以損害特定事業為目的，促使他事業對該特定事業斷絕供給、購買或其他交易之行為。\n二、無正當理由，對他事業給予差別待遇之行為。\n三、以低價利誘或其他不正當方法，阻礙競爭者參與或從事競爭之行為。\n四、以脅迫、利誘或其他不正當方法，使他事業不為價格之競爭、參與結合、聯合或為垂直限制競爭之行為。\n五、以不正當限制交易相對人之事業活動為條件，而與其交易之行為。"}]},{"id":"jjf-112-17","subject":"經紀法","year":112,"no":17,"topic":"聯合行為許可","stem":"關於聯合行為，下列何者正確？","options":["事業不得為聯合行為。但為降低成本、改良品質或增進效率，而統一商品或服務之規格或型式，有益於個別經濟與股東利益，經申請主管機關許可者，不在此限","許可應附期限，其期限不得逾三年","事業對於主管機關就其聯合行為之許可及其有關之條件、負擔、期限，應主動公開","聯合行為經許可後，因經濟情況變更者，主管機關得廢止該許可"],"answer":"D","explain":"經濟情況變更得廢止許可；要件是「整體經濟與公共利益」（非個別經濟與股東利益）；期限 ≤ 5 年；主管機關主動公開","laws":[]},{"id":"jjf-112-18","subject":"經紀法","year":112,"no":18,"topic":"中止調查 §28","stem":"主管機關對於事業涉有違反公平交易法規定之行為進行調查時，下列何者正確？","options":["事業承諾在主管機關所定期限內，採取具體措施停止並改正涉有違法之行為者，主管機關得終止調查","主管機關作成中止調查之決定係基於事業提供不完整或不真實之資訊，應恢復調查","裁處權時效自終止調查之日起，停止進行","主管機關恢復調查者，裁處權時效自恢復調查之翌日起，重新起算"],"answer":"B","explain":"事業提供不實資訊→應恢復調查；用語是「中止」；裁處權時效自中止日起停止，恢復後與先前期間合併計算","laws":[{"ref":"公平交易法 §28","text":"主管機關對於事業涉有違反本法規定之行為進行調查時，事業承諾在主管機關所定期限內，採取具體措施停止並改正涉有違法之行為者，主管機關得中止調查。\n前項情形，主管機關應對事業有無履行其承諾進行監督。\n事業已履行其承諾，採取具體措施停止並改正涉有違法之行為者，主管機關得決定終止該案之調查。但有下列情形之一者，應恢復調查：\n一、事業未履行其承諾。\n二、作成中止調查之決定所依據之事實發生重大變化。\n三、作成中止調查之決定係基於事業提供不完整或不真實之資訊。\n第一項情形，裁處權時效自中止調查之日起，停止進行。主管機關恢復調查者，裁處權時效自恢復調查之翌日起，與停止前已經過之期間一併計算。"}]},{"id":"jjf-112-20","subject":"經紀法","year":112,"no":20,"topic":"媒體連帶責任","stem":"有關消費資訊之規範，依消費者保護法規定，下列何者錯誤？","options":["企業經營者應確保廣告內容之真實，其對消費者所負之義務不得低於廣告之內容","企業經營者之商品或服務廣告內容，於契約成立後，應確實履行","媒體經營者刊登或報導廣告之內容與事實不符者，就消費者因信賴該廣告所受之損害與企業經營者負連帶責任","輸入之商品或服務，應附中文標示及說明書，其內容不得較原產地之標示及說明書簡略"],"answer":"C","explain":"媒體經營者「明知或可得而知」不實才連帶（消保 §23）","laws":[{"ref":"消費者保護法 §23","text":"刊登或報導廣告之媒體經營者明知或可得而知廣告內容與事實不符者，就消費者因信賴該廣告所受之損害與企業經營者負連帶責任。\n前項損害賠償責任，不得預先約定限制或拋棄。"}]},{"id":"jjf-112-21","subject":"經紀法","year":112,"no":21,"topic":"應記載事項 §17","stem":"依消費者保護法規定，有關定型化契約應記載或不得記載事項之規定，下列何者正確？","options":["應公告後報請行政院備查","中央主管機關為預防消費糾紛，保護消費者權益，促進定型化契約之公平化，得選擇特定行業擬訂之","違反公告之定型化契約，其定型化契約條款不構成契約之內容。但消費者得主張該條款仍構成契約之內容","中央主管機關公告應記載之事項，雖未記載於定型化契約，經消費者主張，仍構成契約之內容"],"answer":"B","explain":"中央主管機關選特定行業擬訂，報行政院核定後公告；違反不得記載事項→無效；應記載事項沒寫也自動構成契約內容，不用消費者主張","laws":[{"ref":"消費者保護法 §17","text":"中央主管機關為預防消費糾紛，保護消費者權益，促進定型化契約之公平化，得選擇特定行業，擬訂其定型化契約應記載或不得記載事項，報請行政院核定後公告之。\n前項應記載事項，依契約之性質及目的，其內容得包括：\n一、契約之重要權利義務事項。\n二、違反契約之法律效果。\n三、預付型交易之履約擔保。\n四、契約之解除權、終止權及其法律效果。\n五、其他與契約履行有關之事項。\n第一項不得記載事項，依契約之性質及目的，其內容得包括：\n一、企業經營者保留契約內容或期限之變更權或解釋權。\n二、限制或免除企業經營者之義務或責任。\n三、限制或剝奪消費者行使權利，加重消費者之義務或責任。\n四、其他對消費者顯失公平事項。\n違反第一項公告之定型化契約，其定型化契約條款無效。該定型化契約之效力，依前條規定定之。\n中央主管機關公告應記載之事項，雖未記載於定型化契約，仍構成契約之內容。\n企業經營者使用定型化契約者，主管機關得隨時派員查核。"}]},{"id":"jjf-112-22","subject":"經紀法","year":112,"no":22,"topic":"消保團體訴訟 §49","stem":"消費者保護團體依消費者保護法提起消費者損害賠償訴訟之要件，下列何者正確？","options":["消費者保護團體許可設立三年以上","消費者保護團體申請行政院評定優良者","得委任律師代理訴訟","消費者保護團體不得向消費者請求報酬，但得請求預付或償還必要費用"],"answer":"B","explain":"許可設立 2 年以上、有專門人員、行政院評定優良；應委任律師；律師才能請求預付或償還必要費用","laws":[{"ref":"消費者保護法 §49","text":"消費者保護團體許可設立二年以上，置有消費者保護專門人員，且申請行政院評定優良者，得以自己之名義，提起第五十條消費者損害賠償訴訟或第五十三條不作為訴訟。\n消費者保護團體依前項規定提起訴訟者，應委任律師代理訴訟。受委任之律師，就該訴訟，得請求預付或償還必要費用。\n消費者保護團體關於其提起之第一項訴訟，有不法行為者，許可設立之主管機關應廢止其許可。\n優良消費者保護團體之評定辦法，由行政院定之。"}]},{"id":"jjf-112-23","subject":"經紀法","year":112,"no":23,"topic":"小額消費爭議一造不到","stem":"依消費者保護法之規定，關於小額消費爭議，當事人之一方無正當理由，不於調解期日到場者，下列何者錯誤？","options":["調解委員得審酌情形，依到場當事人一造之請求或依職權提出解決方案，此方案應經參與調解委員過半數之同意","該解決方案之送達，不適用公示送達規定","當事人對該解決方案，得於送達後十日之不變期間內，提出異議；未於異議期間內提出異議者，視為已依該解決方案成立調解","當事人於異議期間提出異議，經調解委員另定調解期日，無正當理由不到場者，視為依該解決方案成立調解"],"answer":"A","explain":"§45-4 方案要經「全體調解委員過半數」同意，題目寫「參與調解委員」所以錯（10-12 已核對條文）；送達不適用公示送達；異議期間 10 日","laws":[{"ref":"消費者保護法 §45-4","text":"關於小額消費爭議，當事人之一方無正當理由，不於調解期日到場者，調解委員得審酌情形，依到場當事人一造之請求或依職權提出解決方案，並送達於當事人。\n前項之方案，應經全體調解委員過半數之同意，並記載第四十五條之五所定異議期間及未於法定期間提出異議之法律效果。\n第一項之送達，不適用公示送達之規定。\n第一項小額消費爭議之額度，由行政院定之。"}]},{"id":"jjf-112-24","subject":"經紀法","year":112,"no":24,"topic":"輸入商品","stem":"關於輸入商品或服務之企業經營者，下列何者錯誤？","options":["視為該商品之設計、生產、製造者或服務之提供者","於提供商品流通進入市場，或提供服務時，應確保該商品或服務，符合當時科技或專業水準可合理期待之安全性","消費者保護團體主張企業經營者不符合當時科技或專業水準可合理期待之安全性者，就其事實應負舉證責任","企業經營者違反相關規定，致生損害於消費者或第三人時，應負連帶賠償責任"],"answer":"C","explain":"主張商品安全的舉證責任在企業經營者（§7-1），不在消保團體","laws":[{"ref":"消費者保護法 §7-1","text":"企業經營者主張其商品於流通進入市場，或其服務於提供時，符合當時科技或專業水準可合理期待之安全性者，就其主張之事實負舉證責任。\n商品或服務不得僅因其後有較佳之商品或服務，而被視為不符合前條第一項之安全性。"}]},{"id":"jjf-112-25","subject":"經紀法","year":112,"no":25,"topic":"消保團體","stem":"關於消費者保護團體，下列何者正確？","options":["消費者保護團體以社團法人、財團法人或行政法人為限","消費者保護團體之任務為監督消費者保護主管機關及指揮消費者保護官行使職權","消費者保護團體從事商品或服務檢驗，發表檢驗結果而有錯誤時，應使相關企業經營者有澄清之機會","消費者保護團體為商品或服務之調查、檢驗時，請求政府予以協助時，政府不應允許"],"answer":"C","explain":"檢驗結果有錯要給業者澄清機會；團體限社團法人或財團法人（沒有行政法人）","laws":[]},{"id":"jjf-113-02","subject":"經紀法","year":113,"no":2,"topic":"經紀人證書","stem":"依不動產經紀業管理條例規定，中華民國國民經不動產經紀人考試及格並領有不動產經紀人證書者，得充不動產經紀人。下列有關不動產經紀人證書之敘述，何者正確？","options":["經不動產經紀人考試及格者，應具備一年以上經紀營業員經驗，始得向考試院考選部請領不動產經紀人證書","不動產經紀人證書有效期限為四年，期滿時，經紀人應檢附其於四年內在中央主管機關認可之機構、團體完成專業訓練二十個小時以上之證明文件，向中央主管機關指定之機構、團體辦理換證","不動產經紀人受申誡處分三次者，應廢止其經紀人證書","不動產經紀人受監護宣告成為無行為能力人，應廢止其經紀人證書"],"answer":"D","explain":"受監護宣告→廢止證書；向直轄市縣市政府請領（非考選部）；換證 30 小時；申誡 3 次→停業處分","laws":[]},{"id":"jjf-113-03","subject":"經紀法","year":113,"no":3,"topic":"懲戒","stem":"經紀人員違反業務規範時，應負之法律責任，下列敘述何者錯誤？","options":["未經所屬經紀業同意為他經紀業執行業務，而為自己或他經紀業執行仲介或代銷業務者，應予以六個月以上三年以下之停止執行業務之懲戒處分","在執行業務過程中，未向與委託人交易之相對人解說不動產說明書之內容者，應予申誡","對於因業務知悉或持有之他人秘密，無故洩漏者，應予申誡","執行業務因故意或過失不法侵害交易當事人致其受有損害者，應與經紀業負連帶賠償責任"],"answer":"A","explain":"違反 §16 專任→申誡，不是停業","laws":[{"ref":"不動產經紀業管理條例 §16","text":"經紀人員應專任一經紀業，並不得為自己或他經紀業執行仲介或代銷業務。但經所屬經紀業同意為他經紀業執行業務者，不在此限。"}]},{"id":"jjf-113-06","subject":"經紀法","year":113,"no":6,"topic":"重建反對者","stem":"某老舊公寓社區因近來地震頻繁嚴重毀損，有危害公共安全之虞。經召開臨時區分所有權人會議，在符合公寓大廈管理條例第30 條及第31 條規定下，決議同意重建。惟甲自始即反對重建，於臨時會議時，亦投下反對票。依公寓大廈管理條例之規定，應如何處理？","options":["因未經全體區分所有權人之同意，該公寓社區不得進行重建","管理負責人或管理委員會得訴請法院命甲出讓其區分所有權及其基地所有權應有部分","管理負責人或管理委員會得訴請法院將甲強制遷離","管理負責人或管理委員會得請求主管機關為必要之處置"],"answer":"B","explain":"管委會可訴請法院命不同意者出讓區分所有權及基地應有部分（公寓 §14）","laws":[{"ref":"公寓大廈管理條例 §14","text":"公寓大廈有前條第二款或第三款所定情形之一，經區分所有權人會議決議重建時，區分所有權人不同意決議又不出讓區分所有權或同意後不依決議履行其義務者，管理負責人或管理委員會得訴請法院命區分所有權人出讓其區分所有權及其基地所有權應有部分。\n前項之受讓人視為同意重建。\n重建之建造執照之申請，其名義以區分所有權人會議之決議為之。"}]},{"id":"jjf-113-11","subject":"經紀法","year":113,"no":11,"topic":"預售屋 §25 態樣","stem":"不動產開發業者或不動產經紀業者銷售預售屋時，其所為之下列何種行為，並不構成公平交易法第25 條「其他足以影響交易秩序之欺罔或顯失公平之行為」？","options":["在向買方收取斡旋金前，未以書面告知買方得選擇支付斡旋金或採用內政部版「要約書」","向買方收取斡旋金後，因未能締結預售屋買賣契約，而拒絕返還","要求購屋人須給付定金或一定費用始提供預售屋買賣契約書攜回審閱","締結預售屋買賣契約後，要求繳回契約書"],"answer":"B","explain":"斡旋金屬「仲介業」規範，不是預售屋銷售態樣；其他三項（要繳回契約書、付訂金才給審閱）都是","laws":[{"ref":"公平交易法 §25","text":"除本法另有規定者外，事業亦不得為其他足以影響交易秩序之欺罔或顯失公平之行為。"}]},{"id":"jjf-113-13","subject":"經紀法","year":113,"no":13,"topic":"違法結合處分","stem":"事業申報結合，經公平交易委員會禁止其結合而仍為結合者，公平交易委員會除得處新臺幣二十萬元以上五千萬元以下罰鍰外，並得為一定之處分。下列何者不包括在內？","options":["停止營業","限期令分設事業","處分全部或部分股份","轉讓部分營業"],"answer":"A","explain":"可分設事業、處分股份、轉讓營業；沒有停止營業","laws":[]},{"id":"jjf-113-15","subject":"經紀法","year":113,"no":15,"topic":"經紀業廣告","stem":"有關不動產經紀業廣告，下列敘述何者正確？","options":["經紀業於臉書社群網路平台刊登不動產銷售廣告，僅註明加盟於知名連鎖不動產經紀業「○○不動產」並使用其服務標章","主打買地送屋，實際卻沒有房屋處分權","廣告及相關銷售文宣註明不動產經紀業名稱","廣告使用未經明確定義之「使用面積」、「受益面積」、「銷售面積」等名詞"],"answer":"C","explain":"必須註明經紀業名稱（§21），只寫加盟品牌不行","laws":[{"ref":"不動產經紀業管理條例 §21","text":"經紀業與委託人簽訂委託契約書後，方得刊登廣告及銷售。\n前項廣告及銷售內容，應與事實相符，並註明經紀業名稱。\n廣告及銷售內容與事實不符者，應負損害賠償責任。"}]},{"id":"jjf-113-17","subject":"經紀法","year":113,"no":17,"topic":"斡旋金","stem":"甲透過仲介公司看房，對某一間公寓頗為滿意，想請父母看房再決定，仲介公司業務員請他先付10 萬元斡旋，可保留優先購買之權利，於是甲支付10 萬元，並簽訂「不動產購買意願書」，下列何者錯誤？","options":["仲介業者如提出斡旋金要求，應主動告知消費者亦可選擇採用內政部所訂定之要約書，並需支付斡旋費用","斡旋金是當消費者中意某房屋，欲與屋主進行議價時，仲介業常要求消費者支付一定金額，作為斡旋差價之用","如消費者選擇交付斡旋金，則仲介業者應以書面明定交付斡旋金之目的，明確告知消費者之權利義務","仲介業者未遵行公平交易委員會對斡旋金規範而有欺罔或顯失公平情事，將違反公平交易法第25 條之規定"],"answer":"A","explain":"要約書不用付斡旋費用","laws":[]},{"id":"jjf-114-03","subject":"經紀法","year":114,"no":3,"topic":"管理委員任期","stem":"依公寓大廈管理條例，下列有關公寓大廈管理委員任期之敘述，何者正確？","options":["管理委員之任期不可以規定在規約中，要召開區分所有權人會議決定","管理委員會會議得決議各管理委員任期為1 年或2 年","主任委員、財務管理委員及監察業務委員之任期屆滿，連選得連任一次","管理委員會的各管理委員之任期屆滿，連選得連任"],"answer":"C","explain":"主委、財務、監察委員連選得連任一次；任期由規約定（≤ 2 年）","laws":[]},{"id":"jjf-114-04","subject":"經紀法","year":114,"no":4,"topic":"外牆廣告物","stem":"甲在公寓大廈1 樓開店營業，向管理委員會表示想要於該大樓1、2 樓外牆設置廣告物，甲要取得何者之同意，才能設置廣告物？","options":["管理委員會開會同意","管理委員會會議及區分所有權人會議決議同意","2 樓區分所有權人同意","區分所有權人會議決議同意及1 樓、2 樓區分所有權人同意"],"answer":"D","explain":"要區權會決議且1、2 樓區權人同意","laws":[]},{"id":"jjf-114-06","subject":"經紀法","year":114,"no":6,"topic":"訪問交易解約","stem":"訪問交易之消費者，關於行使解除契約之敘述，下列何者為正確？","options":["消費者行使解除權，唯有直接退回商品給企業經營者之方式","經企業經營者同意，可以用口頭通知企業經營者的方式來解除契約","消費者解除買賣契約，無須說明理由且無庸負擔任何費用或價款","消費者行使解除權的7 天猶豫期，可以以特約排除猶豫期間"],"answer":"C","explain":"7 日內退回商品或書面通知，不用理由、不負擔費用；猶豫期不能特約排除","laws":[]},{"id":"jjf-114-07","subject":"經紀法","year":114,"no":7,"topic":"預售屋車位不符應記載事項","stem":"甲建商所銷售預售屋的車位位置、規格，不符合預售屋買賣定型化契約應記載及不得記載事項時，地方政府主管機關應優先適用何種法律，裁處罰鍰？","options":["公平交易法","平均地權條例","消費者保護法","不動產經紀業管理條例"],"answer":"B","explain":"優先適用平均地權條例處罰","laws":[]},{"id":"jjf-114-11","subject":"經紀法","year":114,"no":11,"topic":"說明書應記載事項","stem":"有關不動產說明書應記載及不得記載事項之擬定與公告，下列敘述何者正確？","options":["由內政部擬定相關規範，並向行政院報請核定公告","由消費者保護處擬定相關規範，並向行政院報請核定公告","由法務部擬定相關規範，並向司法院報請核定公告","由仲介業全聯會擬定相關規範，並向司法院報請核定公告"],"answer":"A","explain":"由內政部擬定、報行政院核定公告","laws":[]},{"id":"jjf-114-18","subject":"經紀法","year":114,"no":18,"topic":"業與人員都罰","stem":"依不動產經紀業管理條例之規定，經紀人員違反下列那一選項之規定，不僅應依規定懲戒，經紀業亦將依規定處罰？","options":["經紀人員未專任一經紀業，違法為他經紀業執行仲介或代銷業務","經紀人員收取差價或其他報酬","經紀人員在執行業務過程中，未以不動產說明書向與委託人交易之相對人解說","經紀人員無故洩漏因業務知悉或持有之他人秘密"],"answer":"B","explain":"收差價：經紀業 6～30 萬＋人員停業；其他（專任、解說、洩密）只罰人員","laws":[]},{"id":"jjf-114-19","subject":"經紀法","year":114,"no":19,"topic":"營業員資格","stem":"依不動產經紀業管理條例之規定，下列關於不動產經紀營業員之敘述，何者正確？","options":["不動產經紀人考試及格，並向中央主管機關指定之機構、團體登錄及領有不動產經紀營業員證明者，得充任不動產經紀營業員","經紀營業員訓練不得少於20 個小時，其證明有效期限為4 年","期滿時，經紀營業員應檢附完成訓練30 個小時以上之證明文件，向中央主管機關指定之機構、團體重新辦理登錄","經紀營業員經驗之認定，得以本條例施行後，已實際從事仲介或代銷業務之所得扣繳資料證明"],"answer":"A","explain":"考試及格＋登錄領證即可；訓練 ≥ 30 小時、換證 20 小時；經驗認定是條例施行「前」","laws":[]},{"id":"jjf-114-22","subject":"經紀法","year":114,"no":22,"topic":"簽章","stem":"依不動產經紀業管理條例之規定，下列那一項關於簽章之敘述錯誤？","options":["經紀人員在執行業務過程中，不動產說明書於提供解說前，應經委託人簽章","雙方當事人簽訂租賃或買賣契約書時，經紀人應將不動產說明書交付與委託人交易之相對人，並由相對人在不動產說明書上簽章","委由經紀業仲介或代銷者，不動產租賃、買賣契約書文件應由經紀業指派經紀人簽章","經營經紀業者，向主管機關申請許可之應備文件應由經紀業指派經紀人簽章"],"answer":"D","explain":"「申請許可應備文件」不在 §22 簽章清單","laws":[{"ref":"不動產經紀業管理條例 §22","text":"不動產之買賣、互易、租賃或代理銷售，如委由經紀業仲介或代銷者，下列文件應由經紀業指派經紀人簽章：\n一、不動產出租、出售委託契約書。\n二、不動產承租、承購要約書。\n三、定金收據。\n四、不動產廣告稿。\n五、不動產說明書。\n六、不動產租賃、買賣契約書。\n前項第一款及第二款之規定，於經營代銷業務者不適用之。\n第一項第五款之不動產說明書應記載及不得記載事項，由中央主管機關定之。"}]},{"id":"jjf-114-24","subject":"經紀法","year":114,"no":24,"topic":"公平法定義","stem":"依公平交易法之規定，下列那一個定義之內容錯誤？","options":["廣告薦證者，指廣告主於廣告中反映其對商品或服務之意見、信賴、發現或親身體驗結果","獨占，指事業在相關市場處於無競爭狀態，或具有壓倒性地位，可排除競爭之能力者","競爭，指二以上事業在市場上以較有利之價格、數量、品質、服務或其他條件，爭取交易機會之行為","控制性持股，指前項之人或團體及其關係人持有他事業有表決權之股份或出資額，超過他事業已發行有表決權之股份總數或資本總額半數者"],"answer":"A","explain":"廣告薦證者是「廣告主以外」的人","laws":[]},{"id":"jjf-114-25","subject":"經紀法","year":114,"no":25,"topic":"消保法定義","stem":"依消費者保護法之規定，下列敘述何者正確？","options":["定型化契約條款：指以企業經營者提出之定型化契約條款作為契約內容之全部或一部而訂立之契約","邀約交易：指企業經營者未經邀約而與消費者在其住居所、工作場所、公共場所或其他場所所訂立之契約","分期付款：指買賣契約約定消費者支付頭期款，餘款分期支付，而企業經營者於收受頭期款時，交付標的物與消費者之交易型態","通訊交易：指企業經營者以廣播、電視、電話、傳真、型錄、報紙、雜誌、網際網路、傳單或其他類似之方法，消費者於檢視商品或服務之後，而與企業經營者所訂立之契約"],"answer":"C","explain":"分期付款定義正確；訪問交易（非邀約交易）是「未經邀約」；通訊交易是消費者「未能檢視」商品","laws":[]}]</script>
<script>
const PASS_STREAK = 2, ROUND_SIZE = 25, KEYS = ["A","B","C","D"];
let questions = [], progress = {}, subject = "全部";
let round = [], idx = 0, answered = null, roundLog = [];
const $ = s => document.querySelector(s);

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const inSubject = q => subject === "全部" || q.subject === subject;
const st = id => progress[id] || { s: 0, n: 0, w: 0, last: null };
const passed = id => st(id).s >= PASS_STREAK;

function renderStats() {
  const pool = questions.filter(inSubject);
  const p = pool.filter(q => passed(q.id)).length;
  const w = pool.filter(q => st(q.id).last === "wrong").length;
  const s = $("#stats"); s.replaceChildren(
    el("span", { class: "chip" }, "題庫 ", el("b", {}, String(pool.length))),
    el("span", { class: "chip pass" }, "已過關 ", el("b", {}, String(p))),
    el("span", { class: "chip wrong" }, "上次答錯 ", el("b", {}, String(w))));
  $("#barFill").style.width = pool.length ? (p / pool.length * 100) + "%" : "0";
}
function renderFilters() {
  const subs = ["全部", ...new Set(questions.map(q => q.subject))];
  $("#filters").replaceChildren(...(subs.length > 2 ? subs : []).map(s =>
    el("button", { type: "button", "aria-pressed": String(s === subject), onclick: () => { subject = s; renderFilters(); startRound(); } }, s)));
}

function buildRound(reviewAll) {
  const pool = questions.filter(inSubject);
  if (reviewAll) return shuffle(pool.slice()).slice(0, ROUND_SIZE);
  const todo = pool.filter(q => !passed(q.id));
  const g0 = shuffle(todo.filter(q => st(q.id).last === "wrong"));
  const g1 = shuffle(todo.filter(q => st(q.id).n === 0));
  const g2 = shuffle(todo.filter(q => st(q.id).n > 0 && st(q.id).last !== "wrong"));
  return [...g0, ...g1, ...g2].slice(0, ROUND_SIZE);
}
function startRound(reviewAll = false) {
  round = buildRound(reviewAll); idx = 0; answered = null; roundLog = [];
  renderStats();
  if (!round.length) return renderAllPassed();
  renderQuestion();
}

function renderQuestion() {
  const q = round[idx], p = st(q.id);
  const opts = q.options.map((t, i) => {
    const k = KEYS[i];
    return el("button", { type: "button", class: "opt", "data-k": k, onclick: () => answer(k) },
      el("span", { class: "k" }, "(" + k + ")"), el("span", {}, t));
  });
  const card = el("article", { class: "card" },
    el("div", { class: "meta" },
      el("span", {}, `第 ${idx + 1} / ${round.length} 題`),
      el("span", { class: "tag" }, `${q.subject}・${q.year} 年第 ${q.no} 題`),
      el("span", { class: "streak" }, p.n ? `連對 ${p.s}/${PASS_STREAK}・錯 ${p.w} 次` : "新題")),
    el("p", { class: "stem" }, q.stem),
    el("div", { class: "opts", id: "opts" }, opts),
    el("div", { id: "feedback" }));
  $("#main").replaceChildren(card);
  window.scrollTo({ top: 0 });
}

function answer(k) {
  if (answered) return;
  const q = round[idx]; answered = k;
  const ok = k === q.answer;
  document.querySelectorAll("#opts .opt").forEach(b => {
    b.disabled = true;
    const bk = b.dataset.k;
    if (bk === q.answer) b.classList.add("correct");
    else if (bk === k) b.classList.add("picked-wrong");
    if (q.notes && q.notes[bk] && bk !== q.answer) b.lastChild.append(el("span", { class: "why" }, q.notes[bk]));
  });
  const p = { ...st(q.id) };
  p.n += 1; p.s = ok ? p.s + 1 : 0; if (!ok) p.w += 1; p.last = ok ? "right" : "wrong"; p.t = Date.now();
  progress[q.id] = p; roundLog.push({ q, ok });
  saveProgress();
  renderStats();

  const fb = $("#feedback");
  const laws = (q.laws || []).map(l => el("div", { class: "law" }, el("span", { class: "ref" }, l.ref), l.text,
    l.src ? el("span", { class: "src" }, "\n來源：" + l.src) : null));
  fb.replaceChildren(el("div", { class: "card", style: "padding:0;border:0;gap:10px" },
    el("div", { class: "verdict " + (ok ? "ok" : "bad") },
      ok ? (p.s >= PASS_STREAK ? "答對，這題過關了" : "答對") : `答錯，正解是 (${q.answer})`),
    el("p", { class: "explain" }, q.explain),
    q.warn ? el("div", { class: "warn" }, "⚠️ " + q.warn) : null,
    laws.length ? el("details", { class: "laws", open: "" }, el("summary", {}, "法條原文（全國法規資料庫）"), laws) : null,
    el("div", { class: "src" }, "答案依考選部公告"),
    el("div", { class: "actions" },
      el("button", { type: "button", class: "btn", id: "nextBtn", onclick: next }, idx + 1 < round.length ? "下一題" : "看本輪結果"))));
  $("#nextBtn").focus({ preventScroll: true });
}
function next() { answered = null; idx += 1; if (idx < round.length) renderQuestion(); else renderSummary(); }

function renderSummary() {
  const right = roundLog.filter(r => r.ok).length;
  $("#main").replaceChildren(el("div", { class: "card empty" },
    el("h2", {}, `本輪答對 ${right} / ${roundLog.length}`),
    el("div", { class: "result-list" }, roundLog.map(r =>
      el("div", {}, el("span", { class: r.ok ? "o" : "x" }, r.ok ? "○" : "✕"),
        el("span", {}, `${r.q.year}-${r.q.no}　${r.q.topic}`)))),
    el("div", { class: "actions", style: "justify-content:center;margin-top:12px" },
      el("button", { type: "button", class: "btn", onclick: () => startRound() }, "再來一輪"))));
}
function renderAllPassed() {
  const has = questions.some(inSubject);
  $("#main").replaceChildren(el("div", { class: "card empty" },
    el("h2", {}, has ? "這個範圍全部過關" : "目前沒有題目"),
    el("div", {}, has ? "想複習可以全部再抽一輪，答錯會重新列入待練。" : "題庫是空的。"),
    has ? el("div", { class: "actions", style: "justify-content:center;margin-top:12px" },
      el("button", { type: "button", class: "btn ghost", onclick: () => startRound(true) }, "全部複習一輪")) : null));
}

const LS_KEY = "drill-offline-progress-v1";
function saveProgress() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(progress)); } catch (e) { console.warn("progress save failed"); }
}

function showMsg(title, body) {
  $("#main").replaceChildren(el("div", { class: "card empty" }, el("h2", {}, title), el("div", {}, body)));
}

(() => {
  try { progress = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch (e) { progress = {}; }
  questions = JSON.parse(document.getElementById("qdata").textContent);
  renderFilters(); renderStats(); startRound();
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready)
      .then(() => { $("#offline").textContent = "✓ 已存好，可離線使用"; })
      .catch(() => { $("#offline").textContent = "離線快取失敗，請連網重開一次"; });
  } else { $("#offline").textContent = "這個瀏覽器不支援離線"; }
  // 新版 Service Worker 接手時自動重新載入一次，才看得到新版
  if ("serviceWorker" in navigator && navigator.serviceWorker.controller) {
    let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (!reloaded) { reloaded = true; location.reload(); } });
  }
  initBackup();
})();

function initBackup() {
  const box = $("#bkText"), msg = $("#bkMsg");
  const say = t => { msg.textContent = t; };
  $("#bkExport").addEventListener("click", async () => {
    const n = Object.keys(progress).length;
    box.value = JSON.stringify({ v: 1, t: new Date().toISOString(), p: progress });
    box.select();
    say(`共 ${n} 題的記錄，請長按下方文字框全選後拷貝，貼到備忘錄存起來`);
    try { await navigator.clipboard.writeText(box.value); say(`已複製 ${n} 題的記錄，直接貼到備忘錄存起來`); } catch (e) {}
  });
  $("#bkImport").addEventListener("click", () => {
    let d;
    try { d = JSON.parse(box.value.trim()); } catch (e) { return say("讀不懂這串文字，請確認整串都有貼上"); }
    if (!d || typeof d.p !== "object") return say("這不是錯題練習的備份");
    // 同一題取作答次數較多的那份，不會蓋掉比較新的記錄
    let n = 0;
    for (const [id, rec] of Object.entries(d.p)) {
      if (!rec || typeof rec.n !== "number") continue;
      if (!progress[id] || (progress[id].n || 0) < rec.n) { progress[id] = rec; n++; }
    }
    saveProgress(); renderStats(); startRound();
    say(`已匯入 ${n} 題的記錄`);
  });
}
</script>
