<title>錯題練習離線版</title>
<style>
/* 版面：單欄題卡，平板手機優先，上方進度、中間題目、下方解析 */
:root {
  --bg: #f3f4f6; --surface: #ffffff; --ink: #1e293b; --muted: #64748b; --line: #dbe1e8;
  --accent: #b5543c;      /* 陶紅：重點、答錯 */
  --ochre: #b8862b;       /* 赭黃：過關進度 */
  --ok: #2f7d55; --ok-bg: #e6f3ec; --bad-bg: #f8e9e4; --law-bg: #f1f4f8;
  --f-display: "Songti TC", "PingFang TC", serif;
  --f-body: "PingFang TC", "Microsoft JhengHei", sans-serif;
}
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.7; padding-inline: 16px; padding-block: 16px 48px }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px }
h1 { font-family: var(--f-display); font-size: 1.35rem; margin: 0; text-wrap: balance }
.sub { color: var(--muted); font-size: .85rem }
.stats { display: flex; flex-wrap: wrap; gap: 8px }
.chip { font-size: .82rem; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-variant-numeric: tabular-nums }
.chip b { font-weight: 700 }
.chip.pass b { color: var(--ochre) }
.chip.wrong b { color: var(--accent) }
.filters { display: flex; flex-wrap: wrap; gap: 6px }
.filters button { font: inherit; font-size: .85rem; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink) }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--ochre); width: 0; transition: width .3s }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: .8rem; color: var(--muted) }
.meta .tag { color: var(--accent); font-weight: 500 }
.meta .streak { margin-left: auto; font-variant-numeric: tabular-nums }
.stem { font-family: var(--f-display); font-size: 1.12rem; line-height: 1.75; margin: 0 }
.opts { display: flex; flex-direction: column; gap: 8px }
.opt { font: inherit; text-align: left; display: flex; gap: 10px; align-items: flex-start; width: 100%; padding: 12px 14px; border-radius: 8px; border: 1.5px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; line-height: 1.6 }
.opt:hover:not(:disabled) { border-color: var(--ink) }
.opt:focus-visible, .btn:focus-visible, .filters button:focus-visible { outline: 3px solid var(--ochre); outline-offset: 2px }
.opt .k { font-weight: 700; min-width: 1.4em }
.opt:disabled { cursor: default }
.opt.correct { border-color: var(--ok); background: var(--ok-bg) }
.opt.picked-wrong { border-color: var(--accent); background: var(--bad-bg) }
.opt .why { display: block; font-size: .86rem; color: var(--muted); margin-top: 2px }
.verdict { font-weight: 700; font-size: 1.05rem }
.verdict.ok { color: var(--ok) } .verdict.bad { color: var(--accent) }
.explain { margin: 0 }
.warn { background: var(--bad-bg); border-radius: 6px; padding: 8px 12px; font-size: .9rem }
details.laws { border-top: 1px dashed var(--line); padding-top: 10px }
details.laws summary { cursor: pointer; font-weight: 500; font-size: .9rem; color: var(--muted) }
.law { background: var(--law-bg); border-radius: 6px; padding: 10px 12px; margin-top: 8px; font-size: .88rem; white-space: pre-line }
.law .ref { display: block; font-weight: 700; margin-bottom: 2px; white-space: normal }
.src { font-size: .78rem; color: var(--muted) }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end }
.btn { font: inherit; font-weight: 500; padding: 10px 20px; border-radius: 8px; border: 1.5px solid var(--ink); background: var(--ink); color: var(--surface); cursor: pointer }
.btn.ghost { background: transparent; color: var(--ink) }
.empty { text-align: center; color: var(--muted); padding: 32px 12px }
.empty h2 { font-family: var(--f-display); color: var(--ink); font-size: 1.2rem; margin: 0 0 6px }
.result-list { display: flex; flex-direction: column; gap: 4px; font-size: .9rem; text-align: left }
.result-list div { display: flex; gap: 8px }
.result-list .x { color: var(--accent); font-weight: 700 } .result-list .o { color: var(--ok); font-weight: 700 }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none } }
.offline { font-size: .78rem; color: var(--muted) }
.backup { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 18px }
.backup summary { cursor: pointer; font-weight: 500; color: var(--muted) }
.bk-body { display: flex; flex-direction: column; gap: 10px; margin-top: 10px }
.bk-body textarea { font: inherit; font-size: .8rem; width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink) }
</style>
</head>

<div class="wrap">
  <header>
    <div>
      <h1>錯題練習（離線版）</h1>
      <div class="sub">民法 103 題＋土地法 139 題＋經紀法 95 題＋估價 68 題・每輪隨機 25 題・連續答對 2 次過關</div>

      <div class="sub" id="bkMsg" role="status"></div>
    </div>
  </details>

","topic":"農舍出售所得稅","year":106},{"answer":"D","explain":"分割是「契約成立之日」起 30 日內，不是完成移轉登記之日；糾紛→判決確定日；標購公產→產權移轉證明書之日；法拍→權利移轉證明書之日","id":"tdf-106-16","laws":[],"no":16,"options":["不動產移轉發生糾紛時，其申報契稅之起算日期，應以法院判決確定日為準","向政府機關標購或領買公產，以政府機關核發產權移轉證明書之日為申報起算日","向法院標購拍賣之不動產，以法院發給權利移轉證明書之日為申報起算日","不動產分割時，以其完成移轉登記之日為申報起算日"],"stem":"下列有關契稅之申報起算日規定，何者錯誤？","subject":"土地法","topic":"契稅申報起算日","year":106},{"answer":"A","explain":"是「房屋所有人」本人、配偶或直系親屬辦戶籍，不是土地所有權人；無出租營業；本人、配偶、未成年子女全國 3 戶以內","id":"tdf-106-17","laws":[],"no":17,"options":["土地所有權人或其配偶、直系親屬於房屋所在地辦竣戶籍登記","房屋無出租使用","供本人、配偶或直系親屬實際居住使用","本人、配偶及未成年子女全國合計3 戶以內"],"stem":"下列何者非申請自住房屋稅稅率之要件？","subject":"土地法","topic":"自住房屋稅要件","year":106},{"answer":"D","explain":"不依限變更→依「行政執行法」（不是強制執行法）＋6 個月以下有期徒刑或拘役；罰鍰 6～30 萬、按次罰","id":"tdf-106-24","laws":[],"no":24,"options":["由該管直轄市、縣（市）政府處新臺幣6 萬元以上30 萬元以下罰鍰","經限期變更使用、停止使用或拆除地上物恢復原狀而不遵從者，得按次處罰","經限期變更使用而不遵從者，並得停止供水、供電、封閉、強制拆除或採取其他恢復原狀之措施","不依限變更土地使用者，除依強制執行法辦理外，並得處6 個月以下有期徒刑或拘役"],"stem":"下列有關違反區域計畫管制使用土地者之處罰規定，何者錯誤？","subject":"土地法","topic":"區計違規罰則","year":106},{"answer":"C","explain":"重大災害、重大開發建設、區域建設推行委員會建議；「國防或經濟發展」是都計 §27 的事由","id":"tdf-106-25","laws":[{"ref":"區域計畫法 §13","text":"區域計畫公告實施後，擬定計畫之機關應視實際發展情況，每五年通盤檢討一次，並作必要之變更。但有左列情事之一者，得隨時檢討變更之：\n一、發生或避免重大災害。\n二、興辦重大開發或建設事業。\n三、區域建設推行委員會之建議。\n區域計畫之變更，依第九條及第十條程序辦理；必要時上級主管機關得比照第六條第二項規定變更之。"}],"no":25,"options":["發生或避免重大災害","興辦重大開發或建設事業","為適應國防或經濟發展之需要","區域建設推行委員會之建議"],"stem":"下列何者非區域計畫法規定區域計畫得隨時檢討變更之原因？","subject":"土地法","topic":"區計 §13 隨時檢討","year":106},{"answer":"A","explain":"名勝古蹟保存是主要計畫 §15 的內容；細部計畫有居住密度、使用分區管制、道路系統等","id":"tdf-106-27","laws":[{"ref":"都市計畫法 §22","text":"細部計畫應以細部計畫書及細部計畫圖就左列事項表明之：\n一、計畫地區範圍。\n二、居住密度及容納人口。\n三、土地使用分區管制。\n四、事業及財務計畫。\n五、道路系統。\n六、地區性之公共設施用地。\n七、其他。\n前項細部計畫圖比例尺不得小於一千二百分之一。"},{"ref":"都市計畫法 §15","text":"市鎮計畫應先擬定主要計畫書，並視其實際情形，就左列事項分別表明之：\n一、當地自然、社會及經濟狀況之調查與分析。\n二、行政區域及計畫地區範圍。\n三、人口之成長、分布、組成、計畫年期內人口與經濟發展之推計。\n四、住宅、商業、工業及其他土地使用之配置。\n五、名勝、古蹟及具有紀念性或藝術價值應予保存之建築。\n六、主要道路及其他公眾運輸系統。\n七、主要上下水道系統。\n八、學校用地、大型公園、批發市場及供作全部計畫地區範圍使用之公共設施用地。\n九、實施進度及經費。\n十、其他應加表明之事項。\n前項主要計畫書，除用文字、圖表說明外，應附主要計畫圖，其比例尺不得小於一萬分之一；其實施進度以五年為一期，最長不得超過二十五年。"}],"no":27,"options":["名勝、古蹟及具有紀念性或藝術價值應予保存之建築","居住密度及容納人口","土地使用分區管制","道路系統"],"stem":"依都市計畫法第22 條規定，下列何者非細部計畫應以細部計畫書及細部計畫圖應表明之事項？","subject":"土地法","topic":"細部計畫 §22","year":106},{"answer":"A","explain":"公告期間內繳複丈費聲請複丈；調處是界址爭議時才用","id":"tdf-106-28","laws":[],"no":28,"options":["土地所有權人得於公告期間內，向該管地政機關繳納複丈費，聲請複丈","土地所有權人得於公告期滿後，向該管地政機關申請重新實施地籍測量","應由該管地政機關予以調處，不服調處者，應於接到調處通知後15 日內，向司法機關訴請處理","應由該管地政機關予以調處，不服調處者，應於接到調處通知後15 日內，循行政救濟程序辦理"],"stem":"重新實施地籍測量時，已依法設立界標之土地所有權人，於重測結果公告後認為測量結果有錯誤者，應如何辦理？","subject":"土地法","topic":"重測結果有錯","year":106},{"answer":"B","explain":"違反租賃契約→可收回；收回自住重建、欠租 2 個月、損壞房屋都是房屋 §100 的（107-9、109-14 同觀念）","id":"tdf-106-30","laws":[{"ref":"土地法 §103","text":"租用建築房屋之基地，非因左列情形之一，出租人不得收回。\n一、契約年限屆滿時。\n二、承租人以基地供違反法令之使用時。\n三、承租人轉租基地於他人時。\n四、承租人積欠租金額，除以擔保現金抵償外，達二年以上時。\n五、承租人違反租賃契約時。"},{"ref":"土地法 §100","text":"出租人非因左列情形之一，不得收回房屋。\n一、出租人收回自住或重新建築時。\n二、承租人違反民法第四百四十三條第一項之規定轉租於他人時。\n三、承租人積欠租金額，除擔保金抵償外，達二個月以上時。\n四、承租人以房屋供違反法令之使用時。\n五、承租人違反租賃契約時。\n六、承租人損壞出租人之房屋或附著財物，而不為相當之賠償時。"}],"no":30,"options":["出租人收回自住或重新建築時","承租人違反租賃契約時","承租人積欠租金額，除擔保金抵償外，達2 個月以上時","承租人損壞出租人之房屋或附著財物，而不為相當之賠償時"],"stem":"依土地法第103 條規定，租用建築房屋之基地，非因下列何種情形，出租人不得收回？","subject":"土地法","topic":"基地收回 §103","year":106},{"answer":"B","explain":"面積是減半：都市 1.5 公畝、非都市 3.5 公畝；持有 6 年；設籍持有 6 年；出售時本人配偶未成年子女無其他房屋","id":"tdf-106-33","laws":[],"no":33,"options":["出售都市土地面積未超過3 公畝部分或非都市土地面積未超過7 公畝部分","出售時土地所有權人與其配偶及未成年子女，無該自用住宅以外之房屋","出售前持有該土地5 年以上","土地所有權人或其配偶、未成年子女於土地出售前，在該地設有戶籍且持有該自用住宅連續滿5 年"],"stem":"土地所有權人曾使用自用住宅用地優惠稅率後，再出售其自用住宅用地，符合下列何項規定，為不受一次優惠稅率限制條件之一：","subject":"土地法","topic":"一生一屋條件","year":106},{"answer":"D","explain":"公設保留地仍建築使用→6‰，不是 10‰；自用住宅 2‰；停車場、公有非公用 10‰（109-4 同觀念）","id":"tdf-106-34","laws":[],"no":34,"options":["自用住宅用地之地價稅稅率是2‰","依都市計畫法規定設置供公眾使用之停車場用地之地價稅稅率是10‰","公有非公用土地之地價稅稅率是10‰","都市計畫公共設施保留地，在保留期間仍為建築使用者，地價稅稅率是10‰"],"stem":"下列敘述之地價稅稅率，何者錯誤？","subject":"土地法","topic":"地價稅稅率","year":106},{"answer":"D","explain":"平均地權條例→應納登記費 20 倍以下罰鍰（土稅另有 2%）","id":"tdf-106-36","laws":[],"no":36,"options":["5 倍","10 倍","15 倍","20 倍"],"stem":"依平均地權條例之規定，土地買賣未辦竣權利移轉登記，承買人再行出售該土地時，處應納登記費多少倍以下之罰鍰？","subject":"土地法","topic":"未登記再出售","year":106},{"answer":"A","explain":"都市計畫發布實施後依「建築法」實施建築管理","id":"tdf-106-37","laws":[],"no":37,"options":["建築法","建築技術規則","建築師法","建築管理規則"],"stem":"都市計畫發布實施後，應依何法之規定，實施建築管理？","subject":"土地法","topic":"建築管理","year":106},{"answer":"B","explain":"原發所有權狀及地段圖「或」他項權利證明書","id":"tdf-106-38","laws":[{"ref":"土地法 §74","text":"聲請為土地權利變更登記，應檢附原發土地所有權狀及地段圖或土地他項權利證明書。"}],"no":38,"options":["原發土地所有權狀及地段圖","原發土地所有權狀及地段圖或土地他項權利證明書","原發土地所有權狀及地段圖及土地他項權利證明書","原發土地所有權狀或地段圖及土地他項權利證明書"],"stem":"依土地法之規定，聲請為土地權利變更登記，應檢附什麼文件？","subject":"土地法","topic":"權利變更登記應附文件 §74","year":106},{"answer":"D","explain":"報經「內政部」核准（不是農委會）；土地法空地：建物價值不及申報地價 20%；平均地權：10%","id":"tdf-106-39","laws":[],"no":39,"options":["土地法規定，土地建築改良物價值不及所占地基申報地價20%者，視為空地","平均地權條例規定，空地係指已完成道路、排水及電力設施，於有自來水地區並已完成自來水系統，而仍未依法建築使用；或雖建築使用，而其建築改良物價值不及所占基地申報地價10%，且經直轄市或縣（市）政府認定應予增建、改建或重建之私有及公有非公用建築用地","土地法規定，凡編為農業或其他直接生產用地，未依法使用者為荒地","平均地權條例規定，農業用地閒置不用，經直轄市或縣（市）政府報經行政院農業委員會核准通知限期使用或命其委託經營，逾期仍未使用或委託經營者，按應納田賦加徵1 倍至3 倍之荒地稅"],"stem":"依土地法及平均地權條例對於空地及荒地之規定，下列敘述何者錯誤？","subject":"土地法","topic":"荒地稅","year":106},{"answer":"C","explain":"2000－1300－50－漲價總數額 100＝550 萬；持有 1 年內 45%→247.5 萬（注意扣的是「漲價總數額」不是增值稅）","id":"tdf-106-40","laws":[],"no":40,"options":["1,925,000 元","2,240,000 元","2,475,000 元","2,880,000 元"],"stem":"甲105 年6 月買入A 房地，購入成本1,300 萬元，於106 年2 月以2,000 萬元出售A 房地時，繳納土地增值稅10 萬元（土地漲價總數額為100 萬元），因取得、改良及移轉而支付的費用50 萬元，其應納交易所得稅若干？","subject":"土地法","topic":"房地合一計算","year":106},{"answer":"D","explain":"罰鍰最高 20 倍；繼承登記可由任一繼承人為全體申請；期限 1 個月內（繼承是 6 個月）；每逾 1 個月罰 1 倍","id":"tdf-107-01","laws":[],"no":1,"options":["其係繼承登記者，應由全體繼承人聲請之","其係繼承登記者，依法應自繼承開始之日起二個月內為之","聲請逾期者，每逾一個月得處應納登記費額二倍之罰鍰","罰鍰最高不得超過應納登記費額二十倍"],"stem":"關於土地權利變更登記，下列何者正確？","subject":"土地法","topic":"權利變更登記逾期","year":107},{"answer":"C","explain":"礦泉地、瀑布地、名勝古蹟都在內；國家公園土地不在內","id":"tdf-107-02","laws":[{"ref":"土地法 §14","text":"下列土地不得為私有：\n一、海岸一定限度內之土地。\n二、天然形成之湖澤而為公共需用者，及其沿岸一定限度內之土地。\n三、可通運之水道及其沿岸一定限度內之土地。\n四、城鎮區域內水道湖澤及其沿岸一定限度內之土地。\n五、公共交通道路。\n六、礦泉地。\n七、瀑布地。\n八、公共需用之水源地。\n九、名勝古蹟。\n十、其他法律禁止私有之土地。\n前項土地已成為私有者，得依法徵收之。\n符合下列情形之一者，不受第一項第九款規定之限制：\n一、日據時期原屬私有，臺灣光復後登記為公有，依法得贈與移轉為私有之名勝古蹟。\n二、公營事業機構及行政法人，有經營或使用古蹟土地需要，並經中央文化主管機關認定古蹟土地移轉為其所有可助於古蹟保存及維護。"}],"no":2,"options":["礦泉地","瀑布地","國家公園土地","名勝古蹟"],"stem":"下列土地，何者非屬土地法規定不得為私有之土地？","subject":"土地法","topic":"不得私有土地 §14","year":107},{"answer":"A","explain":"信託登記要繳；塗銷、標示變更、重劃變更→免繳（口訣「限重標址，更正消塗」）","id":"tdf-107-03","laws":[{"ref":"土地法 §78","text":"左列登記，免繳納登記費：\n一、因土地重劃之變更登記。\n二、更正登記。\n三、消滅登記。\n四、塗銷登記。\n五、更名登記。\n六、住址變更登記。\n七、標示變更登記。\n八、限制登記。"}],"no":3,"options":["土地權利信託登記","土地權利塗銷登記","土地標示變更登記","因土地重劃之變更登記"],"stem":"下列何種登記，應繳納登記費？","subject":"土地法","topic":"登記費 §78","year":107},{"answer":"D","explain":"地政機關準用 §59 II 調處，不是直接叫你去法院","id":"tdf-107-05","laws":[{"ref":"土地法 §46-2","text":"重新實施地籍測量時，土地所有權人應於地政機關通知之限期內，自行設立界標，並到場指界。逾期不設立界標或到場指界者，得依左列順序逕行施測：\n一、鄰地界址。\n二、現使用人之指界。\n三、參照舊地籍圖。\n四、地方習慣。\n土地所有權人因設立界標或到場指界發生界址爭議時，準用第五十九條第二項規定處理之。"},{"ref":"土地法 §59","text":"土地權利關係人，在前條公告期間內，如有異議，得向該管直轄市或縣（市）地政機關以書面提出，並應附具證明文件。\n因前項異議而生土地權利爭執時，應由該管直轄市或縣（市）地政機關予以調處，不服調處者，應於接到調處通知後十五日內，向司法機關訴請處理，逾期不起訴者，依原調處結果辦理之。"}],"no":5,"options":["逕行參照舊地籍圖施測","請當事人逕行向法院提起確認界址之訴，俟判決確定後再行辦理","逕行依地方習慣施測","準用土地法第59 條第2 項規定之調處程序處理之"],"stem":"重新實施地籍測量，遇有土地所有權人因設立界標或到場指界發生界址爭議時，地政機關應如何處理？","subject":"土地法","topic":"重測界址爭議","year":107},{"answer":"A","explain":"標售 5 次不成登記國有→10 年內原權利人可請求發給價金","id":"tdf-107-06","laws":[{"ref":"土地法 §73-1","text":"土地或建築改良物，自繼承開始之日起逾一年未辦理繼承登記者，經該管直轄市或縣市地政機關查明後，應即公告繼承人於三個月內聲請登記，並以書面通知繼承人；逾期仍未聲請者，得由地政機關予以列冊管理。但有不可歸責於聲請人之事由，其期間應予扣除。\n前項列冊管理期間為十五年，逾期仍未聲請登記者，由地政機關書面通知繼承人及將該土地或建築改良物清冊移請財政部國有財產署公開標售。繼承人占有或第三人占有無合法使用權者，於標售後喪失其占有之權利；土地或建築改良物租賃期間超過五年者，於標售後以五年為限。\n依第二項規定標售土地或建築改良物前應公告三個月，繼承人、合法使用人或其他共有人就其使用範圍依序有優先購買權。但優先購買權人未於決標後三十日內表示優先購買者，其優先購買權視為放棄。\n標售所得之價款應於國庫設立專戶儲存，繼承人得依其法定應繼分領取。逾十年無繼承人申請提領該價款者，歸屬國庫。\n第二項標售之土地或建築改良物無人應買或應買人所出最高價未達標售之最低價額者，由財政部國有財產署定期再標售，於再行標售時，財政部國有財產署應酌減拍賣最低價額，酌減數額不得逾百分之二十。經五次標售而未標出者，登記為國有並準用第二項後段喪失占有權及租賃期限之規定。自登記完畢之日起十年內，原權利人得檢附證明文件按其法定應繼分，向財政部國有財產署申請就第四項專戶提撥發給價金；經審查無誤，公告九十日期滿無人異議時，按該土地或建築改良物第五次標售底價分算發給之。"}],"no":6,"options":["10 年","12 年","15 年","20 年"],"stem":"逾期未辦繼承登記之土地，經依土地法第73 條之1 規定程序列冊管理期滿，移請國有財產署標售五次不成，而登記為國有者，自登記完畢之日起多少年內，原權利人得檢附證明文件按其法定應繼分請求國有財產署發給價金？","subject":"土地法","topic":"§73-1 登記國有後","year":107},{"answer":"A","explain":"交換等一般移轉會被排除；徵收、強制執行、法院判決→不排除","id":"tdf-107-07","laws":[],"no":7,"options":["土地交換","徵收","強制執行","法院判決"],"stem":"預告登記，對於因下列何種事由而為之新登記，具有排除之效力？","subject":"土地法","topic":"預告登記排除效力","year":107},{"answer":"A","explain":"「收回自行建築」是房屋 §100 的事由，基地 §103 沒有；基地的事由：期滿、違反法令使用、轉租、欠租 2 年、違約","id":"tdf-107-09","laws":[{"ref":"土地法 §103","text":"租用建築房屋之基地，非因左列情形之一，出租人不得收回。\n一、契約年限屆滿時。\n二、承租人以基地供違反法令之使用時。\n三、承租人轉租基地於他人時。\n四、承租人積欠租金額，除以擔保現金抵償外，達二年以上時。\n五、承租人違反租賃契約時。"},{"ref":"土地法 §100","text":"出租人非因左列情形之一，不得收回房屋。\n一、出租人收回自住或重新建築時。\n二、承租人違反民法第四百四十三條第一項之規定轉租於他人時。\n三、承租人積欠租金額，除擔保金抵償外，達二個月以上時。\n四、承租人以房屋供違反法令之使用時。\n五、承租人違反租賃契約時。\n六、承租人損壞出租人之房屋或附著財物，而不為相當之賠償時。"}],"no":9,"options":["出租人收回自行建築時","契約年限屆滿時","承租人以基地供違反法令之使用時","承租人轉租基地於他人時"],"stem":"依土地法規定，關於租用建築房屋之基地，下列何者，非屬出租人得收回之情形？","subject":"土地法","topic":"基地收回 §103","year":107},{"answer":"D","explain":"通知 2 年內出售或建築，逾期→照價收買（不是拍賣）","id":"tdf-107-10","laws":[],"no":10,"options":["應通知土地所有權人於三年內出售","應通知土地所有權人於三年內建築使用","逾期未出售或未建築使用者，得予強制拍賣","逾期未出售或未建築使用者，得予照價收買"],"stem":"依平均地權條例規定，直轄市或縣（市）政府對於尚未建築之超額私有建築用地之處理，下列敘述，何者正確？","subject":"土地法","topic":"超額建築用地","year":107},{"answer":"D","explain":"承租人可終止，請求相當 1 年租金補償（耕地才是公告現值 1/3）","id":"tdf-107-11","laws":[],"no":11,"options":["按重劃計畫書公告當期公告土地現值扣除預計土地增值稅後餘額之三分之一","按重劃計畫書公告當期公告土地現值之三分之一","相當六個月租金","相當一年租金"],"stem":"耕地以外之出租土地，因市地重劃而不能達到原租賃之目的者，承租人得終止租約，並得向出租人請求如何之補償？","subject":"土地法","topic":"耕地以外出租土地遇重劃","year":107},{"answer":"C","explain":"興辦臨時性工程才徵用；逾 3 年（不是 6 年）要書面通知；收到通知 30 日內可請求徵收所有權；請求徵收後不得申請收回","id":"tdf-107-13","laws":[],"no":13,"options":["國家因興辦繼續性之公共建設工程，得徵用私有土地或土地改良物","徵用期間逾六年，或二次以上徵用，期間合計逾六年者，需用土地人應於申請徵用前，以書面通知","土地或土地改良物所有權人於收到徵用通知書之日起三十日內，得請求需用土地人徵收所有權","因徵用而請求徵收土地或土地改良物所有權者，必要時所有權人得申請收回其土地或土地改良物"],"stem":"依土地徵收條例有關徵用之規定，下列敘述，何者正確？","subject":"土地法","topic":"徵用","year":107},{"answer":"B","explain":"殘餘地過小→向直轄市或縣（市）主管機關申請","id":"tdf-107-14","laws":[],"no":14,"options":["需用土地人","該管直轄市或縣（市）主管機關","內政部","行政院"],"stem":"依土地徵收條例規定，徵收土地之殘餘部分面積過小或形勢不整，致不能為相當之使用者，所有權人得向何機關申請一併徵收？","subject":"土地法","topic":"一併徵收","year":107},{"answer":"B","explain":"接到核定發給抵價地通知時終止","id":"tdf-107-15","laws":[],"no":15,"options":["向直轄市或縣（市）主管機關申請發給抵價地時","接到直轄市或縣（市）主管機關核定發給抵價地通知時","直轄市或縣（市）主管機關將抵價地登記為申請人所有時","直轄市或縣（市）主管機關將抵價地點交申請人接管時"],"stem":"實施區段徵收時，申請發給抵價地者，對其被徵收土地之權利義務，於何時終止？","subject":"土地法","topic":"抵價地權利義務終止","year":107},{"answer":"B","explain":"只要取得開發地區土地及建物的「權利證明文件」，不用取得全部所有權","id":"tdf-107-16","laws":[],"no":16,"options":["開發許可前，應先將申請開發案提報各該區域計畫委員會審議之","申請開發許可，申請人應先取得開發地區內全部土地及建築物之所有權","開發許可後，辦理分區或用地變更前，應將開發區內公共設施用地完成分割移轉登記為各該直轄市、縣（市）有或鄉、鎮（市）有，並繳交開發影響費","直轄市、縣（市）政府受理開發申請案後，除情形特殊者外，應於六十日內報請各該區域計畫擬定機關審議"],"stem":"區域計畫法有關非都市土地許可開發之規定，下列敘述，何者錯誤？","subject":"土地法","topic":"開發許可","year":107},{"answer":"C","explain":"森林區、山坡地保育區、風景區適用林業用地管制；國家公園區不在內","id":"tdf-107-17","laws":[],"no":17,"options":["森林區","風景區","國家公園區","山坡地保育區"],"stem":"依非都市土地使用管制規則規定，山坡地範圍內之土地，在未編定使用地類別前，適用林業用地之管制，下列何者不包含在內？","subject":"土地法","topic":"山坡地未編定前","year":107},{"answer":"C","explain":"耕作權；地上權、農育權、不動產役權是民法","id":"tdf-107-18","laws":[],"no":18,"options":["地上權","農育權","耕作權","不動產役權"],"stem":"下列土地他項權利，何者為土地法所創設？","subject":"土地法","topic":"土地法創設的權利","year":107},{"answer":"C","explain":"承領→承領人、承墾→耕作權人、典權→典權人；權屬不明由使用人「代繳」（§4）不是納稅義務人","id":"tdf-107-19","laws":[{"ref":"土地稅法 §3","text":"地價稅或田賦之納稅義務人如左：\n一、土地所有權人。\n二、設有典權土地，為典權人。\n三、承領土地，為承領人。\n四、承墾土地，為耕作權人。\n前項第一款土地所有權屬於公有或公同共有者，以管理機關或管理人為納稅義務人；其為分別共有者，地價稅以共有人各按其應有部分為納稅義務人；田賦以共有人所推舉之代表人為納稅義務人，未推舉代表人者，以共有人各按其應有部分為納稅義務人。"},{"ref":"土地稅法 §4","text":"土地有左列情形之一者，主管稽徵機關得指定土地使用人負責代繳其使用部分之地價稅或田賦：\n一、納稅義務人行蹤不明者。\n二、權屬不明者。\n三、無人管理者。\n四、土地所有權人申請由占有人代繳者。\n土地所有權人在同一直轄市、縣（市）內有兩筆以上土地，為不同之使用人所使用時，如土地所有權人之地價稅係按累進稅率計算，各土地使用人應就所使用土地之地價比例負代繳地價稅之義務。\n第一項第一款至第三款代繳義務人代繳之地價稅或田賦，得抵付使用期間應付之地租或向納稅義務人求償。"}],"no":19,"options":["承領土地，為承領人","承墾土地，為耕作權人","權屬不明土地，為主管稅捐稽徵機關指定之土地使用人","設有典權土地，為典權人"],"stem":"下列土地關係人，何者非屬土地稅法第3 條所定之地價稅納稅義務人？","subject":"土地法","topic":"地價稅納稅義務人 §3","year":107},{"answer":"A","explain":"只要求辦竣戶籍登記＋無出租營業，不要求居住事實；建物要是本人、配偶或直系親屬所有","id":"tdf-107-22","laws":[],"no":22,"options":["須土地所有權人或其配偶、直系親屬於該地有居住事實並辦竣戶籍登記","須為無出租或供營業使用之住宅用地","土地面積，都市土地未超過三公畝部分，非都市土地未超過七公畝部分","土地上之建築改良物屬土地所有權人或其配偶、直系親屬所有者為限"],"stem":"自用住宅用地得適用優惠稅率課徵地價稅，下列有關自用住宅用地要件之敘述，何者錯誤？","subject":"土地法","topic":"自用住宅（地價稅）","year":107},{"answer":"B","explain":"以「不動產評價委員會評定的標準價格」為準","id":"tdf-107-23","laws":[],"no":23,"options":["以實際買賣價格為準","以當地不動產評價委員會評定之標準價格為準","以當地地價及標準地價評議委員會評定之標準價格為準","以當地建築主管機關公告之房屋造價為準"],"stem":"買賣契稅之稅率，為其契價百分之六。所稱契價，以何者為準？","subject":"土地法","topic":"契價","year":107},{"answer":"B","explain":"戶籍＋持有＋居住滿 6 年的人是「本人或配偶、未成年子女」，不是直系親屬；免稅 400 萬；6 年內無出租營業；6 年內未曾適用","id":"tdf-107-25","laws":[],"no":25,"options":["免稅所得額，以按該法第14 條之4 第3 項規定計算之餘額不超過四百萬元為限","個人或其配偶、直系親屬辦竣戶籍登記、持有並居住於該房屋連續滿六年","交易前六年內，無出租、供營業或執行業務使用","個人與其配偶及未成年子女於交易前六年內未曾適用該法第4 條之5 第1 項第1 款規定"],"stem":"依所得稅法規定，有關出售自住房屋，其房地交易所得稅之優惠，下列敘述，何者錯誤？","subject":"土地法","topic":"自住房地優惠","year":107},{"answer":"A","explain":"工廠直接生產用的自有房屋→減半，不是免徵；毀損 5 成以上必須修復→免徵；標準價格每 3 年重評","id":"tdf-109-01","laws":[],"no":1,"options":["合法登記之工廠供直接生產使用之自有房屋，免徵房屋稅","受重大災害，毀損面積佔整棟面積五成以上，必須修復始能使用之私有房屋，免徵房屋稅","房屋標準價格，每三年重行評定一次，並應依其耐用年數予以折舊，按年遞減其價格","各級政府機關及地方自治機關之公有辦公房屋及其員工宿舍，免徵房屋稅"],"stem":"依房屋稅條例規定，下列敘述何者錯誤？","subject":"土地法","topic":"房屋稅減免","year":109},{"answer":"C","explain":"自用住宅、自營工廠、自耕農地 2 年內重購都可退；先買後賣也行（2 年內）；不足額是扣除「土地增值稅」後的餘額，不是房地交易所得稅；出售前 1 年不能營業或出租","id":"tdf-109-03","laws":[],"no":3,"options":["土地所有權人於先購買土地後，自完成移轉登記之日起二年後，始行出售土地者","其新購土地地價超過原出售土地地價，扣除繳納房地交易所得稅後之餘額者","自耕之農業用地出售後，於二年內另行購買仍供自耕之農業用地者","土地出售前一年內，曾供營業使用或出租者"],"stem":"土地所有權人於出售土地後，依土地稅法規定，下列何種情形得申請就其已納土地增值稅額內，退還其不足支付新購土地地價之數額？","subject":"土地法","topic":"重購退稅","year":109},{"answer":"B","explain":"私立公園、體育場所→10‰，不是免徵；停車場 10‰；公有土地基本稅率、供公共使用→免徵；公設保留地仍建築使用→6‰","id":"tdf-109-04","laws":[],"no":4,"options":["依都市計畫法劃設並經目的事業主管機關核准供公眾停車使用之停車場用地，按千分之十計徵地價稅","經目的事業主管機關核准設立之私立公園、體育場所使用範圍內之土地，免徵地價稅","公有土地按基本稅率徵收地價稅。但公有土地供公共使用者，免徵地價稅","都市計畫公共設施保留地，在保留期間仍為建築使用者，除自用住宅用地依第17 條之規定外，統按千分之六計徵地價稅"],"stem":"依土地稅法規定，有關地價稅優惠稅率與減免，下列敘述何者錯誤？","subject":"土地法","topic":"地價稅特別稅率","year":109},{"answer":"A","explain":"是「免收或減收」地籍整理規費及書狀費，不是「減半」；低利貸款、抵費地出售不課增值稅、免徵或減徵地價稅田賦都對","id":"tdf-109-05","laws":[],"no":5,"options":["減半收取土地權利變更登記及換發權利書狀費用","土地所有權人參加自辦市地重劃所需費用，得向政府指定之銀行或實施平均地權基金申請低利貸款","自辦市地重劃區抵費地出售時，不計徵土地增值稅","免徵或減徵地價稅與田賦"],"stem":"依平均地權條例規定，為促進土地利用，擴大辦理市地重劃，得獎勵土地所有權人自行組織重劃會辦理市地重劃，下列對獎勵土地所有權人辦理市地重劃之敘述，何者錯誤？","subject":"土地法","topic":"獎勵自辦重劃","year":109},{"answer":"D","explain":"避免重大災害、適應國防或經濟發展、配合重大設施、重大事變→個案迅行變更（C 寫通盤檢討是錯的）；個別變更範圍外的人權益受損可以提行政訴訟（釋字 742）","id":"tdf-109-06","laws":[{"ref":"都市計畫法 §27","text":"都市計畫經發布實施後，遇有下列情事之一時，當地直轄市、縣（市）政府或鄉、鎮、縣轄市公所，應視實際情況迅行變更：\n一、因戰爭、地震、水災、風災、火災或其他重大事變遭受損壞時。\n二、為避免重大災害之發生時。\n三、為適應國防或經濟發展之需要時。\n四、為配合中央、直轄市或縣（市）興建之重大設施時。\n前項都市計畫之變更，內政部或縣（市）政府得指定各該原擬定之機關限期為之，必要時，並得逕為變更。"}],"no":6,"options":["都市計畫之變更，如直接限制一定區域人民之權利者，則其性質即屬公法上之觀念通知","都市計畫之變更屬法規性質，並非行政處分，都市計畫個別變更範圍外之人民，如因都市計畫個別變更致其權利或法律上利益受侵害時，無法提起行政訴訟以資救濟","為適應國防或經濟發展之需要而變更都市計畫時，應以通盤檢討變更之方式辦理","為避免重大災害之發生而變更都市計畫時，應以個案迅行變更之方式辦理"],"stem":"依都市計畫法之規定，關於都市計畫之變更，下列敘述何者正確？","subject":"土地法","topic":"都計 §27 隨時變更","year":109},{"answer":"C","explain":"只有 3 種：興辦事業計畫被廢止、申請人自己申請廢止、違反核定計畫限期不改；C「公共設施無法配合」是審議條件，不是廢止事由","id":"tdf-109-07","laws":[],"no":7,"options":["興辦事業計畫經目的事業主管機關廢止或依法失其效力、整地排水計畫之核准經直轄市或縣（市）政府廢止或水土保持計畫之核准經水土保持主管機關廢止或依法失其效力","申請人自行申請廢止","與水源供應、鄰近之交通設施、排水系統、電力、電信及垃圾處理等公共設施及公用設備服務未能相互配合者","違反核定之土地使用計畫、目的事業或環境影響評估等相關法規，經該管主管機關提出要求處分並經限期改善而未改善"],"stem":"依非都市土地使用管制規則規定，關於區域計畫擬定機關核發開發許可後，直轄市或縣（市）政府應報經區域計畫擬定機關廢止原開發許可之情形，下列敘述何者錯誤？","subject":"土地法","topic":"廢止開發許可","year":109},{"answer":"B","explain":"每 2 年重新規定地價；分區調查最近 1 年買賣價格；未申報→公告地價 80%；申報未滿公告地價 80%→照價收買（不是徵收）","id":"tdf-109-08","laws":[],"no":8,"options":["規定地價後，每三年重新規定地價一次。但必要時得延長之","直轄市或縣（市）主管機關辦理規定地價或重新規定地價時，須分區調查最近一年之土地買賣價格或收益價格","土地所有權人申報之地價未滿公告地價百分之八十時，得徵收之","土地所有權人未於公告期間申報地價者，以公告地價為其申報地價"],"stem":"關於規定地價，依平均地權條例之規定，下列敘述何者正確？","subject":"土地法","topic":"規定地價","year":109},{"answer":"D","explain":"得繼續原來使用或改為妨礙目的較輕的使用（都計 §51）；徵收補償以「毗鄰非公設保留地」平均公告土地現值為準；臨時建築使用辦法由內政部定","id":"tdf-109-09","laws":[{"ref":"都市計畫法 §51","text":"依本法指定之公共設施保留地，不得為妨礙其指定目的之使用。但得繼續為原來之使用或改為妨礙目的較輕之使用。"}],"no":9,"options":["公共設施保留地劃設逾二十五年未經政府取得者，得優先辦理徵收","公共設施保留地，其地價補償以徵收當期毗鄰公共設施保留地之平均公告土地現值為準，必要時得加成補償之","都市計畫公共設施保留地臨時建築使用辦法，由直轄市、縣（市）政府定之","依法指定之公共設施保留地，得繼續為原來之使用或改為妨礙目的較輕之使用"],"stem":"都市計畫法有關公共設施保留地之規定，下列敘述何者正確？","subject":"土地法","topic":"公設保留地","year":109},{"answer":"B","explain":"通知後 6 個月內繳還補償費，不是 3 個月；發給完竣滿 3 年未開始使用、開始使用未滿 5 年不依計畫使用→可收回","id":"tdf-109-11","laws":[],"no":11,"options":["被徵收之土地，依原徵收計畫開始使用後未滿五年，不繼續依原徵收計畫使用者","原土地所有權人應於該管直轄市或縣（市）主管機關通知後三個月內繳還原受領之補償地價及地價加成補償，逾期視為放棄收回權","申請收回土地案件，應由該管直轄市或縣（市）主管機關受理","被徵收之土地，徵收補償費發給完竣屆滿三年，未依徵收計畫開始使用者"],"stem":"關於原土地所有權人申請已徵收土地之收回權，依土地徵收條例規定，下列敘述何者錯誤？","subject":"土地法","topic":"收回權","year":109},{"answer":"A","explain":"農作物 1 年內成熟按孳息估；市價是公告期滿次日起第 15 日評定（不是第 10 日）；建物按「重建價格」（不是起造當時）；公設保留地按「毗鄰非保留地」市價（113-6 同一組選項又錯）","id":"tdf-109-12","laws":[],"no":12,"options":["農作改良物之補償費，於農作改良物被徵收時與其孳息成熟時期相距在1 年以內者，按成熟時之孳息估定之","徵收當期市價指徵收公告期滿次日起算第十日經地價評議委員會評定之當期市價","建築改良物之補償費，按起造當時該建築改良物之重建價格估定之","被徵收土地在都市計畫區內之公共設施保留地，應按毗鄰公共設施保留地之平均市價補償其地價"],"stem":"有關徵收補償，依土地徵收條例相關規定，下列敘述何者正確？","subject":"土地法","topic":"徵收補償","year":109},{"answer":"D","explain":"編為建築用地、出租人收回自建或出售建築→可終止；補償：改良費＋尚未收穫農作物＋公告現值扣除增值稅後餘額 1/3；收回後滿 1 年不依計畫建築→照價收買","id":"tdf-109-13","laws":[],"no":13,"options":["耕地出租人依規定終止租約收回耕地時，應補償承租人為改良土地所支付之費用及已收穫之農作改良物","耕地出租人依規定終止租約，實際收回耕地屆滿二年後，不依照使用計畫建築使用者，直轄市或縣（市）政府得照價收買之","耕地出租人依規定終止租約收回耕地時，承租人得向出租人請求按公告當期該土地之公告土地現值三分之一之補償","出租耕地經依法編為建築用地者，出租人為收回自行建築或出售作為建築使用時，得終止租約"],"stem":"關於耕地終止租約與補償，依平均地權條例規定，下列敘述何者正確？","subject":"土地法","topic":"耕地終止租約","year":109},{"answer":"C","explain":"違反民法 §443 擅自轉租→可收回；積欠租金扣擔保金後達 2 個月（題目只有 1 個月）；生病、工作調動不是事由","id":"tdf-109-14","laws":[{"ref":"土地法 §100","text":"出租人非因左列情形之一，不得收回房屋。\n一、出租人收回自住或重新建築時。\n二、承租人違反民法第四百四十三條第一項之規定轉租於他人時。\n三、承租人積欠租金額，除擔保金抵償外，達二個月以上時。\n四、承租人以房屋供違反法令之使用時。\n五、承租人違反租賃契約時。\n六、承租人損壞出租人之房屋或附著財物，而不為相當之賠償時。"}],"no":14,"options":["承租人乙因疾病、意外產生有長期住院療養之需要時","承租人乙積欠租金額，以擔保金抵償之後，尚有1 個月租金未繳時","承租人乙違反民法第443 條第1 項規定，將該屋轉租給他高中同學時","承租人乙因為工作調動，無法繼續居住時"],"stem":"甲有A 屋一棟，出租給乙居住使用。依土地法第100 條之規定，出租人因下列何項情形，得收回房屋？","subject":"土地法","topic":"房屋收回 §100","year":109},{"answer":"B","explain":"租期超過 5 年→標售後以 5 年為限；逾 1 年未辦→公告 3 個月（不是 6 個月）；標售前公告 3 個月（選項寫 10 日）；價款 10 年歸國庫（選項寫 15 年）","id":"tdf-109-15","laws":[{"ref":"土地法 §73-1","text":"土地或建築改良物，自繼承開始之日起逾一年未辦理繼承登記者，經該管直轄市或縣市地政機關查明後，應即公告繼承人於三個月內聲請登記，並以書面通知繼承人；逾期仍未聲請者，得由地政機關予以列冊管理。但有不可歸責於聲請人之事由，其期間應予扣除。\n前項列冊管理期間為十五年，逾期仍未聲請登記者，由地政機關書面通知繼承人及將該土地或建築改良物清冊移請財政部國有財產署公開標售。繼承人占有或第三人占有無合法使用權者，於標售後喪失其占有之權利；土地或建築改良物租賃期間超過五年者，於標售後以五年為限。\n依第二項規定標售土地或建築改良物前應公告三個月，繼承人、合法使用人或其他共有人就其使用範圍依序有優先購買權。但優先購買權人未於決標後三十日內表示優先購買者，其優先購買權視為放棄。\n標售所得之價款應於國庫設立專戶儲存，繼承人得依其法定應繼分領取。逾十年無繼承人申請提領該價款者，歸屬國庫。\n第二項標售之土地或建築改良物無人應買或應買人所出最高價未達標售之最低價額者，由財政部國有財產署定期再標售，於再行標售時，財政部國有財產署應酌減拍賣最低價額，酌減數額不得逾百分之二十。經五次標售而未標出者，登記為國有並準用第二項後段喪失占有權及租賃期限之規定。自登記完畢之日起十年內，原權利人得檢附證明文件按其法定應繼分，向財政部國有財產署申請就第四項專戶提撥發給價金；經審查無誤，公告九十日期滿無人異議時，按該土地或建築改良物第五次標售底價分算發給之。"}],"no":15,"options":["經縣市地政機關查明後，應即公告繼承人於6 個月內聲請登記；逾期仍未聲請者，得由地政機關予以列冊管理","繼承人占有或第三人占有無合法使用權者，於標售後喪失其占有之權利；土地或建築改良物租賃期間超過5 年者，於標售後以5 年為限","標售所得之價款應於國庫設立專戶儲存，繼承人得依其法定應繼分領取。逾15 年無繼承人申請提領該價款者，歸屬國庫","標售土地或建築改良物前應公告10 日，繼承人、合法使用人或其他共有人就其使用範圍依序有優先購買權"],"stem":"土地或建築改良物，自繼承開始之日起逾1 年未辦理繼承登記者，依土地法之規定，其處理程序何者正確？","subject":"土地法","topic":"逾期未辦繼承 §73-1","year":109},{"answer":"A","explain":"屬限制登記→免登記費；對徵收、法院判決、強制執行無排除效力（題目多塞了「繼承」）；妨礙請求權的處分「無效」但不是絕對無效","id":"tdf-109-16","laws":[],"no":16,"options":["該預告登記為保全登記、暫時登記，其登記免納登記費","該預告登記，對於因繼承、強制執行、徵收、法院判決而為之新登記，無排除之效力","預告登記完畢後，如甲將A 屋移轉於丙，該處分絕對無效","嗣後甲欲就A 屋申辦抵押權次序變更登記時，應檢附乙的同意書，始得為之"],"stem":"甲有A 屋，與乙簽訂買賣契約但尚未為移轉登記，乙對甲的A 屋移轉請求權申請預告登記。下列敘述何者最正確？","subject":"土地法","topic":"預告登記","year":109},{"answer":"D","explain":"地政機關拒絕→向司法機關起訴","id":"tdf-109-22","laws":[],"no":22,"options":["監察院","行政院","立法院","司法機關"],"stem":"依土地法規定，土地登記損害賠償之請求，如經該地政機關拒絕，受損害人得向下列何者起訴？","subject":"土地法","topic":"登記損害賠償","year":109},{"answer":"D","explain":"調處不服→接到通知 15 日內向司法機關訴請處理；應有部分出賣→他共有人優先購買（不是地上權人）；專有＋基地一起賣同一人→不適用優先購買","id":"tdf-109-24","laws":[{"ref":"土地法 §34-1","text":"共有土地或建築改良物，其處分、變更及設定地上權、農育權、不動產役權或典權，應以共有人過半數及其應有部分合計過半數之同意行之。但其應有部分合計逾三分之二者，其人數不予計算。\n共有人依前項規定為處分、變更或設定負擔時，應事先以書面通知他共有人；其不能以書面通知者，應公告之。\n第一項共有人，對於他共有人應得之對價或補償，負連帶清償責任。於為權利變更登記時，並應提出他共有人已為受領或為其提存之證明。其因而取得不動產物權者，應代他共有人申請登記。\n共有人出賣其應有部分時，他共有人得以同一價格共同或單獨優先承購。\n前四項規定，於公同共有準用之。\n依法得分割之共有土地或建築改良物，共有人不能自行協議分割者，任何共有人得申請該管直轄市、縣（市）地政機關調處，不服調處者，應於接到調處通知後十五日內向司法機關訴請處理，屆期不起訴者，依原調處結果辦理之。"}],"no":24,"options":["甲、乙、丙共有一筆土地，其應有部分各三分之一，該地之應有部分出賣時，地上權人、典權人或房屋承租人有依同樣條件優先購買之權","土地共有人欲出租共有土地於他人時，得以共有人過半數及其應有部分合計過半數之同意行之","區分所有建物之專有部分連同其基地應有部分之所有權一併移轉與同一人所有者，應適用土地法第34 條之1 第4 項規定","依法得分割之共有土地或建築改良物，共有人不能自行協議分割者，任何共有人得申請該管直轄市、縣（市）地政機關調處。不服調處者，應於接到調處通知後十五日內，向司法機關訴請處理，屆期不起訴者，依原調處結果辦理之"],"stem":"關於不動產共有關係，依土地法第34 條之1 規定，下列敘述何者正確？","subject":"土地法","topic":"共有 §34-1","year":109},{"answer":"D","explain":"考試當年答案是 4 年；現行法（國土計畫法 §45 II）已改成縣市國土計畫公告實施後 10 年內","id":"tdf-109-25","laws":[{"ref":"國土計畫法 §45","text":"中央主管機關應於本法施行後二年內，公告實施全國國土計畫。\n直轄市、縣（市）主管機關應於全國國土計畫公告實施後三年內，依中央主管機關指定之日期，一併公告實施直轄市、縣（市）國土計畫；並於直轄市、縣（市）國土計畫公告實施後十年內，依中央主管機關指定之日期，一併公告國土功能分區圖。\n直轄市、縣（市）主管機關依前項公告國土功能分區圖之日起，區域計畫法停止適用。"}],"no":25,"options":["一","二","三","四"],"stem":"依國土計畫法規定，縣（市）主管機關應於縣（市）國土計畫公告實施後幾年內，依中央主管機關指定之日期，公告國土功能分區圖？","subject":"土地法","topic":"國土功能分區圖","warn":"修法題：考試當年答案是 4 年，現行國土計畫法 §45 Ⅱ 已改成縣市國土計畫公告實施後 10 年內。","year":109},{"answer":"B","explain":"用途第 8 款「有助於國內重大建設、整體經濟或農牧經營之投資」→申請縣市政府核准前，要先經中央目的事業主管機關同意；縣市核准後報中央地政機關備查","id":"tdf-110-01","laws":[{"ref":"土地法 §19","text":"外國人為供自用、投資或公益之目的使用，得取得左列各款用途之土地，其面積及所在地點，應受該管直轄市或縣（市）政府依法所定之限制︰\n一、住宅。\n二、營業處所、辦公場所、商店及工廠。\n三、教堂。\n四、醫院。\n五、外僑子弟學校。\n六、使領館及公益團體之會所。\n七、墳場。\n八、有助於國內重大建設、整體經濟或農牧經營之投資，並經中央目的事業主管機關核准者。\n前項第八款所需土地之申請程序、應備文件、審核方式及其他應遵行事項之辦法，由行政院定之。"},{"ref":"土地法 §20","text":"外國人依前條需要取得土地，應檢附相關文件，申請該管直轄市或縣（市）政府核准；土地有變更用途或為繼承以外之移轉時，亦同。其依前條第一項第八款取得者，並應先經中央目的事業主管機關同意。\n直轄市或縣（市）政府為前項之准駁，應於受理後十四日內為之，並於核准後報請中央地政機關備查。\n外國人依前條第一項第八款規定取得土地，應依核定期限及用途使用，因故未能依核定期限使用者，應敘明原因向中央目的事業主管機關申請展期；其未依核定期限及用途使用者，由直轄市或縣（市）政府通知土地所有權人於通知送達後三年內出售。逾期未出售者，得逕為標售，所得價款發還土地所有權人；其土地上有改良物者，得併同標售。\n前項標售之處理程序、價款計算、異議處理及其他應遵行事項之辦法，由中央地政機關定之。"}],"no":1,"options":["中央地政機關備查","中央目的事業主管機關同意","該直轄市或縣（市）民意機關同意","該直轄市或縣（市）政府層請行政院同意"],"stem":"依土地法規定，外國人投資有助於國內重大建設、整體經濟或農牧經營而需要取得土地時，應先經下列何者程序？","subject":"土地法","topic":"外國人重大投資 土 §19、§20","year":110},{"answer":"A","explain":"界址爭議→準用 §59 II，由地政機關調處；不服調處→接到通知 15 日內訴請司法機關（不是 30 日）；認為測錯→「公告期間內」繳複丈費聲請複丈；沒聲請→辦標示變更登記（不是更正登記）（107-5、106-28 同觀念，第 3 次）","id":"tdf-110-02","laws":[{"ref":"土地法 §46-2","text":"重新實施地籍測量時，土地所有權人應於地政機關通知之限期內，自行設立界標，並到場指界。逾期不設立界標或到場指界者，得依左列順序逕行施測：\n一、鄰地界址。\n二、現使用人之指界。\n三、參照舊地籍圖。\n四、地方習慣。\n土地所有權人因設立界標或到場指界發生界址爭議時，準用第五十九條第二項規定處理之。"},{"ref":"土地法 §46-3","text":"重新實施地籍測量之結果，應予公告，其期間為三十日。\n土地所有權人認為前項測量結果有錯誤，除未依前條之規定設立界標或到場指界者外，得於公告期間內，向該管地政機關繳納複丈費，聲請複丈。經複丈者，不得再聲請複丈。\n逾公告期間未經聲請複丈，或複丈結果無誤或經更正者，地政機關應即據以辦理土地標示變更登記。"},{"ref":"土地法 §59","text":"土地權利關係人，在前條公告期間內，如有異議，得向該管直轄市或縣（市）地政機關以書面提出，並應附具證明文件。\n因前項異議而生土地權利爭執時，應由該管直轄市或縣（市）地政機關予以調處，不服調處者，應於接到調處通知後十五日內，向司法機關訴請處理，逾期不起訴者，依原調處結果辦理之。"}],"no":2,"options":["土地所有權人發生界址爭議時，應由該管直轄市或縣（市）地政機關予以調處","土地所有權人不服界址爭議調處者，應於接到調處通知後三十日內，向司法機關訴請處理","土地所有權人認為測量結果有錯誤時，得於重測結果公告期滿三十日內聲請複丈","重測結果未經聲請複丈者，地政機關應即據以辦理土地更正登記"],"stem":"有關重新實施地籍測量時，依土地法規定，下列敘述何者正確？","subject":"土地法","topic":"地籍重測 土 §46-2、§46-3","year":110},{"answer":"B","explain":"由縣市地政機關「逕為登記」，所有權人欄註明「國有」（不是囑託、不是縣市有）","id":"tdf-110-03","laws":[{"ref":"土地法 §53","text":"無保管或使用機關之公有土地及因地籍整理而發現之公有土地，由該管直轄市或縣（市）地政機關逕為登記，其所有權人欄註明為國有。"}],"no":3,"options":["由該管直轄市或縣（市）地政機關囑託登記，其所有權人欄註明為國有","由該管直轄市或縣（市）地政機關逕為登記，其所有權人欄註明為國有","由該管直轄市或縣（市）地政機關囑託登記，其所有權人欄註明為直轄市或縣（市）有","由該管直轄市或縣（市）地政機關逕為登記，其所有權人欄註明為直轄市或縣（市）有"],"stem":"依土地法之規定，無保管或使用機關之公有土地及因地籍整理而發現之公有土地，應如何處理？","subject":"土地法","topic":"無主管機關公有土地 土 §53","year":110},{"answer":"C","explain":"由「權利人」按「申報地價」或權利價值 1‰ 繳納","id":"tdf-110-04","laws":[{"ref":"土地法 §76","text":"聲請為土地權利變更登記，應由權利人按申報地價或權利價值千分之一繳納登記費。\n聲請他項權利內容變更登記，除權利價值增加部分，依前項繳納登記費外，免納登記費。"}],"no":4,"options":["由權利人與義務人雙方共同按公告地價或權利價值千分之一繳納登記費","由權利人按公告現值或權利價值千分之二繳納登記費","由權利人按申報地價或權利價值千分之一繳納登記費","由義務人按公告現值或權利價值千分之二繳納登記費"],"stem":"依土地法規定，聲請為土地權利變更登記，應繳納登記費，下列敘述何者正確？","subject":"土地法","topic":"權利變更登記費 土 §76","year":110},{"answer":"D","explain":"擔保現金的「利息」視為租金之一部（不是現金本身）；租金 ≤ 申報總價年息 10%；擔保金 ≤ 2 個月租金，超過可抵房租","id":"tdf-110-05","laws":[{"ref":"土地法 §97","text":"城市地方房屋之租金，以不超過土地及其建築物申報總價年息百分之十為限。\n約定房屋租金，超過前項規定者，該管直轄市或縣（市）政府得依前項所定標準強制減定之。"},{"ref":"土地法 §99","text":"前條擔保之金額，不得超過二個月房屋租金之總額。\n已交付之擔保金，超過前項限度者，承租人得以超過之部份抵付房租。"}],"no":5,"options":["城市地方房屋之租金，以不超過土地及其建築物申報總價年息百分之十為限","約定房屋租金，超過土地法規定者，該管直轄市或縣（市）政府得依土地法所定標準強制減定之","房屋租金擔保之金額，不得超過二個月房屋租金之總額","以現金為租賃之擔保者，其現金視為租金之一部"],"stem":"依土地法規定，房屋租用相關規定，下列何者錯誤？","subject":"土地法","topic":"房屋租金擔保 土 §97～§99","year":110},{"answer":"C","explain":"縣市政府決定，但要經「民意機關」同意","id":"tdf-110-06","laws":[{"ref":"土地法 §123","text":"遇有荒歉，直轄市或縣（市）政府得按照當地當年收穫實況為減租或免租之決定。但應經民意機關之同意。"}],"no":6,"options":["行政院","財政部","民意機關","農業發展委員會"],"stem":"依土地法之規定，遇有荒歉，直轄市或縣（市）政府得按照當地當年收穫實況為減租或免租之決定。但應經何機關同意？","subject":"土地法","topic":"荒歉減免租 土 §123","year":110},{"answer":"B","explain":"因公告地價調整繳納困難→延期 ≤ 6 個月、分期 ≤ 1 年","id":"tdf-110-07","laws":[{"ref":"平均地權條例 §17","text":"已規定地價之土地，應按申報地價，依法徵收地價稅。\n應納地價稅額因公告地價調整致納稅義務人繳納困難者，得於規定繳納期間內，向稅捐稽徵機關申請延期或分期繳納，延期繳納期間不得逾六個月，分期繳納期間不得逾一年。\n前項延期或分期繳納辦法，直轄市及縣（市）政府得依社會經濟情況及實際需要定之。"}],"no":7,"options":["3 個月","6 個月","1 年","3 年"],"stem":"依平均地權條例規定，應納地價稅額因公告地價調整致納稅義務人繳納困難者，得於規定繳納期間內，向稅捐稽徵機關申請延期繳納，延期繳納期間最長不得逾多久？","subject":"土地法","topic":"地價稅延期繳納 平 §17","year":110},{"answer":"A","explain":"違規追補＋2 倍罰鍰：未按捐贈目的使用、違反設立宗旨、收益未全用於該事業；「未辦用地變更」不是","id":"tdf-110-08","laws":[{"ref":"平均地權條例 §35-1","text":"私人捐贈供興辦社會福利事業使用之土地，免徵土地增值稅。但以符合左列各款規定者為限：\n一、受贈人為財團法人。\n二、法人章程載明法人解散時，其賸餘財產歸屬當地地方政府所有。\n三、捐贈人未以任何方式取得所捐贈土地之利益。"}],"no":8,"options":["未辦理用地變更者","未按捐贈目的使用土地者","違反各該事業設立宗旨者","土地收益未全部用於各該事業者"],"stem":"平均地權條例第35 條之1 規定，私人捐贈予財團法人供興辦社會福利事業使用之土地，免徵土地增值稅；但有三種情形之一者，除追補應納之土地增值稅外，並處應納土地增值稅額二倍之罰鍰。下列何者不是規範中的情形？","subject":"土地法","topic":"捐贈社福免增值稅 平 §35-1","year":110},{"answer":"C","explain":"按戶（棟）處 15 萬～100 萬","id":"tdf-110-10","laws":[],"no":10,"options":["三萬元以上十五萬元以下罰鍰","六萬元以上三十萬元以下罰鍰","十五萬元以上一百萬元以下罰鍰","三十萬元以上一百萬元以下罰鍰"],"stem":"依平均地權條例規定，預售屋買受人將已付定金，確立買賣標的物及價金等事項之書面契據，轉售予第三人時，由直轄市、縣（市）主管機關按戶（棟）處罰新臺幣多少元？","subject":"土地法","topic":"預售屋紅單轉售","year":110},{"answer":"B","explain":"3 年以下有期徒刑，得併科 7 千元以下罰金","id":"tdf-110-11","laws":[{"ref":"平均地權條例 §83","text":"以經營土地買賣，違背土地法律，從事土地壟斷、投機者，處三年以下有期徒刑，並得併科七千元以下罰金。"}],"no":11,"options":["處一年以下有期徒刑，並得併科五千元以下罰金","處三年以下有期徒刑，並得併科七千元以下罰金","處一年以下有期徒刑，並得併科八千元以下罰金","處三年以下有期徒刑，並得併科一萬元以下罰金"],"stem":"下列有關平均地權條例對以經營土地買賣，違背土地法律，從事土地壟斷、投機者處罰規定之敘述，何者正確？","subject":"土地法","topic":"土地壟斷投機 平 §83","year":110},{"answer":"A","explain":"列冊管理 15 年→移國有財產署公開標售","id":"tdf-110-14","laws":[{"ref":"土地法 §73-1","text":"土地或建築改良物，自繼承開始之日起逾一年未辦理繼承登記者，經該管直轄市或縣市地政機關查明後，應即公告繼承人於三個月內聲請登記，並以書面通知繼承人；逾期仍未聲請者，得由地政機關予以列冊管理。但有不可歸責於聲請人之事由，其期間應予扣除。\n前項列冊管理期間為十五年，逾期仍未聲請登記者，由地政機關書面通知繼承人及將該土地或建築改良物清冊移請財政部國有財產署公開標售。繼承人占有或第三人占有無合法使用權者，於標售後喪失其占有之權利；土地或建築改良物租賃期間超過五年者，於標售後以五年為限。\n依第二項規定標售土地或建築改良物前應公告三個月，繼承人、合法使用人或其他共有人就其使用範圍依序有優先購買權。但優先購買權人未於決標後三十日內表示優先購買者，其優先購買權視為放棄。\n標售所得之價款應於國庫設立專戶儲存，繼承人得依其法定應繼分領取。逾十年無繼承人申請提領該價款者，歸屬國庫。\n第二項標售之土地或建築改良物無人應買或應買人所出最高價未達標售之最低價額者，由財政部國有財產署定期再標售，於再行標售時，財政部國有財產署應酌減拍賣最低價額，酌減數額不得逾百分之二十。經五次標售而未標出者，登記為國有並準用第二項後段喪失占有權及租賃期限之規定。自登記完畢之日起十年內，原權利人得檢附證明文件按其法定應繼分，向財政部國有財產署申請就第四項專戶提撥發給價金；經審查無誤，公告九十日期滿無人異議時，按該土地或建築改良物第五次標售底價分算發給之。"}],"no":14,"options":["列冊管理期間為15 年，由財務部國有財產署公開標售","列冊管理期間為15 年，由地政機關公開標售","列冊管理期間為20 年，由法院公開拍賣","列冊管理期間為20 年，逕登記為國有土地"],"stem":"依土地法規定，未辦理繼承登記之土地經列冊管理達多久後，逾期仍未聲請登記者，該土地應如何處理？","subject":"土地法","topic":"逾期未辦繼承 土 §73-1","year":110},{"answer":"D","explain":"自行擬定或變更細部計畫→可要求提供或捐贈公共設施用地、可建築土地、樓地板面積、一定金額，四項都可以","id":"tdf-110-15","laws":[{"ref":"都市計畫法 §27-1","text":"土地權利關係人依第二十四條規定自行擬定或變更細部計畫，或擬定計畫機關依第二十六條或第二十七條規定辦理都市計畫變更時，主管機關得要求土地權利關係人提供或捐贈都市計畫變更範圍內之公共設施用地、可建築土地、樓地板面積或一定金額予當地直轄市、縣（市）政府或鄉、鎮、縣轄市公所。\n前項土地權利關係人提供或捐贈之項目、比例、計算方式、作業方法、辦理程序及應備書件等事項，由內政部於審議規範或處理原則中定之。"}],"no":15,"options":["僅①④","僅①②③","僅②③④","①②③④"],"stem":"土地權利關係人依都市計畫法第 24 條規定自行擬定或變更細部計畫時，主管機關得要求土地權利關係人提供或捐贈都市計畫變更範圍內之那些回饋項目予當地直轄市、縣（市）政府或鄉、鎮、縣轄市公所？①公共設施用地 ②可建築土地 ③樓地板面積 ④一定金額","subject":"土地法","topic":"細部計畫回饋 都計 §27-1","year":110},{"answer":"C","explain":"不受土地法、國有財產法、各級政府財產管理法令限制（沒有所得稅法）；劃設逾 25 年未取得者優先交換","id":"tdf-110-16","laws":[{"ref":"都市計畫法 §50-2","text":"私有公共設施保留地得申請與公有非公用土地辦理交換，不受土地法、國有財產法及各級政府財產管理法令相關規定之限制；劃設逾二十五年未經政府取得者，得優先辦理交換。\n前項土地交換之範圍、優先順序、換算方式、作業方法、辦理程序及應備書件等事項之辦法，由內政部會商財政部定之。\n本條之施行日期，由行政院定之。"}],"no":16,"options":["②④","②③④","①③④","①②③④"],"stem":"私有公共設施保留地得申請與公有非公用土地辦理交換，依都市計畫法之規定，不受下列那些法規相關規定之限制？①土地法 ②所得稅法 ③國有財產法 ④各級政府財產管理法令","subject":"土地法","topic":"公設保留地交換 都計 §50-2","year":110},{"answer":"B","explain":"重大建設臨時性設施核准後，用途及期限登錄於「土地參考資訊檔」（條號未核對）","id":"tdf-110-17","laws":[],"no":17,"options":["土地登記謄本","土地參考資訊檔","土地使用分區證明","非都市土地許可使用書"],"stem":"非都市土地經劃定使用分區並編定使用地類別，應依其容許使用之項目及許可使用細目使用。但中央目的事業主管機關認定為重大建設計畫所需之臨時性設施，經徵得使用地之中央主管機關及有關機關同意後，得核准為臨時使用。中央目的事業主管機關於核准時，應函請直轄市或縣（市）政府將臨時使用用途及期限等資料，依相關規定程序登錄於何處？","subject":"土地法","topic":"非都臨時使用","warn":"非都市土地使用管制規則條號未核對，依考選部答案。","year":110},{"answer":"A","explain":"都市 3 公畝「或」非都市 7 公畝（題目寫「和」）；出售前 1 年內無營業出租（不是 5 年）；設籍是本人、配偶或直系親屬（不是「未成年直系親屬」）；只有「按 10% 徵收」是對的","id":"tdf-110-19","laws":[{"ref":"土地稅法 §34","text":"土地所有權人出售其自用住宅用地者，都市土地面積未超過三公畝部分或非都市土地面積未超過七公畝部分，其土地增值稅統就該部分之土地漲價總數額按百分之十徵收之；超過三公畝或七公畝者，其超過部分之土地漲價總數額，依前條規定之稅率徵收之。\n前項土地於出售前一年內，曾供營業使用或出租者，不適用前項規定。\n第一項規定於自用住宅之評定現值不及所占基地公告土地現值百分之十者，不適用之。但自用住宅建築工程完成滿一年以上者不在此限。\n土地所有權人，依第一項規定稅率繳納土地增值稅者，以一次為限。\n土地所有權人適用前項規定後，再出售其自用住宅用地，符合下列各款規定者，不受前項一次之限制：\n一、出售都市土地面積未超過一‧五公畝部分或非都市土地面積未超過三‧五公畝部分。\n二、出售時土地所有權人與其配偶及未成年子女，無該自用住宅以外之房屋。\n三、出售前持有該土地六年以上。\n四、土地所有權人或其配偶、未成年子女於土地出售前，在該地設有戶籍且持有該自用住宅連續滿六年。\n五、出售前五年內，無供營業使用或出租。\n因增訂前項規定造成直轄市政府及縣（市）政府稅收之實質損失，於財政收支劃分法修正擴大中央統籌分配稅款規模之規定施行前，由中央政府補足之，並不受預算法第二十三條有關公債收入不得充經常支出之用之限制。\n前項實質損失之計算，由中央主管機關與直轄市政府及縣（市）政府協商之。"},{"ref":"土地稅法 §9","text":"本法所稱自用住宅用地，指土地所有權人或其配偶、直系親屬於該地辦竣戶籍登記，且無出租或供營業用之住宅用地。"}],"no":19,"options":["都市土地面積未超過三公畝部分和非都市土地面積未超過七公畝部分","其土地增值稅統就該部分之土地漲價總數額按百分之十徵收之","需土地於出售前5 年內，不曾供營業使用或出租者","土地所有權人與其配偶及未成年直系親屬需於該地辦竣戶籍登記"],"stem":"依土地稅法規定，土地所有權人第一次出售其自用住宅用地，其適用自用住宅用地特別稅率之要件，下列敘述何者正確？","subject":"土地法","topic":"一生一次自用住宅 土稅 §34、§9","year":110},{"answer":"A","explain":"政府出售公有土地→實際出售價額；政府贈與或受贈、私人捐贈社福→贈與契約訂約日當期公告現值；抵價地→實際領回抵價地的地價","id":"tdf-110-20","laws":[{"ref":"土地稅法 §30-1","text":"依法免徵土地增值稅之土地，主管稽徵機關應依下列規定核定其移轉現值並發給免稅證明，以憑辦理土地所有權移轉登記：\n一、依第二十八條但書規定免徵土地增值稅之公有土地，以實際出售價額為準；各級政府贈與或受贈之土地，以贈與契約訂約日當期之公告土地現值為準。\n二、依第二十八條之一規定，免徵土地增值稅之私有土地，以贈與契約訂約日當期之公告土地現值為準。\n三、依第三十九條之一第三項規定，免徵土地增值稅之抵價地，以區段徵收時實際領回抵價地之地價為準。"}],"no":20,"options":["各級政府出售之公有土地，以實際出售價額為準","各級政府贈與或受贈之土地，以土地點交日之公告土地現值為準","區段徵收抵價地，以區段徵收時實際測量及登記完竣之地價為準","私人捐贈供興辦社會福利事業之土地，以社會福利事業核准日之公告土地現值為準"],"stem":"依土地稅法免徵土地增值稅之土地，主管稽徵機關依相關規定核定其移轉現值並發給免稅證明，以憑辦理土地所有權移轉登記，下列有關移轉現值核定之敘述何者正確？","subject":"土地法","topic":"免徵增值稅移轉現值 土稅 §30-1","year":110},{"answer":"A","explain":"地主把土地出租、貸與或設地上權；地主把自己的建物出租或貸與；承租人等把他的建物出租或貸與→要協議建築，不成可終止租約或撤銷地上權（典權、不動產役權、農作改良物都不在內）","id":"tdf-110-21","laws":[{"ref":"平均地權條例 §74","text":"依第二十六條規定限期建築之土地，有左列情形之一者，土地所有權人應於接到限期使用通知後，與承租人、借用人或地上權人協議建築、增建或改建；協議不成時，得終止租約、借貸或撤銷地上權：\n一、土地所有權人將其土地出租、貸與或設有地上權者。\n二、土地所有權人將其所有之建築改良物出租或貸與他人使用者。\n三、土地承租人、借用人或地上權人將其所有建築改良物出租或貸與他人使用者。"}],"no":21,"options":["土地所有權人將其土地出租、貸與或設有地上權者","土地所有權人將其土地設定典權或設定不動產役權者","土地所有權人將其所有之農作改良物出租或貸與他人使用者","土地承典人或地役權人將其所有建築改良物出租或貸與他人使用者"],"stem":"平均地權條例第74 條規定，依第26 條規定限期建築之土地，有下列三種情形之一者，土地所有權人應於接到限期使用通知後，與承租人、借用人或地上權人協議建築、增建或改建；協議不成時，得終止租約、借貸或撤銷地上權。下列何者是規範中的情形？","subject":"土地法","topic":"限期建築租約 平 §74","year":110},{"answer":"D","explain":"境內個人：2 年內 45%、2～5 年 35%、5～10 年 20%、10 年以上 15%（題目把 3 年、30% 這些數字換掉）","id":"tdf-110-23","laws":[],"no":23,"options":["持有房屋、土地之期間在三年以內者，稅率為百分之四十五","持有房屋、土地之期間超過三年，未逾五年者，稅率為百分之三十五","持有房屋、土地之期間超過五年，未逾十年者，稅率為百分之三十","持有房屋、土地之期間超過十年者，稅率為百分之十五"],"stem":"有關中華民國境內居住之個人，依所得稅法規定計算之房屋、土地交易所得，減除當次交易依土地稅法第30 條第1 項規定公告土地現值計算之土地漲價總數額後之餘額，不併計綜合所得總額，其稅率計算下列何者正確？","subject":"土地法","topic":"房地合一稅率","year":110},{"answer":"B","explain":"按成交價 3% 計算、上限 30 萬：900 萬 × 3%＝27 萬","id":"tdf-110-25","laws":[],"no":25,"options":["24 萬元","27 萬元","30 萬元","45 萬元"],"stem":"依所得稅法規定，陳先生在110 年10 月以900 萬元出售其於107 年以700 萬元購入之房地產，110 年當期土地之公告現值為800 萬元，陳先生個人未提示因取得、改良及移轉而支付之費用時，稽徵機關得以多少元計算其費用？","subject":"土地法","topic":"房地合一未提示費用","year":110},{"answer":"A","explain":"公用事業→事業機構徵收或購買；其餘由政府或公所以徵收、區段徵收、市地重劃取得（協議價購、交換、都市更新都不在這三種裡）","id":"tdf-111-09","laws":[{"ref":"都市計畫法 §48","text":"依本法指定之公共設施保留地供公用事業設施之用者，由各該事業機構依法予以徵收或購買；其餘由該管政府或鄉、鎮、縣轄市公所依左列方式取得之：\n一、徵收。\n二、區段徵收。\n三、市地重劃。"}],"no":9,"options":["徵收、區段徵收、市地重劃","協議價購、公私土地交換、都市更新","都市更新、市地重劃、區段徵收","徵收、協議價購、公私土地交換"],"stem":"依都市計畫法指定供公用事業設施使用之公共設施保留地，應由各該事業機構依法徵收或購買；其餘由公用事業設施所屬政府或鄉、鎮、縣轄市公所依何種方式取得？","subject":"土地法","topic":"公設保留地取得 都計 §48","year":111},{"answer":"C","explain":"由需用土地人向中央主管機關申請；需用土地人不申請→原所有權人向縣市請求，縣市會同審查後向中央申請（不是縣市「單獨」）；原他項權利、耕地租約不予回復，只有在抵價地上設定的抵押權、典權准予回復","id":"tdf-111-11","laws":[{"ref":"土地徵收條例 §50","text":"撤銷或廢止徵收，由需用土地人向中央主管機關申請之。\n已公告徵收之土地有前條第一項或第二項各款情形之一，而需用土地人未申請撤銷或廢止徵收者，原土地所有權人得向該管直轄巿或縣（巿）主管機關請求之。\n該管直轄巿或縣（巿）主管機關收受前項請求後，應會同需用土地人及其他有關機關審查。其合於規定者，由需用土地人依第一項規定申請之；不合規定者，該管直轄巿或縣（巿）主管機關應將處理結果函復原土地所有權人。\n原土地所有權人不服前項處理結果，應於直轄巿或縣（巿）主管機關函復送達之日起三十日內向中央主管機關請求撤銷或廢止徵收。其合於規定者，由中央主管機關逕予撤銷或廢止；不合規定者，由中央主管機關將處理結果函復原土地所有權人。原土地所有權人不服處理結果者，依法提起行政救濟。\n已公告徵收之土地有前條第一項或第二項各款情形之一，而需用土地人未申請撤銷或廢止徵收者，由該管直轄市或縣（市）主管機關會同需用土地人及其他有關機關審查後向中央主管機關申請撤銷或廢止徵收。"},{"ref":"土地徵收條例 §52","text":"撤銷或廢止徵收後，徵收前原設定之他項權利及耕地租約不予回復。但依第四十二條規定由原土地所有權人及他項權利人申請於發給之抵價地設定抵押權或典權者，其原抵押權或典權准予回復。"}],"no":11,"options":["撤銷或廢止徵收者，徵收前原設定之他項權利及耕地租約得予回復","撤銷或廢止徵收者，如原土地所有權人及他項權利人申請於發給之抵價地上設定抵押權或典權時，其原抵押權或典權不予回復","撤銷或廢止徵收，由需用土地人向中央主管機關申請之","撤銷或廢止徵收，由該管直轄市或縣（市）主管機關單獨向中央主管機關申請之"],"stem":"依土地徵收條例之規定，下列敘述何者正確？","subject":"土地法","topic":"撤銷廢止徵收 土徵 §50、§52","year":111},{"answer":"D","explain":"主要計畫發布後最多 2 年完成細部計畫→細部計畫發布後最多 5 年完成公共設施（「2 細 5 公」）","id":"tdf-111-12","laws":[{"ref":"都市計畫法 §17","text":"第十五條第一項第九款所定之實施進度，應就其計畫地區範圍預計之發展趨勢及地方財力，訂定分區發展優先次序。第一期發展地區應於主要計畫發布實施後，最多二年完成細部計畫；並於細部計畫發布後，最多五年完成公共設施。其他地區應於第一期發展地區開始進行後，次第訂定細部計畫建設之。\n未發布細部計畫地區，應限制其建築使用及變更地形。但主要計畫發布已逾二年以上，而能確定建築線或主要公共設施已照主要計畫興建完成者，得依有關建築法令之規定，由主管建築機關指定建築線，核發建築執照。"}],"no":12,"options":["五年內完成細部計畫，細部計畫發布後二年內完成公共設施建設","四年內完成細部計畫，細部計畫發布後三年內完成公共設施建設","三年內完成細部計畫，細部計畫發布後四年內完成公共設施建設","二年內完成細部計畫，細部計畫發布後五年內完成公共設施建設"],"stem":"都市計畫地區於訂定分區發展優先次序後，第一期發展地區應於主要計畫發布實施後，多久期限完成細部計畫？並於細部計畫發布後，多久期限完成公共設施建設？","subject":"土地法","topic":"都計 §17 第一期發展地區","year":111},{"answer":"B","explain":"林地、漁地、狩獵地、鹽地、礦地、水源地、要塞軍備區及邊境；牧地、農地不在內→可以","id":"tdf-111-14","laws":[{"ref":"土地法 §17","text":"左列土地不得移轉、設定負擔或租賃於外國人：\n一、林地。\n二、漁地。\n三、狩獵地。\n四、鹽地。\n五、礦地。\n六、水源地。\n七、要塞軍備區域及領域邊境之土地。\n前項移轉，不包括因繼承而取得土地。但應於辦理繼承登記完畢之日起三年內出售與本國人，逾期未出售者，由直轄市、縣（市）地政機關移請國有財產局辦理公開標售，其標售程序準用第七十三條之一相關規定。\n前項規定，於本法修正施行前已因繼承取得第一項所列各款土地尚未辦理繼承登記者，亦適用之。"}],"no":14,"options":["林地","牧地","漁地","鹽地"],"stem":"依土地法第17 條規定，下列何項土地得租賃於外國人？","subject":"土地法","topic":"土 §17 不得租給外國人","year":111},{"answer":"C","explain":"中央地政機關報請行政院制止","id":"tdf-111-15","laws":[{"ref":"土地法 §16","text":"私有土地所有權之移轉、設定負擔或租賃，妨害基本國策者，中央地政機關得報請行政院制止之。"}],"no":15,"options":["監察院","國有財產署","中央地政機關","不動產經紀人員獎懲委員會"],"stem":"依土地法規定，私有土地所有權之移轉或租賃，妨害基本國策者，下列何者得報請行政院制止之？","subject":"土地法","topic":"土 §16 妨害基本國策","year":111},{"answer":"D","explain":"可建築土地標租或設定地上權，期限不得逾 99 年（不是 25 年）；國宅用地、安置原住戶→讓售","id":"tdf-111-17","laws":[{"ref":"土地徵收條例 §44","text":"區段徵收範圍內土地，經規劃整理後，除依第四十三條規定配回原管理機關及第四十三條之一規定配售外，其處理方式如下：\n一、抵價地發交被徵收土地所有權人領回。其應領回抵價地之面積，由該管直轄市或縣（市）主管機關按其應領地價補償費與區段徵收補償地價總額之比率計算其應領之權利價值，並以實際領回抵價地之單位地價折算之。\n二、道路、溝渠、公園、綠地、兒童遊樂場、廣場、停車場、體育場所及國民學校用地，無償登記為當地直轄市有、縣（市）有或鄉（鎮、市）有。\n三、前款以外之公共設施用地，得由主管機關依財務計畫需要，於徵收計畫書載明有償或無償撥供需地機關或讓售供公營事業機構使用。\n四、國民住宅用地、安置原住戶或經行政院專案核准所需土地得以讓售。\n五、其餘可供建築土地，得予標售、標租或設定地上權。\n依前項第一款規定領回面積不足最小建築單位面積者，應於規定期間內提出申請合併，未於規定期間內申請者，該管直轄市或縣（市）主管機關應於規定期間屆滿之日起三十日內，按原徵收地價補償費發給現金補償。\n第一項第二款以外之公共設施用地，如該事業得許民營者，其用地應依第一項第五款之規定辦理。\n依第一項第三款至第五款撥用或讓售地價及標售底價，以開發總費用為基準，按其土地之位置、地勢、交通、道路寬度、公共設施及預期發展等條件之優劣估定之。\n依第一項第五款標租或設定地上權時，其期限不得逾九十九年。\n第一項第五款土地之標售、標租及設定地上權辦法，由各級主管機關定之。"}],"no":17,"options":["抵價地發交被徵收土地所有權人領回","國民住宅用地得以讓售","安置原住戶所需土地得以讓售","可供建築土地依規定標租時，其期限不得逾二十五年"],"stem":"依土地徵收條例規定，區段徵收範圍內土地，經規劃整理後，有關其處理方式，下列敘述何者錯誤？","subject":"土地法","topic":"區段徵收土地處理 土徵 §44","year":111},{"answer":"B","explain":"道路、溝渠等十項用地，先以原公有道路、溝渠、河川及未登記地四項抵充，不足再由地主按受益比例負擔；折價抵付合計 ≤ 45%","id":"tdf-111-23","laws":[{"ref":"平均地權條例 §60","text":"依本條例規定實施市地重劃時，重劃區內供公共使用之道路、溝渠、兒童遊樂場、鄰里公園、廣場、綠地、國民小學、國民中學、停車場、零售市場等十項用地，除以原公有道路、溝渠、河川及未登記地等四項土地抵充外，其不足土地及工程費用、重劃費用與貸款利息，由參加重劃土地所有權人按其土地受益比例共同負擔，並以重劃區內未建築土地折價抵付。如無未建築土地者，改以現金繳納。其經限期繳納而逾期不繳納者，得移送法院強制執行。\n重劃區內未列為前項共同負擔之其他公共設施用地，於土地交換分配時，應以該重劃地區之公有土地優先指配。\n依第一項規定折價抵付共同負擔之土地，其合計面積以不超過各該重劃區總面積百分之四十五為限。但經重劃區內私有土地所有權人半數以上且其所有土地面積超過區內私有土地總面積半數之同意者，不在此限。"}],"no":23,"options":["原廣場、綠地、停車場、零售市場地","原公有道路、溝渠、河川及未登記地","原兒童遊樂場、鄰里公園、國民小學、國民中學地","原國有地、學產地、直轄市縣（市）有地、鄉鎮（市）有地"],"stem":"依平均地權條例規定，實施市地重劃時，重劃區內供公共使用之道路等十項用地，應優先以下列何種土地抵充？","subject":"土地法","topic":"重劃共同負擔 平 §60","year":111},{"answer":"D","explain":"是「低利」重劃貸款，不是免息；免收或減收規費及書狀費、優先興建公設、免徵或減徵地價稅田賦（109-5 同一條又錯）","id":"tdf-111-24","laws":[{"ref":"平均地權條例 §58","text":"為促進土地利用，擴大辦理市地重劃，得獎勵土地所有權人自行組織重劃會辦理之。其獎勵事項如左：\n一、給予低利之重劃貸款。\n二、免收或減收地籍整理規費及換發權利書狀費用。\n三、優先興建重劃區及其相關地區之公共設施。\n四、免徵或減徵地價稅與田賦。\n五、其他有助於市地重劃之推行事項。\n前項重劃會組織、職權、重劃業務、獎勵措施等事項之辦法，由中央主管機關定之。\n重劃會辦理市地重劃時，應由重劃區內私有土地所有權人半數以上，而其所有土地面積超過重劃區私有土地總面積半數以上者之同意，並經主管機關核准後實施之。"}],"no":24,"options":["優先興建重劃區之公共設施","免收或減收換發權利書狀費用","免徵或減徵地價稅與田賦","給予免息之重劃貸款"],"stem":"下列何者不屬於平均地權條例獎勵土地所有權人自行辦理市地重劃事業之獎勵事項？","subject":"土地法","topic":"獎勵自辦重劃 平 §58","year":111},{"answer":"B","explain":"一生一次：都市 3 公畝、非都市 7 公畝以內，稅率百分之十。","id":"tdf-112-02","laws":[{"ref":"土地稅法 §34 Ⅰ、Ⅱ","text":"土地所有權人出售其自用住宅用地者，都市土地面積未超過三公畝部分或非都市土地面積未超過七公畝部分，其土地增值稅統就該部分之土地漲價總數額按百分之十徵收之；……\n前項土地於出售前一年內，曾供營業使用或出租者，不適用前項規定。"},{"ref":"土地稅法 §34 Ⅴ③","text":"（一生一屋）三、出售前持有該土地六年以上。"}],"no":2,"notes":{"A":"一生一次是百分之十；千分之二是「地價稅」自用住宅稅率。","C":"出售前 1 年內曾營業或出租，反而「不適用」。","D":"一生一次沒有持有年限；持有 6 年以上是「一生一屋」的條件。"},"options":["土地增值稅之優惠稅率為千分之二","僅限於都市土地面積未超過三公畝部分或非都市土地面積未超過七公畝部分","土地於出售前一年內，曾供營業使用或出租","出售前應持有該土地三年以上"],"stem":"關於土地所有權人出售自用住宅用地時，土地增值稅適用「一生一次」之優惠稅率，下列何者正確？","subject":"土地法","topic":"一生一次自用住宅稅率","year":112},{"answer":"C","explain":"超過累進起點「未達 5 倍」才是 15‰；5～10 倍是 25‰。級距：10 → 15 → 25 → 35 → 45 → 55‰。","id":"tdf-112-05","laws":[{"ref":"土地稅法 §16 Ⅰ","text":"地價稅基本稅率為千分之十。土地所有權人之地價總額未超過土地所在地直轄市或縣（市）累進起點地價者，其地價稅按基本稅率徵收；超過累進起點地價者，依左列規定累進課徵：\n一、超過累進起點地價未達五倍者，就其超過部分課徵千分之十五。\n二、超過累進起點地價五倍至十倍者，就其超過部分課徵千分之二十五。\n三、超過累進起點地價十倍至十五倍者，就其超過部分課徵千分之三十五。\n四、超過累進起點地價十五倍至二十倍者，就其超過部分課徵千分之四十五。\n五、超過累進起點地價二十倍以上者，就其超過部分課徵千分之五十五。"}],"no":5,"notes":{"C":"5 倍到 10 倍那段是千分之二十五，不是千分之十五。"},"options":["地價稅之基本稅率為千分之十","土地所有權人之地價總額未超過土地所在地直轄市或縣（市）累進起點地價者，其地價稅按千分之十稅率徵收","土地所有權人之地價總額超過土地所在地直轄市或縣（市）累進起點地價五倍者，就其超過部分課徵千分之十五","土地所有權人之地價總額超過土地所在地直轄市或縣（市）累進起點地價十五倍至二十倍者，就其超過部分課徵千分之四十五"],"stem":"依土地稅法規定，地價稅之稅率，下列何者錯誤？","subject":"土地法","topic":"地價稅累進稅率","year":112},{"answer":"C","explain":"要先書面通知他共有人，不能書面通知才公告。","id":"tdf-112-06","laws":[{"ref":"土地法 §34-1 Ⅰ、Ⅱ","text":"共有土地或建築改良物，其處分、變更及設定地上權、農育權、不動產役權或典權，應以共有人過半數及其應有部分合計過半數之同意行之。但其應有部分合計逾三分之二者，其人數不予計算。\n共有人依前項規定為處分、變更或設定負擔時，應事先以書面通知他共有人；其不能以書面通知者，應公告之。"},{"ref":"民法 §819 Ⅰ","text":"各共有人，得自由處分其應有部分。"}],"no":6,"notes":{"A":"要「過半數」及應有部分合計「過半數」，不是半數。","B":"要應有部分合計「逾」三分之二，剛好三分之二不夠。","D":"自己的應有部分本來就可以自由處分（民法 §819 Ⅰ）。"},"options":["應以共有人半數及其應有部分半數之同意行之","應有部分合計三分之二者，其人數不予計算","共有人不能以書面通知他共有人者，應公告之","共有人不得單獨處分其應有部分"],"stem":"依土地法規定，關於共有土地之處分，下列何者正確？","subject":"土地法","topic":"共有土地處分 §34-1","year":112},{"answer":"C","explain":"無主土地公告不得少於 30 日。15 日是審查無誤的一般公告（§55）。","id":"tdf-112-07","laws":[{"ref":"土地法 §57","text":"逾登記期限無人聲請登記之土地或經聲請而逾限未補繳證明文件者，其土地視為無主土地，由該管直轄市或縣（市）地政機關公告之，公告期滿，無人提出異議，即為國有土地之登記。"},{"ref":"土地法 §58","text":"依第五十五條所為公告，不得少於十五日。\n依第五十七條所為公告，不得少於三十日。"}],"no":7,"notes":{"C":"無主土地（§57）公告是 30 日；15 日是 §55 審查無誤公告。"},"options":["其土地視為無主土地","由該管直轄市或縣（市）地政機關公告之","公告期間不得少於十五日","公告期滿，無人提出異議，即為國有土地之登記"],"stem":"有關土地總登記，經聲請而逾限未補繳證明文件者之情形，下列何者錯誤？","subject":"土地法","topic":"無主土地公告期間","year":112},{"answer":"C","explain":"流程數字：繼承登記 6 個月 → 逾 1 年 → 公告 3 個月 → 列冊 15 年 → 移國產署標售 → 價款 10 年歸國庫。","id":"tdf-112-08","laws":[{"ref":"土地法 §73 Ⅱ","text":"前項聲請，應於土地權利變更後一個月內為之。其係繼承登記者，得自繼承開始之日起，六個月內為之。……"},{"ref":"土地法 §73-1 Ⅰ、Ⅱ、Ⅳ","text":"土地或建築改良物，自繼承開始之日起逾一年未辦理繼承登記者，經該管直轄市或縣市地政機關查明後，應即公告繼承人於三個月內聲請登記，並以書面通知繼承人；逾期仍未聲請者，得由地政機關予以列冊管理。……\n前項列冊管理期間為十五年，逾期仍未聲請登記者，由地政機關書面通知繼承人及將該土地或建築改良物清冊移請財政部國有財產署公開標售。……\n標售所得之價款應於國庫設立專戶儲存，繼承人得依其法定應繼分領取。逾十年無繼承人申請提領該價款者，歸屬國庫。"}],"no":8,"notes":{"A":"繼承登記是 6 個月內（一般變更登記才是 1 個月）。","B":"是逾「1 年」未辦，公告「3 個月」內聲請，兩個數字都顛倒。","D":"價款是逾 10 年歸國庫。"},"options":["繼承登記應於繼承開始之日起一個月內為之，否則視為逾期登記","繼承開始之日起逾三個月未辦理繼承登記者，經該管直轄市或縣市地政機關查明後，應即公告繼承人於一年內聲請登記","逾期未聲請繼承登記之土地，經地政機關列冊管理十五年，逾期仍未聲請繼承登記者，由地政機關將該土地清冊移請財政部國有財產署公開標售","標售逾期未辦繼承登記土地所得之價款，逾十五年無繼承人申請提領該價款者始得歸屬國庫"],"stem":"依土地法規定，有關繼承登記，下列何者正確？","subject":"土地法","topic":"逾期未辦繼承 §73-1","year":112},{"answer":"C","explain":"契稅都由「取得的人」繳：買受人、典權人、受贈人、占有人。","id":"tdf-112-12","laws":[{"ref":"契稅條例 §3","text":"契稅稅率如下：\n一、買賣契稅為其契價百分之六。\n二、典權契稅為其契價百分之四。\n三、交換契稅為其契價百分之二。\n四、贈與契稅為其契價百分之六。\n五、分割契稅為其契價百分之二。\n六、占有契稅為其契價百分之六。"},{"ref":"契稅條例 §4、§5、§7","text":"買賣契稅，應由買受人申報納稅。\n典權契稅，應由典權人申報納稅。\n贈與契稅，應由受贈人估價立契，申報納稅。"}],"no":12,"notes":{"A":"買賣由買受人申報。","B":"贈與由受贈人申報。","D":"占有契稅是百分之六；百分之二的是交換、分割。"},"options":["買賣契稅應由出賣人申報納稅","贈與契稅應由贈與人估價立契，申報納稅","典權契稅，應由典權人申報納稅","占有契稅稅率為其契價百分之二"],"stem":"以下關於契稅之敘述，何者正確？","subject":"土地法","topic":"契稅納稅義務人與稅率","year":112},{"answer":"C","explain":"保管專戶：不適用提存法、要給利息、期限屆滿「次日」起 3 個月內存入、自「通知送達」生效日起逾 15 年歸國庫。","id":"tdf-112-13","laws":[{"ref":"土地徵收條例 §26","text":"直轄市或縣（市）主管機關應於國庫設立土地徵收補償費保管專戶，保管因受領遲延、拒絕受領或不能受領之補償費，不適用提存法之規定。直轄市或縣（市）主管機關應於本條例規定應發給補償費之期限屆滿次日起三個月內存入專戶保管，並通知應受補償人。自通知送達發生效力之日起，逾十五年未領取之補償費，歸屬國庫。\n前項保管專戶儲存之補償費應給付利息。以實收利息照付。"}],"no":13,"notes":{"A":"條文明講「不適用提存法」。","B":"條文是期限屆滿「次日」起 3 個月內。","D":"15 年是從「通知送達發生效力之日」起算，不是公告期滿。"},"options":["依提存法提存於直轄市或縣（市）主管機關於國庫設立之土地徵收補償費保管專戶","直轄市或縣（市）主管機關應於補償費發給期限屆滿之日起三個月內存入專戶保管","保管專戶儲存之補償費應給付利息","已依規定繳存專戶保管之徵收補償費，自徵收公告期滿之日起，逾十五年未領取者，歸屬國庫"],"stem":"依土地徵收條例規定，因受領遲延、拒絕受領或不能受領之補償費，下列何者正確？","subject":"土地法","topic":"徵收補償費保管專戶","year":112},{"answer":"B","explain":"撤銷＝一開始就有瑕疵（作業錯誤、都計已定其他開發方式）；廢止＝後來情況變了（工程變更設計、開始使用前事業改變／計畫註銷／開發或取得方式改變、情事變更）。","id":"tdf-112-14","laws":[{"ref":"土地徵收條例 §49 Ⅰ、Ⅱ","text":"已公告徵收之土地，需用土地人應切實按核准計畫及所定期限使用。在未依徵收計畫完成使用前，需用土地人應每年檢討其興辦事業計畫，並由其上級事業主管機關列管。有下列情形之一者，應辦理撤銷徵收：\n一、因作業錯誤，致原徵收之土地不在工程用地範圍內。\n二、公告徵收時，都市計畫已規定以聯合開發、市地重劃或其他方式開發。……\n已公告徵收之土地，有下列情形之一者，應廢止徵收：\n一、因工程變更設計，致原徵收之土地不在工程用地範圍內。\n二、依徵收計畫開始使用前，興辦之事業改變、興辦事業計畫經註銷、開發方式改變或取得方式改變。\n三、已依徵收計畫開始使用，尚未依徵收計畫完成使用之土地，因情事變更，致原徵收土地之全部或一部已無徵收之必要。"}],"no":14,"notes":{"A":"撤銷限於作業錯誤、或公告時都市計畫已定以聯合開發、市地重劃等方式開發。"},"options":["應撤銷徵收","應廢止徵收","土地所有權人得行使收回權","應舉行聽證"],"stem":"已公告徵收之土地，依徵收計畫開始使用前，興辦之事業改變時，依土地徵收條例之規定，下列何者正確？","subject":"土地法","topic":"撤銷 vs 廢止徵收","year":112},{"answer":"D","explain":"補正＝文件、資格、規費這類「補得起來」的問題；當事人間「有爭執」補不起來，直接駁回。","id":"tdf-112-15","laws":[{"ref":"土地登記規則 §56","text":"有下列各款情形之一者，登記機關應以書面敘明理由或法令依據，通知申請人於接到通知書之日起十五日內補正：\n一、申請人之資格不符或其代理人之代理權有欠缺。\n二、登記申請書不合程式，或應提出之文件不符或欠缺。\n三、登記申請書記載事項，或關於登記原因之事項，與登記簿或其證明文件不符，而未能證明其不符之原因。\n四、未依規定繳納登記規費。"},{"ref":"土地登記規則 §57 Ⅰ","text":"有下列各款情形之一者，登記機關應以書面敘明理由及法令依據，駁回登記之申請：\n一、不屬受理登記機關管轄。\n二、依法不應登記。\n三、登記之權利人、義務人或其與申請登記之法律關係有關之權利關係人間有爭執。\n四、逾期未補正或未照補正事項完全補正。"}],"no":15,"notes":{"D":"有爭執是 §57 駁回事由，不是補正。"},"options":["申請人之資格不符或其代理人之代理權有欠缺","登記申請書不合程式，或應提出之文件不符或欠缺","未依規定繳納登記規費","登記之權利人、義務人或其與申請登記之法律關係有關之權利關係人間有爭執"],"stem":"依土地登記規則之規定，於何種情形下登記機關應以書面敘明理由或法令依據，通知申請人於接到通知書之日起十五日內補正，下列何者錯誤？","subject":"土地法","topic":"登記補正 vs 駁回","year":112},{"answer":"D","explain":"租賃是契約，規定在民法債編，屬債權。抵押權、農育權是民法物權；耕作權是土地法規定的他項權利。","id":"tdf-112-16","laws":[{"ref":"民法 §421 Ⅰ","text":"稱租賃者，謂當事人約定，一方以物租與他方使用收益，他方支付租金之契約。"}],"no":16,"notes":{"D":"租賃權是債權（民法 §421 租賃契約）。"},"options":["抵押權","農育權","耕作權","租賃權"],"stem":"我國物權係採法定主義，於土地所有權以外之其他不動產物權，謂之他項權利，依民法及土地法之規定，下列何者非屬物權？","subject":"土地法","topic":"物權 vs 債權","year":112},{"answer":"A","explain":"§19 列舉 8 款：住宅、營業處所等、教堂、醫院、外僑子弟學校、使領館及公益團體會所、墳場、經核准的重大投資。沒有長照機構。","id":"tdf-112-17","laws":[{"ref":"土地法 §19 Ⅰ","text":"外國人為供自用、投資或公益之目的使用，得取得左列各款用途之土地，其面積及所在地點，應受該管直轄市或縣（市）政府依法所定之限制︰\n一、住宅。\n二、營業處所、辦公場所、商店及工廠。\n三、教堂。\n四、醫院。\n五、外僑子弟學校。\n六、使領館及公益團體之會所。\n七、墳場。\n八、有助於國內重大建設、整體經濟或農牧經營之投資，並經中央目的事業主管機關核准者。"}],"no":17,"notes":{"A":"長照機構不在 §19 列舉範圍。"},"options":["長照機構","住宅","醫院","營業處所、辦公場所、商店及工廠"],"stem":"依土地法之規定，外國人為供自用、投資或公益之目的使用，得取得所需之土地，其面積及所在地點，應受該管直轄市或縣（市）政府依法所定之限制，下列何種用途不屬之？","subject":"土地法","topic":"外國人取得土地用途","year":112},{"answer":"D","explain":"共有人優先購買權：接到通知 15 日內不表示視為放棄。對照：基地房屋 §104、耕地是 10 日。","id":"tdf-112-18","laws":[{"ref":"土地法第三十四條之一執行要點 第 13 點(一)","src":"內政部主管法規查詢系統","text":"他共有人於接到出賣通知後十五日內不表示者，其優先購買權視為放棄。"}],"no":18,"notes":{"D":"是 15 日，不是 20 日。"},"options":["部分共有人就共有土地或建築改良物為處分、變更及設定地上權、農育權、不動產役權或典權，應就共有物之全部為之","部分共有人依本法條規定為處分、變更或設定負擔前，應先行通知他共有人","出賣共有土地或建築改良物時，他共有人得以出賣之同一條件共同或單獨優先購買","他共有人於接到出賣通知後二十日內不表示者，其優先購買權視為放棄"],"stem":"依土地法第三十四條之一執行要點規定，有關共有人權利之行使，下列何者錯誤？","subject":"土地法","topic":"共有人優先購買權天數","year":112},{"answer":"B","explain":"地方政府辦地籍測量，實施計畫要送「中央」地政機關核定，不是自己核定自己。","id":"tdf-112-19","laws":[{"ref":"土地法 §45","text":"地籍測量，如由該管直轄市或縣（市）政府辦理，其實施計畫應經中央地政機關之核定。"},{"ref":"土地法 §44-1 Ⅰ、§46-2 Ⅰ、§46-3 Ⅰ","text":"地籍測量時，土地所有權人應設立界標，並永久保存之。\n重新實施地籍測量時，土地所有權人應於地政機關通知之限期內，自行設立界標，並到場指界。……\n重新實施地籍測量之結果，應予公告，其期間為三十日。"}],"no":19,"notes":{"B":"應經「中央」地政機關核定。"},"options":["地籍測量時，土地所有權人應設立界標，並永久保存之","地籍測量，如由該管直轄市或縣（市）政府辦理，其實施計畫應經該地方之地政機關核定","重新實施地籍測量時，土地所有權人應於地政機關通知之限期內，自行設立界標，並到場指界","重新實施地籍測量之結果，應予公告，其期間為三十日"],"stem":"依土地法規定，有關地籍測量之相關規定，下列何者錯誤？","subject":"土地法","topic":"地籍測量實施計畫核定","year":112},{"answer":"C","explain":"地政機關先賠；登記人員有重大過失，由該人員「償還」（機關向他求償），不是連帶賠償。","id":"tdf-112-20","laws":[{"ref":"土地法 §68 Ⅰ","text":"因登記錯誤遺漏或虛偽致受損害者，由該地政機關負損害賠償責任。但該地政機關證明其原因應歸責於受害人時，不在此限。"},{"ref":"土地法 §69","text":"登記人員或利害關係人，於登記完畢後，發見登記錯誤或遺漏時，非以書面聲請該管上級機關查明核准後，不得更正。……"},{"ref":"土地法 §70","text":"地政機關所收登記費，應提存百分之十作為登記儲金，專備第六十八條所定賠償之用。\n地政機關所負之損害賠償，如因登記人員之重大過失所致者，由該人員償還，撥歸登記儲金。"}],"no":20,"notes":{"C":"條文是「由該人員償還，撥歸登記儲金」，沒有連帶。"},"options":["因登記錯誤遺漏或虛偽致受損害者，由該地政機關負損害賠償責任","登記人員或利害關係人，於登記完畢後，發見登記錯誤或遺漏時，非以書面聲請該管上級機關查明核准後，不得更正","地政機關所負之損害賠償，如因登記人員之重大過失所致者，由該人員及地政機關負連帶損害賠償責任，撥歸登記儲金","損害賠償之請求，如經該地政機關拒絕，受損害人得向司法機關起訴"],"stem":"依土地法之規定，有關土地登記之損害賠償，下列何者錯誤？","subject":"土地法","topic":"登記損害賠償","year":112},{"answer":"A","explain":"空地照價收買，以收買當期「公告土地現值」為準。","id":"tdf-112-21","laws":[{"ref":"平均地權條例 §26","text":"直轄市或縣（市）政府對於私有空地，得視建設發展情形，分別劃定區域，限期建築、增建、改建或重建；逾期未建築、增建、改建或重建者，按該宗土地應納地價稅基本稅額加徵二倍至五倍之空地稅或照價收買。"},{"ref":"平均地權條例 §31","text":"照價收買土地之地價，依左列規定計算之：\n一、依第十六條規定收買者，以其申報地價為準。\n二、依第四十七條之一規定收買者，以其申報土地移轉現值為準。\n三、依第二十六條、第二十六條之一、第七十二條、第七十六條規定收買者，以收買當期之公告土地現值為準。"}],"no":21,"notes":{"A":"不是平均市價，是公告土地現值。"},"options":["規定照價收買者，以收買當期之平均市價為準","逾期未建築、增建、改建或重建者，按該宗土地應納地價稅基本稅額加徵二倍至五倍之空地稅或照價收買","依規定限期建築、增建、改建或重建之土地，其新建之改良物價值不及所占基地申報地價百分之五十者，直轄市或縣（市）政府不予核發建築執照","直轄市或縣（市）政府對於私有空地，得視建設發展情形，分別劃定區域，限期建築、增建、改建或重建"],"stem":"依平均地權條例規定，對私有空地之處置，下列何者錯誤","subject":"土地法","topic":"照價收買私有空地地價","year":112},{"answer":"C","explain":"主要計畫圖不得小於 1/10000；實施進度 5 年一期、最長 25 年。（細部計畫圖是 1/1200）","id":"tdf-112-22","laws":[{"ref":"都市計畫法 §15 Ⅱ","text":"前項主要計畫書，除用文字、圖表說明外，應附主要計畫圖，其比例尺不得小於一萬分之一；其實施進度以五年為一期，最長不得超過二十五年。"}],"no":22,"notes":{},"options":["五百分之一","一千分之一","一萬分之一","一萬五千分之一"],"stem":"依都市計畫法之規定，市鎮計畫之主要計畫書，除用文字、圖表說明外，應附主要計畫圖，其比例尺不得小於多少？","subject":"土地法","topic":"主要計畫圖比例尺","year":112},{"answer":"C","explain":"境內個人：2 年內 45%、2～5 年 35%、5～10 年 20%、10 年以上 15%；非自願因素、合建、都更 5 年內都是 20%；自住 10%。","id":"tdf-112-23","laws":[{"ref":"所得稅法 §14-4 Ⅲ①","text":"一、中華民國境內居住之個人：\n（一）持有房屋、土地之期間在二年以內者，稅率為百分之四十五。\n（二）持有房屋、土地之期間超過二年，未逾五年者，稅率為百分之三十五。\n（三）持有房屋、土地之期間超過五年，未逾十年者，稅率為百分之二十。\n（四）持有房屋、土地之期間超過十年者，稅率為百分之十五。\n（五）因財政部公告之調職、非自願離職或其他非自願性因素，交易持有期間在五年以下之房屋、土地者，稅率為百分之二十。\n（六）個人以自有土地與營利事業合作興建房屋，自土地取得之日起算五年內完成並銷售該房屋、土地者，稅率為百分之二十。\n……"}],"no":23,"notes":{"A":"2 年內是 45%。","B":"2～5 年是 35%。","D":"合建 5 年內是 20%。"},"options":["持有房屋、土地之期間在二年以內者，稅率為百分之三十五","持有房屋、土地之期間超過二年，未逾五年者，稅率為百分之二十五","因財政部公告之調職、非自願離職或其他非自願性因素，交易持有期間在五年以下之房屋、土地者，稅率為百分之二十","個人以自有土地與營利事業合作興建房屋，自土地取得之日起算五年內完成並銷售該房屋、土地者，稅率為百分之二十五"],"stem":"依所得稅法之規定，個人依第 14 條之 4 前 2 項規定計算之房屋、土地交易所得，減除當次交易依土地稅法第 30 條第 1 項規定公告土地現值計算之土地漲價總數額後之餘額，不併計綜合所得總額，按相關規定稅率計算應納稅額，其在中華民國境內居住之個人應納稅額，下列何者正確？","subject":"土地法","topic":"房地合一稅率","year":112},{"answer":"A","explain":"代繳 4 種：行蹤不明、權屬不明、無人管理、所有權人申請由占有人代繳。沒有「訴訟中」。","id":"tdf-112-24","laws":[{"ref":"土地稅法 §4 Ⅰ","text":"土地有左列情形之一者，主管稽徵機關得指定土地使用人負責代繳其使用部分之地價稅或田賦：\n一、納稅義務人行蹤不明者。\n二、權屬不明者。\n三、無人管理者。\n四、土地所有權人申請由占有人代繳者。"}],"no":24,"notes":{"A":"訴訟中不在 §4 列舉。"},"options":["土地進行訴訟者","權屬不明者","納稅義務人行蹤不明者","土地所有權人申請由占有人代繳者"],"stem":"依土地稅法之規定，主管稽徵機關得指定土地使用人負責代繳其使用部分之地價稅或田賦，下列何項非屬所規範者？","subject":"土地法","topic":"代繳地價稅","year":112},{"answer":"C","explain":"經核准的例外轉售：全國每 2 年 1 戶（棟）。另一種例外是配偶、直系血親、二親等內旁系血親間，沒有戶數限制。","id":"tdf-113-01","laws":[{"ref":"平均地權條例 §47-4 Ⅰ、Ⅱ","text":"預售屋或新建成屋買賣契約之買受人，於簽訂買賣契約後，不得讓與或轉售買賣契約與第三人，並不得自行或委託刊登讓與或轉售廣告。但配偶、直系血親或二親等內旁系血親間之讓與或轉售；或其他中央主管機關公告得讓與或轉售之情形並經直轄市、縣（市）主管機關核准者，不在此限。\n買受人依前項但書後段規定得讓與或轉售之戶（棟）數，全國每二年以一戶（棟）為限；……"}],"no":1,"notes":{},"options":["全國每一年以一戶（棟）為限","全國每一年以二戶（棟）為限","全國每二年以一戶（棟）為限","全國每二年以三戶（棟）為限"],"stem":"依平均地權條例規定，預售屋或新建成屋買賣契約之買受人，於簽訂買賣契約後，不得讓與或轉售買賣契約與第三人，但經其他中央主管機關公告得讓與或轉售之情形並經直轄市、縣（市）主管機關核准者，不在此限。買受人據此得讓與或轉售之戶（棟）數為何？","subject":"土地法","topic":"預售屋例外轉售戶數","year":113},{"answer":"A","explain":"屆期未申報、已辦竣移轉登記 → 3 萬～15 萬；處罰 2 次仍未改正 → 按次 30 萬～100 萬。","id":"tdf-113-02","laws":[{"ref":"平均地權條例 §81-2 Ⅰ","text":"違反第四十七條第二項規定，未共同申報登錄資訊者，直轄市、縣（市）主管機關應令其限期申報登錄資訊；屆期未申報登錄資訊，買賣案件已辦竣所有權移轉登記者，處新臺幣三萬元以上十五萬元以下罰鍰，並令其限期改正；屆期未改正者，按次處罰。經處罰二次仍未改正者，按次處新臺幣三十萬元以上一百萬元以下罰鍰。其含建物者，按戶（棟）處罰。"}],"no":2,"notes":{"D":"30 萬～100 萬是「處罰二次仍未改正」之後的按次處罰。"},"options":["新臺幣三萬元以上十五萬元以下罰鍰","新臺幣六萬元以上三十萬元以下罰鍰","新臺幣十五萬元以上五十萬元以下罰鍰","新臺幣三十萬元以上一百萬元以下罰鍰"],"stem":"依平均地權條例規定，權利人及義務人應於買賣案件申請所有權移轉登記時，申報登錄資訊，未共同申報登錄資訊者，直轄市、縣（市）主管機關應令其限期申報登錄資訊；屆期未申報登錄資訊，買賣案件已辦竣所有權移轉登記者，處多少罰鍰，並令其限期改正？","subject":"土地法","topic":"未申報登錄罰鍰","year":113},{"answer":"A","explain":"主要計畫幾乎都是「內政部核定」。要轉報行政院備案的只有首都、直轄市擬定的特定區；內政部自己訂的特定區是報行政院備案。","id":"tdf-113-04","laws":[{"ref":"都市計畫法 §20 Ⅰ","text":"主要計畫應依下列規定分別層報核定之：\n一、首都之主要計畫由內政部核定，轉報行政院備案。\n二、直轄市、省會、市之主要計畫由內政部核定。\n三、縣政府所在地及縣轄市之主要計畫由內政部核定。\n四、鎮及鄉街之主要計畫由內政部核定。\n五、特定區計畫由縣（市）政府擬定者，由內政部核定；直轄市政府擬定者，由內政部核定，轉報行政院備案；內政部訂定者，報行政院備案。"}],"no":4,"notes":{"B":"直轄市的主要計畫也是內政部核定。","C":"縣（市）擬定的特定區，內政部核定就好，不用轉報；要轉報行政院備案的是「直轄市」擬定的特定區。","D":"內政部訂定的特定區是報行政院「備案」，不是核定。"},"options":["鎮及鄉街之主要計畫由內政部核定","直轄市之主要計畫由行政院核定","特定區計畫由縣（市）政府擬定者，由內政部核定，轉報行政院備案","特定區計畫由內政部訂定者，由行政院核定"],"stem":"依都市計畫法規定，有關主要計畫之核定，下列何者正確？","subject":"土地法","topic":"主要計畫核定機關","year":113},{"answer":"B","explain":"每年檢討後是由「上級事業主管機關」列管，不是縣市政府。口訣：作業錯誤→撤銷；工程變更設計、開始使用前事業或開發方式改變→廢止。","id":"tdf-113-05","laws":[{"ref":"土地徵收條例 §49 Ⅰ、Ⅱ","text":"已公告徵收之土地，需用土地人應切實按核准計畫及所定期限使用。在未依徵收計畫完成使用前，需用土地人應每年檢討其興辦事業計畫，並由其上級事業主管機關列管。有下列情形之一者，應辦理撤銷徵收：\n一、因作業錯誤，致原徵收之土地不在工程用地範圍內。\n二、公告徵收時，都市計畫已規定以聯合開發、市地重劃或其他方式開發。但以聯合開發方式開發之土地，土地所有權人不願參與聯合開發者，不在此限。\n已公告徵收之土地，有下列情形之一者，應廢止徵收：\n一、因工程變更設計，致原徵收之土地不在工程用地範圍內。\n二、依徵收計畫開始使用前，興辦之事業改變、興辦事業計畫經註銷、開發方式改變或取得方式改變。\n三、已依徵收計畫開始使用，尚未依徵收計畫完成使用之土地，因情事變更，致原徵收土地之全部或一部已無徵收之必要。"},{"ref":"土地徵收條例 §50 Ⅰ","text":"撤銷或廢止徵收，由需用土地人向中央主管機關申請之。"}],"no":5,"notes":{"B":"列管的是需用土地人的「上級事業主管機關」。"},"options":["撤銷或廢止徵收，由需用土地人向中央主管機關申請之","在未依徵收計畫完成使用前，需用土地人應每年檢討其興辦事業計畫，並由該管直轄市或縣（市）政府列管","依徵收計畫開始使用前，開發方式改變，應廢止徵收","因作業錯誤，致原徵收之土地不在工程用地範圍內，應撤銷徵收"],"stem":"依土地徵收條例規定，有關徵收之撤銷或廢止之敘述，下列何者錯誤？","subject":"土地法","topic":"撤銷 vs 廢止徵收","year":113},{"answer":"D","explain":"農作物 1 年內會成熟→按成熟時的孳息；超過 1 年→按種植培育費用參酌現值。","id":"tdf-113-06","laws":[{"ref":"土地徵收條例 §30 Ⅰ、Ⅱ","text":"被徵收之土地，應按照徵收當期之市價補償其地價。在都市計畫區內之公共設施保留地，應按毗鄰非公共設施保留地之平均市價補償其地價。\n前項市價，由直轄市、縣（市）主管機關提交地價評議委員會評定之。"},{"ref":"土地徵收條例 §31 Ⅰ、Ⅱ","text":"建築改良物之補償費，按徵收當時該建築改良物之重建價格估定之。\n農作改良物之補償費，於農作改良物被徵收時與其孳息成熟時期相距在一年以內者，按成熟時之孳息估定之；其逾一年者，按其種植及培育費用，並參酌現值估定之。"}],"no":6,"notes":{"A":"公設保留地是按「毗鄰非公共設施保留地之平均市價」補償。","B":"市價由「地價評議委員會」評定。","C":"建物按「重建價格」，不是重置價格。"},"options":["在都市計畫區內之公共設施保留地，應按照徵收當期之市價補償其地價","徵收補償之地價，由不動產估價師評定之","建築改良物之補償費，按徵收當時該建築改良物之重置價格估定之","農作改良物之補償費，於農作改良物被徵收時與其孳息成熟時期相距在一年以內者，按成熟時之孳息估定之"],"stem":"依土地徵收條例規定，有關徵收補償費，下列何者正確？","subject":"土地法","topic":"徵收補償費計算","year":113},{"answer":"A","explain":"保管專戶：3 個月內存入、不適用提存法、要付利息、存入即視同補償完竣；自通知送達生效起逾「15 年」歸國庫。","id":"tdf-113-07","laws":[{"ref":"土地徵收條例 §26 Ⅰ～Ⅲ","text":"直轄市或縣（市）主管機關應於國庫設立土地徵收補償費保管專戶，保管因受領遲延、拒絕受領或不能受領之補償費，不適用提存法之規定。直轄市或縣（市）主管機關應於本條例規定應發給補償費之期限屆滿次日起三個月內存入專戶保管，並通知應受補償人。自通知送達發生效力之日起，逾十五年未領取之補償費，歸屬國庫。\n前項保管專戶儲存之補償費應給付利息。以實收利息照付。\n未受領之徵收補償費，依第一項規定繳存專戶保管時，視同補償完竣。"}],"no":7,"notes":{"A":"是 15 年。10 年是逾期未辦繼承「標售價款」歸國庫的年限，別搞混。"},"options":["自通知送達發生效力之日起，逾十年未領取之補償費，歸屬國庫","應於規定應發給補償費之期限屆滿次日起三個月內存入專戶保管","保管未受領之徵收補償費，不適用提存法之規定","未受領之徵收補償費，依規定繳存專戶保管時，視同補償完竣"],"stem":"依土地徵收條例規定，有關直轄市或縣（市）主管機關應於國庫設立土地徵收補償費保管專戶部分，下列何者錯誤？","subject":"土地法","topic":"補償費保管專戶","year":113},{"answer":"C","explain":"協議價購時，其他法律的優先購買權不適用。","id":"tdf-113-08","laws":[{"ref":"土地徵收條例 §10 Ⅱ、Ⅲ","text":"需用土地人於事業計畫報請目的事業主管機關許可前，應舉行公聽會，聽取土地所有權人及利害關係人之意見。但因舉辦具機密性之國防事業或已舉行公聽會或說明會者，不在此限。\n特定農業區經行政院核定為重大建設須辦理徵收者，若有爭議，應依行政程序法舉行聽證。"},{"ref":"土地徵收條例 §11 Ⅰ、Ⅲ","text":"需用土地人申請徵收土地或土地改良物前，除國防、交通或水利事業，因公共安全急需使用土地未及與所有權人協議者外，應先與所有權人協議價購或以其他方式取得；所有權人拒絕參與協議或經開會未能達成協議且無法以其他方式取得者，始得依本條例申請徵收。\n第一項協議價購，依其他法律規定有優先購買權者，無優先購買權之適用。"}],"no":8,"notes":{"A":"少了「若有爭議」才要聽證。","B":"公聽會是在報請許可「前」舉行。","D":"還要「且無法以其他方式取得」，才可以申請徵收。"},"options":["特定農業區經行政院核定為重大建設須辦理徵收者，應依行政程序法舉行聽證","需用土地人於事業計畫報請目的事業主管機關許可後，應舉行公聽會","協議價購時，依其他法律規定有優先購買權者，無優先購買權之適用","需用土地人於所有權人拒絕參與協議或經開會未能達成協議時，則改申請徵收"],"stem":"依土地徵收條例規定，有關徵收之程序，下列何者正確？","subject":"土地法","topic":"徵收前程序（公聽會／聽證／協議價購）","year":113},{"answer":"A","explain":"順序：繼承人 → 合法使用人 → 其他共有人；決標後 30 日內不表示視為放棄。","id":"tdf-113-10","laws":[{"ref":"土地法 §73-1 Ⅲ","text":"依第二項規定標售土地或建築改良物前應公告三個月，繼承人、合法使用人或其他共有人就其使用範圍依序有優先購買權。但優先購買權人未於決標後三十日內表示優先購買者，其優先購買權視為放棄。"}],"no":10,"notes":{"D":"合法使用人排在其他共有人前面。"},"options":["繼承人、合法使用人、其他共有人","其他共有人、合法使用人、繼承人","合法使用人、繼承人、其他共有人","繼承人、其他共有人、合法使用人"],"stem":"依土地法規定，逾期未辦繼承之土地於標售時，有關優先購買權人之順序依序為何？","subject":"土地法","topic":"逾期未辦繼承標售優先購買順序","year":113},{"answer":"C","explain":"不服調處，接到通知後 15 日內起訴；不起訴就照調處結果辦。","id":"tdf-113-11","laws":[{"ref":"土地法 §34-1 Ⅵ","text":"依法得分割之共有土地或建築改良物，共有人不能自行協議分割者，任何共有人得申請該管直轄市、縣（市）地政機關調處，不服調處者，應於接到調處通知後十五日內向司法機關訴請處理，屆期不起訴者，依原調處結果辦理之。"}],"no":11,"notes":{},"options":["七日","十日","十五日","三十日"],"stem":"依土地法規定，依法得分割之共有土地，共有人不能自行協議分割者，任何共有人得申請該管直轄市、縣（市）地政機關調處，不服調處者，應於接到調處通知後幾日內向司法機關訴請處理，屆期不起訴者，依原調處結果辦理之？","subject":"土地法","topic":"共有分割調處起訴期限","year":113},{"answer":"D","explain":"政府要求變更使用或遷移，「應予適當之補償」。D 錯在「不得請求補償」。","id":"tdf-113-14","laws":[{"ref":"都市計畫法 §50 Ⅰ","text":"公共設施保留地在未取得前，得申請為臨時建築使用。"},{"ref":"都市計畫法 §51","text":"依本法指定之公共設施保留地，不得為妨礙其指定目的之使用。但得繼續為原來之使用或改為妨礙目的較輕之使用。"},{"ref":"都市計畫法 §50-2 Ⅰ","text":"私有公共設施保留地得申請與公有非公用土地辦理交換，不受土地法、國有財產法及各級政府財產管理法令相關規定之限制；劃設逾二十五年未經政府取得者，得優先辦理交換。"},{"ref":"都市計畫法 §41","text":"都市計畫發布實施後，其土地上原有建築物不合土地使用分區規定者，除准修繕外，不得增建或改建。當地直轄市、縣（市）政府或鄉、鎮、縣轄市公所認有必要時，得斟酌地方情形限期令其變更使用或遷移；其因變更使用或遷移所受之損害，應予適當之補償，補償金額由雙方協議之；協議不成，由當地直轄市、縣（市）政府函請內政部予以核定。"}],"no":14,"notes":{"D":"要給補償。條文用語最接近都計 §41（限期令其變更使用或遷移，應予適當之補償）。"},"options":["公共設施保留地在未取得前，得申請為臨時建築使用","不得為妨礙其指定目的之使用，但得繼續為原來之使用或改為妨礙目的較輕之使用","私有公共設施保留地得申請與公有非公用土地辦理交換，不受土地法、國有財產法及各級政府財產管理法令相關規定之限制","地上物除准修繕外，不得增建或改建。當地政府認有必要時，得令其清除地上物或遷移，且不得請求補償"],"stem":"依都市計畫法規定，下列有關公共設施保留地之使用管制規定，何者錯誤？","subject":"土地法","topic":"公設保留地使用管制","year":113},{"answer":"C","explain":"流程：逾 1 年 → 公告 3 個月＋書面通知 → 列冊 15 年 → 書面通知＋移國產署標售（標售前公告 3 個月）。","id":"tdf-113-16","laws":[{"ref":"土地法 §73-1 Ⅰ～Ⅲ","text":"土地或建築改良物，自繼承開始之日起逾一年未辦理繼承登記者，經該管直轄市或縣市地政機關查明後，應即公告繼承人於三個月內聲請登記，並以書面通知繼承人；逾期仍未聲請者，得由地政機關予以列冊管理。但有不可歸責於聲請人之事由，其期間應予扣除。\n前項列冊管理期間為十五年，逾期仍未聲請登記者，由地政機關書面通知繼承人及將該土地或建築改良物清冊移請財政部國有財產署公開標售。繼承人占有或第三人占有無合法使用權者，於標售後喪失其占有之權利；土地或建築改良物租賃期間超過五年者，於標售後以五年為限。\n依第二項規定標售土地或建築改良物前應公告三個月，繼承人、合法使用人或其他共有人就其使用範圍依序有優先購買權。但優先購買權人未於決標後三十日內表示優先購買者，其優先購買權視為放棄。"}],"no":16,"notes":{"A":"公告期間是「三個月」，不是六個月。","B":"條文沒有「每年清查並書面通知」。","D":"順序是繼承人 → 合法使用人 → 其他共有人。"},"options":["自繼承開始之日起逾一年未辦理繼承登記者，經該管直轄市或縣市地政機關查明後，應即公告繼承人於六個月內聲請登記，並以書面通知繼承人","列冊管理期間為十五年，列冊管理期間該管直轄市或縣市地政機關應每年清查並書面通知繼承人辦理繼承登記","列冊管理期間屆滿，逾期仍未聲請登記者，由地政機關書面通知繼承人及將該土地或建築改良物清冊移請財政部國有財產署公開標售","標售土地或建築改良物前應公告三個月，並書面通知繼承人、共有人或合法使用人依序行使優先購買權"],"stem":"依土地法規定，下列有關逾期未辦繼承登記案件應由地政機關書面通知繼承人之情形，何者正確？","subject":"土地法","topic":"逾期未辦繼承流程","year":113},{"answer":"C","explain":"可建築土地得標售、標租或設定地上權；標租、設定地上權期限不得逾 99 年。","id":"tdf-113-18","laws":[{"ref":"土地徵收條例 §44 Ⅰ、Ⅴ","text":"區段徵收範圍內土地，經規劃整理後，除依第四十三條規定配回原管理機關及第四十三條之一規定配售外，其處理方式如下：\n一、抵價地發交被徵收土地所有權人領回。……\n二、道路、溝渠、公園、綠地、兒童遊樂場、廣場、停車場、體育場所及國民學校用地，無償登記為當地直轄市有、縣（市）有或鄉（鎮、市）有。\n三、前款以外之公共設施用地，得由主管機關依財務計畫需要，於徵收計畫書載明有償或無償撥供需地機關或讓售供公營事業機構使用。\n四、國民住宅用地、安置原住戶或經行政院專案核准所需土地得以讓售。\n五、其餘可供建築土地，得予標售、標租或設定地上權。\n依第一項第五款標租或設定地上權時，其期限不得逾九十九年。"}],"no":18,"notes":{"A":"區段徵收是「抵價地」；抵費地是市地重劃的用語。","B":"零售市場不在無償登記的名單（道路、溝渠、公園、綠地、兒童遊樂場、廣場、停車場、體育場所、國民學校）。","D":"安置原住戶是「讓售」。"},"options":["抵費地發交被徵收土地所有權人領回","零售市場無償登記為當地直轄市有、縣（市）有或鄉（鎮、市）有","標租時，其期限不得逾九十九年","安置原住戶土地得以標售"],"stem":"依土地徵收條例規定，有關區段徵收範圍內土地，經規劃整理後之處理方式，下列何者正確？","subject":"土地法","topic":"區段徵收後土地處理","year":113},{"answer":"B","explain":"起造人待售屋 2 年內：2%～3.6%。","id":"tdf-113-19","laws":[{"ref":"房屋稅條例 §5 Ⅰ①（三）（四）","text":"（三）起造人持有使用執照所載用途為住家用之待銷售房屋，於起課房屋稅二年內，最低不得少於其房屋現值百分之二，最高不得超過百分之三點六。\n（四）其他住家用房屋，最低不得少於其房屋現值百分之二，最高不得超過百分之四點八。"}],"no":19,"notes":{"C":"2%～4.8% 是「其他住家用房屋」。","D":"3%～5% 是營業用（非住家用）。"},"options":["最低不得少於其房屋現值百分之一點二，最高不得超過百分之二點四","最低不得少於其房屋現值百分之二，最高不得超過百分之三點六","最低不得少於其房屋現值百分之二，最高不得超過百分之四點八","最低不得少於其房屋現值百分之三，最高不得超過百分之五"],"stem":"依房屋稅條例規定，起造人持有使用執照所載用途為住家用之待銷售房屋，於起課房屋稅二年內，其房屋稅之稅率為何？","subject":"土地法","topic":"起造人待售房屋稅率","year":113},{"answer":"B","explain":"糾紛：判決確定日；公產：核發產權移轉證明書之日；法拍：法院發給權利移轉證明書之日；預售換起造人：使照核發之日起「滿 30 日」。","id":"tdf-113-20","laws":[{"ref":"契稅條例 §16 Ⅱ～Ⅴ","text":"不動產移轉發生糾紛時，其申報契稅之起算日期，應以法院判決確定日為準。\n向政府機關標購或領買公產，以政府機關核發產權移轉證明書之日為申報起算日。\n向法院標購拍賣之不動產，以法院發給權利移轉證明書之日為申報起算日。\n建築物於建造完成前，因買賣、交換、贈與，以承受人為建造執照原始起造人或中途變更起造人名義並取得使用執照者，以主管建築機關核發使用執照之日起滿三十日為申報起算日。"}],"no":20,"notes":{"A":"是「核發產權移轉證明書」之日。","C":"是「法院發給權利移轉證明書」之日。","D":"是核發使用執照之日起「滿三十日」。"},"options":["向政府機關標購公產，以政府機關核准產權移轉之日為申報起算日","不動產移轉發生糾紛時，以法院判決確定之日為申報起算日","向法院標購拍賣之不動產，以承買人拍定之日為申報起算日","建築物於建造完成前，因交換以承受人為建造執照原始起造人者，以主管建築機關核發使用執照之日為申報起算日"],"stem":"依契稅條例規定，有關申報契稅之起算日期，下列何者正確？","subject":"土地法","topic":"契稅申報起算日","year":113},{"answer":"D","explain":"累進起點地價＝7 公畝平均地價，排除工業、礦業、農業「及免稅土地」；看「土地所在地」；以「千元」為單位。","id":"tdf-113-21","laws":[{"ref":"土地稅法 §16 Ⅰ（節錄）、Ⅱ","text":"地價稅基本稅率為千分之十。土地所有權人之地價總額未超過土地所在地直轄市或縣（市）累進起點地價者，其地價稅按基本稅率徵收；……\n前項所稱累進起點地價，以各該直轄市或縣（市）土地七公畝之平均地價為準。但不包括工業用地、礦業用地、農業用地及免稅土地在內。"},{"ref":"土地稅法施行細則 §6 Ⅱ、Ⅲ","text":"前項累進起點地價，應於舉辦規定地價或重新規定地價後當年地價稅開徵前計算完竣，並分別報請財政部及內政部備查。\n累進起點地價以千元為單位，以下四捨五入。"}],"no":21,"notes":{"A":"漏了「免稅土地」也不包括在內。","B":"看「土地所在地」，不是戶籍所在地。","C":"以「千元」為單位。"},"options":["累進起點地價，以各該直轄市或縣（市）土地七公畝之平均地價為準。只有工業用地、礦業用地及農業用地不包括在內","土地所有權人之地價總額未超過戶籍所在地直轄市或縣（市）累進起點地價者，其地價稅按基本稅率徵收","累進起點地價以百元為單位，以下四捨五入","累進起點地價，應於舉辦規定地價或重新規定地價後當年地價稅開徵前計算完竣，並報請財政部及內政部備查"],"stem":"依土地稅法規定，有關累進起點地價，下列何者正確？","subject":"土地法","topic":"累進起點地價","year":113},{"answer":"C","explain":"三要件：開闢完成或核定供公設使用＋完成使用地編定＋需用土地人證明。條件是「尚未被徵收前」，所以不需要徵收公告。","id":"tdf-113-22","laws":[{"ref":"土地稅法 §39 Ⅲ（節錄）","text":"非都市土地經需用土地人開闢完成或依計畫核定供公共設施使用，並依法完成使用地編定，其尚未被徵收前之移轉，經需用土地人證明者，準用第一項前段規定，免徵土地增值稅。"}],"no":22,"notes":{},"options":["經需用土地人開闢完成或依計畫核定供公共設施使用","依法完成使用地編定","依法完成徵收公告","經需用土地人證明"],"stem":"依土地稅法規定，非都市土地供公共設施使用者，在滿足規定要件下，其尚未被徵收前之移轉，免徵土地增值稅。下列有關免稅要件之敘述，何者錯誤？","subject":"土地法","topic":"非都市公設地免增值稅要件","year":113},{"answer":"B","explain":"地政機關先賠；登記人員有「重大過失」才由該人員償還，撥歸登記儲金。","id":"tdf-114-01","laws":[{"ref":"土地法 §68 Ⅰ","text":"因登記錯誤遺漏或虛偽致受損害者，由該地政機關負損害賠償責任。但該地政機關證明其原因應歸責於受害人時，不在此限。"},{"ref":"土地法 §70 Ⅱ","text":"地政機關所負之損害賠償，如因登記人員之重大過失所致者，由該人員償還，撥歸登記儲金。"}],"no":1,"notes":{},"options":["抽象輕過失責任","重大過失責任","具體輕過失責任","通常事變責任"],"stem":"因土地登記有錯誤致人民受有損害，地政機關負損害賠償後，於登記人員未盡下列那一種注意義務時，得對登記人員行使求償權？","subject":"土地法","topic":"登記人員求償","year":114},{"answer":"D","explain":"預告登記保全三種請求權：移轉或消滅、內容或次序變更、附條件或期限。附條件贈與→預告登記。","id":"tdf-114-02","laws":[{"ref":"土地法 §79-1 Ⅰ","text":"聲請保全左列請求權之預告登記，應由請求權人檢附登記名義人之同意書為之：\n一、關於土地權利移轉或使其消滅之請求權。\n二、土地權利內容或次序變更之請求權。\n三、附條件或期限之請求權。"}],"no":2,"notes":{"A":"假處分要法院裁定，不是雙方自己申請。"},"options":["假處分登記","第一次登記","註記登記","預告登記"],"stem":"甲為 A 地之登記名義人，與乙成立附條件的 A 地贈與契約，則甲與乙可以對 A 地申請做下列那一種土地登記？","subject":"土地法","topic":"附條件請求權→預告登記","year":114},{"answer":"A","explain":"特定農業區＋行政院核定重大建設＋有爭議 → 依行政程序法舉行聽證。","id":"tdf-114-03","laws":[{"ref":"土地徵收條例 §10 Ⅲ","text":"特定農業區經行政院核定為重大建設須辦理徵收者，若有爭議，應依行政程序法舉行聽證。"}],"no":3,"notes":{"C":"公聽會是事業計畫報請許可「前」一般都要辦的程序。"},"options":["聽證","說明會","公聽會","陳述意見"],"stem":"辦理土地徵收時，徵收事業經行政院核定為重大建設，徵收範圍內之特定農業區農牧用地，如土地所有權人對於土地列入徵收範圍有爭議，經說明後仍有異議，則中央目的事業主管機關應辦理那一項民眾參與方式？","subject":"土地法","topic":"特定農業區有爭議→聽證","year":114},{"answer":"C","explain":"地價稅基本稅率 10‰；累進 15、25、35、45、55‰；自用住宅 2‰。","id":"tdf-114-04","laws":[{"ref":"土地稅法 §16 Ⅰ（節錄）","text":"地價稅基本稅率為千分之十。"}],"no":4,"notes":{"D":"千分之十五是累進第一級（超過累進起點未達 5 倍）。"},"options":["百分之十","百分之五","千分之十","千分之十五"],"stem":"依土地稅法之規定，一般地價稅的基本稅率為多少？","subject":"土地法","topic":"地價稅基本稅率","year":114},{"answer":"C","explain":"未辦第一次登記且所有人不明：先找「使用執照」起造人 → 沒使照找「建造執照」起造人 → 都沒有才找現住人或管理人。C 錯在把建造執照排第一。","id":"tdf-114-05","laws":[{"ref":"房屋稅條例 §4 Ⅰ（節錄）、Ⅳ、Ⅴ（節錄）","text":"房屋稅向房屋所有人徵收之；以土地設定地上權之使用權房屋，向該使用權人徵收之；設有典權者，向典權人徵收之。共有房屋向共有人徵收之，由共有人推定一人繳納，其不為推定者，由現住人或使用人代繳。\n未辦建物所有權第一次登記且所有人不明之房屋，其房屋稅向使用執照所載起造人徵收之；無使用執照者，向建造執照所載起造人徵收之；無建造執照者，向現住人或管理人徵收之。\n房屋為信託財產者，於信託關係存續中，以受託人為房屋稅之納稅義務人。"}],"no":5,"notes":{"C":"優先的是「使用執照」所載起造人。"},"options":["以土地設定地上權之使用權房屋，為該使用權人","共有房屋向共有人徵收，並由共有人推定一人繳納","未辦建物所有權第一次登記且所有人不明者，優先向建造執照所載起造人徵收","房屋為信託財產，在信託關係存續中，為受託人"],"stem":"下列關於房屋稅納稅義務人的認定，何者錯誤？","subject":"土地法","topic":"房屋稅納稅義務人","year":114},{"answer":"B","explain":"訂約後 30 日內共同申報移轉現值。","id":"tdf-114-06","laws":[{"ref":"土地稅法 §49 Ⅰ","text":"土地所有權移轉或設定典權時，權利人及義務人應於訂定契約之日起三十日內，檢附契約影本及有關文件，共同向主管稽徵機關申報其土地移轉現值。但依規定得由權利人單獨申請登記者，權利人得單獨申報其移轉現值。"}],"no":6,"notes":{},"options":["15 日","30 日","45 日","60 日"],"stem":"土地所有權移轉時，原則上權利人及義務人雙方應於訂定契約幾日內檢附契約影本及相關文件共同向主管稽徵機關申報土地移轉現值？","subject":"土地法","topic":"申報移轉現值期限","year":114},{"answer":"C","explain":"§34-1：人數過半＋應有部分過半；或應有部分「逾 2/3」時人數不計。","id":"tdf-114-07","laws":[{"ref":"土地法 §34-1 Ⅰ","text":"共有土地或建築改良物，其處分、變更及設定地上權、農育權、不動產役權或典權，應以共有人過半數及其應有部分合計過半數之同意行之。但其應有部分合計逾三分之二者，其人數不予計算。"}],"no":7,"notes":{"B":"超過 1/2 還要搭配「人數過半」。"},"options":["超過四分之三","超過二分之一","超過三分之二","全體"],"stem":"依土地法規定，所有權人欲以共有土地設定地上權，在不計共有人人數比例的情況下，至少應得到該共有土地應有部分多少比例之同意？","subject":"土地法","topic":"共有土地設定地上權門檻","year":114},{"answer":"A","explain":"限制登記：預告登記、查封、假扣押、假處分、破產登記，及其他依法律禁止處分之登記。更正登記不是。","id":"tdf-114-10","laws":[{"ref":"土地登記規則 §136","text":"土地法第七十八條第八款所稱限制登記，謂限制登記名義人處分其土地權利所為之登記。\n前項限制登記，包括預告登記、查封、假扣押、假處分或破產登記，及其他依法律所為禁止處分之登記。"}],"no":10,"notes":{},"options":["更正登記","假處分","破產登記","預告登記"],"stem":"土地法第 78 條第 8 款所稱限制登記，謂限制登記名義人處分其土地權利所為之登記，下列何者非屬之？","subject":"土地法","topic":"限制登記種類","year":114},{"answer":"C","explain":"不得私有的土地（海岸、湖澤、水道、公共交通道路、水源地、名勝古蹟等）已成私有→得依法徵收。","id":"tdf-114-11","laws":[{"ref":"土地法 §14 Ⅱ","text":"前項土地已成為私有者，得依法徵收之。"}],"no":11,"notes":{},"options":["公開標售","照價收買","徵收","沒收"],"stem":"依土地法規定，有關私有土地所有權取得之限制，土地若已成為私有者，政府得依法以何種方式處置？","subject":"土地法","topic":"不得私有之土地已成私有","year":114},{"answer":"C","explain":"共有人（§34-1）15 日；基地房屋（§104）、耕地（§107 準用 §104）10 日。","id":"tdf-114-13","laws":[{"ref":"土地法 §104 Ⅱ（節錄）","text":"前項優先購買權人，於接到出賣通知後十日內不表示者，其優先權視為放棄。"},{"ref":"土地法 §107","text":"出租人出賣或出典耕地時，承租人有依同樣條件優先承買或承典之權。\n第一百零四條第二項之規定，於前項承買承典準用之。"},{"ref":"土地法第三十四條之一執行要點 第 13 點（一）、（三）","src":"內政部主管法規查詢系統","text":"（一）他共有人於接到出賣通知後十五日內不表示者，其優先購買權視為放棄。……\n（三）區分所有建物之專有部分連同其基地應有部分之所有權一併移轉與同一人者，他共有人無本法條優先購買權之適用。"}],"no":13,"notes":{"A":"基地房屋是 10 日。","B":"耕地準用 §104，也是 10 日。","D":"專有部分連同基地一起賣給同一人，他共有人「無」優先購買權。"},"options":["基地出賣或房屋出賣時，優先購買權人，於接到出賣通知後 15 日內不表示者，其優先購買權視為放棄","耕地租用出租人出賣或出典耕地時，優先購買權人，於接到出賣通知後 15 日內不表示者，其優先購買權視為放棄","共有土地共有人出賣其應有部分時，優先購買權人，於接到出賣通知後 15 日內不表示者，其優先購買權視為放棄","區分所有建物之專有部分連同其基地應有部分之所有權一併移轉與同一人者，他共有人有優先購買權之適用"],"stem":"依土地法規定，有關優先購買權之敘述，下列何者正確？","subject":"土地法","topic":"優先購買權天數","year":114},{"answer":"B","explain":"買賣、贈與、占有 6%；典權 4%；交換、分割 2%。","id":"tdf-114-14","laws":[{"ref":"契稅條例 §3","text":"契稅稅率如下：\n一、買賣契稅為其契價百分之六。\n二、典權契稅為其契價百分之四。\n三、交換契稅為其契價百分之二。\n四、贈與契稅為其契價百分之六。\n五、分割契稅為其契價百分之二。\n六、占有契稅為其契價百分之六。"}],"no":14,"notes":{"A":"4% 是典權。","C":"2% 是交換、分割。"},"options":["百分之四","百分之六","百分之二","百分之五"],"stem":"在不動產贈與的情形下，有關契稅稅率，下列何者為是？","subject":"土地法","topic":"契稅稅率","year":114},{"answer":"A","explain":"B、C、D 都是「減半」徵收；災害毀損要「五成以上」才免徵。","id":"tdf-114-15","laws":[{"ref":"房屋稅條例 §15 Ⅰ④⑦、Ⅱ①②④","text":"私有房屋有下列情形之一者，免徵房屋稅：……\n四、無償供政府機關公用或供軍用之房屋。……\n七、受重大災害，毀損面積占整棟面積五成以上，必須修復始能使用之房屋。……\n私有房屋有下列情形之一者，其房屋稅減半徵收：\n一、政府平價配售之平民住宅。\n二、合法登記之工廠供直接生產使用之自有房屋。……\n四、受重大災害，毀損面積占整棟面積三成以上不及五成之房屋。"}],"no":15,"notes":{"B":"平民住宅是減半。","C":"工廠直接生產用是減半。","D":"三成到五成是減半；五成以上才免徵。"},"options":["無償供政府機關公用或供軍用之房屋","政府平價配售之平民住宅","合法登記之工廠供直接生產使用之自有房屋","受重大災害，毀損面積占整棟面積三成以上不及五成之房屋"],"stem":"依房屋稅條例規定，對於私有房屋免徵房屋稅，下列何者正確？","subject":"土地法","topic":"房屋稅免徵 vs 減半","year":114},{"answer":"A","explain":"繳款書送達後 30 日內繳。怠報金（晚申報）：每逾 3 日加 1%；滯納金（晚繳）：每逾 2 日加 1%；匿報短報：1～3 倍。","id":"tdf-114-16","laws":[{"ref":"契稅條例 §19","text":"納稅義務人應於稽徵機關核定繳款書送達後三十日內繳納。"},{"ref":"契稅條例 §24（節錄）","text":"納稅義務人不依規定期限申報者，每逾三日，加徵應納稅額百分之一之怠報金，最高以應納稅額為限。但不得超過新臺幣一萬五千元。"},{"ref":"契稅條例 §25（節錄）","text":"納稅義務人不依規定期限繳納稅款者，每逾二日，加徵應納稅額百分之一之滯納金；……"},{"ref":"契稅條例 §26","text":"納稅義務人應納契稅，匿報或短報，經主管稽徵機關查得，或經人舉發查明屬實者，除應補繳稅額外，並加處以應納稅額一倍以上三倍以下之罰鍰。"}],"no":16,"notes":{"B":"怠報金是每逾「3 日」加「1%」。","C":"滯納金是每逾「2 日」加「1%」。","D":"是一倍以上「三倍」以下。"},"options":["納稅義務人應於稽徵機關核定繳款書送達後 30 日內繳納","納稅義務人不依規定期限申報者，每逾 2 日，加徵應納稅額百分之二之怠報金","納稅義務人不依規定期限繳納稅款者，每逾 3 日，加徵應納稅額百分之二之滯納金","納稅義務人應納契稅，匿報或短報，經主管稽徵機關查得，或經人舉發查明屬實者，除應補繳稅額外，並加處以應納稅額一倍以上二倍以下之罰鍰"],"stem":"依契稅條例規定，有關納稅義務人繳納契稅期限及罰則之規定，下列敘述何者正確？","subject":"土地法","topic":"契稅繳納期限與罰則","year":114},{"answer":"C","explain":"逃稅→短匿稅額 3 倍以下；規避實物→1 倍；未登記再出售→移轉現值 2% 以下；1 個月內繳納。","id":"tdf-114-17","laws":[{"ref":"土地稅法 §54","text":"納稅義務人藉變更、隱匿地目等則或於適用特別稅率、減免地價稅或田賦之原因、事實消滅時，未向主管稽徵機關申報者，依下列規定辦理：\n一、逃稅或減輕稅賦者，除追補應納部分外，處短匿稅額或賦額三倍以下之罰鍰。\n二、規避繳納實物者，除追補應納部分外，處應繳田賦實物額一倍之罰鍰。\n土地買賣未辦竣權利移轉登記，再行出售者，處再行出售移轉現值百分之二以下之罰鍰。\n第一項應追補之稅額或賦額、隨賦徵購實物及罰鍰，納稅義務人應於通知繳納之日起一個月內繳納之；屆期不繳納者，移送強制執行。"}],"no":17,"notes":{"A":"是「一倍」。","B":"是百分之「二」以下。","D":"是「一個月」內。"},"options":["規避繳納實物者，除追補應納部分外，處應繳田賦實物額二倍之罰鍰","土地買賣未辦竣權利移轉登記，再行出售者，處再行出售移轉現值百分之三以下之罰鍰","逃稅或減輕稅賦者，除追補應納部分外，處短匿稅額或賦額三倍以下之罰鍰","應追補之稅額或賦額、隨賦徵購實物及罰鍰，納稅義務人應於通知繳納之日起 2 個月內繳納之"],"stem":"依土地稅法規定，納稅義務人藉變更、隱匿地目等則或於適用特別稅率、減免地價稅或田賦之原因、事實消滅時，未向主管稽徵機關申報者，應依規定辦理，下列敘述何者正確？","subject":"土地法","topic":"土地稅法罰則","year":114},{"answer":"A","explain":"主要計畫圖 ≥ 1/10000；細部計畫圖 ≥ 1/1200；5 年一期最長 25 年；核定後 30 日內發布。","id":"tdf-114-18","laws":[{"ref":"都市計畫法 §15 Ⅱ","text":"前項主要計畫書，除用文字、圖表說明外，應附主要計畫圖，其比例尺不得小於一萬分之一；其實施進度以五年為一期，最長不得超過二十五年。"},{"ref":"都市計畫法 §22 Ⅱ","text":"前項細部計畫圖比例尺不得小於一千二百分之一。"},{"ref":"都市計畫法 §21 Ⅰ","text":"主要計畫經核定或備案後，當地直轄市、縣（市）政府應於接到核定或備案公文之日起三十日內，將主要計畫書及主要計畫圖發布實施，並應將發布地點及日期刊登新聞紙或新聞電子報周知。"}],"no":18,"notes":{"B":"細部計畫圖是一千二百分之一。","C":"主要計畫圖是一萬分之一。","D":"是 30 日內。"},"options":["主要計畫其實施進度以 5 年為一期，最長不得超過 25 年","細部計畫圖，其比例尺不得小於一千五百分之一","主要計畫圖，其比例尺不得小於一萬五千分之一","主要計畫經核定或備案後，當地直轄市、縣（市）政府應於接到核定或備案公文之日起 20 日內，將主要計畫書及主要計畫圖發布實施"],"stem":"依都市計畫法規定，有關都市計畫之內容與實施，下列敘述何者正確？","subject":"土地法","topic":"都市計畫比例尺／年期／發布","year":114},{"answer":"B","explain":"國土保育、海洋資源→中央核定；農業發展、城鄉發展→地方核定。功能分區「劃設」是地方，中央只管劃設順序、原則。","id":"tdf-114-19","laws":[{"ref":"國土計畫法 §4","text":"中央主管機關應辦理下列事項：\n一、全國國土計畫之擬訂、公告、變更及實施。\n二、對直轄市、縣（市）政府推動國土計畫之核定及監督。\n三、國土功能分區劃設順序、劃設原則之規劃。\n四、使用許可制度及全國性土地使用管制之擬定。\n五、國土保育地區或海洋資源地區之使用許可、許可變更及廢止之核定。\n六、其他全國性國土計畫之策劃及督導。\n直轄市、縣（市）主管機關應辦理下列事項：\n一、直轄市、縣（市）國土計畫之擬訂、公告、變更及執行。\n二、國土功能分區之劃設。\n三、全國性土地使用管制之執行及直轄市、縣（市）特殊性土地使用管制之擬定、執行。\n四、農業發展地區及城鄉發展地區之使用許可、許可變更及廢止之核定。\n五、其他直轄市、縣（市）國土計畫之執行。"}],"no":19,"notes":{"A":"劃設是直轄市、縣（市）的事。","C":"農業發展、城鄉發展是地方核定。","D":"是地方的事。"},"options":["國土功能分區之劃設","國土保育地區或海洋資源地區之使用許可、許可變更及廢止之核定","農業發展地區及城鄉發展地區之使用許可、許可變更及廢止之核定","直轄市、縣（市）國土計畫之擬訂、公告、變更及執行"],"stem":"依國土計畫法規定，關於中央主管機關應辦理之事項，下列敘述何者正確？","subject":"土地法","topic":"國土計畫中央 vs 地方事項","year":114},{"answer":"B","explain":"B 是平均地權條例 §58 Ⅲ 原文：人數半數以上＋面積超過半數。重劃會辦法由「中央」主管機關定。","id":"tdf-114-20","laws":[{"ref":"平均地權條例 §58 Ⅱ、Ⅲ","text":"前項重劃會組織、職權、重劃業務、獎勵措施等事項之辦法，由中央主管機關定之。\n重劃會辦理市地重劃時，應由重劃區內私有土地所有權人半數以上，而其所有土地面積超過重劃區私有土地總面積半數以上者之同意，並經主管機關核准後實施之。"}],"no":20,"notes":{"A":"由「中央」主管機關定之。"},"options":["重劃會組織、職權、重劃業務、獎勵措施等事項之辦法，由地方主管機關定之","重劃會辦理市地重劃時，應由重劃區內私有土地所有權人半數以上，而其所有土地面積超過重劃區私有土地總面積半數以上者之同意，並經主管機關核准後實施之","自辦農地重劃，應經重劃區內私有土地所有權人半數以上，而其所有面積亦達私有土地面積半數以上者之同意，就重劃區全部土地辦理重劃，並經該管直轄市或縣（市）主管機關核准","重劃會辦理農村社區土地重劃時，應經重劃區內私有土地所有權人合計超過三分之二，且其所有面積合計超過私有土地面積三分之二者之同意，就重劃區全部土地辦理重劃，並經該管直轄市或縣（市）主管機關核准後實施"],"stem":"有關自辦土地重劃，依相關法規之規定，下列敘述何者正確？","subject":"土地法","topic":"自辦市地重劃","year":114},{"answer":"C","explain":"不得給外國人：林、漁、狩獵、鹽、礦、水源地、要塞軍備區域及邊境。農地不在內。","id":"tdf-114-21","laws":[{"ref":"土地法 §17 Ⅰ","text":"左列土地不得移轉、設定負擔或租賃於外國人：\n一、林地。\n二、漁地。\n三、狩獵地。\n四、鹽地。\n五、礦地。\n六、水源地。\n七、要塞軍備區域及領域邊境之土地。"}],"no":21,"notes":{},"options":["林地","鹽地","農地","水源地"],"stem":"依土地法規定，下列何種土地非屬於不得移轉、設定負擔或租賃於外國人之土地？","subject":"土地法","topic":"不得移轉外國人之土地","year":114},{"answer":"A","explain":"農作改良物要「附著於土地」：農作物、其他植物、水利土壤之改良。盆栽只是放著，沒附著。","id":"tdf-114-22","laws":[{"ref":"土地法 §5 Ⅱ","text":"附著於土地之建築物或工事，為建築改良物，附著於土地之農作物及其他植物與水利土壤之改良，為農作改良物。"}],"no":22,"notes":{"C":"灌溉設施屬「水利」改良。","D":"肥料屬「土壤」改良。"},"options":["置於農地上的盆栽","附著於農地上的芒果樹","農田的灌溉設施","農地上所施加的肥料"],"stem":"下列何者並非土地法中的農作改良物？","subject":"土地法","topic":"農作改良物定義","year":114},{"answer":"C","explain":"國營事業是 §3 的「一般徵收」事業，不是 §4 區段徵收的情形。","id":"tdf-114-23","laws":[{"ref":"土地徵收條例 §4 Ⅰ","text":"有下列各款情形之一者，得為區段徵收：\n一、新設都市地區之全部或一部，實施開發建設者。\n二、舊都市地區為公共安全、衛生、交通之需要或促進土地之合理使用實施更新者。\n三、都市土地之農業區、保護區變更為建築用地或工業區變更為住宅區、商業區者。\n四、非都市土地實施開發建設者。\n五、農村社區為加強公共設施、改善公共衛生之需要或配合農業發展之規劃實施更新者。\n六、其他依法得為區段徵收者。"},{"ref":"土地徵收條例 §3（節錄）","text":"國家因公益需要，興辦下列各款事業，得徵收私有土地；……\n九、國營事業。"}],"no":23,"notes":{},"options":["舊都市地區為公共安全、衛生、交通之需要或促進土地之合理使用實施更新者","非都市土地實施開發建設者","興辦國營事業或公安事業者","農村社區為加強公共設施、改善公共衛生之需要或配合農業發展之規劃實施更新者"],"stem":"依土地徵收條例規定，有關得為區段徵收之情形，下列何項非屬之？","subject":"土地法","topic":"區段徵收情形","year":114},{"answer":"C","explain":"都市 3 公畝、非都市 7 公畝；國宅、勞工宿舍自動工或取得之日起適用 2‰；本人配偶未成年受扶養親屬以「一處」為限。（選項 C 原卷文字就到「其用地之地價稅」為止。）","id":"tdf-114-24","laws":[{"ref":"土地稅法 §17","text":"合於左列規定之自用住宅用地，其地價稅按千分之二計徵：\n一、都市土地面積未超過三公畝部分。\n二、非都市土地面積未超過七公畝部分。\n國民住宅及企業或公營事業興建之勞工宿舍，自動工興建或取得土地所有權之日起，其用地之地價稅，適用前項稅率計徵。\n土地所有權人與其配偶及未成年之受扶養親屬，適用第一項自用住宅用地稅率繳納地價稅者，以一處為限。"}],"no":24,"notes":{"A":"都市是 3 公畝。","B":"非都市是 7 公畝。","D":"是「一處」，不是一次（一次是土地增值稅一生一次）。"},"options":["都市土地面積未超過五公畝部分","非都市土地面積未超過十公畝部分","國民住宅及企業或公營事業興建之勞工宿舍，自動工興建或取得土地所有權之日起，其用地之地價稅","土地所有權人與其配偶及未成年之受扶養親屬，適用自用住宅用地稅率繳納地價稅者，以一次為限"],"stem":"依土地稅法規定，土地所有權人申請自用住宅用地，其地價稅按千分之二計徵，下列敘述何者正確？","subject":"土地法","topic":"地價稅自用住宅 2‰","year":114},{"answer":"B","explain":"公設保留地：未使用並隔離→免地價稅；仍建築使用→6‰；移轉→免增值稅；繼承或配偶直系血親贈與→免遺產稅、贈與稅。全部是「免」，沒有減半。","id":"tdf-114-25","laws":[{"ref":"土地稅法 §19","text":"都市計畫公共設施保留地，在保留期間仍為建築使用者，除自用住宅用地依第十七條之規定外，統按千分之六計徵地價稅；其未作任何使用並與使用中之土地隔離者，免徵地價稅。"},{"ref":"土地稅法 §39 Ⅱ（節錄）","text":"依都市計畫法指定之公共設施保留地尚未被徵收前之移轉，準用前項前段規定，免徵土地增值稅。"},{"ref":"都市計畫法 §50-1","text":"公共設施保留地因依本法第四十九條第一項徵收取得之加成補償，免徵所得稅；因繼承或因配偶、直系血親間之贈與而移轉者，免徵遺產稅或贈與稅。"}],"no":25,"notes":{"A":"是千分之六。","C":"是「免徵」。","D":"是「免徵」。"},"options":["都市計畫公共設施保留地，在保留期間仍為建築使用者，除自用住宅用地依平均地權條例第 20 條之規定外，統按千分之十計徵地價稅","公共設施保留地未作任何使用並與使用中之土地隔離者，免徵地價稅","依都市計畫法指定之公共設施保留地尚未被徵收前之移轉，減半徵收土地增值稅","公共設施保留地因繼承或因配偶、直系血親間之贈與而移轉者，減半徵收遺產稅或贈與稅"],"stem":"政府為解決因經費問題無法於短期內徵收公共設施保留地，以至於影響土地所有權人之權益，於是採取若干措施，依相關法規之規定，下列敘述何者正確？","subject":"土地法","topic":"公設保留地租稅優惠","year":114},{"answer":"D","explain":"共 7 個：買賣契約 1、債權贈與契約 1、債權讓與 1、乙付錢給丙的物權行為 1、三台車各一個物權行為 3（一物一權）","id":"mf-107-01","laws":[],"no":1,"options":["4","5","6","7"],"stem":"甲有A、B、C 三台車，以總價50 萬元出售給乙，其後甲將其對乙的債權贈與於丙，並讓與之。於乙將50 萬元現金支付於丙後，甲將A、B、C 三台車交付給乙並移轉所有權。試問甲、乙、丙間共有多少法律行為？","subject":"民法","topic":"法律行為個數","year":107},{"answer":"C","explain":"錯誤選項：身分行為不能代理，但可以用使者傳達（使者只是傳聲筒）。使者可為無行為能力人；未適時傳達的風險由表意人承擔","id":"mf-107-03","laws":[],"no":3,"options":["使者係在傳達他人的意思表示","使者得為無行為能力人","身分行為不可藉使者傳達其意思表示","使者未適時傳達的危險由表意人承擔"],"stem":"下列有關使者之敘述，何者錯誤？","subject":"民法","topic":"使者","year":107},{"answer":"B","explain":"往取之債：債務人指定給付物並通知債權人→特定。可約定也可法定；(C)(D) 寫反了：赴償之債送到債權人住所、送赴之債交給運送人時特定","id":"mf-107-04","laws":[],"no":4,"options":["種類之債只能依法定方法為特定","往取之債於債務人具體指定給付物，並將準備給付之情事，通知債權人時，種類之債即為特定","送赴之債於債務人將給付物送至債權人住所地，使債權人處於得隨時受領之狀態時，種類之債即為特定","赴償之債於債務人交付其物於運送之人時，種類之債即為特定"],"stem":"種類之債係以不特定物之給付為標的，為使債之實現，於履行前應為特定。下列有關種類之債特定之方法，何者正確？","subject":"民法","topic":"種類之債特定","year":107},{"answer":"B","explain":"乙把次序利益拋棄給丁：乙丁原本可分的 200 萬按債權比 200:50 分→乙 160、丁 40；丙不受影響 100（§870-1）","id":"mf-107-06","laws":[{"ref":"民法 §870-1","text":"同一抵押物有多數抵押權者，抵押權人得以下列方法調整其可優先受償之分配額。但他抵押權人之利益不受影響：\n一、為特定抵押權人之利益，讓與其抵押權之次序。\n二、為特定後次序抵押權人之利益，拋棄其抵押權之次序。\n三、為全體後次序抵押權人之利益，拋棄其抵押權之次序。\n前項抵押權次序之讓與或拋棄，非經登記，不生效力。並應於登記前，通知債務人、抵押人及共同抵押人。\n因第一項調整而受利益之抵押權人，亦得實行調整前次序在先之抵押權。\n調整優先受償分配額時，其次序在先之抵押權所擔保之債權，如有第三人之不動產為同一債權之擔保者，在因調整後增加負擔之限度內，以該不動產為標的物之抵押權消滅。但經該第三人同意者，不在此限。"}],"no":6,"options":["乙150 萬元，丙0 元，丁50 萬元","乙160 萬元，丙100 萬元，丁40 萬元","乙0 元，丙100 萬元，丁200 萬元","乙150 萬元，丙100 萬元，丁50 萬元"],"stem":"債務人甲所有之抵押物上，設有擔保乙200 萬元債權之第一次序抵押權、丙120 萬元債權之第二次序抵押權及丁50 萬元債權之第三次序抵押權。抵押物拍賣所得價金為300 萬元。乙將其第一次序之優先受償利益拋棄予丁，則應如何分配拍賣所得之金額？","subject":"民法","topic":"抵押次序相對拋棄","year":107},{"answer":"A","explain":"甲乙丙應有部分合計 3/4（逾 2/3）→依土地法 §34-1 多數決處分，有效","id":"mf-107-08","laws":[{"ref":"土地法 §34-1","text":"共有土地或建築改良物，其處分、變更及設定地上權、農育權、不動產役權或典權，應以共有人過半數及其應有部分合計過半數之同意行之。但其應有部分合計逾三分之二者，其人數不予計算。\n共有人依前項規定為處分、變更或設定負擔時，應事先以書面通知他共有人；其不能以書面通知者，應公告之。\n第一項共有人，對於他共有人應得之對價或補償，負連帶清償責任。於為權利變更登記時，並應提出他共有人已為受領或為其提存之證明。其因而取得不動產物權者，應代他共有人申請登記。\n共有人出賣其應有部分時，他共有人得以同一價格共同或單獨優先承購。\n前四項規定，於公同共有準用之。\n依法得分割之共有土地或建築改良物，共有人不能自行協議分割者，任何共有人得申請該管直轄市、縣（市）地政機關調處，不服調處者，應於接到調處通知後十五日內向司法機關訴請處理，屆期不起訴者，依原調處結果辦理之。"}],"no":8,"options":["有效","無效","未得共有人全體同意，係屬無權處分效力未定","債權行為效力未定，物權移轉行為亦受其影響而效力未定"],"stem":"甲乙丙丁共有A 地，各有應有部分四分之一，甲乙丙三人未經丁之同意即將A 地出賣給戊並為移轉登記，請問此物權移轉行為之效力為何？","subject":"民法","topic":"共有物處分","year":107},{"answer":"C","explain":"錯誤選項：「花柳病或惡疾」不是宣告改用分別財產制的事由（§1010 沒有這款）。分別財產制是約定財產制之一；一方替他方還債可請求返還","id":"mf-107-09","laws":[{"ref":"民法 §1010","text":"夫妻之一方有左列各款情形之一時，法院因他方之請求，得宣告改用分別財產制：\n一、依法應給付家庭生活費用而不給付時。\n二、夫或妻之財產不足清償其債務時。\n三、依法應得他方同意所為之財產處分，他方無正當理由拒絕同意時。\n四、有管理權之一方對於共同財產之管理顯有不當，經他方請求改善而不改善時。\n五、因不當減少其婚後財產，而對他方剩餘財產分配請求權有侵害之虞時。\n六、有其他重大事由時。\n夫妻之總財產不足清償總債務或夫妻難於維持共同生活，不同居已達六個月以上時，前項規定於夫妻均適用之。"}],"no":9,"options":["分別財產制為約定財產制之一種","夫妻各自保有財產之所有權，並各自為管理、使用、收益及處分","夫妻之一方得因他方有花柳病或其他惡疾，向法院請求宣告改用分別財產制","夫妻各自對其債務負清償之責，但夫妻之一方以自己財產清償他方債務時，得請求返還"],"stem":"下列有關夫妻分別財產制之規定，下列何者錯誤？","subject":"民法","topic":"分別財產制","year":107},{"answer":"D","explain":"撤銷權、解除權都是形成權。撤銷對象可以是法律行為；有些要向法院聲請（§74、§244）；期間是除斥期間","id":"mf-107-12","laws":[{"ref":"民法 §74","text":"法律行為，係乘他人之急迫、輕率或無經驗，使其為財產上之給付或為給付之約定，依當時情形顯失公平者，法院得因利害關係人之聲請，撤銷其法律行為或減輕其給付。\n前項聲請，應於法律行為後一年內為之。"},{"ref":"民法 §244","text":"債務人所為之無償行為，有害及
