債權者，債權人得聲請法院撤銷之。\n債務人所為之有償行為，於行為時明知有損害於債權人之權利者，以受益人於受益時亦知其情事者為限，債權人得聲請法院撤銷之。\n債務人之行為非以財產為標的，或僅有害於以給付特定物為標的之債權者，不適用前二項之規定。\n債權人依第一項或第二項之規定聲請法院撤銷時，得並聲請命受益人或轉得人回復原狀。但轉得人於轉得時不知有撤銷原因者，不在此限。"}],"no":12,"options":["撤銷權僅能對不健全的意思表示為之，不得對法律行為或法律關係為之","任何撤銷權之行使，均只須以意思表示方式為之，即生法律效果","撤銷權因一定期間內不行使而消滅，此期間稱為消滅時效","撤銷權之法律性質與解除權相同，均屬形成權之一種"],"stem":"針對民法有關撤銷權之規範，下列敘述何者正確？","subject":"民法","topic":"撤銷權","year":107},{"answer":"D","explain":"贈與可附負擔（§412）。贈與是契約（不是單獨行為）、諾成（不用交付）；經公證的贈與不得任意撤銷（§408 II）","id":"mf-107-14","laws":[{"ref":"民法 §412","text":"贈與附有負擔者，如贈與人已為給付而受贈人不履行其負擔時，贈與人得請求受贈人履行其負擔，或撤銷贈與。\n負擔以公益為目的者，於贈與人死亡後，主管機關或檢察官得請求受贈人履行其負擔。"},{"ref":"民法 §408","text":"贈與物之權利未移轉前，贈與人得撤銷其贈與。其一部已移轉者，得就其未移轉之部分撤銷之。\n前項規定，於經公證之贈與，或為履行道德上義務而為贈與者，不適用之。"}],"no":14,"options":["贈與係單獨行為","贈與以物之交付為要件，於物之交付後，贈與行為才為生效","經公證之贈與，於贈與物之權利未移轉前，贈與人得隨時撤銷其贈與","贈與得附有負擔"],"stem":"下列有關贈與之敘述，何者正確？","subject":"民法","topic":"贈與","year":107},{"answer":"C","explain":"錯誤選項：法人應設董事（§27），監察人是「得設」。法人有權利能力（專屬自然人的除外）；董事執行職務侵權→法人連帶負責（§28）","id":"mf-107-15","laws":[{"ref":"民法 §27","text":"法人應設董事。董事有數人者，法人事務之執行，除章程另有規定外，取決於全體董事過半數之同意。\n董事就法人一切事務，對外代表法人。董事有數人者，除章程另有規定外，各董事均得代表法人。\n對於董事代表權所加之限制，不得對抗善意第三人。\n法人得設監察人，監察法人事務之執行。監察人有數人者，除章程另有規定外，各監察人均得單獨行使監察權。"},{"ref":"民法 §28","text":"法人對於其董事或其他有代表權之人因執行職務所加於他人之損害，與該行為人連帶負賠償之責任。"}],"no":15,"options":["法人可分為財團法人與社團法人","法人於法令限制內，有享受權利負擔義務之能力。但專屬於自然人之權利義務，不在此限","法人應設董事與監察人","法人對於其董事或其他有代表權之人因執行職務所加於他人之損害，與該行為人連帶負賠償之責任"],"stem":"民法關於法人之規定，下列敘述，何者錯誤？","subject":"民法","topic":"法人機關","year":107},{"answer":"C","explain":"錯誤選項：債務不履行致人格權受侵害→可以準用侵權規定請求賠償（§227-1）","id":"mf-107-16","laws":[{"ref":"民法 §227-1","text":"債務人因債務不履行，致債權人之人格權受侵害者，準用第一百九十二條至第一百九十五條及第一百九十七條之規定，負損害賠償責任。"}],"no":16,"options":["人格權受侵害時，得請求法院除去其侵害；有受侵害之虞時，得請求防止之","名譽權受侵害時，若法院採取命被告登報道歉作為回復名譽之適當處分，依現行司法實務見解，仍屬合憲","債務人因債務不履行，致債權人之人格權受侵害者，不得請求損害賠償","生命權受侵害時，配偶得請求損害賠償與慰撫金"],"stem":"關於人格權保護，下列敘述，何者錯誤？","subject":"民法","topic":"人格權","year":107},{"answer":"B","explain":"已安裝在大廈內運作的電梯＝建物重要成分，不能單獨作為物權客體。義肢（未裝上）、專有部分、能遮風避雨的違建都可以","id":"mf-107-18","laws":[],"no":18,"options":["醫療器材店所販售之大腿義肢","已被安裝置入大廈內運作的客製化電梯","區分所有建築物（如大廈）之專有部分","足以遮風避雨的違章建築物"],"stem":"下列敘述所涉及之物，何者不能單獨作為物權之客體？","subject":"民法","topic":"重要成分","year":107},{"answer":"B","explain":"拾得漂流物準用遺失物規定（§810）→要通知、交存，不能立即取得所有權；不是無主物先占","id":"mf-107-19","laws":[{"ref":"民法 §810","text":"拾得漂流物、沈沒物或其他因自然力而脫離他人占有之物者，準用關於拾得遺失物之規定。"}],"no":19,"options":["甲拾得珍貴漂流木，依民法第802 條無主物先占規定，原始取得其所有權","甲拾得珍貴漂流木，依民法第810 條適用關於拾得遺失物規定，負通知及交存該物之義務，無法立即取得該物所有權","因天災致國有珍貴林木漂流至國有林區外時，甲得自由撿拾取得所有權，不受民法關於拾得遺失物規定之限制","甲因丙取得漂流木所有權而受損害時，得依關於不當得利之規定請求償還價額"],"stem":"甲於颱風過後翌日在河邊拾得從國家森林區漂流而下之珍貴紅檜木，乙自甲處竊取之，並將之以低價出售予不知情之丙。下列敘述，何者正確？","subject":"民法","topic":"漂流物","year":107},{"answer":"A","explain":"地上權可以（另有農育權、典權，§882）；不動產役權不能單獨抵押；著作權、租賃權不行","id":"mf-107-20","laws":[{"ref":"民法 §882","text":"地上權、農育權及典權，均得為抵押權之標的物。"}],"no":20,"options":["地上權","不動產役權","著作權","租賃權"],"stem":"下列何種權利，得為抵押權之標的物？","subject":"民法","topic":"抵押權標的","year":107},{"answer":"C","explain":"一筆地贈與數人→分別共有。祭祀公業派下員、合夥財產、分割前遺產都是公同共有","id":"mf-107-21","laws":[],"no":21,"options":["祭祀公業之派下員對不具法人資格的祭祀公業財產之關係","合夥人對合夥財產之關係","將一筆土地贈與且移轉登記予數人，受贈人對該贈與物之關係","數人繼承遺產，於分割遺產前，各繼承人對於遺產全部之關係"],"stem":"下列何者並非公同共有關係？","subject":"民法","topic":"公同共有","year":107},{"answer":"D","explain":"定義正確（§881-1）。質權是擔保物權不是用益物權；違建建造完成時建造人原始取得所有權；公同共有沒有應有部分，不能就應有部分設定抵押","id":"mf-107-22","laws":[{"ref":"民法 §881-1","text":"稱最高限額抵押權者，謂債務人或第三人提供其不動產為擔保，就債權人對債務人一定範圍內之不特定債權，在最高限額內設定之抵押權。\n最高限額抵押權所擔保之債權，以由一定法律關係所生之債權或基於票據所生之權利為限。\n基於票據所生之權利，除本於與債務人間依前項一定法律關係取得者外，如抵押權人係於債務人已停止支付、開始清算程序，或依破產法有和解、破產之聲請或有公司重整之聲請，而仍受讓票據者，不屬最高限額抵押權所擔保之債權。但抵押權人不知其情事而受讓者，不在此限。"}],"no":22,"options":["用益物權包括地上權、農育權、不動產役權、典權與質權","違章建築物不能辦理移轉登記，故於建造完成時，建造人無法取得所有權","基於公同關係而共有之房地，各共有人得就其應有部分設定抵押權","稱最高限額抵押權者，謂債務人或第三人提供其不動產為擔保，就債權人對債務人一定範圍內之不特定債權，在最高限額內設定之抵押權"],"stem":"下列關於物權規定之敘述，何者正確？","subject":"民法","topic":"最高限額抵押","year":107},{"answer":"A","explain":"錯誤選項：通行權人不限土地所有人，地上權人等也準用（§800-1）。只要與公路無適宜聯絡即可；必要時可開路；要付償金","id":"mf-107-24","laws":[{"ref":"民法 §800-1","text":"第七百七十四條至前條規定，於地上權人、農育權人、不動產役權人、典權人、承租人、其他土地、建築物或其他工作物利用人準用之。"}],"no":24,"options":["通行權人必須為土地所有人","土地因與公路無適宜聯絡即可，無須毫無聯絡方法","通行權人有必要時可以開設道路","通行權人對於通行地因此所受之損害，應支付償金"],"stem":"關於相鄰地必要通行權，下列敘述何者錯誤？","subject":"民法","topic":"袋地通行","year":107},{"answer":"A","explain":"從物常助主物效用、獨立的物，動產不動產都可（§68）。分離後的成分、孳息歸有收取權人（§70）不是占有人；無權占有建屋→房屋屬建築人；能遮風避雨的房屋已是獨立不動產","id":"mf-109-01","laws":[{"ref":"民法 §68","text":"非主物之成分，常助主物之效用，而同屬於一人者，為從物。但交易上有特別習慣者，依其習慣。\n主物之處分，及於從物。"},{"ref":"民法 §70","text":"有收取天然孳息權利之人，其權利存續期間內，取得與原物分離之孳息。\n有收取法定孳息權利之人，按其權利存續期間內之日數，取得其孳息。"}],"no":1,"options":["從物在客觀上需常助主物之效用，且與主物為各自獨立之兩個物，動產或不動產均可為從物","物之成分或其天然孳息，分離後原則上屬於該成分或天然孳息之占有人","無權占有他人土地建築房屋，建築完成時，該房屋原則上屬於土地所有人所有","已足避風雨，可達經濟上使用目的，但屋頂尚未完全完工之房屋，屬土地之成分"],"stem":"下列關於法律上之物的敘述，何者正確？","subject":"民法","topic":"從物","year":109},{"answer":"A","explain":"人格權受侵害的除去妨害請求權不罹於時效。贍養費、繼承回復請求權（§1146 II）都會時效消滅；未登記不動產的返還請求權仍適用時效（已登記的才不適用）","id":"mf-109-02","laws":[{"ref":"民法 §1146","text":"繼承權被侵害者，被害人或其法定代理人得請求回復之。\n前項回復請求權，自知悉被侵害之時起，二年間不行使而消滅；自繼承開始時起逾十年者亦同。"}],"no":2,"options":["人格權受侵害時之除去妨害請求權","夫妻因離婚所約定之贍養費請求權","繼承權受侵害時之回復請求權","未登記不動產所有權人之返還請求權"],"stem":"下列何者非消滅時效適用之客體？","subject":"民法","topic":"消滅時效客體","year":109},{"answer":"C","explain":"買賣標的物利益及危險，自交付時起由買受人承受（§373），不是過戶、簽約或付清價金","id":"mf-109-03","laws":[{"ref":"民法 §373","text":"買賣標的物之利益及危險，自交付時起，均由買受人承受負擔，但契約另有訂定者，不在此限。"}],"no":3,"options":["於甲與乙簽訂汽車買賣契約時起，由乙承受","自該車辦理過戶登記於乙時，由乙承受","自該車交付於乙時起，由乙承受","於乙支付價金完畢時，由乙承受"],"stem":"甲與乙訂立買賣契約，將其二手汽車出賣予乙，若當事人間無特別約定者，關於該汽車之利益及危險，下列何者正確？","subject":"民法","topic":"危險負擔","year":109},{"answer":"C","explain":"可以要約＋承諾、要約交錯、要約＋意思實現（§161）成立；沒有「承諾交錯」這種方式","id":"mf-109-04","laws":[{"ref":"民法 §161","text":"依習慣或依其事件之性質，承諾無須通知者，在相當時期內，有可認為承諾之事實時，其契約為成立。\n前項規定，於要約人要約當時預先聲明承諾無須通知者準用之。"}],"no":4,"options":["契約得以要約與承諾之意思表示合致而成立","契約得以要約交錯之方式而成立","契約得以承諾交錯之方式而成立","契約得以要約與意思實現方式而成立"],"stem":"下列有關契約成立之敘述，何者錯誤？","subject":"民法","topic":"契約成立","year":109},{"answer":"D","explain":"借款到期開本票交給債權人＝新債清償（間接給付，§320），本票兌現前舊債不消滅","id":"mf-109-07","laws":[{"ref":"民法 §320","text":"因清償債務而對於債權人負擔新債務者，除當事人另有意思表示外，若新債務不履行時，其舊債務仍不消滅。"}],"no":7,"options":["甲所受領乙開立的100 萬元本票，是債之內容更改","甲所受領乙開立的100 萬元本票，是抵銷","甲所受領乙開立的100 萬元本票，是代物清償","甲所受領乙開立的100 萬元本票，是新債清償"],"stem":"甲借給乙100 萬元，借期屆至，甲請求乙返還100 萬元借款，乙因此開立100 萬元之本票交由甲受領。下列敘述，何者正確？","subject":"民法","topic":"新債清償","year":109},{"answer":"C","explain":"判決只確定「甲要履行移轉義務」（給付判決），甲還沒辦移轉登記→所有權仍屬甲（§758）","id":"mf-109-10","laws":[{"ref":"民法 §758","text":"不動產物權，依法律行為而取得、設定、喪失及變更者，非經登記，不生效力。\n前項行為，應以書面為之。"}],"no":10,"options":["因甲已將其土地出售乙，故所有權屬於乙","因乙已取得土地買賣契約給付請求權勝訴確定，故所有權屬於乙","因甲尚未辦理土地所有權移轉登記於乙，故所有權仍屬於甲","因該地尚未交付予乙占有，故所有權仍屬於甲"],"stem":"甲將其土地出售乙，但因價金給付方式仍有爭議，故甲拒絕交付予乙，亦不辦理登記，乙起訴請求甲履行買賣契約之給付義務，經判決勝訴確定。下列敘述，何者正確？","subject":"民法","topic":"登記生效","year":109},{"answer":"A","explain":"錯誤選項：因可歸責於受任人而提前終止，不能請求已處理部分報酬；非可歸責於受任人才可以（§548 II）。有償注意義務較高；依習慣應給報酬可請求","id":"mf-109-11","laws":[{"ref":"民法 §548","text":"受任人應受報酬者，除契約另有訂定外，非於委任關係終止及為明確報告顛末後，不得請求給付。\n委任關係，因非可歸責於受任人之事由，於事務處理未完畢前已終止者，受任人得就其已處理之部分，請求報酬。"}],"no":11,"options":["委任關係因可歸責於受任人之事由，而於委任事務處理完畢前經終止者，受任人仍得就已經處理之部分比例請求報酬","受任人受有報酬之注意義務，高於受任人未受報酬之注意義務","當事人縱未約定報酬，但依交易習慣或委任事務之性質應給與報酬者，受任人得請求報酬","除契約另有規定外，原則上於委任關係終止時，受任人須明確報告始末後才能請求報酬"],"stem":"關於委任契約受任人之報酬，下列敘述，何者錯誤？","subject":"民法","topic":"委任報酬","year":109},{"answer":"B","explain":"錯誤選項：違建買受人只取得事實上處分權，不是所有權，不能行使 §767 物上請求權（實務）。拍定人自取得權利移轉證書時取得權利","id":"mf-109-12","laws":[{"ref":"民法 §767","text":"所有人對於無權占有或侵奪其所有物者，得請求返還之。對於妨害其所有權者，得請求除去之。有妨害其所有權之虞者，得請求防止之。\n前項規定，於所有權以外之物權，準用之。"}],"no":12,"options":["土地與土地上之違章建築同屬於一人所有，嗣將違章建築與土地分別讓與相異之人，仍有民法第425 條之1 推定租賃關係規定之適用","違章建築之買受人對於無權占用房屋之人，得行使民法第767 條之物上請求權","違章建築遭拍賣，拍定人自取得法院權利移轉證書之日起，取得該違章建築之權利","甲、乙買賣違章建築，所讓與的是事實上之處分權"],"stem":"甲將自己所有的違章建築A 屋賣給乙，有關於買賣違章建築之法律關係。下列敘述，依實務見解，何者錯誤？","subject":"民法","topic":"違章建築","year":109},{"answer":"C","explain":"社團法人名下財產是法人單獨所有。遺產（分割前）、合夥財產、夫妻共同財產都是公同共有","id":"mf-109-14","laws":[],"no":14,"options":["繼承人有數人時，其繼承取得之遺產","合夥人之合夥財產","屬於社團法人名下之財產","屬於夫妻共同財產制下之財產"],"stem":"下列何者非屬公同共有之性質？","subject":"民法","topic":"公同共有","year":109},{"answer":"D","explain":"加工價值顯逾材料→佛像歸加工人乙（§814）；原主甲依不當得利請求償還價額（§816）。17 歲可占有（占有是事實）；乙賣給丙是有權處分","id":"mf-109-15","laws":[{"ref":"民法 §814","text":"加工於他人之動產者，其加工物之所有權，屬於材料所有人。但因加工所增之價值顯逾材料之價值者，其加工物之所有權屬於加工人。"},{"ref":"民法 §816","text":"因前五條之規定而受損害者，得依關於不當得利之規定，請求償還價額。"}],"no":15,"options":["甲因未滿二十歲，不得占有該木材","乙不能取得名貴的佛像所有權","乙將名貴的佛像讓與並交付予丙，係屬無權處分","甲得向乙請求償還該木材的價額"],"stem":"甲現年十七歲，在山中拾獲名貴木材一塊，嗣後該木材遭乙竊取，乙請人雕刻成名貴的佛像，以高價出售於惡意的丙，並交付之。下列敘述，何者正確？","subject":"民法","topic":"加工","year":109},{"answer":"B","explain":"預付地租非經登記不得對抗受讓人（§836-1）。不可抗力不能請求減免地租（§837）；欠租是「積欠地租達 2 年總額」不是連續 2 年（§836）；無地租的地上權可隨時拋棄（§834）","id":"mf-109-18","laws":[{"ref":"民法 §836-1","text":"土地所有權讓與時，已預付之地租，非經登記，不得對抗第三人。"},{"ref":"民法 §837","text":"地上權人，縱因不可抗力，妨礙其土地之使用，不得請求免除或減少租金。"},{"ref":"民法 §836","text":"地上權人積欠地租達二年之總額，除另有習慣外，土地所有人得定相當期限催告地上權人支付地租，如地上權人於期限內不為支付，土地所有人得終止地上權。地上權經設定抵押權者，並應同時將該催告之事實通知抵押權人。\n地租之約定經登記者，地上權讓與時，前地上權人積欠之地租應併同計算。受讓人就前地上權人積欠之地租，應與讓與人連帶負清償責任。\n第一項終止，應向地上權人以意思表示為之。"},{"ref":"民法 §834","text":"地上權無支付地租之約定者，地上權人得隨時拋棄其權利。"}],"no":18,"options":["地上權人若因不可抗力，妨礙其土地之使用，依法即得請求免除或減少租金","土地所有權讓與時，地上權人已預付之地租，非經登記，不得對抗第三人","地上權人須連續積欠地租達二年，土地所有人始得終止地上權","地上權無支付地租之約定者，地上權人應於一年前通知土地所有人，始得拋棄其權利"],"stem":"下列關於地上權之敘述，何者正確？","subject":"民法","topic":"地上權","year":109},{"answer":"B","explain":"建築物存在必要的權利（地上權）只是併付拍賣，抵押權人對它無優先受償權→不是效力所及。扣押後的租金（§864）、附加部分（§862）、滅失後殘餘物（§862-1）都是效力所及","id":"mf-109-19","laws":[{"ref":"民法 §864","text":"抵押權之效力，及於抵押物扣押後抵押人就抵押物得收取之法定孳息。但抵押權人，非以扣押抵押物之事情，通知應清償法定孳息之義務人，不得與之對抗。"},{"ref":"民法 §862","text":"抵押權之效力，及於抵押物之從物與從權利。\n第三人於抵押權設定前，就從物取得之權利，不受前項規定之影響。\n以建築物為抵押者，其附加於該建築物而不具獨立性之部分，亦為抵押權效力所及。但其附加部分為獨立之物，如係於抵押權設定後附加者，準用第八百七十七條之規定。"},{"ref":"民法 §862-1","text":"抵押物滅失之殘餘物，仍為抵押權效力所及。抵押物之成分非依物之通常用法而分離成為獨立之動產者，亦同。\n前項情形，抵押權人得請求占有該殘餘物或動產，並依質權之規定，行使其權利。"}],"no":19,"options":["抵押物扣押後，抵押人就抵押物所得收取之租金","抵押之建築物存在所必要且性質上得讓與之權利","設定抵押權後所增建附加於該建築物，而不具獨立性之部分","抵押之建築物滅失後殘餘之鋼筋"],"stem":"以建築物設定抵押權者，下列何者非抵押權效力所及之標的物範圍？","subject":"民法","topic":"抵押權效力範圍","year":109},{"answer":"B","explain":"婚前財產在婚姻中生的孳息→視為婚後財產（§1017 II）。財產不足清償債務→法院宣告改用分別財產制（不是法定，§1010）；婚後財產處分不用他方同意","id":"mf-109-22","laws":[{"ref":"民法 §1017","text":"夫或妻之財產分為婚前財產與婚後財產，由夫妻各自所有。不能證明為婚前或婚後財產者，推定為婚後財產；不能證明為夫或妻所有之財產，推定為夫妻共有。\n夫或妻婚前財產，於婚姻關係存續中所生之孳息，視為婚後財產。\n夫妻以契約訂立夫妻財產制後，於婚姻關係存續中改用法定財產制者，其改用前之財產視為婚前財產。"},{"ref":"民法 §1010","text":"夫妻之一方有左列各款情形之一時，法院因他方之請求，得宣告改用分別財產制：\n一、依法應給付家庭生活費用而不給付時。\n二、夫或妻之財產不足清償其債務時。\n三、依法應得他方同意所為之財產處分，他方無正當理由拒絕同意時。\n四、有管理權之一方對於共同財產之管理顯有不當，經他方請求改善而不改善時。\n五、因不當減少其婚後財產，而對他方剩餘財產分配請求權有侵害之虞時。\n六、有其他重大事由時。\n夫妻之總財產不足清償總債務或夫妻難於維持共同生活，不同居已達六個月以上時，前項規定於夫妻均適用之。"}],"no":22,"options":["於法定財產制下，夫或妻之財產分為婚前財產與婚後財產，婚前財產由夫妻各自所有，婚後財產則由夫妻共有","於法定財產制下，夫或妻之婚前及婚後財產，於婚姻關係存續中所生之孳息，均屬於婚後財產之範圍","無論採何種約定財產，當夫或妻其財產不足清償其債務時，法院得因他方之請求，宣告改用法定財產制","夫或妻各自管理、使用、收益其婚前財產與婚後財產，但對於婚後財產為處分時，應得他方之同意"],"stem":"下列關於夫妻法定財產制之敘述，何者正確？","subject":"民法","topic":"法定財產制","year":109},{"answer":"A","explain":"失蹤滿 7 年可聲請（§8）；80 歲以上滿 3 年；特別災難終了滿 1 年（不是 3 個月）；未受死亡宣告前的財產管理依家事事件法（不是破產法，§10）","id":"mf-110-03","laws":[{"ref":"民法 §8","text":"失蹤人失蹤滿七年後，法院得因利害關係人或檢察官之聲請，為死亡之宣告。\n失蹤人為八十歲以上者，得於失蹤滿三年後，為死亡之宣告。\n失蹤人為遭遇特別災難者，得於特別災難終了滿一年後，為死亡之宣告。"},{"ref":"民法 §10","text":"失蹤人失蹤後，未受死亡宣告前，其財產之管理，除其他法律另有規定者外，依家事事件法之規定。"}],"no":3,"options":["失蹤人失蹤滿七年後，法院得因利害關係人或檢察官之聲請，為死亡之宣告","失蹤人為八十歲以上者，得於失蹤滿五年後，為死亡之宣告","失蹤人為遭遇特別災難者，得於特別災難終了滿三個月後，為死亡之宣告","失蹤人失蹤後，未受死亡宣告前，其財產之管理，除其他法律另有規定者外，依破產法之規定"],"stem":"關於失蹤人的敘述，下列何者正確？","subject":"民法","topic":"死亡宣告","year":110},{"answer":"D","explain":"胎兒保護的是權利能力（§7），不是行為能力。受監護宣告人意思表示無效；限制行為能力人未得允許的單獨行為無效；未達結婚年齡結婚→得撤銷不是無效","id":"mf-110-04","laws":[{"ref":"民法 §7","text":"胎兒以將來非死產者為限，關於其個人利益之保護，視為既已出生。"}],"no":4,"options":["受監護宣告之人之意思表示，無效，應由其法定代理人代為意思表示，並代受意思表示","限制行為能力人未得法定代理人之允許，所為之單獨行為，無效","未滿法定結婚年齡之男女，其結婚之法律效果並非無效，而是得撤銷","為保障胎兒之行為能力，胎兒以將來非死產者為限，關於其個人利益之保護，視為既已出生"],"stem":"關於行為能力之敘述，下列何者錯誤？","subject":"民法","topic":"胎兒","year":110},{"answer":"C","explain":"表見代理（§169）正確。授權不用書面，向代理人或第三人以意思表示為之（§167）；代理人有數人→原則共同代理（§168）；無權代理→效力未定不是無效","id":"mf-110-05","laws":[{"ref":"民法 §169","text":"由自己之行為表示以代理權授與他人，或知他人表示為其代理人而不為反對之表示者，對於第三人應負授權人之責任。但第三人明知其無代理權或可得而知者，不在此限。"},{"ref":"民法 §167","text":"代理權係以法律行為授與者，其授與應向代理人或向代理人對之為代理行為之第三人，以意思表示為之。"},{"ref":"民法 §168","text":"代理人有數人者，其代理行為應共同為之。但法律另有規定或本人另有意思表示者，不在此限。"}],"no":5,"options":["代理權係以法律行為授與者，其授與應向代理人或向代理人對之為代理行為之第三人，以書面授權方式代理為之","代理人有數人者，其代理行為應單獨為之。但法律另有規定或本人另有意思表示者，不在此限","由自己之行為表示以代理權授與他人，或知他人表示為其代理人而不為反對之表示者，對於第三人應負授權人之責任。但第三人明知其無代理權或可得而知者，不在此限","代理人於代理權限內，以本人名義所為之意思表示，直接對本人發生效力。而無代理權人以代理人之名義所為之法律行為則為無效"],"stem":"關於代理的敘述，下列何者正確？","subject":"民法","topic":"代理","year":110},{"answer":"B","explain":"收養要書面＋法院認可（§1079）。拋棄動產所有權、贈與、經紀契約都不用書面","id":"mf-110-06","laws":[{"ref":"民法 §1079","text":"收養應以書面為之，並向法院聲請認可。\n收養有無效、得撤銷之原因或違反其他法律規定者，法院應不予認可。"}],"no":6,"options":["動產所有權之拋棄","子女之收養","贈與契約","演藝經紀契約"],"stem":"下列何種法律行為屬法定書面要式行為？","subject":"民法","topic":"法定書面要式","year":110},{"answer":"D","explain":"通謀虛偽隱藏他項法律行為→適用被隱藏的行為（§87 II）。心中保留原則有效，相對人明知才無效（§86）；通謀虛偽→無效","id":"mf-110-07","laws":[{"ref":"民法 §87","text":"表意人與相對人通謀而為虛偽意思表示者，其意思表示無效。但不得以其無效對抗善意第三人。\n虛偽意思表示，隱藏他項法律行為者，適用關於該項法律行為之規定。"},{"ref":"民法 §86","text":"表意人無欲為其意思表示所拘束之意，而為意思表示者，其意思表示，不因之無效。但其情形為相對人所明知者，不在此限。"}],"no":7,"options":["表意人無欲為其意思表示所拘束之意，而為意思表示者，其意思表示無效","表意人無欲為其意思表示所拘束之意，而為意思表示，其情形為相對人所明知者，其意思表示有效","表意人與相對人通謀而為虛偽意思表示者，其意思表示不因之無效","虛偽意思表示，隱藏他項法律行為者，適用關於該項法律行為之規定"],"stem":"關於意思表示不一致的敘述，下列何者正確？","subject":"民法","topic":"意思表示不一致","year":110},{"answer":"B","explain":"實行抵押權聲請強制執行前 5 年內發生的利息＋執行中發生的（§861 II）","id":"mf-110-08","laws":[{"ref":"民法 §861","text":"抵押權所擔保者為原債權、利息、遲延利息、違約金及實行抵押權之費用。但契約另有約定者，不在此限。\n得優先受償之利息、遲延利息、一年或不及一年定期給付之違約金債權，以於抵押權人實行抵押權聲請強制執行前五年內發生及於強制執行程序中發生者為限。"}],"no":8,"options":["二年","五年","十年","十五年"],"stem":"關於抵押權所擔保而得優先受償之利息，以於抵押權人實行抵押權聲請強制執行前幾年內發生及於強制執行程序中發生者為限？","subject":"民法","topic":"抵押權擔保利息","year":110},{"answer":"C","explain":"設定抵押權的物權行為要登記才生效（§758）。繼承登記前就取得（§759）；買賣契約是債權契約；夫妻財產制契約登記是對抗要件","id":"mf-110-09","laws":[{"ref":"民法 §758","text":"不動產物權，依法律行為而取得、設定、喪失及變更者，非經登記，不生效力。\n前項行為，應以書面為之。"},{"ref":"民法 §759","text":"因繼承、強制執行、徵收、法院之判決或其他非因法律行為，於登記前已取得不動產物權者，應經登記，始得處分其物權。"}],"no":9,"options":["遺產之繼承","土地買賣契約","設定抵押權之物權行為","夫妻就共同財產制之約定"],"stem":"依現行民法規定，下列何者須經登記始生法律效力？","subject":"民法","topic":"登記生效","year":110},{"answer":"D","explain":"先就主債務人財產強制執行無效果前可拒絕清償＝先訴抗辯權（§745）","id":"mf-110-11","laws":[{"ref":"民法 §745","text":"保證人於債權人未就主債務人之財產強制執行而無效果前，對於債權人得拒絕清償。"}],"no":11,"options":["同時履行抗辯","撤銷訴權","追索權抗辯","先訴抗辯"],"stem":"民法於保證契約一節中規定，保證人於債權人未就主債務人之財產強制執行而無效果前，對於債權人得拒絕清償，概念上一般稱為？","subject":"民法","topic":"保證","year":110},{"answer":"C","explain":"一人不能償還的部分→由求償權人與他債務人按比例分擔（§282 I），已免責的人也要分擔（§282 II）。一人單獨負責的事由由該人負擔（§280 但書）；求償可請求利息（§281）","id":"mf-110-12","laws":[{"ref":"民法 §282","text":"連帶債務人中之一人，不能償還其分擔額者，其不能償還之部分，由求償權人與他債務人按照比例分擔之。但其不能償還，係由求償權人之過失所致者，不得對於他債務人請求其分擔。\n前項情形，他債務人中之一人應分擔之部分已免責者，仍應依前項比例分擔之規定，負其責任。"},{"ref":"民法 §280","text":"連帶債務人相互間，除法律另有規定或契約另有訂定外，應平均分擔義務。但因債務人中之一人應單獨負責之事由所致之損害及支付之費用，由該債務人負擔。"},{"ref":"民法 §281","text":"連帶債務人中之一人，因清償、代物清償、提存、抵銷或混同，致他債務人同免責任者，得向他債務人請求償還各自分擔之部分，並自免責時起之利息。\n前項情形，求償權人於求償範圍內，承受債權人之權利。但不得有害於債權人之利益。"}],"no":12,"options":["連帶債務人相互間，縱因債務人中之一人應單獨負責之事由所致之損害及支付之費用，仍應平均分擔義務","連帶債務人中之一人，因清償、代物清償、提存、抵銷或混同，致他債務人同免責任者，得向他債務人請求償還各自分擔之部分，但不得請求利息","連帶債務人中之一人，不能償還其分擔額者，其不能償還之部分，由求償權人與他債務人按照比例分擔之","連帶債務人中之一人，不能償還其分擔額，而他債務人中之一人應分擔之部分已免責者，無須負其責任"],"stem":"關於連帶債務的敘述，下列何者正確？","subject":"民法","topic":"連帶債務求償","year":110},{"answer":"B","explain":"債務人無償行為害及債權→聲請法院撤銷（§244）。受詐欺意思表示撤銷即可；違反公序→無效；違反近親禁婚→無效（§988）","id":"mf-110-13","laws":[{"ref":"民法 §244","text":"債務人所為之無償行為，有害及債權者，債權人得聲請法院撤銷之。\n債務人所為之有償行為，於行為時明知有損害於債權人之權利者，以受益人於受益時亦知其情事者為限，債權人得聲請法院撤銷之。\n債務人之行為非以財產為標的，或僅有害於以給付特定物為標的之債權者，不適用前二項之規定。\n債權人依第一項或第二項之規定聲請法院撤銷時，得並聲請命受益人或轉得人回復原狀。但轉得人於轉得時不知有撤銷原因者，不在此限。"},{"ref":"民法 §988","text":"結婚有下列情形之一者，無效：\n一、不具備第九百八十二條之方式。\n二、違反第九百八十三條規定。\n三、違反第九百八十五條規定。但重婚之雙方當事人因善意且無過失信賴一方前婚姻消滅之兩願離婚登記或離婚確定判決而結婚者，不在此限。"}],"no":13,"options":["因受詐欺所為之意思表示","債務人所為之無償行為，有害及債權者","締結違反公共秩序之契約","違反民法第983 條特定親屬間禁止結婚規定之結婚行為"],"stem":"下列何種情形，當事人一方須以向法院聲請撤銷方式為之？","subject":"民法","topic":"聲請法院撤銷","year":110},{"answer":"B","explain":"合夥人沒有增資、補充資本的義務（§669）。合夥財產是公同共有；不足額→合夥人連帶負責（§681）；退夥後對退夥前債務仍要負責（§690）","id":"mf-110-14","laws":[{"ref":"民法 §669","text":"合夥人除有特別訂定外，無於約定出資之外增加出資之義務。因損失而致資本減少者，合夥人無補充之義務。"},{"ref":"民法 §681","text":"合夥財產不足清償合夥之債務時，各合夥人對於不足之額，連帶負其責任。"},{"ref":"民法 §690","text":"合夥人退夥後，對於其退夥前合夥所負之債務，仍應負責。"}],"no":14,"options":["各合夥人之出資及其他合夥財產，為合夥人全體之分別共有","合夥人除有特別訂定外，無於約定出資之外增加出資之義務。因損失而致資本減少者，合夥人無補充之義務","合夥財產不足清償合夥之債務時，各合夥人對於不足之額，無須負其責任","合夥人退夥後，對於其退夥前合夥所負之債務，無須負其責任"],"stem":"關於合夥的敘述，下列何者正確？","subject":"民法","topic":"合夥","year":110},{"answer":"C","explain":"只能就瑕疵物解除，分離顯受損害→可解除全部（§363 I）。從物有瑕疵→只能就從物解除；他地送到的物不受領→仍有暫為保管責任（§358）；種類物另行交付的物，出賣人仍負擔保責任（§364 II）","id":"mf-110-15","laws":[{"ref":"民法 §363","text":"為買賣標的之數物中，一物有瑕疵者，買受人僅得就有瑕疵之物為解除。其以總價金將數物同時賣出者，買受人並得請求減少與瑕疵物相當之價額。\n前項情形，當事人之任何一方，如因有瑕疵之物，與他物分離而顯受損害者，得解除全部契約。"},{"ref":"民法 §358","text":"買受人對於由他地送到之物，主張有瑕疵，不願受領者，如出賣人於受領地無代理人，買受人有暫為保管之責。\n前項情形，如買受人不即依相當方法證明其瑕疵之存在者，推定於受領時為無瑕疵。\n送到之物易於敗壞者，買受人經依相當方法之證明，得照市價變賣之。如為出賣人之利益，有必要時，並有變賣之義務。\n買受人依前項規定為變賣者，應即通知出賣人。如怠於通知，應負損害賠償之責。"},{"ref":"民法 §364","text":"買賣之物，僅指定種類者，如其物有瑕疵，買受人得不解除契約或請求減少價金，而即時請求另行交付無瑕疵之物。\n出賣人就前項另行交付之物，仍負擔保責任。"}],"no":15,"options":["買受人對於由他地送到之物，主張有瑕疵，不願受領者，買受人無暫為保管之責","從物有瑕疵者，買受人得就主物併同從物，解除全部契約","為買賣標的之數物中，一物有瑕疵者，買受人僅得就有瑕疵之物為解除，但當事人之任何一方，如因有瑕疵之物，與他物分離而顯受損害者，得解除全部契約","買賣之物，僅指定種類者，如其物有瑕疵，買受人得不解除契約或請求減少價金，而即時請求另行交付無瑕疵之物。出賣人就另行交付之物，不負擔保責任"],"stem":"關於買賣瑕疵擔保的敘述，下列何者正確？","subject":"民法","topic":"數物一物有瑕疵","year":110},{"answer":"D","explain":"登記不影響依其他法律所為財產權登記的效力（§1008 III）。結婚前或後都可訂；法定財產制（舊制才叫聯合財產制）；非經登記不得對抗第三人，不是不生效力","id":"mf-110-19","laws":[{"ref":"民法 §1008","text":"夫妻財產制契約之訂立、變更或廢止，非經登記，不得以之對抗第三人。\n前項夫妻財產制契約之登記，不影響依其他法律所為財產權登記之效力。\n第一項之登記，另以法律定之。"}],"no":19,"options":["夫妻得於結婚前以契約就民法所定之約定財產制中，選擇其一，為其夫妻財產制。結婚後則不行","夫妻未以契約訂立夫妻財產制者，除民法另有規定外，以聯合財產制，為其夫妻財產制","夫妻財產制契約之訂立、變更或廢止，非經登記，不生效力","夫妻財產制契約之登記，不影響依其他法律所為財產權登記之效力"],"stem":"關於夫妻財產制契約的敘述，下列何者正確？","subject":"民法","topic":"夫妻財產制契約","year":110},{"answer":"D","explain":"夫妻各自清償債務（§1046）；一方以自己財產替他方還債，婚姻存續中也能請求償還。(B)(C) 寫「存續中不得請求」都錯","id":"mf-110-20","laws":[{"ref":"民法 §1046","text":"分別財產制有關夫妻債務之清償，適用第一千零二十三條之規定。"}],"no":20,"options":["夫妻於行為時明知有損於婚姻關係消滅後他方之剩餘財產分配請求權者，以受益人受益時亦知其情事者為限，他方得聲請法院撤銷之","夫妻之一方以自己財產清償他方之債務時，於婚姻關係存續中，不得請求償還。但於婚姻關係消滅時，夫或妻現存之婚後財產，扣除婚姻關係存續所負債務後，如有剩餘，其雙方剩餘財產之差額，應平均分配","夫妻之一方以自己財產清償他方之債務時，於婚姻關係存續中，不得請求償還。但於婚姻關係消滅時，應分別納入現存之婚後財產或婚姻關係存續中所負債務計算","夫妻各自對其債務負清償之責"],"stem":"分別財產制有關夫妻債務的敘述，下列何者正確？","subject":"民法","topic":"分別財產制債務","year":110},{"answer":"A","explain":"共同財產的債務用共同財產清償→不生補償請求權（§1038 I）","id":"mf-110-21","laws":[{"ref":"民法 §1038","text":"共同財產所負之債務，而以共同財產清償者，不生補償請求權。\n共同財產之債務，而以特有財產清償，或特有財產之債務，而以共同財產清償者，有補償請求權，雖於婚姻關係存續中，亦得請求。"}],"no":21,"options":["不生補償請求權","不生補償請求權，但於共同財產制關係消滅時，應分別納入現存之婚後財產或婚姻關係存續中所負債務計算","有補償請求權，但於婚姻關係存續中，不得請求","有補償請求權，雖於婚姻關係存續中，亦得請求"],"stem":"關於共同財產所負之債務，而以共同財產清償者，下列何者正確？","subject":"民法","topic":"共同財產制債務","year":110},{"answer":"A","explain":"否認推定婚生子女要提否認之訴（§1063 II），不是認領之訴。生父生母結婚→視為婚生（準正）；認領→視為婚生；子女或生母可否認生父的認領（§1066）","id":"mf-110-22","laws":[{"ref":"民法 §1063","text":"妻之受胎，係在婚姻關係存續中者，推定其所生子女為婚生子女。\n前項推定，夫妻之一方或子女能證明子女非為婚生子女者，得提起否認之訴。\n前項否認之訴，夫妻之一方自知悉該子女非為婚生子女，或子女自知悉其非為婚生子女之時起二年內為之。但子女於未成年時知悉者，仍得於成年後二年內為之。"},{"ref":"民法 §1066","text":"非婚生子女或其生母，對於生父之認領，得否認之。"}],"no":22,"options":["如有受推定為婚生子女情形，夫妻之一方或子女能證明子女非為婚生子女者，得提起認領之訴","非婚生子女，其生父與生母結婚者，視為婚生子女","非婚生子女經生父認領者，視為婚生子女","非婚生子女或其生母，對於生父之認領，得否認之"],"stem":"民法關於非婚生子女之規定，下列何者錯誤？","subject":"民法","topic":"非婚生子女","year":110},{"answer":"C","explain":"官方答 (C) 錯誤。阿摩網友理由：繼承人要在繼承開始時生存（同時存在原則）、拋棄溯及繼承開始。⚠️但乙在甲死亡時其實還活著，這個理由說不太通，屬爭議題；考場直接記「丙拋棄前乙已死→丁不能繼承乙那一份」即可，不深究","id":"mf-110-23","laws":[],"no":23,"options":["甲之遺產繼承人順序，丙優先於乙","配偶丁與乙有相互繼承遺產之權","就甲之遺產，既然丙已拋棄繼承，應由次順序之乙繼承，雖然乙早於丙拋棄繼承前死亡，仍應由丁繼承乙所繼承自甲之遺產","拋棄繼承權，應於知悉其得繼承之時起三個月內，以書面向法院為之"],"stem":"甲早年父母雙亡，僅有一兄長乙，甲與配偶離異後獨自養育一子丙。某日甲死亡，於丙拋棄繼承前，乙亦不幸意外死亡，留下乙之配偶丁。下列何者錯誤？","subject":"民法","topic":"拋棄繼承","warn":"爭議題：官方答 (C)，理由說不太通，考場直接記結論就好。","year":110},{"answer":"D","explain":"繼承人連帶責任，自分割時（或清償期後）經 5 年免除（§1171 II）。可隨時請求分割（沒有服喪期）；遺囑禁止分割最多 10 年；擔保支付能力看分割時（附條件或未到期才看清償時，§1169）","id":"mf-110-25","laws":[{"ref":"民法 §1171","text":"遺產分割後，其未清償之被繼承人之債務，移歸一定之人承受，或劃歸各繼承人分擔，如經債權人同意者，各繼承人免除連帶責任。\n繼承人之連帶責任，自遺產分割時起，如債權清償期在遺產分割後者，自清償期屆滿時起，經過五年而免除。"},{"ref":"民法 §1169","text":"遺產分割後，各繼承人按其所得部分，對於他繼承人因分割而得之債權，就遺產分割時債務人之支付能力，負擔保之責。\n前項債權，附有停止條件或未屆清償期者，各繼承人就應清償時債務人之支付能力，負擔保之責。"}],"no":25,"options":["繼承人於服喪三年後得隨時請求分割遺產","遺囑禁止遺產之分割者，其禁止之效力以二十年為限","遺產分割後，各繼承人按其所得部分，對於他繼承人因分割而得之債權，就應清償時債務人之支付能力，負擔保之責","繼承人之連帶責任，自遺產分割時起，如債權清償期在遺產分割後者，自清償期屆滿時起，經過五年而免除"],"stem":"關於遺產分割的敘述，下列何者正確？","subject":"民法","topic":"遺產分割","year":110},{"answer":"A","explain":"前小姨子＝旁系姻親、輩分相同→可以結婚。前養女（收養終止後直系親屬仍禁婚）、前媳婦（直系姻親，關係消滅後仍禁婚）、叔母（旁系姻親輩分不同）都禁止（§983）","id":"mf-111-02","laws":[{"ref":"民法 §983","text":"與左列親屬，不得結婚︰\n一、直系血親及直系姻親。\n二、旁系血親在六親等以內者。但因收養而成立之四親等及六親等旁系血親，輩分相同者，不在此限。\n三、旁系姻親在五親等以內，輩分不相同者。\n前項直系姻親結婚之限制，於姻親關係消滅後，亦適用之。\n第一項直系血親及直系姻親結婚之限制，於因收養而成立之直系親屬間，在收養關係終止後，亦適用之。"}],"no":2,"options":["與離婚後無依無靠之前小姨子結婚","與終止收養後之前養女結婚","與自己兒子離婚後之前媳婦結婚","與叔叔死亡後孤苦守寡之叔母結婚"],"stem":"下列何種情況是非屬於近親禁止結婚之規範範圍？","subject":"民法","topic":"近親禁婚","year":111},{"answer":"B","explain":"「買賣不破租賃」只適用租賃，使用借貸不能主張；使用借貸一定無償；動物飼養費原則由借用人負擔（§469）；借用人不能轉借收益","id":"mf-111-04","laws":[{"ref":"民法 §469","text":"借用物之通常保管費用，由借用人負擔。借用物為動物者，其飼養費亦同。\n借用人就借用物支出有益費用，因而增加該物之價值者，準用第四百三十一條第一項之規定。\n借用人就借用物所增加之工作物，得取回之。但應回復借用物之原狀。"}],"no":4,"options":["使用借貸契約必須是無償的契約","借用人得主張買賣不破使用借貸之抗辯","借用物為動物時，飼養費原則上應由借用人承擔","借用人對於借用物原則上並無轉租收益之權限"],"stem":"下列敘述，何者錯誤？","subject":"民法","topic":"使用借貸","year":111},{"answer":"D","explain":"間接給付（新債清償，§320）：新債務不履行時舊債務不消滅。代物清償、抵銷、混同都會讓債務消滅","id":"mf-111-06","laws":[{"ref":"民法 §320","text":"因清償債務而對於債權人負擔新債務者，除當事人另有意思表示外，若新債務不履行時，其舊債務仍不消滅。"}],"no":6,"options":["債權人受領債務人以代物清償方式清償原有之債務","債務人對債權人已屆清償期之債權行使抵銷權，彼此間在抵銷數額之債權債務","債權與其債務發生混同之情形","債務人以間接給付之方式清償原有之債務"],"stem":"下列何種情形，債務人之原有債務不會發生消滅之效果？","subject":"民法","topic":"間接給付","year":111},{"answer":"A","explain":"自己代理（§106）沒經本人同意→效力未定（本人可承認），不是無效。表見代理以「沒有代理權」為前提；間接代理不直接對本人生效；代理人被詐欺→本人可撤銷（§105 以代理人判斷）","id":"mf-111-08","laws":[{"ref":"民法 §106","text":"代理人非經本人之許諾，不得為本人與自己之法律行為，亦不得既為第三人之代理人，而為本人與第三人之法律行為。但其法律行為，係專履行債務者，不在此限。"},{"ref":"民法 §105","text":"代理人之意思表示，因其意思欠缺、被詐欺、被脅迫，或明知其事情或可得而知其事情，致其效力受影響時，其事實之有無，應就代理人決之。但代理人之代理權係以法律行為授與者，其意思表示，如依照本人所指示之意思而為時，其事實之有無，應就本人決之。"}],"no":8,"options":["未經本人事前同意之自己代理，對於本人而言，係無效之代理行為","民法第169 條表見代理效力之發生，須無本人之授予代理權為其要件","間接代理人之代理行為不會對本人直接發生效力","代理人為代理行為時，被相對人詐欺，本人得自行撤銷該代理行為"],"stem":"有關現行民法代理制度之介紹，下列何者錯誤？","subject":"民法","topic":"代理","year":111},{"answer":"C","explain":"財團法人得以遺囑設立（§60）。財團是他律法人（題目說自律錯）；開除社員要總會決議＋正當理由（不是董事會）；社團最高機關是總會不是董事會","id":"mf-111-09","laws":[{"ref":"民法 §60","text":"設立財團者，應訂立捐助章程。但以遺囑捐助者，不在此限。\n捐助章程，應訂明法人目的及所捐財產。\n以遺囑捐助設立財團法人者，如無遺囑執行人時，法院得依主管機關、檢察官或利害關係人之聲請，指定遺囑執行人。"}],"no":9,"options":["財團法人具有自律法人之性質","社員資格須經社團之董事會特別決議同意，且有正當理由時，方能開除之","財團法人之設立，得以遺囑為之","社團法人以社團董事會為其最高意思機關"],"stem":"對於民法上有關法人規定之說明，下列何者正確？","subject":"民法","topic":"法人","year":111},{"answer":"A","explain":"給付前後都能聲請法院撤銷（§74）；1 年期間是除斥期間不是消滅時效；要向法院聲請，不是對相對人意思表示；不是自始無效","id":"mf-111-11","laws":[{"ref":"民法 §74","text":"法律行為，係乘他人之急迫、輕率或無經驗，使其為財產上之給付或為給付之約定，依當時情形顯失公平者，法院得因利害關係人之聲請，撤銷其法律行為或減輕其給付。\n前項聲請，應於法律行為後一年內為之。"}],"no":11,"options":["當事人無論於財產給付前或給付後，均得聲請撤銷該暴利行為","撤銷權自該法律行為成立時起一年內不行使，罹於消滅時效而消滅","行使暴利行為之撤銷權時，應以意思表示向相對人為之","暴利行為自始當然無效"],"stem":"關於民法第74 條暴利行為之規定，下列敘述何者正確？","subject":"民法","topic":"暴利行為","year":111},{"answer":"D","explain":"共有人分割後的擔保責任是按應有部分負責（§825），不是連帶。合夥人對不足額（§681）、共同侵權（§185）、共同繼承人對遺產債務（§1153）都是法定連帶","id":"mf-111-12","laws":[{"ref":"民法 §825","text":"各共有人，對於他共有人因分割而得之物，按其應有部分，負與出賣人同一之擔保責任。"},{"ref":"民法 §681","text":"合夥財產不足清償合夥之債務時，各合夥人對於不足之額，連帶負其責任。"},{"ref":"民法 §185","text":"數人共同不法侵害他人之權利者，連帶負損害賠償責任。不能知其中孰為加害人者亦同。\n造意人及幫助人，視為共同行為人。"},{"ref":"民法 §1153","text":"繼承人對於被繼承人之債務，以因繼承所得遺產為限，負連帶責任。\n繼承人相互間對於被繼承人之債務，除法律另有規定或另有約定外，按其應繼分比例負擔之。"}],"no":12,"options":["合夥財產不足清償合夥債務時，各合夥人對於該不足額之債務","數人共同不法侵害他人權利所生之損害賠償債務","共同繼承人對於被繼承人，於繼承所得遺產限度內之遺產債務","共有人對於他共有人因分割而得之物，所負之擔保責任債務"],"stem":"下列何者非法律明文規定屬於連帶債務之性質？","subject":"民法","topic":"連帶債務","year":111},{"answer":"B","explain":"管理決定顯失公平，或情事變更難以繼續→法院得因任何共有人聲請以裁定變更（§820 II、III）。(A) 寫「半數以上」錯，要「過半數」；(C) 是聲請裁定不是訴請裁判；(D) 不動產的約定要登記後才對受讓人有效，「受讓時知悉就有效」是動產的規定（§826-1）","id":"mf-111-14","laws":[{"ref":"民法 §820","text":"共有物之管理，除契約另有約定外，應以共有人過半數及其應有部分合計過半數之同意行之。但其應有部分合計逾三分之二者，其人數不予計算。\n依前項規定之管理顯失公平者，不同意之共有人得聲請法院以裁定變更之。\n前二項所定之管理，因情事變更難以繼續時，法院得因任何共有人之聲請，以裁定變更之。\n共有人依第一項規定為管理之決定，有故意或重大過失，致共有人受損害者，對不同意之共有人連帶負賠償責任。\n共有物之簡易修繕及其他保存行為，得由各共有人單獨為之。"},{"ref":"民法 §826-1","text":"不動產共有人間關於共有物使用、管理、分割或禁止分割之約定或依第八百二十條第一項規定所為之決定，於登記後，對於應有部分之受讓人或取得物權之人，具有效力。其由法院裁定所定之管理，經登記後，亦同。\n動產共有人間就共有物為前項之約定、決定或法院所為之裁定，對於應有部分之受讓人或取得物權之人，以受讓或取得時知悉其情事或可得而知者為限，亦具有效力。\n共有物應有部分讓與時，受讓人對讓與人就共有物因使用、管理或其他情形所生之負擔連帶負清償責任。"}],"no":14,"options":["分管契約應以共有人半數以上及其應有部分合計過半數，或應有部分合計逾三分之二之同意訂定之","分管契約訂定後，若因情事變更難以繼續時，法院得因任何共有人之聲請，以裁定變更之","共有人對於分管契約無法達成協議時，得訴請法院裁判定分管方式","分管契約訂定後，對於應有部分之受讓人於受讓時知悉其情事者，亦具有效力"],"stem":"關於共有不動產分管契約之敘述，下列何者正確？","subject":"民法","topic":"分管契約","year":111},{"answer":"A","explain":"丙侮辱的是母親乙，不是被繼承人甲→不符 §1145 I 第 5 款，不喪失；丁在甲生前表示拋棄＝預先拋棄無效（拋棄要繼承開始後）→乙丙丁戊各 150 萬","id":"mf-111-15","laws":[{"ref":"民法 §1145","text":"有左列各款情事之一者，喪失其繼承權：\n一、故意致被繼承人或應繼承人於死或雖未致死因而受刑之宣告者。\n二、以詐欺或脅迫使被繼承人為關於繼承之遺囑，或使其撤回或變更之者。\n三、以詐欺或脅迫妨害被繼承人為關於繼承之遺囑，或妨害其撤回或變更之者。\n四、偽造、變造、隱匿或湮滅被繼承人關於繼承之遺囑者。\n五、對於被繼承人有重大之虐待或侮辱情事，經被繼承人表示其不得繼承者。\n前項第二款至第四款之規定，如經被繼承人宥恕者，其繼承權不喪失。"}],"no":15,"options":["乙、丙、丁、戊各150 萬元","乙、戊各200 萬元，庚、辛各100 萬元","乙、丁、戊各150 萬元，庚、辛各75 萬元","乙、戊各300 萬元"],"stem":"甲與乙結婚，生有三個女兒丙、丁、戊。丙因未婚生有二子庚及辛，曾與其母乙發生重大爭吵及言語侮辱情事，而遭甲表示剝奪其繼承權。丁則於甲生前即已向甲表示，當甲百年後將拋棄繼承權。設甲死亡時留有遺產現金600 萬元，並未立有遺囑。問:甲之遺產依法應如何分配？","subject":"民法","topic":"喪失繼承權＋預先拋棄","year":111},{"answer":"B","explain":"現制全面限定責任（§1148 II）：沒開遺產清冊不當然喪失限定利益。仍要繼承債務、只是以遺產為限；隱匿遺產情節重大→不能主張限定（§1163）；順序是先還債權人、最後才交付遺贈（§1160）","id":"mf-111-16","laws":[{"ref":"民法 §1148","text":"繼承人自繼承開始時，除本法另有規定外，承受被繼承人財產上之一切權利、義務。但權利、義務專屬於被繼承人本身者，不在此限。\n繼承人對於被繼承人之債務，以因繼承所得遺產為限，負清償責任。"},{"ref":"民法 §1163","text":"繼承人中有下列各款情事之一者，不得主張第一千一百四十八條第二項所定之利益：\n一、隱匿遺產情節重大。\n二、在遺產清冊為虛偽之記載情節重大。\n三、意圖詐害被繼承人之債權人之權利而為遺產之處分。"},{"ref":"民法 §1160","text":"繼承人非依前條規定償還債務後，不得對受遺贈人交付遺贈。"}],"no":16,"options":["限定繼承係指繼承人自繼承開始時，僅承受被繼承人財產上之權利，而不繼承其債務","繼承人縱未依法開具遺產清冊陳報法院，並不當然喪失限定繼承之利益","繼承人隱匿被繼承人之遺產而情節重大者，仍可主張限定繼承之利益","繼承人應先對受遺贈人交付遺贈，其次償還優先權之債務，再清償普通債務"],"stem":"關於限定繼承之敘述，下列何者正確？","subject":"民法","topic":"限定責任","year":111},{"answer":"C","explain":"夫妻各自管理、使用、收益、處分婚前婚後財產，各自清償債務（§1018）。婚後財產不是共有；追加計算限「為減少他方分配、法定財產制消滅前 5 年內」的處分（§1030-3）；分配請求權 2 年／5 年時效從「知有差額」起算（§1030-1 V）","id":"mf-111-17","laws":[{"ref":"民法 §1018","text":"夫或妻各自管理、使用、收益及處分其財產。"},{"ref":"民法 §1030-3","text":"夫或妻為減少他方對於剩餘財產之分配，而於法定財產制關係消滅前五年內處分其婚後財產者，應將該財產追加計算，視為現存之婚後財產。但為履行道德上義務所為之相當贈與，不在此限。\n前項情形，分配權利人於義務人不足清償其應得之分配額時，得就其不足額，對受領之第三人於其所受利益內請求返還。但受領為有償者，以顯不相當對價取得者為限。\n前項對第三人之請求權，於知悉其分配權利受侵害時起二年間不行使而消滅。自法定財產制關係消滅時起，逾五年者，亦同。"},{"ref":"民法 §1030-1","text":"法定財產制關係消滅時，夫或妻現存之婚後財產，扣除婚姻關係存續所負債務後，如有剩餘，其雙方剩餘財產之差額，應平均分配。但下列財產不在此限：\n一、因繼承或其他無償取得之財產。\n二、慰撫金。\n夫妻之一方對於婚姻生活無貢獻或協力，或有其他情事，致平均分配有失公平者，法院得調整或免除其分配額。\n法院為前項裁判時，應綜合衡酌夫妻婚姻存續期間之家事勞動、子女照顧養育、對家庭付出之整體協力狀況、共同生活及分居時間之久暫、婚後財產取得時間、雙方之經濟能力等因素。\n第一項請求權，不得讓與或繼承。但已依契約承諾，或已起訴者，不在此限。\n第一項剩餘財產差額之分配請求權，自請求權人知有剩餘財產之差額時起，二年間不行使而消滅。自法定財產制關係消滅時起，逾五年者，亦同。"}],"no":17,"options":["夫或妻之財產分為婚前財產與婚後財產，婚前財產由夫妻各自所有，婚後財產則由夫妻共有","夫或妻於婚姻關係存續中就其婚後財產所為之無償行為，應將該財產追加計算，視為現存之婚後財產","夫或妻各自管理、使用、收益及處分其婚前及婚後財產，並各自對其債務負清償之責","剩餘財產差額分配請求權屬一身專屬性之權利，請求權人自法定財產制關係消滅時起，二年間不行使而消滅"],"stem":"關於夫妻法定財產制之規定，下列敘述何者正確？","subject":"民法","topic":"法定財產制","year":111},{"answer":"B","explain":"以建築物設定抵押，建築物存在必要的權利（地上權）可讓與→併付拍賣（§877-1），但抵押權人對這部分價金無優先受償權","id":"mf-111-18","laws":[{"ref":"民法 §877-1","text":"以建築物設定抵押權者，於法院拍賣抵押物時，其抵押物存在所必要之權利得讓與者，應併付拍賣。但抵押權人對於該權利賣得之價金，無優先受清償之權。"}],"no":18,"options":["若丁實行抵押權拍賣B 屋時，A 地所有權應併付拍賣之","若丁實行抵押權拍賣B 屋時，地上權應併付拍賣之","若丙實行抵押權拍賣A 地所有權時，B 屋應併付拍賣之","若丙實行抵押權拍賣A 地所有權時，地上權應併付拍賣之"],"stem":"甲將其A 地設定地上權予乙，乙於A 土地上興建B 屋一棟。其後甲為貸款擔保而將其A 地設定抵押權予丙，乙亦因其貸款擔保而將B 屋設定抵押權予丁。下列敘述何者正確？","subject":"民法","topic":"建築物抵押＋地上權","year":111},{"answer":"B","explain":"果樹附合於土地屬乙；果實分離前是土地成分屬乙；分離後歸有收取權的人（§70），無權占有人甲沒有收取權→分離前後都屬乙","id":"mf-111-19","laws":[{"ref":"民法 §70","text":"有收取天然孳息權利之人，其權利存續期間內，取得與原物分離之孳息。\n有收取法定孳息權利之人，按其權利存續期間內之日數，取得其孳息。"}],"no":19,"options":["果實在與果樹分離前或分離後，均屬於甲所有","果實在與果樹分離前或分離後，均屬於乙所有","果實在與果樹分離前屬於甲所有，分離後屬於乙所有","果實在與果樹分離前屬於乙所有，分離後屬於甲所有"],"stem":"甲無權占有乙之土地種植果樹，其果實歸屬於何人？","subject":"民法","topic":"無權占有種果樹","year":111},{"answer":"C","explain":"特定物買賣不能請求另行交付，只有種類物可以（§364）；可解約、減價，故意不告知瑕疵可請求損害賠償（§360）","id":"mf-111-20","laws":[{"ref":"民法 §364","text":"買賣之物，僅指定種類者，如其物有瑕疵，買受人得不解除契約或請求減少價金，而即時請求另行交付無瑕疵之物。\n出賣人就前項另行交付之物，仍負擔保責任。"},{"ref":"民法 §360","text":"買賣之物，缺少出賣人所保證之品質者，買受人得不解除契約或請求減少價金，而請求不履行之損害賠償；出賣人故意不告知物之瑕疵者亦同。"}],"no":20,"options":["解除買賣契約","請求減少買賣價金","請求另行交付無瑕疵之物","故意不告知瑕疵時，請求損害賠償"],"stem":"特定物買賣，若因物有瑕疵而出賣人依法應負物之瑕疵擔保責任時，下列何者非買受人依法所得主張之權利？","subject":"民法","topic":"物之瑕疵擔保","year":111},{"answer":"D","explain":"租用基地建屋→承租人可請求出租人辦地上權登記（§422-1）。超過 1 年沒字據→視為不定期租賃，不是無效；租金增減限未定期限的租賃（§442）；出租人對承租人放在屋內的物是留置權不是質權（§445）","id":"mf-111-21","laws":[{"ref":"民法 §422-1","text":"租用基地建築房屋者，承租人於契約成立後，得請求出租人為地上權之登記。"},{"ref":"民法 §442","text":"租賃物為不動產者，因其價值之昇降，當事人得聲請法院增減其租金。但其租賃定有期限者，不在此限。"},{"ref":"民法 §445","text":"不動產之出租人，就租賃契約所生之債權，對於承租人之物置於該不動產者，有留置權。但禁止扣押之物，不在此限。\n前項情形，僅於已得請求之損害賠償及本期與以前未交之租金之限度內，得就留置物取償。"}],"no":21,"options":["期限逾一年之不動產租賃契約，應以字據訂立之，否則契約無效","定有期限之不動產租賃，因其價值之昇降，當事人得聲請法院增減其租金","不動產之出租人就租金債權，對於承租人之物置於該不動產者，有法定質權","租用基地建築房屋者，承租人於契約成立後，得請求出租人為地上權之登記"],"stem":"關於租賃法律關係之敘述，下列何者正確？","subject":"民法","topic":"租賃","year":111},{"answer":"A","explain":"互負同種類、均屆清償期的債務→抵銷（§334）；抵充是幾筆債務先還哪筆；混同是債權人債務人同一人","id":"mf-111-22","laws":[{"ref":"民法 §334","text":"二人互負債務，而其給付種類相同，並均屆清償期者，各得以其債務，與他方之債務，互為抵銷。但依債之性質不能抵銷或依當事人之特約不得抵銷者，不在此限。\n前項特約，不得對抗善意第三人。"}],"no":22,"options":["抵銷","抵充","免除","混同"],"stem":"二人互負債務而其給付種類相同，並均屆清償期者，得以其債務與他方之債務互為下列何項主張，以消滅其債務？","subject":"民法","topic":"抵銷","year":111},{"answer":"B","explain":"財團法人設立登記前要得主管機關許可（§59）。財團只能公益；沒有總會；營利目的的是社團（§45 依特別法）","id":"mf-111-24","laws":[{"ref":"民法 §59","text":"財團於登記前，應得主管機關之許可。"},{"ref":"民法 §45","text":"以營利為目的之社團，其取得法人資格，依特別法之規定。"}],"no":24,"options":["財團法人得為公益或營利之目的而設立","財團法人於設立登記前，應得主管機關之許可","財團法人之最高意思機關為總會，且為必設之機關","財團法人若以營利為目的設立，其取得法人資格，依特別法之規定"],"stem":"關於財團法人之敘述，下列何者正確？","subject":"民法","topic":"財團法人","year":111},{"answer":"D","explain":"暴利行為（§74）要向法院聲請撤銷；錯誤、詐欺只要意思表示就能撤銷；通謀虛偽直接無效","id":"mf-112-04","laws":[{"ref":"民法 §74","text":"法律行為，係乘他人之急迫、輕率或無經驗，使其為財產上之給付或為給付之約定，依當時情形顯失公平者，法院得因利害關係人之聲請，撤銷其法律行為或減輕其給付。\n前項聲請，應於法律行為後一年內為之。"}],"no":4,"options":["通謀虛偽意思表示所為之法律行為","因錯誤或誤傳之意思表示而為法律行為","被詐欺而為意思表示之法律行為","因暴利行為所為之法律行為"],"stem":"下列情形，那一行為需向法院聲請撤銷，才會發生撤銷之效力？","subject":"民法","topic":"要聲請法院撤銷的行為","year":112},{"answer":"C","explain":"§350 出賣人擔保債權確實存在→契約有效，買方主張權利瑕疵擔保，不是標的不能而無效","id":"mf-112-06","laws":[{"ref":"民法 §350","text":"債權或其他權利之出賣人，應擔保其權利確係存在。有價證券之出賣人，並應擔保其證券未因公示催告而宣示無效。"}],"no":6,"options":["債權不得作為買賣之標的所以無效","該買賣標的權利自始不存在，屬於標的不能而無效","該買賣標的權利雖然不存在，但契約仍有效，甲可對乙主張權利瑕疵擔保","甲可依締約上過失向乙請求損害賠償"],"stem":"甲向乙購買乙對於丙的債權，但丙已於買賣前清償系爭債權而使該債權消滅，請問該買賣契約之效力如何？","subject":"民法","topic":"債權買賣，債權已不存在","year":112},{"answer":"B","explain":"超過週年 16% 部分無效（§205，110 年從 20% 下修）","id":"mf-112-07","laws":[{"ref":"民法 §205","text":"約定利率，超過週年百分之十六者，超過部分之約定，無效。"}],"no":7,"options":["12","16","20","25"],"stem":"依民法之規定，約定利率超過週年百分之多少，則超過之部分會無效？","subject":"民法","topic":"約定利率上限","year":112},{"answer":"C","explain":"簡易交付（§761 I 但書）","id":"mf-112-10","laws":[{"ref":"民法 §761","text":"動產物權之讓與，非將動產交付，不生效力。但受讓人已占有動產者，於讓與合意時，即生效力。\n讓與動產物權，而讓與人仍繼續占有動產者，讓與人與受讓人間，得訂立契約，使受讓人因此取得間接占有，以代交付。\n讓與動產物權，如其動產由第三人占有時，讓與人得以對於第三人之返還請求權，讓與於受讓人，以代交付。"}],"no":10,"options":["現實交付","占有改定","簡易交付","指示交付"],"stem":"為動產物權讓與之交付，倘受讓人已先占有動產，於讓與合意時即生動產所有權取得之效力，學理上稱之為何？","subject":"民法","topic":"受讓人已先占有","year":112},{"answer":"C","explain":"§798 但書：鄰地為公用地不適用→仍屬果樹所有人","id":"mf-112-11","laws":[{"ref":"民法 §798","text":"果實自落於鄰地者，視為屬於鄰地所有人。但鄰地為公用地者，不在此限。"}],"no":11,"options":["國家所有","該果實為無主物，誰先占即取得所有","為該果實之果樹所有權人所有","由國家及果樹所有權人所共有"],"stem":"果實自落於鄰地者，果實之所有權為鄰地所有權人所有，倘鄰地係公有用地時，該自落之果實為何人所有？","subject":"民法","topic":"果實落在公有地","year":112},{"answer":"D","explain":"租動產營業的租價＝2 年（§127），不是 5 年；催告後 6 個月沒起訴→不中斷；起訴是「中斷」不是「不完成」；判決確定→重新起算 5 年（§137 III）","id":"mf-112-15","laws":[{"ref":"民法 §127","text":"左列各款請求權，因二年間不行使而消滅：\n一、旅店、飲食店及娛樂場之住宿費、飲食費、座費、消費物之代價及其墊款。\n二、運送費及運送人所墊之款。\n三、以租賃動產為營業者之租價。\n四、醫生、藥師、看護生之診費、藥費、報酬及其墊款。\n五、律師、會計師、公證人之報酬及其墊款。\n六、律師、會計師、公證人所收當事人物件之交還。\n七、技師、承攬人之報酬及其墊款。\n八、商人、製造人、手工業人所供給之商品及產物之代價。"},{"ref":"民法 §137","text":"時效中斷者，自中斷之事由終止時，重行起算。\n因起訴而中斷之時效，自受確定判決，或因其他方法訴訟終結時，重行起算。\n經確定判決或其他與確定判決有同一效力之執行名義所確定之請求權，其原有消滅時效期間不滿五年者，因中斷而重行起算之時效期間為五年。"}],"no":15,"options":["乙租車公司的租金請求權時效本為5 年","乙於108 年9 月催告後6 個月內未起訴，仍生中斷時效之效力","乙於109 年8 月訴請甲給付租金時，時效不完成","判決確定後，時效重新起算5 年"],"stem":"甲於民國（下同）107 年9 月間向乙租車公司租用自小客車環島，然卻積欠乙租金新臺幣3 萬元，乙於108 年9 月催告後甲仍不為給付，乙便於109 年8 月訴請甲給付租金，於110 年9 月獲勝訴判決確定。下列何者正確？","subject":"民法","topic":"租車租金時效","year":112},{"answer":"C","explain":"§573 約定報酬無請求權，但契約不是無效（已付的不能要回）","id":"mf-112-16","laws":[{"ref":"民法 §573","text":"因婚姻居間而約定報酬者，就其報酬無請求權。"}],"no":16,"options":["甲乙間的契約，無效","乙得對甲請求給付報酬","乙對甲無報酬請求權","婚姻居間契約不得約定報酬"],"stem":"甲委託乙代為尋覓對象結婚，並承諾事成後給予乙報酬新臺幣10 萬元。關於婚姻居間契約，下列何者正確？","subject":"民法","topic":"婚姻居間","year":112},{"answer":"A","explain":"自訴狀送達之日起視為惡意（§959 II，10-12 已核對條文），不是判決確定日","id":"mf-112-20","laws":[{"ref":"民法 §959","text":"善意占有人自確知其無占有本權時起，為惡意占有人。\n善意占有人於本權訴訟敗訴時，自訴狀送達之日起，視為惡意占有人。"}],"no":20,"options":["善意占有人於本權訴訟敗訴時，自判決確定之日起，視為惡意占有人","善意占有人自確知其無占有本權時起，為惡意占有人","善意占有人因保存占有物所支出之必要費用，得向回復請求人請求償還","善意占有人，因改良占有物所支出之有益費用，於其占有物現存之增加價值限度內，得向回復請求人，請求償還"],"stem":"關於善意占有人之敘述，下列何者錯誤？","subject":"民法","topic":"善意占有人敗訴","year":112},{"answer":"B","explain":"不能證明歸屬的財產＝推定共有（§1017 I），題目寫「視為」所以錯","id":"mf-112-21","laws":[{"ref":"民法 §1017","text":"夫或妻之財產分為婚前財產與婚後財產，由夫妻各自所有。不能證明為婚前或婚後財產者，推定為婚後財產；不能證明為夫或妻所有之財產，推定為夫妻共有。\n夫或妻婚前財產，於婚姻關係存續中所生之孳息，視為婚後財產。\n夫妻以契約訂立夫妻財產制後，於婚姻關係存續中改用法定財產制者，其改用前之財產視為婚前財產。"}],"no":21,"options":["夫或妻婚前財產，於婚姻關係存續中所生之孳息，視為婚後財產","不能證明為夫或妻所有之財產，視為夫妻共有","夫或妻之財產分為婚前財產與婚後財產，由夫妻各自所有","夫妻各自對其債務負清償之責"],"stem":"就法定夫妻財產制之敘述，下列何者錯誤？","subject":"民法","topic":"法定財產制","year":112},{"answer":"C","explain":"配偶與父母（第 2 順序）或兄弟姊妹同為繼承＝1/2（§1144）","id":"mf-112-23","laws":[{"ref":"民法 §1144","text":"配偶有相互繼承遺產之權，其應繼分，依左列各款定之：\n一、與第一千一百三十八條所定第一順序之繼承人同為繼承時，其應繼分與他繼承人平均。\n二、與第一千一百三十八條所定第二順序或第三順序之繼承人同為繼承時，其應繼分為遺產二分之一。\n三、與第一千一百三十八條所定第四順序之繼承人同為繼承時，其應繼分為遺產三分之二。\n四、無第一千一百三十八條所定第一順序至第四順序之繼承人時，其應繼分為遺產全部。"}],"no":23,"options":["非婚生子女非經生父認領或準正，不得繼承其生父之遺產","遺產繼承人，除配偶外，其繼承順序為直系血親卑親屬、父母、兄弟姊妹、祖父母","配偶與被繼承人直系血親尊親屬同為繼承時，其應繼分為遺產之三分之一","特留分之規定，係為保障法定繼承人之權利免受侵害"],"stem":"關於遺產繼承之敘述，下列何者錯誤？","subject":"民法","topic":"應繼分","year":112},{"answer":"A","explain":"故意致被繼承人死亡（§1145 I 第 1 款）不能因原諒回復","id":"mf-112-24","laws":[{"ref":"民法 §1145","text":"有左列各款情事之一者，喪失其繼承權：\n一、故意致被繼承人或應繼承人於死或雖未致死因而受刑之宣告者。\n二、以詐欺或脅迫使被繼承人為關於繼承之遺囑，或使其撤回或變更之者。\n三、以詐欺或脅迫妨害被繼承人為關於繼承之遺囑，或妨害其撤回或變更之者。\n四、偽造、變造、隱匿或湮滅被繼承人關於繼承之遺囑者。\n五、對於被繼承人有重大之虐待或侮辱情事，經被繼承人表示其不得繼承者。\n前項第二款至第四款之規定，如經被繼承人宥恕者，其繼承權不喪失。"}],"no":24,"options":["子女為了遺產而謀殺父親，即喪失對父親之繼承權，因被繼承人原諒繼承人之行為而回復繼承權","偽造、變造、隱匿、湮滅被繼承人關於繼承之遺囑者，喪失繼承權，得因被繼承人原諒繼承人之行為而回復其繼承權","對於被繼承人有重大之虐待或侮辱情事，經被繼承人表示其不得繼承時，喪失繼承權，但之後仍可因獲得被繼承人之原諒而回復繼承權","以詐欺或脅迫妨害被繼承人為關於繼承之遺囑，或妨害其撤回或變更者，喪失繼承權，得因被繼承人原諒繼承人之行為而回復其繼承權"],"stem":"關於回復喪失繼承權之敘述，下列何者錯誤？","subject":"民法","topic":"宥恕回復繼承權","year":112},{"answer":"B","explain":"應通知因拋棄而應繼承的人，但沒通知不影響拋棄效力","id":"mf-112-25","laws":[],"no":25,"options":["應於知悉其得繼承之時起三個月內，以書面向法院為之","拋棄繼承後，應通知因其拋棄而應為繼承之人。未為通知者，不生拋棄繼承之效力","配偶拋棄繼承權者，其應繼分歸屬於與其同為繼承之人","繼承之拋棄，溯及於繼承開始時發生效力"],"stem":"關於拋棄繼承之敘述，下列何者錯誤？","subject":"民法","topic":"拋棄繼承通知","year":112},{"answer":"B","explain":"18 歲成年，19 歲可獨自買車；精神疾病沒受監護宣告≠無行為能力；受輔助宣告人贈與要輔助人同意；15 歲拋棄所有權是單獨行為，沒允許→無效","id":"mf-113-02","laws":[],"no":2,"options":["年滿30 歲患有精神疾病致無法處理自己事務之甲，當然沒有行為能力","年滿19 歲之乙可以獨自訂立買賣汽車之契約","受輔助宣告之丙可以不經輔助人丁之同意贈與使用過之筆電給戊","15 歲之庚可以不經法定代理人允許擅自丟棄自有之平板電腦"],"stem":"有關行為能力之敘述，下列何者正確？","subject":"民法","topic":"行為能力","year":113},{"answer":"B","explain":"丙可依 §110 向無權代理人乙請求損害賠償；乙是以「甲的代理人」名義賣，丙信的是代理權不是所有權→不適用善意取得；甲不承認→債權、物權契約都無效","id":"mf-113-03","laws":[{"ref":"民法 §110","text":"無代理權人，以他人之代理人名義所為之法律行為，對於善意之相對人，負損害賠償之責。"}],"no":3,"options":["丙善意取得名畫之所有權","丙得請求乙損害賠償","乙與丙之買賣契約有效","乙與丙之物權契約有效"],"stem":"甲將其所有之名畫出租於乙，並未將代理權授與乙。詎料，乙竟以甲之代理人名義，與善意之丙訂立買賣契約，將名畫出賣並交付於丙。甲不承認乙之無權代理行為，下列敘述，何者正確？","subject":"民法","topic":"無權代理＋善意取得","year":113},{"answer":"C","explain":"租約有效；第三人主張權利致不能使用→承租人得終止（§436 準用 §435）；不能對抗所有人丙","id":"mf-113-07","laws":[{"ref":"民法 §436","text":"前條規定，於承租人因第三人就租賃物主張權利，致不能為約定之使用、收益者準用之。"},{"ref":"民法 §435","text":"租賃關係存續中，因不可歸責於承租人之事由，致租賃物之一部滅失者，承租人得按滅失之部分，請求減少租金。\n前項情形，承租人就其存餘部分不能達租賃之目的者，得終止契約。"}],"no":7,"options":["甲與乙訂立之租賃契約無效","甲與乙訂立之租賃契約得撤銷","乙得終止與甲訂立之租賃契約","乙得以與甲之租賃契約對抗丙"],"stem":"甲與乙訂立租賃契約，將丙所有之A 屋出租於乙，並交付於乙。嗣後，丙對乙起訴，請求乙返還A 屋，致乙不能為約定之使用，下列敘述，何者正確？","subject":"民法","topic":"出租他人之物","year":113},{"answer":"A","explain":"§425-1 推定在房屋得使用期限內有租賃關係（比較：§838-1 法定地上權是「視為」，用在拍賣）","id":"mf-113-09","laws":[{"ref":"民法 §425-1","text":"土地及其土地上之房屋同屬一人所有，而僅將土地或僅將房屋所有權讓與他人，或將土地及房屋同時或先後讓與相異之人時，土地受讓人或房屋受讓人與讓與人間或房屋受讓人與土地受讓人間，推定在房屋得使用期限內，有租賃關係。其期限不受第四百四十九條第一項規定之限制。\n前項情形，其租金數額當事人不能協議時，得請求法院定之。"},{"ref":"民法 §838-1","text":"土地及其土地上之建築物，同屬於一人所有，因強制執行之拍賣，其土地與建築物之拍定人各異時，視為已有地上權之設定，其地租、期間及範圍由當事人協議定之；不能協議者，得請求法院以判決定之。其僅以土地或建築物為拍賣時，亦同。\n前項地上權，因建築物之滅失而消滅。"}],"no":9,"options":["推定甲與乙在房屋得使用期限內有租賃關係","視為甲與乙在房屋得使用期限內有租賃關係","推定乙在房屋得使用期限內對A 地有普通地上權","視為乙在房屋得使用期限內對A 地有普通地上權"],"stem":"甲在其所有之A 地上興建B 屋後，將B 屋出售並移轉所有權登記於乙。下列敘述，何者正確？","subject":"民法","topic":"房地同一人只賣房","year":113},{"answer":"C","explain":"認錯人（人的同一性錯誤）→契約有效但可撤銷；通謀虛偽離婚無效→仍是夫妻；心中保留相對人明知→無效；被脅迫→得撤銷非當然無效","id":"mf-113-10","laws":[],"no":10,"options":["甲與乙本為夫妻，為逃避債務，通謀虛偽離婚，並辦理離婚登記完畢，甲乙間已無婚姻關係","甲無欲為其意思表示之拘束，而向乙表示將贈與新款手機一部，乙雖明知甲心中之真意，贈與契約仍有效","甲誤將丙誤認為乙，與之訂立買賣契約，該契約有效，但甲得撤銷其之意思表示","甲受丙脅迫而與之訂立互易契約，該契約當然無效"],"stem":"有關意思表示之敘述，下列何者正確？","subject":"民法","topic":"意思表示","year":113},{"answer":"C","explain":"§416 贈與人得撤銷贈與","id":"mf-113-11","laws":[{"ref":"民法 §416","text":"受贈人對於贈與人，有左列情事之一者，贈與人得撤銷其贈與：\n一、對於贈與人、其配偶、直系血親、三親等內旁系血親或二親等內姻親，有故意侵害之行為，依刑法有處罰之明文者。\n二、對於贈與人有扶養義務而不履行者。\n前項撤銷權，自贈與人知有撤銷原因之時起，一年內不行使而消滅。贈與人對於受贈人已為宥恕之表示者，亦同。"}],"no":11,"options":["甲得解除贈與契約","甲得終止贈與契約","甲得撤銷贈與契約","甲得撤回贈與契約"],"stem":"甲與其20 歲之兒子乙訂立贈與契約，將甲所有之A 屋贈與乙，並完成所有權移轉登記。嗣後，乙竟不履行對甲之法定扶養義務。下列敘述，何者正確？","subject":"民法","topic":"受贈人不扶養","year":113},{"answer":"A","explain":"形成判決，判決確定時取得所有權，不待登記（處分前才要登記）","id":"mf-113-14","laws":[],"no":14,"options":["甲乙丙丁於判決確定時，各自取得分得部分之所有權","甲根據確定判決，請求乙丙丁辦理登記，始取得分得部分之所有權","共有物分割之判決是確認判決，僅在確認甲乙丙丁之權利義務法律關係","共有物分割之判決是給付判決，甲有權請求乙丙丁給付分得部分之所有權"],"stem":"甲乙丙丁分別共有A 地，甲以乙丙丁為被告提起分割共有物之訴，獲得勝訴確定判決。下列敘述，何者正確？","subject":"民法","topic":"分割共有物判決","year":113},{"answer":"B","explain":"只取得「請求登記為地上權人」的權利（向地政機關申請），不是直接取得","id":"mf-113-15","laws":[],"no":15,"options":["甲已經取得普通地上權","甲得請求登記為普通地上權人","因乙之A 地已辦理登記，故甲無法時效取得","甲得直接以乙為被告，起訴請求乙同意甲登記為普通地上權人"],"stem":"甲以行使普通地上權之意思，二十年間和平、公然、繼續在乙已登記之A 地上有B 屋，下列敘述，何者正確？","subject":"民法","topic":"時效取得地上權","year":113},{"answer":"C","explain":"§195 非財產上損害（慰撫金）一身專屬，除非已契約承諾或已起訴才可繼承","id":"mf-113-19","laws":[{"ref":"民法 §195","text":"不法侵害他人之身體、健康、名譽、自由、信用、隱私、貞操，或不法侵害其他人格法益而情節重大者，被害人雖非財產上之損害，亦得請求賠償相當之金額。其名譽被侵害者，並得請求回復名譽之適當處分。\n前項請求權，不得讓與或繼承。但以金額賠償之請求權已依契約承諾，或已起訴者，不在此限。\n前二項規定，於不法侵害他人基於父、母、子、女或配偶關係之身分法益而情節重大者，準用之。"}],"no":19,"options":["尚未繳清貸款之房屋","甲所著理財專書之著作權","甲對丙依據民法第195 條規定可主張之非財產上損害賠償請求權","甲積欠乙銀行之20 萬信用貸款"],"stem":"著有數本暢銷理財專書之甲，某日遭汽車駕駛人丙撞傷，卻於與丙損害賠償協議達成前，突發心肌梗塞猝死，留有土地一筆及尚未繳清貸款之房屋一棟，某上市電子公司股份100 萬股，銀行存款30 萬元，尚欠有乙銀行之信用貸款20 萬元。下列何者非屬繼承之標的？","subject":"民法","topic":"不能繼承的權利","warn":"這題考選部公告 (B)、(C) 都給分，網頁以 (C) 計。","year":113},{"answer":"C","explain":"生存歸來要向法院聲請撤銷，不是地檢署；80 歲以上失蹤滿 3 年；共有人是利害關係人可聲請","id":"mf-114-01","laws":[],"no":1,"options":["失蹤人遺留之與他人共有不動產之共有人，得聲請對失蹤人為死亡宣告","失蹤人已年滿80 歲，其失蹤期間應滿3 年後，始得被聲請死亡宣告","失蹤人受死亡宣告後，生存歸來時，得聲請地檢署撤銷死亡宣告","受死亡宣告之失蹤人實際上仍生存時，其權利能力不因死亡宣告而喪失"],"stem":"依我國民法有關死亡宣告之規定，下述何者錯誤？","subject":"民法","topic":"死亡宣告","year":114},{"answer":"B","explain":"「辨識能力顯有不足」＝輔助宣告；「不能辨識」才是監護宣告","id":"mf-114-02","laws":[],"no":2,"options":["受監護宣告之成年人，無行為能力","成年人因精神障礙或其他心智缺陷，致其辨識其意思表示效果之能力顯有不足者，得因聲請，對其為監護之宣告","受監護宣告之成年人，仍保有完全之權利能力","受輔助宣告之成年人逕自締結汽車之買賣契約，該契約不因欠缺輔助人之事前同意而無效"],"stem":"我國民法修正時，增訂有關監護宣告及輔助宣告制度之規定。依現行民法相關之規定，下列何者錯誤？","subject":"民法","topic":"監護 vs 輔助","year":114},{"answer":"C","explain":"法人仍可享有名稱權、名譽權等人格權，說「無法享有」錯；以遺囑捐助設立財團法人不用訂捐助章程（§60）","id":"mf-114-03","laws":[{"ref":"民法 §60","text":"設立財團者，應訂立捐助章程。但以遺囑捐助者，不在此限。\n捐助章程，應訂明法人目的及所捐財產。\n以遺囑捐助設立財團法人者，如無遺囑執行人時，法院得依主管機關、檢察官或利害關係人之聲請，指定遺囑執行人。"}],"no":3,"options":["民法關於公益社團法人之設立，係採取許可主義","法人解散後，在清算程序中，在清算之必要範圍內，仍具有法人格","法人之權利能力，受到性質上之限制，因此無法享有民法賦予自然人所有之人格權利","財團法人之設立，捐助人亦得以遺囑捐助之方式為之，且以此種方式設立之財團法人，無須訂立捐助章程"],"stem":"下列敘述，何者與民法法人之規定並不相容？","subject":"民法","topic":"法人","year":114},{"answer":"C","explain":"不得對抗善意第三人（§27 III），不是「任何第三人」","id":"mf-114-04","laws":[{"ref":"民法 §27","text":"法人應設董事。董事有數人者，法人事務之執行，除章程另有規定外，取決於全體董事過半數之同意。\n董事就法人一切事務，對外代表法人。董事有數人者，除章程另有規定外，各董事均得代表法人。\n對於董事代表權所加之限制，不得對抗善意第三人。\n法人得設監察人，監察法人事務之執行。監察人有數人者，除章程另有規定外，各監察人均得單獨行使監察權。"}],"no":4,"options":["就A 法人一切事務，甲可代表A 法人","A 法人可僅設甲一位董事","A 法人若對甲董事之代表權加以限制，其限制得對抗任何第三人","若A 法人僅有甲與丙兩位董事，則該法人事務之執行，若兩人意見相左，則恐陷入表決的僵局"],"stem":"甲當選A 法人董事，準備大顯身手，下列敘述何者錯誤？","subject":"民法","topic":"董事代表權限制","year":114},{"answer":"C","explain":"意思表示後 1 年（§90），不是 2 年；撤銷後要賠相對人信賴利益（§91）","id":"mf-114-07","laws":[{"ref":"民法 §90","text":"前二條之撤銷權，自意思表示後，經過一年而消滅。"},{"ref":"民法 §91","text":"依第八十八條及第八十九條之規定撤銷意思表示時，表意人對於信其意思表示為有效而受損害之相對人或第三人，應負賠償責任。但其撤銷之原因，受害人明知或可得而知者，不在此限。"}],"no":7,"options":["該錯誤之意思表示若因表意人之過失所致時，表意人不得撤銷其所為之意思表示","該錯誤必須在交易上被認為具有重要性","錯誤之表意人必須在意思表示後，於2 年內行使撤銷權，反之於除斥期間經過後，該法律關係即應繼續有效存續","錯誤之表意人撤銷其意思表示後，對於相對人應承擔信賴該法律行為有效而生之損害賠償責任"],"stem":"不同之權利主體以法律行為方式，形成了彼此間之法律關係。嗣後，當事人一方發現自己已為之意思表示發生錯誤，乃依民法第88 條規定行使撤銷權。下列相關之敘述，何者錯誤？","subject":"民法","topic":"錯誤撤銷除斥期間","year":114},{"answer":"D","explain":"超過授權部分＝無權代理，契約不能切成「1 億內有效」；不動產買賣委任及代理權授與都要書面（§531）","id":"mf-114-09","laws":[{"ref":"民法 §531","text":"為委任事務之處理，須為法律行為，而該法律行為，依法應以文字為之者，其處理權之授與，亦應以文字為之。其授與代理權者，代理權之授與亦同。"}],"no":9,"options":["本件代理權的授與和委任契約二者均須書面","若丙自始至終不知道乙為甲的代理人，且債權契約和物權契約當事人簽乙的名字，則本件法律效果無法歸屬於甲","若甲知道丙欺騙乙，把房屋的優點講得天花亂墜，但甲仍要乙代理他買下房屋，則甲事後不得主張受詐欺撤銷意思表示","甲跟乙說好，最多出價1 億元，1 億元的事情沒寫在書面，乙和丙講價的結果，被丙說服用行情價1 億1 千萬簽訂契約。該買賣契約在1 億元價金的範圍內有效"],"stem":"甲授與乙代理權，並委任乙與丙商談甲買受丙所有房屋及辦理移轉所有權之事宜。下列敘述何者錯誤？","subject":"民法","topic":"代理逾越權限","year":114},{"answer":"B","explain":"房屋一部轉租，無反對約定可以（§443）；超過 1 年沒書面→視為不定期租賃，不是無效；默示更新→視為不定期","id":"mf-114-12","laws":[{"ref":"民法 §443","text":"承租人非經出租人承諾，不得將租賃物轉租於他人。但租賃物為房屋者，除有反對之約定外，承租人得將其一部分轉租於他人。\n承租人違反前項規定，將租賃物轉租於他人者，出租人得終止契約。"}],"no":12,"options":["租期若超過1 年，且未寫書面契約，則租賃契約無效","若未特別約定，則乙有權將其中的房間分租給丙","若未特別約定，則乙有權將承租人的地位債權讓與給丙","若雙方約定租期3 年，3 年過後乙默默繳房租，甲默默收房租，則雙方均不得主張租賃契約默示更新"],"stem":"甲將房屋租給乙。下列何者正確？","subject":"民法","topic":"房屋租賃","year":114},{"answer":"D","explain":"贈與人只有故意不告知或保證無瑕疵才賠（§411）；贈與是諾成契約；公證贈與遲延不能請求遲延損害（§409 II）","id":"mf-114-13","laws":[{"ref":"民法 §411","text":"贈與之物或權利如有瑕疵，贈與人不負擔保責任。但贈與人故意不告知其瑕疵或保證其無瑕疵者，對於受贈人因瑕疵所生之損害，負賠償之義務。"},{"ref":"民法 §409","text":"贈與人就前條第二項所定之贈與給付遲延時，受贈人得請求交付贈與物；其因可歸責於自己之事由致給付不能時，受贈人得請求賠償贈與物之價額。\n前項情形，受贈人不得請求遲延利息或其他不履行之損害賠償。"}],"no":13,"options":["在經公證之贈與契約，贈與人因可歸責之事由致給付遲延，受贈人得依民法第231 條之規定請求贈與人對於遲延給付造成之損害，負賠償責任","依現行民法之規定，以不動產為標的之贈與契約，屬於具要物性之法律行為","贈與人所贈與之標的物本身具有瑕疵，贈與人應負無過失之擔保責任","贈與人所贈與之標的物具有瑕疵，造成受贈人之損害，僅於贈與人故意不告知其瑕疵或保證其無瑕疵時，始得請求賠償"],"stem":"對於權利主體間之贈與契約，依我國民法規定，下列何者為正確之論述？","subject":"民法","topic":"贈與瑕疵","year":114},{"answer":"D","explain":"出資屬合夥人全體公同共有（§668），不是各自所有","id":"mf-114-14","laws":[{"ref":"民法 §668","text":"各合夥人之出資及其他合夥財產，為合夥人全體之公同共有。"}],"no":14,"options":["如甲在麵館以外之場所猥褻K，乙無須對K 負連帶損害賠償責任","麵體供應商J 多次索取買賣價金均無果，J 得以M 為被告請求履行債務","甲、乙兩人想把M 收起來，尚須經清算程序","M 麵館的餐具是甲提供的、攤車是乙提供的，當麵館持續在營業時，餐具的所有權仍是甲的、攤車的所有權仍是乙的"],"stem":"甲、乙兩人合夥開了一家小麵館M，生意興隆。下列何者錯誤？","subject":"民法","topic":"合夥財產","year":114},{"answer":"A","explain":"故意越界不受 §796 保護→可請求移去；分割造成袋地通行他分割人土地不用付償金（§789）；果實落鄰地是「視為」不是推定；鄰地使用受損害只能要償金不能拒絕（§792）","id":"mf-114-15","laws":[{"ref":"民法 §796","text":"土地所有人建築房屋非因故意或重大過失逾越地界者，鄰地所有人如知其越界而不即提出異議，不得請求移去或變更其房屋。但土地所有人對於鄰地因此所受之損害，應支付償金。\n前項情形，鄰地所有人得請求土地所有人，以相當之價額購買越界部分之土地及因此形成之畸零地，其價額由當事人協議定之；不能協議者，得請求法院以判決定之。"},{"ref":"民法 §789","text":"因土地一部之讓與或分割，而與公路無適宜之聯絡，致不能為通常使用者，土地所有人因至公路，僅得通行受讓人或讓與人或他分割人之所有地。數宗土地同屬於一人所有，讓與其一部或同時分別讓與數人，而與公路無適宜之聯絡，致不能為通常使用者，亦同。\n前項情形，有通行權人，無須支付償金。"},{"ref":"民法 §792","text":"土地所有人因鄰地所有人在其地界或近旁，營造或修繕建築物或其他工作物有使用其土地之必要，應許鄰地所有人使用其土地。但因而受損害者，得請求償金。"}],"no":15,"options":["土地所有人建築房屋故意逾越地界者，法院得斟酌公共利益後，能允許鄰地所有人請求移去或變更","共有土地因分割，致其中一共有人所取得分得土地與公路無適宜之聯絡，無法為通常之使用，應支付償金，取得通行他分割人所有地之權利","果實自落於鄰地，推定由鄰地所有人取得所有權","鄰地所有人因營造或修繕建築物之必要，得使用土地所有人之土地及其上建物內部閒置之空間。但受有損害時，則得拒絕鄰地所有人之使用"],"stem":"依現行民法物權編有關不動產所有權相鄰關係規定之內容，下列之選項，何者正確？","subject":"民法","topic":"相鄰關係","year":114},{"answer":"A","explain":"約定不分割期間內，有重大事由仍得隨時請求分割（§823 III）；不分割約定最長 5 年","id":"mf-114-16","laws":[{"ref":"民法 §823","text":"各共有人，除法令另有規定外，得隨時請求分割共有物。但因物之使用目的不能分割或契約訂有不分割之期限者，不在此限。\n前項約定不分割之期限，不得逾五年；逾五年者，縮短為五年。但共有之不動產，其契約訂有管理之約定時，約定不分割之期限，不得逾三十年；逾三十年者，縮短為三十年。\n前項情形，如有重大事由，共有人仍得隨時請求分割。"}],"no":16,"options":["若甲、乙協議20 年內不得分割，則在該期限內，不論發生任何事由，甲、乙均不得請求分割","甲得在未經乙的同意下，將其應有部分贈與及移轉給丁","若甲商請乙分割A 地未果，甲可聲請法院分割A 地，此時法院須優先考慮原物分配","A 地由丙無權占有使用，乙得在未經甲的同意下請求丙返還A 地"],"stem":"甲、乙兩人共有A 地，應有部分甲為1/3、乙為2/3。下列何者錯誤？","subject":"民法","topic":"共有","year":114},{"answer":"D","explain":"預付地租已登記→可對抗受讓人；未定期限逾 20 年才能請求法院定期間（不是 30 年）；不可抗力不能減免地租（§837）；欠租 2 年要先定期催告才能終止","id":"mf-114-17","laws":[{"ref":"民法 §837","text":"地上權人，縱因不可抗力，妨礙其土地之使用，不得請求免除或減少租金。"}],"no":17,"options":["地上權未定有存續期間者，逾越30 年後，土地所有人始得向法院請求，定其後續之存續期間，或終止該地上權","地上權人因不可抗力之事由導致妨礙其行使地上權使用時，得拒絕或減少地租之支付","地上權人積欠地租達2 年總額時，除另有習慣外，土地所有人得逕行終止存續期限尚未屆至之地上權","已設定地上權之土地所有權人，於地上權存續期間讓與該土地所有權與第三人，已預收之地租如已登記，地上權人得以該預付地租對抗受讓之第三人"],"stem":"依我國民法關於地上權之規定，下列何者正確之論述？","subject":"民法","topic":"地上權","year":114},{"answer":"D","explain":"惡意占有人因保存支出必要費用，可依無因管理請求償還（§957）","id":"mf-114-18","laws":[{"ref":"民法 §957","text":"惡意占有人，因保存占有物所支出之必要費用，對於回復請求人，得依關於無因管理之規定，請求償還。"}],"no":18,"options":["占有於我國為事實，而非占有權","無權占有人亦有占有物返還請求權","占有與取得時效有關","惡意占有人，因保存占有物所支出之必要費用，不得請求償還"],"stem":"關於占有，下列何者錯誤？","subject":"民法","topic":"占有","year":114},{"answer":"B","explain":"自己任意行為造成袋地（自己築牆）→不適用法定通行權，要對方同意；非故意越界＋知情不異議→不能請求拆屋","id":"mf-114-19","laws":[],"no":19,"options":["A 地兩面環山、第三面環河，僅能經過B 地通行於道路，則甲須經乙的同意，始得取得對B 地的通行權","A 地一面環山、一面環河、一面接著大馬路、一面緊鄰B 地，甲聽信風水師的建議，將面臨大馬路的那一面築起無門的高牆因此無法通行，則甲須經乙的同意，始得取得對B 地的通行權","袋地通行權性質上並非供役地所有權本質上的限縮","若甲在A 地上蓋房子，因為土地測量單位的疏失，該建築有30 公分越界到B 地，此時乙得知此狀況，若沒有馬上阻止，則之後仍可請求甲拆屋還地"],"stem":"甲所有的A 地與乙所有的B 地相鄰。下列何者正確？","subject":"民法","topic":"袋地通行","year":114},{"answer":"C","explain":"婚後受贈財產不列入分配（§1030-1 I 第 1 款），不管有沒有書面聲明","id":"mf-114-20","laws":[{"ref":"民法 §1030-1","text":"法定財產制關係消滅時，夫或妻現存之婚後財產，扣除婚姻關係存續所負債務後，如有剩餘，其雙方剩餘財產之差額，應平均分配。但下列財產不在此限：\n一、因繼承或其他無償取得之財產。\n二、慰撫金。\n夫妻之一方對於婚姻生活無貢獻或協力，或有其他情事，致平均分配有失公平者，法院得調整或免除其分配額。\n法院為前項裁判時，應綜合衡酌夫妻婚姻存續期間之家事勞動、子女照顧養育、對家庭付出之整體協力狀況、共同生活及分居時間之久暫、婚後財產取得時間、雙方之經濟能力等因素。\n第一項請求權，不得讓與或繼承。但已依契約承諾，或已起訴者，不在此限。\n第一項剩餘財產差額之分配請求權，自請求權人知有剩餘財產之差額時起，二年間不行使而消滅。自法定財產制關係消滅時起，逾五年者，亦同。"}],"no":20,"options":["甲所有之婚前購買之有價證券，於甲、乙婚後，甲取得該有價證券分配之股息或利息，於甲、乙離婚時，乙得主張該分配之股息或利息，納入剩餘財產為分配計算之標的","甲於婚後以自己之財產清償乙所負之債務後，即使在婚姻關係中，仍得請求乙償還","甲、乙離婚時，對於婚後乙受贈之財產，如未經贈與人以書面聲明為乙之特有財產時，即應納入乙之婚後財產，成為剩餘財產分配計算之標的","甲、乙離婚時，乙知悉剩餘財產分配計算之差額，僅得自法定財產關係消滅時起2 年內，向甲主張給付該差額之二分之一"],"stem":"甲、乙結婚後未約定夫妻財產制時，下列有關甲、乙間之配偶財產關係之論述，何者錯誤？","subject":"民法","topic":"剩餘財產分配","year":114},{"answer":"A","explain":"拋棄繼承→應繼分歸同順序其他人，不是代位繼承；繼承債務以遺產為限負連帶；拋棄者管理遺產＝與處理自己事務同一注意","id":"mf-114-22","laws":[],"no":22,"options":["概括繼承人如對於被繼承人生前享有權利或負擔義務，不因被繼承人之死亡而隨之消滅","第1138 條所定第1 順序之繼承人中有拋棄繼承權者，其應繼分應由其直系血親卑親屬代位繼承之","繼承人對於被繼承人所遺留之債務，對於被繼承人之債權人，負連帶清償之責任","拋棄繼承者，就自己所管理之遺產，於其他繼承人或遺產管理人開始管理前，應以善良管理人之注意義務，繼續管理該遺產"],"stem":"我國現行民法對於繼承制度，原則上採取概括繼承有限責任之規範型態。下列何者屬於正確之敘述？","subject":"民法","topic":"概括繼承","year":114},{"answer":"A","explain":"受遺贈人比遺囑人先死→遺贈不生效力（§1201），受遺贈人的繼承人不能主張","id":"mf-114-23","laws":[{"ref":"民法 §1201","text":"受遺贈人於遺囑發生效力前死亡者，其遺贈不生效力。"}],"no":23,"options":["甲立遺囑，遺囑中將A 地贈與好友乙。乙於甲之遺囑生效前意外死亡，其後甲重病身亡，乙之繼承人丙得向甲之繼承人丁請求移轉交付A 地所有權予自己","甲遺囑中遺贈予乙之A 車，因丙之過失毀損，甲之遺囑生效時，推定對丙之權利成為遺贈之客體，乙得向甲之繼承人丁請求移轉該權利予自己","甲以遺囑贈與A 屋予好友乙，遺囑生效時，甲之繼承人丙寄存證信函請求乙30 日內回函確認，乙置之不理，期限屆滿時，該遺囑中之遺贈，仍然確定生效","甲以遺囑贈與A 屋予好友乙，遺囑生效前，甲將A 屋出賣予丙取得價金1 千萬元之債權，甲請求丙將該價金1 千萬元直接捐贈予丁慈善基金會。甲之遺囑生效時，遺囑中A 屋之遺贈應屬無效"],"stem":"依我國民法有關遺囑之規定，下列敘述何者錯誤？","subject":"民法","topic":"遺贈","year":114},{"answer":"B","explain":"無法證明先後→推定同時死亡（§11），互不繼承","id":"mf-114-25","laws":[{"ref":"民法 §11","text":"二人以上同時遇難，不能證明其死亡之先後時，推定其為同時死亡。"}],"no":25,"options":["甲、乙被發現時，由屍體的腐壞程度可以斷定甲比乙早10 小時死亡，則乙為甲的繼承人","甲、乙被發現時，即使經過法醫相驗，也無法確定誰先死，則雙方互為繼承人","3 年前，甲的家人為了擔心乙分家產，要求甲把全部的財產贈與給甲母，才允許雙方登記結婚此次事故甲死乙傷，乙無法對甲母主張詐害債權的撤銷","該事故實則是乙為了取得甲大筆的遺產所製造的車禍，若甲死乙傷，乙將喪失對甲的繼承權"],"stem":"甲夫乙妻，一起到夏威夷旅遊，租車亂跑，不幸墜入山谷。下列何者錯誤？","subject":"民法","topic":"同時死亡","year":114}]</script>
<script>
const PASS_STREAK = 2, ROUND_SIZE = 25, KEYS = ["A","B","C","D"];
let questions = [], progress = {}, subject = "全部";
let round = [], idx = 0, answered = null, roundLog = [];
const $ = s => document.querySelector(s);

function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const inSubject = q => subject === "全部" || q.subject === subject;
const st = id => progress[id] || { s: 0, n: 0, w: 0, last: null };
const passed = id => st(id).s >= PASS_STREAK;

function renderStats() {
  const pool = questions.filter(inSubject);
  const p = pool.filter(q => passed(q.id)).length;
  const w = pool.filter(q => st(q.id).last === "wrong").length;
  const s = $("#stats"); s.replaceChildren(
    el("span", { class: "chip" }, "題庫 ", el("b", {}, String(pool.length))),
    el("span", { class: "chip pass" }, "已過關 ", el("b", {}, String(p))),
    el("span", { class: "chip wrong" }, "上次答錯 ", el("b", {}, String(w))));
  $("#barFill").style.width = pool.length ? (p / pool.length * 100) + "%" : "0";
}
function renderFilters() {
  const subs = ["全部", ...new Set(questions.map(q => q.subject))];
  $("#filters").replaceChildren(...(subs.length > 2 ? subs : []).map(s =>
    el("button", { type: "button", "aria-pressed": String(s === subject), onclick: () => { subject = s; renderFilters(); startRound(); } }, s)));
}

function buildRound(reviewAll) {
  const pool = questions.filter(inSubject);
  if (reviewAll) return shuffle(pool.slice()).slice(0, ROUND_SIZE);
  const todo = pool.filter(q => !passed(q.id));
  const g0 = shuffle(todo.filter(q => st(q.id).last === "wrong"));
  const g1 = shuffle(todo.filter(q => st(q.id).n === 0));
  const g2 = shuffle(todo.filter(q => st(q.id).n > 0 && st(q.id).last !== "wrong"));
  return [...g0, ...g1, ...g2].slice(0, ROUND_SIZE);
}
function startRound(reviewAll = false) {
  round = buildRound(reviewAll); idx = 0; answered = null; roundLog = [];
  renderStats();
  if (!round.length) return renderAllPassed();
  renderQuestion();
}

function renderQuestion() {
  const q = round[idx], p = st(q.id);
  const opts = q.options.map((t, i) => {
    const k = KEYS[i];
    return el("button", { type: "button", class: "opt", "data-k": k, onclick: () => answer(k) },
      el("span", { class: "k" }, "(" + k + ")"), el("span", {}, t));
  });
  const card = el("article", { class: "card" },
    el("div", { class: "meta" },
      el("span", {}, `第 ${idx + 1} / ${round.length} 題`),
      el("span", { class: "tag" }, `${q.subject}・${q.year} 年第 ${q.no} 題`),
      el("span", { class: "streak" }, p.n ? `連對 ${p.s}/${PASS_STREAK}・錯 ${p.w} 次` : "新題")),
    el("p", { class: "stem" }, q.stem),
    el("div", { class: "opts", id: "opts" }, opts),
    el("div", { id: "feedback" }));
  $("#main").replaceChildren(card);
  window.scrollTo({ top: 0 });
}

function answer(k) {
  if (answered) return;
  const q = round[idx]; answered = k;
  const ok = k === q.answer;
  document.querySelectorAll("#opts .opt").forEach(b => {
    b.disabled = true;
    const bk = b.dataset.k;
    if (bk === q.answer) b.classList.add("correct");
    else if (bk === k) b.classList.add("picked-wrong");
    if (q.notes && q.notes[bk] && bk !== q.answer) b.lastChild.append(el("span", { class: "why" }, q.notes[bk]));
  });
  const p = { ...st(q.id) };
  p.n += 1; p.s = ok ? p.s + 1 : 0; if (!ok) p.w += 1; p.last = ok ? "right" : "wrong"; p.t = Date.now();
  progress[q.id] = p; roundLog.push({ q, ok });
  saveProgress();
  renderStats();

  const fb = $("#feedback");
  const laws = (q.laws || []).map(l => el("div", { class: "law" }, el("span", { class: "ref" }, l.ref), l.text,
    l.src ? el("span", { class: "src" }, "\n來源：" + l.src) : null));
  fb.replaceChildren(el("div", { class: "card", style: "padding:0;border:0;gap:10px" },
    el("div", { class: "verdict " + (ok ? "ok" : "bad") },
      ok ? (p.s >= PASS_STREAK ? "答對，這題過關了" : "答對") : `答錯，正解是 (${q.answer})`),
    el("p", { class: "explain" }, q.explain),
    q.warn ? el("div", { class: "warn" }, "⚠️ " + q.warn) : null,
    laws.length ? el("details", { class: "laws", open: "" }, el("summary", {}, "法條原文（全國法規資料庫）"), laws) : null,
    el("div", { class: "src" }, "答案依考選部公告"),
    el("div", { class: "actions" },
      el("button", { type: "button", class: "btn", id: "nextBtn", onclick: next }, idx + 1 < round.length ? "下一題" : "看本輪結果"))));
  $("#nextBtn").focus({ preventScroll: true });
}
function next() { answered = null; idx += 1; if (idx < round.length) renderQuestion(); else renderSummary(); }

function renderSummary() {
  const right = roundLog.filter(r => r.ok).length;
  $("#main").replaceChildren(el("div", { class: "card empty" },
    el("h2", {}, `本輪答對 ${right} / ${roundLog.length}`),
    el("div", { class: "result-list" }, roundLog.map(r =>
      el("div", {}, el("span", { class: r.ok ? "o" : "x" }, r.ok ? "○" : "✕"),
        el("span", {}, `${r.q.year}-${r.q.no}　${r.q.topic}`)))),
    el("div", { class: "actions", style: "justify-content:center;margin-top:12px" },
      el("button", { type: "button", class: "btn", onclick: () => startRound() }, "再來一輪"))));
}
function renderAllPassed() {
  const has = questions.some(inSubject);
  $("#main").replaceChildren(el("div", { class: "card empty" },
    el("h2", {}, has ? "這個範圍全部過關" : "目前沒有題目"),
    el("div", {}, has ? "想複習可以全部再抽一輪，答錯會重新列入待練。" : "題庫是空的。"),
    has ? el("div", { class: "actions", style: "justify-content:center;margin-top:12px" },
      el("button", { type: "button", class: "btn ghost", onclick: () => startRound(true) }, "全部複習一輪")) : null));
}

const LS_KEY = "drill-offline-progress-v1";
function saveProgress() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(progress)); } catch (e) { console.warn("progress save failed"); }
}

function showMsg(title, body) {
  $("#main").replaceChildren(el("div", { class: "card empty" }, el("h2", {}, title), el("div", {}, body)));
}

(() => {
  try { progress = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch (e) { progress = {}; }
  questions = JSON.parse(document.getElementById("qdata").textContent);
  renderFilters(); renderStats(); startRound();
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready)
      .then(() => { $("#offline").textContent = "✓ 已存好，可離線使用"; })
      .catch(() => { $("#offline").textContent = "離線快取失敗，請連網重開一次"; });
  } else { $("#offline").textContent = "這個瀏覽器不支援離線"; }
})();
</script>
</body>
